name: CBR — vídeo acelerado de refletividade nativa

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cbr-reflectivity-mp4.yml"
  workflow_run:
    workflows:
      - "WRF CBR 4 KM — fallback ICON → ECMWF → GFS"
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execução CBR concluída; vazio seleciona a mais recente válida"
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Selecionar checkpoint CBR concluído mais recente
        env:
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          candidates=""
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$EVENT_CONCLUSION" == "success" ]] || { echo "CBR não concluiu com sucesso; vídeo não será renderizado."; exit 0; }
            candidates="$EVENT_RUN_ID"
          elif [[ -n "$INPUT_RUN_ID" ]]; then
            candidates="$INPUT_RUN_ID"
          else
            # Scan newest CBR executions, including failed/partial runs, and
            # keep the newest run whose release actually contains full products.
            # Some historical complete releases were published even though a
            # separate post-processing step later marked their Actions run failed.
            candidates="$(gh run list --repo "$GH_REPO" --workflow wrf-cbr-4km.yml --limit 100 --json databaseId | jq -r '.[].databaseId')"
          fi

          selected=""
          while IFS= read -r candidate; do
            [[ "$candidate" =~ ^[0-9]+$ ]] || continue
            run_id="$candidate"
            tag="cbr-wrf-4km-checkpoint-$run_id"
            assets="$(gh release view "$tag" --repo "$GH_REPO" --json assets 2>/dev/null || true)"
            [[ -n "$assets" ]] || { echo "Checkpoint $tag ainda não existe; tentando outro."; continue; }
            npz_count="$(jq '[.assets[] | select(.name | endswith(".npz"))] | length' <<< "$assets")"
            products_count="$(jq '[.assets[] | select(.name == "cbr-products-4km.tar.gz")] | length' <<< "$assets")"
            if (( npz_count >= 2 && products_count >= 1 )); then
              selected="$run_id"
              break
            fi
            echo "Ignorando $tag: produtos completos ausentes ou frames NPZ insuficientes."
          done <<< "$candidates"

          [[ -n "$selected" ]] || { echo "Nenhum checkpoint CBR completo encontrado; não vou produzir um MP4 de uma rodada antiga fixada no código." >&2; exit 1; }
          echo "CHECKPOINT_TAG=cbr-wrf-4km-checkpoint-$selected" >> "$GITHUB_ENV"
          echo "VIDEO_NAME=cbr-refletividade-rapida-$selected.mp4" >> "$GITHUB_ENV"
          echo "CBR selecionado: cbr-wrf-4km-checkpoint-$selected"
      - name: Baixar os frames compactos publicados no checkpoint
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p cbr_npz frames mapdata
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/brazil-states.geojson \
            -o mapdata/brazil-states.geojson
          test -s mapdata/brazil-states.geojson
          gh release download "$CHECKPOINT_TAG" --repo "$GH_REPO" --pattern '*.npz' --dir cbr_npz
          count=$(find cbr_npz -maxdepth 1 -type f -name '*.npz' | wc -l)
          test "$count" -ge 2
          echo "NPZ_COUNT=$count" >> "$GITHUB_ENV"
          ls -lh cbr_npz

      - name: Instalar renderizador de vídeo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib

      - name: Renderizar refletividade composta nativa do WRF
        run: |
          cat > render_cbr.py <<'PY'
          from pathlib import Path
          from datetime import datetime
          import re
          import json
          import os
          import numpy as np
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from matplotlib.colors import BoundaryNorm, ListedColormap

          inp = Path("cbr_npz")
          out = Path("frames")
          files = sorted(inp.glob("*.npz"))
          if len(files) < 2:
              raise SystemExit("Checkpoint sem pelo menos dois frames NPZ.")

          colors = [
              "#1846a3", "#087ff5", "#00cfff", "#00d58a",
              "#39c522", "#c6e51d", "#ffed32", "#ffb21b",
              "#ff7417", "#f43124", "#d50032", "#ed36c7",
              "#f5f5f5", "#ffffff"
          ]
          levels = np.arange(5, 80, 5)
          cmap = ListedColormap(colors, name="sideral_reflectivity")
          cmap.set_under((0, 0, 0, 0))
          cmap.set_bad((0, 0, 0, 0))
          norm = BoundaryNorm(levels, cmap.N, clip=True)

          # Base cartográfica real: polígonos oficiais/administrativos dos estados do Brasil.
          # As geometrias são desenhadas em lon/lat sobre a grade WRF, sem deslocar os ecos.
          with open("mapdata/brazil-states.geojson", encoding="utf-8") as fp:
              state_geojson = json.load(fp)

          land_rings = []
          for feature in state_geojson.get("features", []):
              geom = feature.get("geometry") or {}
              kind, coords = geom.get("type"), geom.get("coordinates", [])
              polygons = [coords] if kind == "Polygon" else (coords if kind == "MultiPolygon" else [])
              for polygon in polygons:
                  if not polygon:
                      continue
                  ring = np.asarray(polygon[0], dtype=np.float64)
                  if ring.ndim == 2 and ring.shape[0] >= 3 and ring.shape[1] >= 2:
                      land_rings.append(ring[:, :2])

          if not land_rings:
              raise SystemExit("A base cartográfica dos estados do Brasil não contém polígonos válidos.")

          # Siglas posicionadas dentro dos respectivos estados na área visível do domínio CBR.
          state_labels = [
              ("PA", -49.4, -4.0), ("MA", -45.2, -5.3), ("PI", -42.8, -7.7),
              ("CE", -39.5, -5.6), ("RN", -36.3, -5.4), ("PB", -36.7, -7.2),
              ("PE", -37.9, -8.5), ("AL", -36.4, -9.7), ("SE", -37.2, -10.7),
              ("BA", -41.7, -12.5), ("TO", -48.0, -10.1), ("GO", -49.0, -16.4),
              ("DF", -47.9, -15.8), ("MG", -45.5, -18.5), ("ES", -40.7, -19.1),
              ("RJ", -42.3, -20.6)
          ]

          # Capitais de referência com pequenos marcadores; mantidas apenas as que caem no domínio.
          cities = [
              ("Belém", -48.50, -1.45), ("São Luís", -44.30, -2.53),
              ("Teresina", -42.80, -5.09), ("Fortaleza", -38.53, -3.73),
              ("Natal", -35.21, -5.79), ("João Pessoa", -34.85, -7.12),
              ("Recife", -34.88, -8.05), ("Maceió", -35.74, -9.67),
              ("Aracaju", -37.07, -10.95), ("Salvador", -38.50, -12.97),
              ("Brasília", -47.88, -15.79), ("Palmas", -48.33, -10.18),
              ("Goiânia", -49.26, -16.69), ("Belo Horizonte", -43.94, -19.92),
              ("Vitória", -40.31, -20.32)
          ]

          times = []
          loaded = []
          for f in files:
              m = re.search(r"(\d{8})_(\d{6})", f.stem)
              if not m:
                  continue
              dt = datetime.strptime(m.group(1)+m.group(2), "%Y%m%d%H%M%S")
              with np.load(f) as z:
                  required = {"lat", "lon", "reflectivity_composite_dbz"}
                  if not required.issubset(set(z.files)):
                      raise SystemExit(f"{f.name}: faltam variáveis {sorted(required-set(z.files))}")
                  lat = np.asarray(z["lat"], dtype=np.float32)
                  lon = np.asarray(z["lon"], dtype=np.float32)
                  refl = np.asarray(z["reflectivity_composite_dbz"], dtype=np.float32)
              if refl.shape != lat.shape or refl.shape != lon.shape:
                  raise SystemExit(f"{f.name}: grades de refletividade/lat/lon incompatíveis")
              refl = np.where(np.isfinite(refl) & (refl >= 5) & (refl <= 90), refl, np.nan)
              times.append(dt)
              loaded.append((dt, lat, lon, refl, f.name))

          if len(loaded) < 2:
              raise SystemExit("Não há frames válidos para o vídeo.")
          init = loaded[0][0]
          for idx, (dt, lat, lon, refl, filename) in enumerate(loaded):
              fh = int(round((dt-init).total_seconds()/3600))
              fig = plt.figure(figsize=(13.2, 8.0), dpi=110, facecolor="#050a14")
              ax = fig.add_axes([0.065, 0.105, 0.82, 0.755], facecolor="#050a14")
              # Terra em azul-marinho escuro, oceano quase preto.
              for ring in land_rings:
                  ax.fill(ring[:, 0], ring[:, 1], color="#0a1522", linewidth=0, zorder=1)

              # Ecos reais de refletividade composta no grid WRF.
              mesh = ax.pcolormesh(lon, lat, refl, cmap=cmap, norm=norm,
                                   shading="auto", rasterized=True, zorder=2)
              ax.set_xlim(float(np.nanmin(lon)), float(np.nanmax(lon)))
              ax.set_ylim(float(np.nanmin(lat)), float(np.nanmax(lat)))
              ax.set_aspect(1.015, adjustable="box")

              # Contornos dos estados e linha costeira ficam sobre os ecos, para dar referência geográfica.
              for ring in land_rings:
                  ax.plot(ring[:, 0], ring[:, 1], color="#405b79", linewidth=0.62,
                          alpha=0.92, zorder=4)

              xmin, xmax = ax.get_xlim()
              ymin, ymax = ax.get_ylim()
              for sigla, x, y in state_labels:
                  if xmin < x < xmax and ymin < y < ymax:
                      ax.text(x, y, sigla, color="#d2dced", fontsize=7.2,
                              fontweight="bold", ha="center", va="center", zorder=6,
                              bbox=dict(facecolor="#07101c", edgecolor="none",
                                        alpha=0.72, boxstyle="round,pad=0.16"))

              for city, x, y in cities:
                  if xmin < x < xmax and ymin < y < ymax:
                      ax.scatter([x], [y], s=8, color="#f2f6ff",
                                 edgecolors="#07101c", linewidths=0.55, zorder=7)
                      ax.annotate(city, (x, y), xytext=(4, 3), textcoords="offset points",
                                  color="#edf3fc", fontsize=5.6, zorder=7,
                                  path_effects=[], bbox=dict(facecolor="#07101c",
                                  edgecolor="none", alpha=0.62, pad=0.7))

              ax.text(xmax - 0.6, (ymin + ymax) / 2, "OCEANO\nATLÂNTICO",
                      color="#7089a7", fontsize=8.5, ha="right", va="center",
                      alpha=0.9, fontstyle="italic", zorder=3)
              ax.set_xlabel("Longitude", color="#d8e2f0", fontsize=10)
              ax.set_ylabel("Latitude", color="#d8e2f0", fontsize=10)
              ax.tick_params(colors="#aebbd0", labelsize=9)
              ax.grid(True, color="#7389a4", alpha=0.30, linewidth=0.55, linestyle=":")
              for spine in ax.spines.values():
                  spine.set_color("#52657d")
              fig.text(0.065, 0.94, "WRF CBR 4 KM  /  REFLETIVIDADE", color="white",
                       fontsize=17, fontweight="bold", ha="left")
              fig.text(0.065, 0.895, "REFL_10CM · máximo vertical nativo · grade WRF 401 × 501",
                       color="#9fb2cb", fontsize=10, ha="left")
              fig.text(0.885, 0.94, f"F{fh:03d}", color="#f5f8ff",
                       fontsize=20, fontweight="bold", ha="right")
              fig.text(0.885, 0.895, dt.strftime("%d/%m/%Y %H:%M UTC"),
                       color="#a9bdd8", fontsize=10, ha="right")
              cax = fig.add_axes([0.90, 0.16, 0.018, 0.64])
              cb = fig.colorbar(mesh, cax=cax, ticks=[5,10,20,30,40,50,60,70])
              cb.set_label("dBZ", color="#e4ecf8", fontsize=10)
              cb.ax.tick_params(colors="#d6e0ef", labelsize=8, length=3)
              cb.outline.set_edgecolor("#536277")
              fig.text(0.065, 0.045, "SIDERAL METEOROLOGIA  ·  CAMPOS NATIVOS DO WRF  ·  " + os.environ["CHECKPOINT_TAG"],
                       color="#8192aa", fontsize=8.2, ha="left")
              fig.savefig(out / f"frame_{idx:03d}.png", facecolor=fig.get_facecolor(),
                          dpi=110, bbox_inches=None)
              plt.close(fig)
          print(f"Frames renderizados: {len(loaded)}; período {loaded[0][0]} até {loaded[-1][0]} UTC")
          PY
          python render_cbr.py
          count=$(find frames -maxdepth 1 -name 'frame_*.png' | wc -l)
          test "$count" -ge 2
          ffmpeg -hide_banner -loglevel error -y -framerate 8 -i frames/frame_%03d.png \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -vf "scale=1440:-2:flags=lanczos" -movflags +faststart "$VIDEO_NAME"
          test -s "$VIDEO_NAME"
          echo "Video size: $(du -h "$VIDEO_NAME" | cut -f1)"
          echo "VIDEO_NAME=$VIDEO_NAME" >> "$GITHUB_ENV"

      - name: Publicar MP4 junto ao checkpoint
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$CHECKPOINT_TAG" "$VIDEO_NAME" --repo "$GH_REPO" --clobber
          echo "MP4 publicado: https://github.com/$GH_REPO/releases/download/$CHECKPOINT_TAG/$VIDEO_NAME"
