name: WRF 7 km SUDESTE ICON - AUTOMATICO DIARIO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  workflow_run:
    workflows: ["ICON Global - PROXIMO DIA AUTOMATICO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sudeste-icon-7km
  cancel-in-progress: false

jobs:
  check-icon-data:
    # Descontinuado em 2026-10-26: WRF Sudeste 7 km
    if: ${{ false }}
    name: Verificar disponibilidade de dados ICON
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      data_available: ${{ steps.check.outputs.available }}
      run_date: ${{ steps.check.outputs.run_date }}
      run_cycle: ${{ steps.check.outputs.run_cycle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar dados ICON
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          now = datetime.now(timezone.utc)
          base = now.replace(hour=(now.hour // 6) * 6, minute=0, second=0, microsecond=0)
          available = False
          run_date = ''
          run_cycle = ''
          for offset in range(0, 48, 6):
              run = base - timedelta(hours=offset)
              date_str = run.strftime('%Y%m%d')
              cycle_str = run.strftime('%H')
              url = (
                  'https://opendata.dwd.de/weather/nwp/icon/grib/'
                  f'{cycle_str}/t_2m/icon_global_icosahedral_single-level_'
                  f'{date_str}{cycle_str}_042_T_2M.grib2.bz2'
              )
              try:
                  request = urllib.request.Request(
                      url, method='HEAD',
                      headers={'User-Agent': 'Sideral-Check'}
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status in (200, 206):
                          print(f'ICON encontrado: {date_str} {cycle_str}Z')
                          available = True
                          run_date = date_str
                          run_cycle = cycle_str
                          break
              except Exception as exc:
                  print(f'ICON indisponivel {date_str} {cycle_str}Z: {exc}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'available={str(available).lower()}\n')
              output.write(f'run_date={run_date}\n')
              output.write(f'run_cycle={run_cycle}\n')
          if not available:
              print('Nenhuma rodada ICON com F042 disponivel; etapa regional sera pulada sem falhar.')
          PY

  wrf:
    # Descontinuado em 2026-10-26: WRF Sudeste 7 km
    if: ${{ false }}
    name: WRF Sudeste ICON 7km
    needs: check-icon-data
    uses: ./.github/workflows/wrf-regional-7km-single.yml
    with:
      model: icon
      domain: sudeste
      source_data_branch: icon-data
      publish_branch: wrf-sudeste-icon-data
      run_script: run_icon_wrf_sudeste.sh
      run_date: ${{ needs.check-icon-data.outputs.run_date }}
      run_cycle: ${{ needs.check-icon-data.outputs.run_cycle }}
    secrets: inherit

  notify-unavailable:
    # Descontinuado em 2026-10-26: WRF Sudeste 7 km
    if: ${{ false }}
    name: Notificar dados indisponíveis
    needs: check-icon-data
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo "⚠️  Dados ICON não disponíveis no momento"
          echo "A rodada será retentada automaticamente pela agenda"
