<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sideral — SuperRes Radar Teste</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{margin:0;width:100%;height:100%;background:#070a0d;color:#fff;font-family:system-ui,Arial;overflow:hidden}
.panel{position:fixed;z-index:10;left:18px;top:18px;width:330px;padding:14px;border:1px solid #ffffff20;border-radius:12px;background:#0b1016e8;backdrop-filter:blur(12px);box-shadow:0 12px 35px #0008}
h1{font-size:15px;margin:0 0 8px}.muted{font-size:11px;color:#9aa5ae;line-height:1.45}label{display:block;font-size:10px;color:#89949d;margin:12px 0 5px}input,select,button{width:100%;height:36px;border-radius:8px;border:1px solid #ffffff18;background:#ffffff0a;color:#fff;padding:0 9px;box-sizing:border-box}button{margin-top:9px;background:#1877ff;border:0;font-weight:700;cursor:pointer}.status{margin-top:9px;font-size:11px;color:#83e8bd;min-height:15px}.legend{position:fixed;z-index:9;left:50%;bottom:25px;transform:translateX(-50%);padding:7px 12px;border-radius:9px;background:#080c11d9;border:1px solid #ffffff18;font-size:10px}.bar{display:inline-block;width:260px;height:8px;margin:0 8px;border-radius:5px;background:linear-gradient(90deg,#285d93,#56c6ee,#0fd0b2,#2ddf41,#f4e632,#ff971f,#ef321f,#fa4bc5)}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h1>SIDERAL — SUPERRES RADAR</h1>
<div class="muted">Teste experimental: PNG radar real → reamostragem de alta resolução. Não inventa células nem recupera variáveis que não existem no PNG.</div>
<label>Produto REDEMET</label><select id="product"><option value="03km">CAPPI 3 km</option><option value="05km">CAPPI 5 km</option><option value="07km">CAPPI 7 km</option><option value="10km">CAPPI 10 km</option><option value="maxcappi">MaxCappi</option></select>
<label>Escala SuperRes</label><select id="scale"><option value="2">2×</option><option value="4" selected>4×</option><option value="6">6×</option><option value="8">8×</option></select>
<label>URL de PNG REDEMET (opcional)</label><input id="url" placeholder="cole aqui uma URL oficial estatico-redemet.decea.mil.br/radar/...">
<button id="run">GERAR SUPERRES</button><div class="status" id="status"></div>
</div>
<div class="legend">0 <span class="bar"></span> 75 dBZ</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BACKEND='https://sideral-backend.onrender.com';
const map=L.map('map',{zoomControl:true}).setView([-15,-53],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
let overlay=null;
const bounds=[[-34,-74],[6,-34]];
async function run(){
 const status=document.getElementById('status'); status.textContent='Processando no Render…';
 if(overlay){map.removeLayer(overlay);overlay=null}
 const q=new URLSearchParams({product:document.getElementById('product').value,scale:document.getElementById('scale').value,anima:'1'});
 const url=document.getElementById('url').value.trim(); if(url) q.set('url',url);
 try{
  const r=await fetch(BACKEND+'/api/radar/superres?'+q.toString(),{cache:'no-store'});
  if(!r.ok){let t=await r.text();throw new Error('HTTP '+r.status+' — '+t.slice(0,250))}
  const blob=await r.blob();
  const objectUrl=URL.createObjectURL(blob);
  overlay=L.imageOverlay(objectUrl,bounds,{opacity:.84,interactive:false}).addTo(map);
  status.textContent='SuperRes carregado: '+Math.round(blob.size/1024)+' KB';
 }catch(e){console.error(e);status.textContent='Erro: '+e.message}
}
document.getElementById('run').onclick=run;
</script>
</body>
</html>
