<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sideral | Skew-T ECMWF</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#050505;--panel:#0b0b0d;--ink:#f5f5f5;--muted:#96969f;--line:#25252c;--accent:#7c3cff;--accent2:#a875ff;--danger:#ff5b68}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}body{min-height:100vh}.toolbar{background:#09090b;border-bottom:1px solid var(--line);padding:12px;display:grid;grid-template-columns:auto 150px 110px minmax(180px,1fr) 105px 105px 130px;gap:8px;align-items:end;position:sticky;top:0;z-index:10}.toolbar h1{font-size:16px;margin:0 12px 8px 2px;font-weight:900;white-space:nowrap}.control-group{display:flex;flex-direction:column;gap:4px}.control-group label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}.control-group input,.control-group select{height:34px;border:1px solid var(--line);background:#111116;color:#fff;border-radius:3px;padding:5px 8px;font:600 12px Consolas,monospace;outline:none}.btn{height:34px;border:1px solid var(--accent);border-radius:3px;background:var(--accent);color:#fff;padding:0 12px;font-weight:900}.btn:disabled{opacity:.5}.status{grid-column:1/-1;min-height:18px;font:600 11px Consolas;color:#aaa}.status.error{color:var(--danger)}.actions{grid-column:1/-1;display:flex;gap:7px}.actions button{height:32px;border:1px solid var(--line);background:#111116;color:#fff;border-radius:3px;padding:0 12px}.workspace{padding:10px}.board{background:#000;border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,.8fr);grid-template-rows:minmax(650px,72vh) auto;min-height:900px}.left{min-width:0;border-right:1px solid var(--line)}.right{min-width:0;display:grid;grid-template-rows:minmax(390px,1fr) 250px}.canvasbox{width:100%;height:100%;background:#050505;overflow:hidden}.canvasbox canvas{width:100%;height:100%;display:block}.mini{display:grid;grid-template-columns:repeat(3,1fr)}.panel,.data{padding:9px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}.title{font:900 10px Consolas;color:var(--accent2);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:7px;text-transform:uppercase}.body{font:600 10px Consolas;line-height:1.45;white-space:pre-wrap;color:#ddd}.bottom{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line)}.data pre{margin:0;white-space:pre-wrap;font:600 9px Consolas;color:#ddd}.loading{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20;font:900 12px Consolas}.spin{width:28px;height:28px;border:3px solid #292932;border-top-color:var(--accent2);border-radius:50%;animation:s .8s linear infinite;margin-right:10px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:1100px){.toolbar{grid-template-columns:1fr 1fr 1fr}.toolbar h1{grid-column:1/-1}.board{display:flex;flex-direction:column}.left{height:650px;border-right:0;border-bottom:1px solid var(--line)}.right{height:500px}.bottom{grid-template-columns:1fr 1fr}}@media(max-width:600px){.toolbar{grid-template-columns:1fr 1fr}.control-group.location{grid-column:1/-1}.toolbar .btn{grid-column:1/-1;width:100%}.left{height:520px}.right{height:480px}.bottom{grid-template-columns:1fr}}
</style></head>
<body>
<div class="toolbar"><h1>Sideral Skew‑T</h1><div class="control-group"><label>Modelo</label><input value="ECMWF IFS 0.25°" disabled></div><div class="control-group"><label>Forecast</label><select id="fh"></select></div><div class="control-group location"><label>Localização / cidade</label><input id="label" placeholder="Ex.: Rio das Ostras, RJ"></div><div class="control-group"><label>Latitude</label><input id="lat" type="number" step="0.01" value="-22.53"></div><div class="control-group"><label>Longitude</label><input id="lon" type="number" step="0.01" value="-41.95"></div><button class="btn" id="go">Gerar Skew-T</button><div class="status" id="status"></div><div class="actions"><button id="png">Exportar Skew-T PNG</button></div></div>
<div class="workspace"><div class="board"><section class="left"><div class="canvasbox"><canvas id="skew"></canvas></div></section><section class="right"><div class="canvasbox"><canvas id="hodo"></canvas></div><div class="mini"><div class="panel"><div class="title">Storm Motion</div><div id="storm" class="body">--</div></div><div class="panel"><div class="title">Camadas</div><div id="layers" class="body">--</div></div><div class="panel"><div class="title">Produto</div><div id="prod" class="body">Renderização direta no navegador</div></div></div></section><section class="bottom"><div class="data"><div class="title">Parcelas / Instabilidade</div><pre id="parc">--</pre></div><div class="data"><div class="title">Termodinâmica</div><pre id="therm">--</pre></div><div class="data"><div class="title">Cisalhamento / SR</div><pre id="kin">--</pre></div><div class="data"><div class="title">Compostos / Severidade</div><pre id="sev">--</pre></div><div class="data"><div class="title">Perfil ECMWF</div><pre id="profile">--</pre></div></section></div></div>
<div class="loading" id="loading"><span class="spin"></span>ECMWF → perfil vertical → Skew-T...</div>
<script>
const API='https://sideral-backend.onrender.com';const $=id=>document.getElementById(id);let lastProfile=null;
for(let h=0;h<=72;h+=3){let o=document.createElement('option');o.value=h;o.textContent='F'+String(h).padStart(3,'0');$('fh').appendChild(o)}
function status(t,e=false){$('status').textContent=t;$('status').classList.toggle('error',e)}
function num(v){v=Number(v);return Number.isFinite(v)?v:null}
function pick(a,keys){for(const k of keys){if(a&&a[k]!=null)return num(a[k])}return null}
function profileFrom(m){let p=m.profile||m.vertical_profile||m.soundings||m.levels||[];if(!Array.isArray(p)&&p&&Array.isArray(p.levels))p=p.levels;return Array.isArray(p)?p:[]}
function val(x,keys){return pick(x,keys)}
function pressure(x){return val(x,['pressure','p','pres','level_hpa','pressure_hpa'])}
function temp(x){return val(x,['temperature','temp','t','temperature_c'])}
function dew(x){return val(x,['dewpoint','dew_point','td','dewpoint_c','td_c'])}
function windDir(x){return val(x,['wind_direction','wind_dir','wd','direction'])}
function windSpeed(x){let v=val(x,['wind_speed','windSpeed','ws','wind_speed_ms']);return v==null?null:(x.wind_speed_ms!=null?v*1.943844:v)}
function canvasSize(c){let r=c.getBoundingClientRect(),d=devicePixelRatio||1,w=Math.max(300,r.width),h=Math.max(300,r.height);c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return [x,w,h]}
function drawSkew(profile){const [c,w,h]=canvasSize($('skew'));c.fillStyle='#050505';c.fillRect(0,0,w,h);let L=62,R=18,T=22,B=42,x0=L,x1=w-R,y0=T,y1=h-B;const pmin=100,pmax=1050;const xp=t=>x0+(t+40)/90*(x1-x0);const yp=p=>y0+(Math.log(p)-Math.log(pmax))/(Math.log(pmin)-Math.log(pmax))*(y1-y0);c.font='10px Consolas';c.lineWidth=1;c.strokeStyle='#24242b';c.fillStyle='#aaa';
for(let p=100;p<=1000;p+=50){let y=yp(p);if(y<y0||y>y1)continue;c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();c.fillText(p,x0-38,y+3)}
for(let t=-40;t<=50;t+=10){let x=xp(t);c.beginPath();c.moveTo(x,y0);c.lineTo(x,y1);c.stroke();c.fillText(t,x-8,y1+18)}
// dry adiabats: logarithmic pressure-temperature relation, drawn from real thermodynamic coordinates
c.strokeStyle='#3a3a42';for(let t0=-40;t0<=50;t0+=10){c.beginPath();for(let p=1000;p>=100;p-=20){let tk=(t0+273.15)*Math.pow(p/1000,0.2854);let t=tk-273.15,x=xp(t),y=yp(p);if(x>=x0&&x<=x1){if(p===1000)c.moveTo(x,y);else c.lineTo(x,y)}}c.stroke()}
// mixing-ratio lines (visual thermodynamic grid)
for(let t0=-20;t0<=30;t0+=10){c.beginPath();for(let p=1000;p>=100;p-=20){let t=t0+8*Math.log(1000/p);let x=xp(t),y=yp(p);if(x>=x0&&x<=x1){if(p===1000)c.moveTo(x,y);else c.lineTo(x,y)}}c.stroke()}
const pts=profile.map(x=>({p:pressure(x),t:temp(x),td:dew(x)})).filter(x=>x.p&&x.t!=null).sort((a,b)=>b.p-a.p);function line(key,stroke){c.beginPath();let n=0;for(const q of pts){let z=q[key];if(z==null)continue;let x=xp(z),y=yp(q.p);if(x<x0||x>x1||y<y0||y>y1)continue;if(!n)c.moveTo(x,y);else c.lineTo(x,y);n++}if(n>1){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
line('t','#ff6969');line('td','#62a8ff');c.fillStyle='#eee';c.font='900 12px Consolas';c.fillText('Skew-T / log-P',x0,15);c.font='10px Consolas';c.fillText('Temperatura °C',x0,y1+34);c.fillStyle='#ff6969';c.fillText('T',x1-28,y0+12);c.fillStyle='#62a8ff';c.fillText('Td',x1-28,y0+27);if(!pts.length){c.fillStyle='#ff5b68';c.fillText('Perfil vertical não disponível no retorno do ECMWF.',x0+10,(y0+y1)/2)}}
function drawHodo(profile){const [c,w,h]=canvasSize($('hodo'));c.fillStyle='#050505';c.fillRect(0,0,w,h);let cx=w/2,cy=h/2,scale=Math.min(w,h)/7;c.strokeStyle='#24242b';c.lineWidth=1;for(let r=scale;r<Math.min(w,h)/2;r+=scale){c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke()}c.beginPath();c.moveTo(cx-3*scale,cy);c.lineTo(cx+3*scale,cy);c.moveTo(cx,cy-3*scale);c.lineTo(cx,cy+3*scale);c.stroke();let pts=profile.map(x=>({d:windDir(x),s:windSpeed(x),p:pressure(x)})).filter(x=>x.d!=null&&x.s!=null).sort((a,b)=>b.p-a.p);c.beginPath();let n=0;for(const q of pts){let rad=q.d*Math.PI/180,x=cx+Math.sin(rad)*q.s/15*scale,y=cy-Math.cos(rad)*q.s/15*scale;if(!n)c.moveTo(x,y);else c.lineTo(x,y);n++}c.strokeStyle='#d5a7ff';c.lineWidth=2;c.stroke();c.fillStyle='#eee';c.font='900 12px Consolas';c.fillText('Hodógrafo',12,18);c.font='10px Consolas';c.fillStyle='#aaa';c.fillText('vento real do perfil ECMWF',12,34);}
function pretty(v){return JSON.stringify(v??{},null,2)}
function render(j){lastProfile=j;let m=j.meta||j,profile=profileFrom(m);drawSkew(profile);drawHodo(profile);$('prod').textContent='ECMWF IFS • renderização direta no navegador • perfil '+profile.length+' níveis';$('profile').textContent=pretty(profile.slice(0,40));$('parc').textContent=pretty(m.parcels);$('therm').textContent=pretty(m.variables);$('kin').textContent=pretty(m.storm_motion);$('sev').textContent=pretty(m.severe);$('storm').textContent=pretty(m.storm_motion);$('layers').textContent=profile.length+' níveis verticais recebidos';}
async function load(){let lat=Number($('lat').value),lon=Number($('lon').value),fh=Number($('fh').value);$('loading').style.display='flex';$('go').disabled=true';status(`ECMWF ${lat.toFixed(2)}, ${lon.toFixed(2)} • F${String(fh).padStart(3,'0')} → perfil vertical...`);try{let r=await fetch(API+'/api/skewt/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat,lon,forecast_hour:fh,label:$('label').value||'Ponto selecionado',render:'profile'})});let j=await r.json();if(!r.ok||!j.status)throw Error(j.error||'Falha ao obter perfil ECMWF');render(j);status('Perfil ECMWF recebido e desenhado diretamente no navegador.')}catch(e){status(e.message,true)}finally{$('loading').style.display='none';$('go').disabled=false}}
$('go').onclick=load;$('png').onclick=()=>{let c=$('skew');let a=document.createElement('a');a.download='sideral-skewt.png';a.href=c.toDataURL('image/png');a.click()};window.addEventListener('resize',()=>{if(lastProfile)render(lastProfile)});
</script></body></html>
