<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sideral | Skew-T ECMWF + SHARPpy</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--page:#050507;--ink:#fff;--line:#5d32b8;--purple:#7c3cff;--purple2:#a976ff}*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#fff;font-family:"Segoe UI",Arial,sans-serif}.toolbar{background:#fff;color:#000;border-bottom:2px solid var(--purple);padding:10px 14px;display:flex;align-items:end;gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:50}.toolbar h1{font-size:1rem;margin:0 8px 0 0;align-self:center;font-weight:900}.control-group{display:flex;flex-direction:column;gap:2px}.control-group label{font-size:.61rem;font-weight:900;color:#4b3a72;text-transform:uppercase}.control-group select,.control-group input{height:30px;border:1px solid #a98cf5;background:#fff;border-radius:3px;padding:4px 7px;font:700 .76rem Consolas,monospace;color:#000}.btn{height:30px;border:1px solid #000;border-radius:3px;background:#000;color:#fff;padding:0 14px;font-weight:900;cursor:pointer}.meta{margin-left:auto;text-align:right;color:#3d3156;font:600 .68rem Consolas,monospace;line-height:1.45}.status{width:100%;font-size:.72rem;min-height:18px;color:#4b3a72}.status.error{color:#b00020;font-weight:900}.actions{width:100%;display:flex;gap:8px}.actions button{min-height:34px;padding:0 12px;border:1px solid var(--purple);background:#fff;color:#000;font-weight:900;cursor:pointer}.workspace{padding:8px;background:#070709;min-height:calc(100vh - 120px)}.board{background:#000;border:2px solid var(--purple);display:grid;grid-template-columns:minmax(0,1.48fr) minmax(470px,.95fr);grid-template-rows:minmax(690px,72vh) auto;min-height:980px}.left{border-right:1px solid var(--line);min-width:0}.right{display:grid;grid-template-rows:minmax(410px,1fr) 275px;min-width:0}.product{width:100%;height:100%;background:#000;overflow:hidden}.product img{width:100%;height:100%;display:block;object-fit:contain;background:#000}.mini{display:grid;grid-template-columns:1fr 1fr 1fr}.panel{padding:9px;border-right:1px solid var(--line);overflow:auto}.title{font:900 .68rem Consolas;color:var(--purple2);border-bottom:1px solid #33224d;padding-bottom:5px;margin-bottom:6px}.body{font:700 .68rem Consolas;line-height:1.45;white-space:pre-wrap}.bottom{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line)}.data{padding:8px;border-right:1px solid var(--line);overflow:auto}.data pre{margin:0;white-space:pre-wrap;font:600 .58rem Consolas;color:#eee}.loading{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:100;font:900 .8rem Consolas}.spin{width:28px;height:28px;border:3px solid #33224d;border-top-color:var(--purple2);border-radius:50%;animation:s .8s linear infinite;margin-right:10px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:980px){.board{display:flex;flex-direction:column;min-height:0}.left{height:560px;border-right:0;border-bottom:1px solid var(--line)}.right{height:500px}.bottom{grid-template-columns:1fr 1fr}.meta{width:100%;margin-left:0;text-align:left}}@media(max-width:600px){.control-group{min-width:calc(50% - 6px);flex:1}.location{min-width:100%}.btn{width:100%;height:42px}.bottom{grid-template-columns:1fr}.left{height:480px}}
</style>
</head>
<body>
<div class="toolbar"><h1>Sideral Skew‑T</h1><div class="control-group"><label>Modelo</label><input value="ECMWF IFS 0.25°" disabled></div><div class="control-group"><label>Forecast</label><select id="fh"></select></div><div class="control-group location"><label>Localização</label><input id="label" placeholder="Ex.: Curitiba, PR"></div><div class="control-group"><label>Latitude</label><input id="lat" type="number" step="0.01" value="-25.43"></div><div class="control-group"><label>Longitude</label><input id="lon" type="number" step="0.01" value="-49.27"></div><button class="btn" id="go">Atualizar perfil</button><div class="meta"><div id="loc">Local: --</div><div id="run">Run: --</div><div id="valid">Validade: --</div><div>ECMWF IFS + SHARPpy</div></div><div class="status" id="status"></div><div class="actions"><button id="gif" disabled>Abrir GIF SHARPpy</button><button id="png" disabled>Abrir PNG completo</button></div></div>
<div class="workspace"><div class="board"><section class="left"><div id="skew" class="product"></div></section><section class="right"><div id="hodo" class="product"></div><div class="mini"><div class="panel"><div class="title">Storm Motion</div><div id="storm" class="body">--</div></div><div class="panel"><div class="title">Camadas</div><div id="layers" class="body">--</div></div><div class="panel"><div class="title">Produto</div><div id="prod" class="body">SHARPpy pré-renderizado</div></div></div></section><section class="bottom"><div class="data"><div class="title">Parcelas / Instabilidade</div><pre id="parc">--</pre></div><div class="data"><div class="title">Termodinâmica</div><pre id="therm">--</pre></div><div class="data"><div class="title">Cisalhamento / SR</div><pre id="kin">--</pre></div><div class="data"><div class="title">Compostos / Severidade</div><pre id="sev">--</pre></div><div class="data"><div class="title">Perfil ECMWF</div><pre id="profile">--</pre></div></section></div></div>
<div class="loading" id="loading"><span class="spin"></span>AGUARDANDO GITHUB + SHARPpy...</div>
<script>
const ROOT='https://raw.githubusercontent.com/progames12301-hash/sideral-backend/main/data/skewt/points',API='https://sideral-backend.onrender.com';let key='';let gridLat=null,gridLon=null;
const $=id=>document.getElementById(id);
function snap025(v){return Math.floor(Number(v)*4+0.5)/4}
function keyFor(a,b){return `${Number(a).toFixed(2)}_${Number(b).toFixed(2)}`.replaceAll('-','m').replaceAll('.','p')}
function setGrid(a,b){gridLat=snap025(a);gridLon=snap025(b);key=keyFor(gridLat,gridLon)}
for(let h=0;h<=72;h+=3){let o=document.createElement('option');o.value=h;o.textContent='F'+String(h).padStart(3,'0');$('fh').appendChild(o)}
function status(t,e=false){$('status').textContent=t;$('status').classList.toggle('error',e)}
function u(n){return `${ROOT}/${key}/${n}?v=${Date.now()}`}
async function show(meta){let f=String($('fh').value).padStart(3,'0');$('loc').textContent=`Local: ${meta.location||'Brasil'} (grade ${Number(meta.latitude).toFixed(2)}, ${Number(meta.longitude).toFixed(2)})`;$('run').textContent='Run: '+(meta.run_utc||'--');$('valid').textContent='Validade: '+(meta.valid_utc||'--');$('skew').innerHTML=`<img src="${u(f+'_skewt.png')}" alt="Skew-T SHARPpy">`;$('hodo').innerHTML=`<img src="${u(f+'_hodograph.png')}" alt="Hodógrafo SHARPpy">`;let r=await fetch(u(f+'.json'),{cache:'no-store'});if(r.ok){let d=await r.json();$('parc').textContent=JSON.stringify(d.parcels||{},null,2);$('therm').textContent=JSON.stringify(d.variables||{},null,2);$('kin').textContent=JSON.stringify(d.storm_motion||{},null,2);$('sev').textContent=JSON.stringify(d.severe||{},null,2);$('profile').textContent=JSON.stringify(d.profile||[],null,2)}$('gif').disabled=false;$('png').disabled=false;$('gif').onclick=()=>window.open(u('animation.gif'),'_blank');$('png').onclick=()=>window.open(u(f+'.png'),'_blank')}
async function load(){let lat=Number($('lat').value),lon=Number($('lon').value);if(lat<-34||lat>6||lon<-75||lon>-33){status('Coordenada fora do domínio brasileiro.',true);return}setGrid(lat,lon);$('loading').style.display='flex';$('go').disabled=true;status(`Coordenada associada à grade ECMWF 0.25°: ${gridLat.toFixed(2)}, ${gridLon.toFixed(2)}. Solicitando produto SHARPpy...`);try{let r=await fetch(API+'/api/skewt/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat,lon,label:$('label').value||'Brasil'})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Falha ao iniciar GitHub');for(let i=0;i<36;i++){try{let x=await fetch(u('latest.json'),{cache:'no-store'});if(x.ok){let m=await x.json();if(Number(m.latitude).toFixed(2)===gridLat.toFixed(2)&&Number(m.longitude).toFixed(2)===gridLon.toFixed(2)){await show(m);status('Produto completo recebido do GitHub/SHARPpy. O navegador apenas exibe os arquivos.');return}}}catch{}await new Promise(r=>setTimeout(r,10000))}throw Error('Runner ainda não publicou o produto para esta célula ECMWF 0.25°.')}catch(e){status(e.message,true)}finally{$('loading').style.display='none';$('go').disabled=false}}
$('go').onclick=load;$('fh').onchange=()=>{if(key)fetch(u('latest.json')).then(r=>r.json()).then(show)};window.onload=load;
</script></body></html>
