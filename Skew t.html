<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sideral | Skew-T ECMWF</title><link rel="icon" type="image/png" href="/favicon.png"><style>body{margin:0;background:#050505;color:#f5f5f5;font-family:Segoe UI,Arial,sans-serif}.toolbar{padding:12px;background:#09090b;border-bottom:1px solid #25252c;display:flex;gap:8px;flex-wrap:wrap;align-items:end}.toolbar h1{font-size:16px;margin:0 15px 5px 0}.g{display:flex;flex-direction:column;gap:4px}.g label{font:800 10px Consolas;color:#96969f}.g input,.g select{height:34px;background:#111116;color:#fff;border:1px solid #25252c;padding:0 8px}.btn{height:34px;background:#7c3cff;color:#fff;border:1px solid #a875ff;font-weight:900;padding:0 12px}.status{width:100%;font:600 11px Consolas;color:#aaa}.status.error{color:#ff5b68}.board{margin:10px;border:1px solid #25252c;background:#000;display:grid;grid-template-columns:1.5fr .8fr}.box{min-width:0;border-right:1px solid #25252c}.canvas{width:100%;height:650px}.canvas canvas{width:100%;height:100%;display:block}.side{display:grid;grid-template-rows:650px auto}.mini{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #25252c}.panel,.data{padding:9px;background:#0b0b0d;border-right:1px solid #25252c;overflow:auto}.title{font:900 10px Consolas;color:#a875ff;border-bottom:1px solid #25252c;padding-bottom:6px;margin-bottom:7px}.body,pre{font:600 10px Consolas;line-height:1.45;white-space:pre-wrap;color:#ddd;margin:0}.bottom{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #25252c}.loading{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;font:900 12px Consolas}@media(max-width:1000px){.board{display:block}.box{border:0}.canvas{height:560px}.side{display:block}.mini{min-height:180px}.bottom{grid-template-columns:1fr 1fr}}@media(max-width:600px){.canvas{height:480px}.bottom{grid-template-columns:1fr}}</style></head><body><div class="toolbar"><h1>Sideral Skew‑T</h1><div class="g"><label>MODELO</label><input value="ECMWF IFS 0.25°" disabled></div><div class="g"><label>FORECAST</label><select id="fh"></select></div><div class="g" style="min-width:190px"><label>LOCALIZAÇÃO</label><input id="label" placeholder="Rio das Ostras, RJ"></div><div class="g"><label>LAT</label><input id="lat" type="number" step="0.01" value="-22.53"></div><div class="g"><label>LON</label><input id="lon" type="number" step="0.01" value="-41.95"></div><button class="btn" id="go">Gerar Skew-T</button><button class="btn" id="png">Exportar PNG</button><div id="status" class="status"></div></div><div class="board"><section class="box"><div class="canvas"><canvas id="skew"></canvas></div></section><section class="side"><div class="canvas"><canvas id="hodo"></canvas></div><div class="mini"><div class="panel"><div class="title">STORM MOTION</div><div id="storm" class="body">--</div></div><div class="panel"><div class="title">CAMADAS</div><div id="layers" class="body">--</div></div><div class="panel"><div class="title">PRODUTO</div><div id="prod" class="body">Renderização HTML</div></div></div></section><section class="bottom"><div class="data"><div class="title">PARCELAS</div><pre id="parc">--</pre></div><div class="data"><div class="title">TERMODINÂMICA</div><pre id="therm">--</pre></div><div class="data"><div class="title">CISALHAMENTO / SR</div><pre id="kin">--</pre></div><div class="data"><div class="title">SEVERIDADE</div><pre id="sev">--</pre></div><div class="data"><div class="title">PERFIL ECMWF</div><pre id="profile">--</pre></div></section></div><div class="loading" id="loading">ECMWF → perfil vertical → Skew-T...</div><script>const API='https://sideral-backend.onrender.com', $=id=>document.getElementById(id);let last=null;for(let h=0;h<=72;h+=3){let o=document.createElement('option');o.value=h;o.textContent='F'+String(h).padStart(3,'0');$('fh').appendChild(o)}function st(t,e=false){$('status').textContent=t;$('status').classList.toggle('error',e)}function n(v){v=Number(v);return Number.isFinite(v)?v:null}function pick(x,a){for(const k of a)if(x&&x[k]!=null){let v=n(x[k]);if(v!=null)return v}return null}function prof(j){let m=j.meta||j,p=m.profile||m.vertical_profile||m.soundings||m.levels||[];if(!Array.isArray(p)&&p&&Array.isArray(p.levels))p=p.levels;return Array.isArray(p)?p:[]}function P(x){return pick(x,['pressure','p','pres','level_hpa','pressure_hpa'])}function T(x){return pick(x,['temperature','temp','t','temperature_c'])}function D(x){return pick(x,['dewpoint','dew_point','td','dewpoint_c','td_c'])}function WD(x){return pick(x,['wind_direction','wind_dir','wd','direction'])}function WS(x){let v=pick(x,['wind_speed','windSpeed','ws','wind_speed_ms']);return v==null?null:(x.wind_speed_ms!=null?v*1.943844:v)}function size(c){let r=c.getBoundingClientRect(),d=devicePixelRatio||1,w=Math.max(300,r.width),h=Math.max(300,r.height);c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]}function draw(profile){let[c,w,h]=size($('skew'));c.fillStyle='#050505';c.fillRect(0,0,w,h);let L=62,R=18,TT=24,B=42,x0=L,x1=w-R,y0=TT,y1=h-B,xp=t=>x0+(t+40)/90*(x1-x0),yp=p=>y0+(Math.log(p)-Math.log(1050))/(Math.log(100)-Math.log(1050))*(y1-y0);c.font='10px Consolas';c.lineWidth=1;c.strokeStyle='#24242b';c.fillStyle='#aaa';for(let p=100;p<=1000;p+=50){let y=yp(p);c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();c.fillText(p,x0-38,y+3)}for(let t=-40;t<=50;t+=10){let x=xp(t);c.beginPath();c.moveTo(x,y0);c.lineTo(x,y1);c.stroke();c.fillText(t,x-8,y1+18)}c.strokeStyle='#33333b';for(let t0=-40;t0<=50;t0+=10){c.beginPath();let first=true;for(let p=1000;p>=100;p-=20){let t=(t0+273.15)*Math.pow(p/1000,.2854)-273.15,x=xp(t),y=yp(p);if(x>=x0&&x<=x1){if(first){c.moveTo(x,y);first=false}else c.lineTo(x,y)}}c.stroke()}let q=profile.map(x=>({p:P(x),t:T(x),d:D(x)})).filter(x=>x.p&&x.t!=null).sort((a,b)=>b.p-a.p);function line(k,color){c.beginPath();let z=0;for(let a of q){if(a[k]==null)continue;let x=xp(a[k]),y=yp(a.p);if(x<x0||x>x1||y<y0||y>y1)continue;if(!z)c.moveTo(x,y);else c.lineTo(x,y);z++}if(z>1){c.strokeStyle=color;c.lineWidth=2;c.stroke()}}line('t','#ff6969');line('d','#62a8ff');c.fillStyle='#eee';c.font='900 12px Consolas';c.fillText('Skew-T / log-P',x0,15);c.font='10px Consolas';c.fillText('Temperatura °C',x0,y1+34);if(!q.length){c.fillStyle='#ff5b68';c.fillText('Perfil vertical ECMWF não retornado.',x0+10,(y0+y1)/2)}}function hodo(profile){let[c,w,h]=size($('hodo'));c.fillStyle='#050505';c.fillRect(0,0,w,h);let cx=w/2,cy=h/2,s=Math.min(w,h)/7;c.strokeStyle='#24242b';for(let r=s;r<Math.min(w,h)/2;r+=s){c.beginPath();c.arc(cx,cy,r,0,6.283);c.stroke()}let q=profile.map(x=>({d:WD(x),s:WS(x),p:P(x)})).filter(x=>x.d!=null&&x.s!=null).sort((a,b)=>b.p-a.p);c.beginPath();q.forEach((a,i)=>{let r=a.d*Math.PI/180,x=cx+Math.sin(r)*a.s/15*s,y=cy-Math.cos(r)*a.s/15*s;i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle='#d5a7ff';c.lineWidth=2;c.stroke();c.fillStyle='#eee';c.font='900 12px Consolas';c.fillText('Hodógrafo',12,18)}function render(j){last=j;let m=j.meta||j,p=prof(j);draw(p);hodo(p);$('prod').textContent='ECMWF IFS • renderização direta no navegador • '+p.length+' níveis';$('layers').textContent=p.length+' níveis verticais';$('profile').textContent=JSON.stringify(p.slice(0,60),null,2);$('parc').textContent=JSON.stringify(m.parcels??{},null,2);$('therm').textContent=JSON.stringify(m.variables??{},null,2);$('kin').textContent=JSON.stringify(m.storm_motion??{},null,2);$('sev').textContent=JSON.stringify(m.severe??{},null,2);$('storm').textContent=JSON.stringify(m.storm_motion??{},null,2)}async function load(){let lat=Number($('lat').value),lon=Number($('lon').value),fh=Number($('fh').value);$('loading').style.display='flex';$('go').disabled=true;st(`ECMWF ${lat.toFixed(2)}, ${lon.toFixed(2)} • F${String(fh).padStart(3,'0')} → perfil vertical...`);try{let r=await fetch(API+'/api/skewt/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat,lon,forecast_hour:fh,label:$('label').value||'Ponto selecionado',render:'profile'})});let j=await r.json();if(!r.ok||!j.status)throw Error(j.error||'Falha ao obter perfil ECMWF');render(j);st('Perfil ECMWF recebido e desenhado diretamente no navegador.')}catch(e){st(e.message,true)}finally{$('loading').style.display='none';$('go').disabled=false}}$('go').onclick=load;$('png').onclick=()=>{let a=document.createElement('a');a.download='sideral-skewt.png';a.href=$('skew').toDataURL('image/png');a.click()};window.addEventListener('resize',()=>{if(last)render(last)});</script></body></html>
