name: TESTE ECMWF REFLETIVIDADE NATIVA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-ecmwf-native-reflectivity.yml"
  workflow_dispatch:

jobs:
  test-native-reflectivity:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar cliente ECMWF e ecCodes
        run: |
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata eccodes

      - name: Testar tcvmrr nativo
        run: |
          set -euxo pipefail
          python - <<'PY'
          import datetime as dt
          from pathlib import Path
          from ecmwf.opendata import Client
          from eccodes import codes_grib_new_from_file, codes_get, codes_release

          client=Client(source='ecmwf', model='ifs')
          latest=client.latest(type='fc', step=6, param=['tcvmrr'])
          if isinstance(latest, dt.datetime):
              run=latest if latest.tzinfo else latest.replace(tzinfo=dt.timezone.utc)
          else:
              run=dt.datetime.fromisoformat(str(latest))
              if run.tzinfo is None:
                  run=run.replace(tzinfo=dt.timezone.utc)

          print('RODADA:',run.isoformat())
          target=Path('tcvmrr.grib2')
          client.retrieve(
              date=run.strftime('%Y%m%d'),
              time=int(run.strftime('%H')),
              type='fc',
              step=[6],
              param=['tcvmrr'],
              target=str(target),
          )
          print('TAMANHO:',target.stat().st_size)

          with target.open('rb') as fh:
              gid=codes_grib_new_from_file(fh)
              if gid is None:
                  raise SystemExit('GRIB vazio')
              try:
                  print('shortName=',codes_get(gid,'shortName'))
                  print('name=',codes_get(gid,'name'))
                  print('units=',codes_get(gid,'units'))
                  print('typeOfLevel=',codes_get(gid,'typeOfLevel'))
              finally:
                  codes_release(gid)
          PY
