name: WRF 4 km - DOIS DIAS AUTOMATICO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WRF 4 km - REFL NATIVO - USE ESTE"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-two-days
  cancel-in-progress: false

jobs:
  run-info:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    outputs:
      run_date: ${{ steps.info.outputs.run_date }}
      run_cycle: ${{ steps.info.outputs.run_cycle }}
    steps:
      - name: Ler rodada curta publicada
        id: info
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-data/metadata.json?run=${GITHUB_RUN_ID}"
          curl -fsSL --retry 8 --retry-delay 5 "$URL" -o /tmp/meta.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/meta.json',encoding='utf-8'))
          assert d.get('reflectivitySource')=='REFL_10CM_NATIVE', d
          cycle=str(d['runCycle']).replace('Z','')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"run_date={d['runDate']}\nrun_cycle={cycle}\n")
          print('GFS rodada', d['runDate'], d['runCycle'])
          PY

  segment-1:
    name: GFS WRF segmento F000-F024
    needs: run-info
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Liberar espaco
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          docker pull dtcenter/wps_wrf:latest
          python -m pip install numpy xarray netCDF4
      - name: Rodar F000-F024
        env:
          FORCE_RUN_DATE: ${{ needs.run-info.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.run-info.outputs.run_cycle }}
          WRF_START_HOUR: '0'
          WRF_END_HOUR: '24'
        run: |
          chmod +x wrf/run_gfs_segment.sh
          ./wrf/run_gfs_segment.sh
          ls -lh wrf_work/run/wrfrst_d01_*
      - name: Extrair segmento
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 220 --grid-y 180
      - uses: actions/upload-artifact@v4
        with:
          name: gfs-restart-f024
          path: wrf_work/run/wrfrst_d01_*
          retention-days: 2
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: gfs-frames-f000-f024
          path: wrf_publish/
          retention-days: 2

  segment-2:
    name: GFS WRF segmento F024-F048
    needs: [run-info, segment-1]
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: gfs-restart-f024
          path: restart_in
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          docker pull dtcenter/wps_wrf:latest
          python -m pip install numpy xarray netCDF4
      - name: Continuar F024-F048
        env:
          FORCE_RUN_DATE: ${{ needs.run-info.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.run-info.outputs.run_cycle }}
          WRF_START_HOUR: '24'
          WRF_END_HOUR: '48'
        run: |
          RST=$(find restart_in -type f -name 'wrfrst_d01_*' | head -1)
          test -n "$RST"
          export WRF_RESTART_FILE="$RST"
          chmod +x wrf/run_gfs_segment.sh
          ./wrf/run_gfs_segment.sh
          ls -lh wrf_work/run/wrfrst_d01_*
      - name: Extrair segmento
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 220 --grid-y 180
      - uses: actions/upload-artifact@v4
        with:
          name: gfs-restart-f048
          path: wrf_work/run/wrfrst_d01_*
          retention-days: 2
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: gfs-frames-f024-f048
          path: wrf_publish/
          retention-days: 2

  segment-3:
    name: GFS WRF segmento F048-F069
    needs: [run-info, segment-2]
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: gfs-restart-f048
          path: restart_in
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          docker pull dtcenter/wps_wrf:latest
          python -m pip install numpy xarray netCDF4
      - name: Continuar F048-F069
        env:
          FORCE_RUN_DATE: ${{ needs.run-info.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.run-info.outputs.run_cycle }}
          WRF_START_HOUR: '48'
          WRF_END_HOUR: '69'
        run: |
          RST=$(find restart_in -type f -name 'wrfrst_d01_*' | head -1)
          test -n "$RST"
          export WRF_RESTART_FILE="$RST"
          chmod +x wrf/run_gfs_segment.sh
          ./wrf/run_gfs_segment.sh
      - name: Extrair segmento
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 220 --grid-y 180
      - uses: actions/upload-artifact@v4
        with:
          name: gfs-frames-f048-f069
          path: wrf_publish/
          retention-days: 2

  publish-two-days:
    name: GFS publicar dois dias completos
    needs: [run-info, segment-1, segment-2, segment-3]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
      - uses: actions/download-artifact@v4
        with:
          name: gfs-frames-f000-f024
          path: segments/a
      - uses: actions/download-artifact@v4
        with:
          name: gfs-frames-f024-f048
          path: segments/b
      - uses: actions/download-artifact@v4
        with:
          name: gfs-frames-f048-f069
          path: segments/c
      - name: Unir e selecionar dois dias BRT
        run: |
          python wrf/merge_wrf_segments.py --input segments/a --input segments/b --input segments/c --output wrf_publish
          python wrf/filter_next_day.py --root wrf_publish --days 2
          python - <<'PY'
          import json
          d=json.load(open('wrf_publish/metadata.json',encoding='utf-8'))
          assert d['model']=='gfs', d
          assert d['reflectivitySource']=='REFL_10CM_NATIVE', d
          assert d['scope']=='next_two_local_days', d
          assert d['frameCount']==48, d
          assert len(d['forecastLocalDates'])==2, d
          print('GFS 48h OK',d['forecastLocalDates'])
          PY
      - name: Publicar 48 horas em wrf-data
        run: |
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/wrf-data
          git worktree add --detach /tmp/wrf-data
          cd /tmp/wrf-data
          git checkout --orphan wrf-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          printf '# Sideral WRF Data\nDois dias completos em BRT. WRF Sul 4 km / REFL_10CM nativo.\n' > README.md
          git add .
          git commit -m "GFS-WRF publica dois dias [skip render]"
          git push --force origin HEAD:wrf-data
