name: WRF 7 km SUL GFS - DOIS DIAS AUTOMATICO

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Rodada GFS em YYYYMMDD (vazio = mais recente com F042)"
        required: false
        type: string
      run_cycle:
        description: "Ciclo GFS: 00, 06, 12 ou 18 (vazio = mais recente com F042)"
        required: false
        type: string
  schedule:
    - cron: '20 0 * * *'
  workflow_run:
    workflows: ["WRF 7 km SUL GFS - REFL NATIVO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-two-days
  cancel-in-progress: false

jobs:
  wrf:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/wrf-regional-7km-single.yml
    with:
      model: gfs
      domain: sul
      publish_branch: wrf-data
      run_date: ${{ inputs.run_date || '' }}
      run_cycle: ${{ inputs.run_cycle || '' }}
    secrets: inherit
