name: WRF 4 km - PROXIMO DIA AUTOMATICO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WRF 4 km - REFL NATIVO - USE ESTE"]
    types: [completed]

permissions:
  contents: write

jobs:
  next-day:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout wrf-runner
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Ler a rodada que acabou de terminar
        run: |
          set -euxo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-data/metadata.json?nextday=${GITHUB_RUN_ID}"
          curl -fsSL --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 60 "$URL" -o /tmp/source-metadata.json
          python - <<'PY'
          import json, os
          d = json.load(open('/tmp/source-metadata.json', encoding='utf-8'))
          assert d.get('reflectivitySource') == 'REFL_10CM_NATIVE', d
          assert d.get('frameCount', 0) >= 3, d
          cycle = str(d['runCycle']).replace('Z', '')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"FORCE_RUN_DATE={d['runDate']}\n")
              f.write(f"FORCE_RUN_CYCLE={cycle}\n")
          print('Rodada encadeada:', d['runDate'], d['runCycle'])
          PY

      - name: Liberar espaco
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h

      - name: Baixar container WRF WPS
        run: |
          set -euxo pipefail
          docker pull dtcenter/wps_wrf:latest

      - name: Rodar mesma rodada ate F042
        run: |
          set -euxo pipefail
          echo "Rodada fixa: ${FORCE_RUN_DATE} ${FORCE_RUN_CYCLE}Z"
          chmod +x wrf/run_gfs_nextday.sh
          ./wrf/run_gfs_nextday.sh

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar extrator
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy xarray netCDF4

      - name: Extrair REFL_10CM nativo
        run: |
          set -euxo pipefail
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py \
            --run-dir wrf_work/run \
            --run-env wrf_diagnostics/run.env \
            --output-dir wrf_publish \
            --grid-x 220 \
            --grid-y 180
          python wrf/filter_next_day.py --root wrf_publish
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('wrf_publish/metadata.json').read_text(encoding='utf-8'))
          assert d.get('scope') == 'next_local_day', d
          assert d.get('timezone') == 'America/Sao_Paulo', d
          assert d.get('frameCount') == 8, d
          assert d.get('reflectivitySource') == 'REFL_10CM_NATIVE', d
          print('Data local publicada:', d['forecastLocalDate'])
          print('Horas:', [(f['forecastHour'], f['localValidTime']) for f in d['frames']])
          PY

      - name: Publicar proximo dia em wrf-data
        run: |
          set -euxo pipefail
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/sideral-wrf-data
          git worktree add --detach /tmp/sideral-wrf-data
          cd /tmp/sideral-wrf-data
          git checkout --orphan wrf-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          cat > README.md <<'EOF'
          # Sideral WRF Data
          Previsao WRF Sul 4 km do proximo dia em horario de Brasilia.
          Refletividade: REFL_10CM nativo do WRF.
          EOF
          git add .
          git commit -m "Publica WRF 4 km do proximo dia [skip render]"
          git push --force origin HEAD:wrf-data

      - name: Confirmar publicacao remota
        run: |
          set -euxo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-data/metadata.json?nextdaycheck=${GITHUB_RUN_ID}"
          for N in $(seq 1 12); do
            if curl -fsSL --connect-timeout 10 --max-time 30 "$URL-$N" -o /tmp/remote.json; then
              if python - <<'PY'
          import json
          d = json.load(open('/tmp/remote.json', encoding='utf-8'))
          ok = (
              d.get('scope') == 'next_local_day'
              and d.get('timezone') == 'America/Sao_Paulo'
              and d.get('frameCount') == 8
              and d.get('reflectivitySource') == 'REFL_10CM_NATIVE'
              and all(f.get('reflectivitySource') == 'REFL_10CM_NATIVE' for f in d.get('frames', []))
          )
          print('metadata remoto:', d)
          raise SystemExit(0 if ok else 1)
          PY
              then
                echo "PROXIMO DIA WRF PUBLICADO COM SUCESSO"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 41

      - name: Salvar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-next-day-diagnostics
          path: |
            wrf_diagnostics/
            wrf_publish/
          retention-days: 7
          if-no-files-found: warn
