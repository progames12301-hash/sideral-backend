name: WRF 4 km - DOIS DIAS AUTOMATICO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WRF 4 km - REFL NATIVO - USE ESTE"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-two-days
  cancel-in-progress: false

jobs:
  run-info:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    outputs:
      run_date: ${{ steps.info.outputs.run_date }}
      run_cycle: ${{ steps.info.outputs.run_cycle }}
      run_id: ${{ steps.info.outputs.run_id }}
    steps:
      - name: Ler rodada curta publicada
        id: info
        shell: bash
        run: |
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-data/metadata.json?run=${GITHUB_RUN_ID}"
          curl -fsSL --retry 8 --retry-delay 5 "$url" -o /tmp/meta.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/meta.json', encoding='utf-8'))
          assert data.get('reflectivitySource') == 'REFL_10CM_NATIVE', data
          cycle = str(data['runCycle']).replace('Z', '').zfill(2)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_date={data['runDate']}\n")
              output.write(f"run_cycle={cycle}\n")
              output.write(f"run_id={data['runDate']}{cycle}\n")
          PY

  segments:
    name: WRF F${{ matrix.start }}-F${{ matrix.end }}
    needs: run-info
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { id: "000-009", start: 0, end: 9 }
          - { id: "009-018", start: 9, end: 18 }
          - { id: "018-027", start: 18, end: 27 }
          - { id: "027-036", start: 27, end: 36 }
          - { id: "036-045", start: 36, end: 45 }
          - { id: "045-054", start: 45, end: 54 }
          - { id: "054-063", start: 54, end: 63 }
          - { id: "063-072", start: 63, end: 72 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - name: Preparar runner
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          docker pull dtcenter/wps_wrf:latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar extrator
        run: python -m pip install numpy xarray netCDF4
      - name: Rodar segmento independente
        env:
          FORCE_RUN_DATE: ${{ needs.run-info.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.run-info.outputs.run_cycle }}
          WRF_START_HOUR: ${{ matrix.start }}
          WRF_END_HOUR: ${{ matrix.end }}
          WRF_COLD_START: "1"
        shell: bash
        run: |
          chmod +x wrf/run_gfs_segment.sh
          wrf/run_gfs_segment.sh
      - name: Extrair REFL_10CM nativo
        shell: bash
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py \
            --run-dir wrf_work/run \
            --run-env wrf_diagnostics/run.env \
            --output-dir wrf_publish \
            --grid-x 220 \
            --grid-y 180
      - uses: actions/upload-artifact@v4
        with:
          name: gfs-frames-${{ matrix.id }}
          path: wrf_publish/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publicar WRF completo F000-F072
    needs: [run-info, segments]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
      - uses: actions/download-artifact@v4
        with:
          pattern: gfs-frames-*
          path: segments
      - name: Unir os oito segmentos
        shell: bash
        run: |
          mapfile -t roots < <(find segments -type f -name metadata.json -printf '%h\n' | sort)
          test "${#roots[@]}" -eq 8
          args=()
          for root in "${roots[@]}"; do args+=(--input "$root"); done
          python wrf/merge_wrf_segments.py "${args[@]}" --output wrf_publish
          python3 - <<'PY'
          import json
          data = json.load(open('wrf_publish/metadata.json', encoding='utf-8'))
          hours = [int(frame['forecastHour']) for frame in data['frames']]
          assert data['model'] == 'gfs', data
          assert data['reflectivitySource'] == 'REFL_10CM_NATIVE', data
          assert data['frameCount'] == 73, data
          assert hours == list(range(73)), hours
          data['scope'] = 'forecast_72_hours'
          json.dump(data, open('wrf_publish/metadata.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('WRF 72H VALIDADO:', data['initTime'], data['frameCount'])
          PY
      - name: Publicar no branch de dados
        shell: bash
        run: |
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/wrf-data
          git worktree add --detach /tmp/wrf-data
          cd /tmp/wrf-data
          git checkout --orphan wrf-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          printf '# Sideral WRF Data\n72 horas · WRF Sul 4 km · REFL_10CM nativo.\n' > README.md
          git add .
          git commit -m "GFS-WRF publica 72 horas [skip render]"
          git push --force origin HEAD:wrf-data
      - name: Guardar rodada por três dias
        uses: actions/upload-artifact@v4
        with:
          name: wrf-gfs-${{ needs.run-info.outputs.run_id }}
          path: wrf_publish/
          retention-days: 3
          compression-level: 6
