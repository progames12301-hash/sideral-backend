name: Sideral Skew-T SHARPpy — 27 Capitais

on:
  schedule:
    - cron: '45 13 * * *'
    - cron: '45 19 * * *'
    - cron: '45 1 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Ciclo ECMWF IFS'
        required: true
        type: choice
        options:
          - '06'
          - '12'
          - '18'

permissions:
  contents: write

concurrency:
  group: sideral-skewt-${{ github.event_name == 'workflow_dispatch' && inputs.cycle || github.event.schedule }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar ciclo
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cycle="${{ inputs.cycle }}"
          else
            case "${{ github.event.schedule }}" in
              '45 13 * * *') cycle='06' ;;
              '45 19 * * *') cycle='12' ;;
              '45 1 * * *')  cycle='18' ;;
              *) echo 'Cron desconhecido'; exit 1 ;;
            esac
          fi
          echo "CYCLE=$cycle" >> "$GITHUB_ENV"
          echo "Ciclo selecionado: $cycle UTC"

      - name: Sistema gráfico Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Dependências meteorológicas
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Gerar 27 capitais × F000–F048
        run: |
          rm -rf build/skewt-capitals
          python tools/skewt/generate_capitals_sharppy.py \
            --cycle "$CYCLE" \
            --out build/skewt-capitals

      - name: Validar saída antes de publicar
        shell: bash
        run: |
          count=$(find build/skewt-capitals -type f -name '*.png' | wc -l)
          echo "PNG encontrados: $count"
          test "$count" -eq 459
          test -s build/skewt-capitals/manifest.json
          while IFS= read -r file; do
            size=$(stat -c '%s' "$file")
            if (( size < 10000 )); then
              echo "PNG suspeito: $file ($size bytes)"
              exit 1
            fi
          done < <(find build/skewt-capitals -type f -name '*.png')

      - name: Construir índice público dos assets
        shell: bash
        run: |
          tag="skewt-live-${CYCLE}"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          root = Path('build/skewt-capitals')
          tag = f"skewt-live-{os.environ['CYCLE']}"
          assets = sorted(p.name for p in root.glob('*/*.png'))
          if len(assets) != 459:
              raise SystemExit(f'Índice público: esperados 459 PNG, encontrados {len(assets)}')
          publication = {
              'schema': 'sideral-skewt-publication-v1',
              'repository': os.environ['GH_REPO'],
              'tag': tag,
              'asset_count': len(assets),
              'download_base': f'https://github.com/{os.environ["GH_REPO"]}/releases/download/{tag}/',
              'assets': assets,
          }
          (root / 'publication.json').write_text(json.dumps(publication, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'publication.json: {len(assets)} assets indexados')
          PY
          test -s build/skewt-capitals/publication.json

      - name: Publicar release operacional
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="skewt-live-${CYCLE}"
          gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag || true
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find build/skewt-capitals -mindepth 2 -maxdepth 2 -type f -name '*.png' -print0 | sort -z)
          test "${#files[@]}" -eq 459
          gh release create "$tag" \
            --repo "$GH_REPO" \
            --title "Sideral Skew-T ECMWF ${CYCLE}Z — 27 capitais" \
            --notes "PNG pré-renderizado diretamente pelo SHARPpy. Fonte: ECMWF IFS 0.25° via Open-Meteo Single Runs. Forecast F000–F048 em passos de 3h. publication.json contém o índice determinístico dos assets para o HTML." \
            "${files[@]}" \
            build/skewt-capitals/manifest.json \
            build/skewt-capitals/publication.json

      - name: Verificar release publicado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="skewt-live-${CYCLE}"
          gh release view "$tag" --repo "$GH_REPO" --json tagName,assets --jq '{tag:.tagName,assets:(.assets|length)}'
          test "$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets|map(.name)|map(select(.=="publication.json"))|length')" -eq 1

      - name: Artefato de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: skewt-${{ env.CYCLE }}-manifest
          path: |
            build/skewt-capitals/manifest.json
            build/skewt-capitals/publication.json
          retention-days: 3
