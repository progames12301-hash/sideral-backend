name: Sideral Skew-T SHARPpy — 27 Capitais

on:
  push:
    branches: [main]
    paths:
      - 'tools/skewt/native_spc_render.py'
      - 'tools/skewt/generate_sharppy_product.py'
      - 'tools/skewt/generate_capitals_sharppy.py'
  schedule:
    # GitHub cron é UTC. Executa uma vez por dia, usando o ciclo ECMWF 18Z.
    - cron: '45 1 * * *'  # 18Z
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Ciclo ECMWF IFS'
        required: true
        type: choice
        options: ['06','12','18']

permissions:
  contents: write

concurrency:
  group: sideral-skewt-${{ github.event_name == 'workflow_dispatch' && inputs.cycle || (github.event_name == 'push' && 'refresh') || (github.event.schedule == '45 13 * * *' && '06') || (github.event.schedule == '45 19 * * *' && '12') || '18' }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  SIDERAL_QT_COMPAT: '1'
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}
  GH_REPO: ${{ github.repository }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar ciclo
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cycle="${{ inputs.cycle }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # A Single Runs API nem sempre tem o ciclo mais recente publicado
            # logo após a inicialização. Selecione um ciclo que já teve tempo
            # de ser processado pelo ECMWF/Open-Meteo.
            hour=$(date -u +%H)
            if (( 10#$hour >= 21 )); then
              cycle='12'
            elif (( 10#$hour >= 15 )); then
              cycle='06'
            else
              cycle='18'
            fi
          else
            case "${{ github.event.schedule }}" in
              '45 13 * * *') cycle='06' ;;
              '45 19 * * *') cycle='12' ;;
              '45 1 * * *')  cycle='18' ;;
              *) echo "Cron desconhecido: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi
          case "$cycle" in 06|12|18) ;; *) echo "Ciclo inválido: $cycle"; exit 1;; esac
          echo "CYCLE=$cycle" >> "$GITHUB_ENV"
          echo "Ciclo selecionado: ${cycle}Z"

      - name: Sistema gráfico Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Dependências meteorológicas
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Verificar compatibilidade Qt/SHARPpy
        run: |
          python - <<'PY'
          import os
          print('PYTHONPATH=', os.environ.get('PYTHONPATH'))
          import sitecustomize
          sitecustomize.enable_qt_compat()
          from PyQt5 import QtCore
          print('QRect float compatibility:', QtCore.QRect(1, 2, 3, 4.7).width())
          PY

      - name: Gerar 27 capitais × F000–F048
        run: |
          set -euo pipefail
          rm -rf build/skewt-capitals
          python tools/skewt/generate_capitals_sharppy.py --cycle "$CYCLE" --out build/skewt-capitals

      - name: Validar 27 capitais × 17 PNGs
        shell: bash
        run: |
          set -euo pipefail
          count=$(find build/skewt-capitals -type f -name '*.png' | wc -l)
          echo "PNG encontrados: $count"
          test "$count" -eq 459
          capitals=(rio-branco maceio macapa manaus salvador fortaleza brasilia vitoria goiania sao-luis cuiaba campo-grande belo-horizonte belem joao-pessoa curitiba recife teresina rio-de-janeiro natal porto-alegre porto-velho boa-vista florianopolis sao-paulo aracaju palmas)
          for city in "${capitals[@]}"; do
            dir="build/skewt-capitals/$city"
            test -d "$dir" || { echo "Diretório ausente: $dir"; exit 1; }
            city_count=$(find "$dir" -maxdepth 1 -type f -name '*.png' | wc -l)
            echo "$city: $city_count PNG"
            test "$city_count" -eq 17
            for fh in 000 003 006 009 012 015 018 021 024 027 030 033 036 039 042 045 048; do
              file="$dir/$city-f$fh.png"
              test -s "$file" || { echo "PNG ausente/vazio: $file"; exit 1; }
              size=$(stat -c '%s' "$file")
              (( size >= 10000 )) || { echo "PNG suspeito: $file ($size bytes)"; exit 1; }
            done
          done
          test -s build/skewt-capitals/manifest.json

      - name: Construir índice público dos assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('build/skewt-capitals'); cycle=os.environ['CYCLE']; tag=f'skewt-live-{cycle}'
          assets=sorted(p.name for p in root.glob('*/*.png'))
          if len(assets)!=459: raise SystemExit(f'Esperados 459 PNG, encontrados {len(assets)}')
          publication={'schema':'sideral-skewt-publication-v1','repository':os.environ['GH_REPO'],'tag':tag,'asset_count':459,'cities':27,'frames_per_city':17,'cycles':['06','12','18'],'download_base':f'https://github.com/{os.environ["GH_REPO"]}/releases/download/{tag}/','assets':assets}
          (root/'publication.json').write_text(json.dumps(publication,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          test -s build/skewt-capitals/publication.json

      - name: Publicar release operacional
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="skewt-live-${CYCLE}"
          title="Sideral Skew-T ECMWF ${CYCLE}Z — 27 capitais"
          notes="PNG pré-renderizado pelo SHARPpy. ECMWF IFS 0.25° via Open-Meteo Single Runs; HRES 9 km não expõe campos de pressão nesta API. F000–F048 em passos de 3h. 459 PNGs: 27 capitais × 17 frames."

          mapfile -d '' png_files < <(find build/skewt-capitals -mindepth 2 -maxdepth 2 -type f -name '*.png' -print0 | sort -z)
          test "${#png_files[@]}" -eq 459
          files=("${png_files[@]}" build/skewt-capitals/manifest.json build/skewt-capitals/publication.json)
          test "${#files[@]}" -eq 461

          # Never delete the existing release as a pre-publication step.
          # A transient GitHub API 502 during deletion left the old release/tag
          # in place, and the subsequent create command failed with "tag exists".
          release_state="unknown"
          for attempt in 1 2 3 4 5; do
            if response="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" 2>&1)"; then
              release_state="present"
              break
            elif grep -Eqi 'HTTP 404|404 Not Found|Not Found' <<< "$response"; then
              release_state="missing"
              break
            else
              echo "Consulta da release falhou (tentativa $attempt/5): $response"
              sleep $((attempt * 5))
            fi
          done
          if [[ "$release_state" == "unknown" ]]; then
            echo "Não foi possível determinar o estado da release após 5 tentativas; sem apagar ou recriar nada."
            exit 1
          fi

          if [[ "$release_state" == "missing" ]]; then
            echo "Criando release $tag"
            gh release create "$tag" --repo "$GH_REPO" --title "$title" --notes "$notes"
          else
            echo "Atualizando release existente $tag sem apagar a tag"
            gh release edit "$tag" --repo "$GH_REPO" --title "$title" --notes "$notes"
          fi

          # If an upload has a transient failure, retry the same idempotent
          # upsert. --clobber replaces same-named assets instead of rejecting
          # duplicate asset names; the 459 PNGs and both manifests are refreshed.
          upload_ok=false
          for attempt in 1 2 3; do
            if gh release upload "$tag" --repo "$GH_REPO" --clobber "${files[@]}"; then
              upload_ok=true
              break
            fi
            echo "Upload da release falhou (tentativa $attempt/3); repetindo após pausa."
            sleep $((attempt * 10))
          done
          [[ "$upload_ok" == "true" ]] || { echo "Não foi possível publicar todos os assets de $tag."; exit 1; }

      - name: Verificar release publicado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="skewt-live-${CYCLE}"
          verified=false
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$GH_REPO" --json tagName,assets --jq '{tag:.tagName,assets:(.assets|length)}'; then
              verified=true
              break
            fi
            echo "Ainda não foi possível consultar a release (tentativa $attempt/5)."
            sleep $((attempt * 3))
          done
          [[ "$verified" == "true" ]] || { echo "Release não pôde ser verificada."; exit 1; }
          png_count=""
          for attempt in 1 2 3 4 5; do
            if png_count="$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '[.assets[].name | select(endswith(".png"))] | length')"; then break; fi
            sleep $((attempt * 3))
          done
          echo "PNG no release: $png_count"
          test "$png_count" -eq 459
          publication_count=""
          for attempt in 1 2 3 4 5; do
            if publication_count="$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets|map(.name)|map(select(.=="publication.json"))|length')"; then break; fi
            sleep $((attempt * 3))
          done
          test "$publication_count" -eq 1

      - name: Artefato de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: skewt-${{ env.CYCLE }}-manifest
          path: |
            build/skewt-capitals/manifest.json
            build/skewt-capitals/publication.json
          retention-days: 3
