name: Sideral Skew-T SHARPpy — 27 Capitais

on:
  schedule:
    # ECMWF IFS dissemination windows end at roughly 12:27, 18:27 and 00:27 UTC
    # for the 06Z, 12Z and 18Z deterministic runs respectively. These schedules
    # leave a safety margin before generation starts.
    - cron: '45 13 * * *'   # 06Z run
    - cron: '45 19 * * *'   # 12Z run
    - cron: '45 1 * * *'    # 18Z run (next UTC day)
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Ciclo ECMWF IFS'
        required: true
        type: choice
        options:
          - '06'
          - '12'
          - '18'

permissions:
  contents: write

concurrency:
  group: sideral-skewt-${{ github.event_name == 'workflow_dispatch' && inputs.cycle || github.event.schedule }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar ciclo
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cycle="${{ inputs.cycle }}"
          else
            case "${{ github.event.schedule }}" in
              '45 13 * * *') cycle='06' ;;
              '45 19 * * *') cycle='12' ;;
              '45 1 * * *')  cycle='18' ;;
              *) echo 'Cron desconhecido'; exit 1 ;;
            esac
          fi
          echo "CYCLE=$cycle" >> "$GITHUB_ENV"
          echo "Ciclo selecionado: $cycle UTC"

      - name: Sistema gráfico Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Dependências meteorológicas
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Gerar 27 capitais × F000–F048
        run: |
          rm -rf build/skewt-capitals
          python tools/skewt/generate_capitals_sharppy.py \
            --cycle "$CYCLE" \
            --out build/skewt-capitals

      - name: Validar saída antes de publicar
        shell: bash
        run: |
          count=$(find build/skewt-capitals -type f -name '*.png' | wc -l)
          echo "PNG encontrados: $count"
          test "$count" -eq 459
          test -s build/skewt-capitals/manifest.json
          while IFS= read -r file; do
            size=$(stat -c '%s' "$file")
            if (( size < 10000 )); then
              echo "PNG suspeito: $file ($size bytes)"
              exit 1
            fi
          done < <(find build/skewt-capitals -type f -name '*.png')

      - name: Publicar release operacional
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="skewt-live-${CYCLE}"
          gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag || true
          shopt -s nullglob
          files=(build/skewt-capitals/**/*.png)
          test "${#files[@]}" -eq 459
          gh release create "$tag" \
            --repo "$GH_REPO" \
            --title "Sideral Skew-T ECMWF ${CYCLE}Z — 27 capitais" \
            --notes "PNG pré-renderizado diretamente pelo SHARPpy. Fonte: ECMWF IFS 0.25° via Open-Meteo Single Runs. Forecast F000–F048 em passos de 3h. Este release é substituído a cada nova rodada ${CYCLE}Z." \
            "${files[@]}" \
            build/skewt-capitals/manifest.json

      - name: Artefato de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: skewt-${{ env.CYCLE }}-manifest
          path: build/skewt-capitals/manifest.json
          retention-days: 3
