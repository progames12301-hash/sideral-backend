name: CIM WRF 5 km — reusable operational runner

on:
  workflow_call:
    inputs:
      wrf2:
        description: Run the next-day CIM WRF2 ICON-only configuration
        required: true
        type: boolean
      scheduled_cycle:
        description: Optional fixed target cycle for scheduled runs
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: '3.12'
  WRF_TARGET_RESOLUTION_KM: '5'
  WRF_DX_METERS: '5000'
  WRF_DY_METERS: '5000'
  WRF_E_WE: '447'
  WRF_E_SN: '375'
  WRF_TIME_STEP: '25'
  WRF_HISTORY_INTERVAL_MINUTES: '60'
  WRF_MPI_PROCS: '8'
  WRF_REF_LAT: '-27.50'
  WRF_REF_LON: '-52.75'
  WRF_STAND_LON: '-52.75'
  ICON_SOURCE_XSIZE: '113'
  ICON_SOURCE_YSIZE: '89'
  ICON_SOURCE_XFIRST: '-67.0'
  ICON_SOURCE_YFIRST: '-39.0'
  ICON_SOURCE_XINC: '0.25'
  ICON_SOURCE_YINC: '0.25'
  ECMWF_SOURCE_WEST: '-67'
  ECMWF_SOURCE_EAST: '-39'
  ECMWF_SOURCE_SOUTH: '-39'
  ECMWF_SOURCE_NORTH: '-17'

jobs:
  seg00:
    name: CIM WRF 5 km ${{ inputs.wrf2 && 'WRF2' || 'principal' }} · F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout CIM 5 km runner
        uses: actions/checkout@v4
        with:
          ref: cim-wrf-4km-runner
          fetch-depth: 1

      - name: Install WRF input and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          source wrf/ensure_eccodes_tools.sh
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027' 'scipy>=1.11,<2' 'requests>=2.31' 'ecmwf-opendata==0.3.34'

      - name: Validate CIM 5 km runner scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cim4_checkpoint_segment.sh
            wrf/run_cim4_icon_wrf.sh
            wrf/run_cim4_ecmwf_wrf.sh
            wrf/run_cim4_gfs_wrf.sh
            wrf/run_cim4_wrf_with_source.sh
            wrf/run_cim4_restart_segment.sh
          )
          for script in "${scripts[@]}"; do
            test -s "$script"
            bash -n "$script"
          done
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/select_tarc_icon_run.py wrf/extract_wrf_severe_core.py wrf/cim4_postprocess.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path("wrf/cim4_variable_catalog.json").read_text(encoding="utf-8"))
          assert catalog["resolutionKm"] == 5
          assert catalog["domain"]["e_we"] == 447 and catalog["domain"]["e_sn"] == 375
          assert catalog["domain"]["dx_m"] == 5000 and catalog["domain"]["dy_m"] == 5000
          print(f"{catalog['model']}: 447x375 WRF domain / 446x374 mass points")
          PY

      - name: Run CIM 5 km forecast segment F000-F003 F000-F006
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ format('cim4{0}-checkpoint-{1}', inputs.wrf2 && '-wrf2' || '', github.run_id) }}
          WRF2_TOMORROW: ${{ inputs.wrf2 && '1' || '0' }}
          WRF2_ICON_ONLY: ${{ inputs.wrf2 && '1' || '0' }}
          WRF_SCHEDULED_CYCLE: ${{ inputs.scheduled_cycle }}
          SOURCE_MODEL: icon
          WRF_START_HOUR: '0'
          WRF_END_HOUR: '3'
          WRF_BOUNDARY_END_HOUR: '3'
        run: |
          set -euo pipefail
          chmod +x wrf/run_cim4_checkpoint_segment.sh
          bash wrf/run_cim4_checkpoint_segment.sh 0 3 0 1

      - name: Save CIM 5 km diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cim4-${{ inputs.wrf2 && 'wrf2' || 'primary' }}-seg00-diagnostics-${{ github.run_id }}
          path: |
            cim4_diagnostics/
            cim4_segment_output/rsl.*
            wrf_diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  seg01:
