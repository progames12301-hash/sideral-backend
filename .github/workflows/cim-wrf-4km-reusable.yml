          WRF2_TOMORROW: ${{ inputs.wrf2 && '1' || '0' }}
          WRF2_ICON_ONLY: ${{ inputs.wrf2 && '1' || '0' }}
          WRF_SCHEDULED_CYCLE: ${{ inputs.scheduled_cycle }}
          SOURCE_MODEL: icon
          WRF_START_HOUR: '39'
          WRF_END_HOUR: '42'
          WRF_BOUNDARY_END_HOUR: '42'
        run: |
          set -euo pipefail
          chmod +x wrf/run_cim4_checkpoint_segment.sh
          bash wrf/run_cim4_checkpoint_segment.sh 39 42 13 0

      - name: Save CIM 5 km diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cim4-${{ inputs.wrf2 && 'wrf2' || 'primary' }}-seg13-diagnostics-${{ github.run_id }}
          path: |
            cim4_diagnostics/
            cim4_segment_output/rsl.*
            wrf_diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify CIM 5 km checkpoint and forecast frames
    runs-on: ubuntu-22.04
    needs: [seg00, seg01, seg02, seg03, seg04, seg05, seg06, seg07, seg08, seg09, seg10, seg11, seg12, seg13]
    steps:
      - name: Install GitHub CLI
        run: gh --version
      - name: Validate complete checkpoint release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ format('cim4{0}-checkpoint-{1}', inputs.wrf2 && '-wrf2' || '', github.run_id) }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --json assets > release.json
          NPZ_COUNT="$(jq '[.assets[].name | select(test("^[0-9]{8}_[0-9]{6}[.]npz$"))] | length' release.json)"
          WRFOUT_COUNT="$(jq '[.assets[].name | select(test("^cim4-wrfout-[0-9]+-wrfout_d01_"))] | length' release.json)"
          test "$NPZ_COUNT" -ge 41
          test "$WRFOUT_COUNT" -ge 5
          echo "CIM 5 km checkpoint validado: NPZ=$NPZ_COUNT; WRFOUT=$WRFOUT_COUNT"

