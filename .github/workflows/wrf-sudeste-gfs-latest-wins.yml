name: WRF Sudeste GFS - guardiao anti-travamento

on:
  workflow_run:
    workflows:
      - "WRF Sudeste 4 km GFS - DOIS DIAS"
    types: [requested]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Manter somente a rodada mais nova e cortar rodada obsoleta
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="progames12301-hash/sideral-backend"
          WORKFLOW_ID="350586126"

          DATA="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=50")"

          # Preserve active computation. GitHub concurrency already keeps one pending run.
          # Each segment has its own 350-minute timeout; elapsed workflow age includes queue time.
          jq -r '.workflow_runs[] | select(.status != "completed") | "Preservando WRF \(.id): \(.status)"' <<<"$DATA"
