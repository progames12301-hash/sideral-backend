name: Sideral Skew-T — ECMWF, ICON, UKMO e meteoblue NEMS10

on:
  push:
    branches: [main]
    paths:
      - 'tools/skewt/generate_multimodel_capitals.py'
      - 'tools/skewt/generate_capitals_sharppy.py'
      - 'tools/skewt/native_spc_render.py'
  schedule:
    - cron: '55 1 * * *'  # ciclo 18Z
  workflow_dispatch:
    inputs:
      model:
        description: 'Produto multimodelo'
        required: true
        type: choice
        default: all
        options: [all, icon, ecmwf-hybrid, ukmo10km, nems10]
      cycle:
        description: 'Rodada de previsão'
        required: true
        type: choice
        default: '06'
        options: ['06', '12', '18']

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  SIDERAL_QT_COMPAT: '1'
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}
  GH_REPO: ${{ github.repository }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: skewt-multimodel-${{ matrix.model }}-${{ matrix.model == 'nems10' && 'live' || (github.event_name == 'workflow_dispatch' && inputs.cycle || (github.event_name == 'schedule' && github.event.schedule == '55 19 * * *' && '12') || (github.event_name == 'schedule' && github.event.schedule == '55 1 * * *' && '18') || 'auto') }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # job.if é avaliado antes da expansão da matriz e não pode usar matrix.model.
        # No dispatch, cria somente o job selecionado; all e gatilhos automáticos executam os três.
        model: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.model != 'all' && format('["{0}"]', inputs.model) || '["icon","ecmwf-hybrid","ukmo10km","nems10"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar token de publicação antes de renderizar
        shell: bash
        env:
          SIDERAL_RELEASE_TOKEN: ${{ secrets.SIDERAL_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SIDERAL_RELEASE_TOKEN" ]]; then
            echo "::error title=Token de publicação ausente::Crie o segredo SIDERAL_RELEASE_TOKEN com um Fine-grained PAT que tenha Contents: Read and write neste repositório. A renderização foi interrompida para evitar gastar runners sem conseguir publicar."
            exit 1
          fi

      - name: Selecionar rodada
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cycle="${{ inputs.cycle }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            hour=$(date -u +%H)
            if (( 10#$hour >= 21 )); then cycle='12'
            elif (( 10#$hour >= 15 )); then cycle='06'
            else cycle='18'; fi
          else
            case "${{ github.event.schedule }}" in
              '55 13 * * *') cycle='06' ;;
              '55 19 * * *') cycle='12' ;;
              '55 1 * * *') cycle='18' ;;
              *) echo "Cron desconhecido"; exit 1 ;;
            esac
          fi
          echo "CYCLE=$cycle" >> "$GITHUB_ENV"
          echo "MODELE=${{ matrix.model }}" >> "$GITHUB_ENV"
          echo "Rodada $cycle Z; produto ${{ matrix.model }}"

      - name: Sistema gráfico Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Dependências meteorológicas
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Verificar Qt/SHARPpy
        run: |
          python - <<'PY'
          import os, sitecustomize
          sitecustomize.enable_qt_compat()
          from PyQt5 import QtCore
          print('PYTHONPATH=', os.environ.get('PYTHONPATH'))
          print('QRect compatibility:', QtCore.QRect(1, 2, 3, 4.7).width())
          PY

      - name: Gerar 27 capitais × F000–F048
        env:
          # Usada apenas para NEMS10 e nunca armazenada nos PNGs/manifests.
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf "build/skewt-models/$MODELE"
          python tools/skewt/generate_multimodel_capitals.py --model "$MODELE" --cycle "$CYCLE" --out "build/skewt-models/$MODELE"

      - name: Validar os 459 PNGs
        shell: bash
        run: |
          set -euo pipefail
          root="build/skewt-models/$MODELE"
          count=$(find "$root" -type f -name '*.png' | wc -l)
          echo "PNG encontrados: $count"
          test "$count" -eq 459
          capitals=(rio-branco maceio macapa manaus salvador fortaleza brasilia vitoria goiania sao-luis cuiaba campo-grande belo-horizonte belem joao-pessoa curitiba recife teresina rio-de-janeiro natal porto-alegre porto-velho boa-vista florianopolis sao-paulo aracaju palmas)
          for city in "${capitals[@]}"; do
            dir="$root/$city"
            test -d "$dir" || { echo "Diretório ausente: $dir"; exit 1; }
            city_count=$(find "$dir" -maxdepth 1 -type f -name '*.png' | wc -l)
            test "$city_count" -eq 17 || { echo "$city: $city_count PNG"; exit 1; }
            for fh in 000 003 006 009 012 015 018 021 024 027 030 033 036 039 042 045 048; do
              file="$dir/$city-f$fh.png"
              test -s "$file" || { echo "PNG ausente: $file"; exit 1; }
              size=$(stat -c '%s' "$file")
              (( size >= 10000 )) || { echo "PNG suspeito: $file ($size bytes)"; exit 1; }
            done
          done
          test -s "$root/manifest.json"

      - name: Agrupar os 459 PNGs em 27 ZIPs por capital
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_STORED, ZipFile
          root = Path(f"build/skewt-models/{os.environ['MODELE']}")
          cities = sorted(p for p in root.iterdir() if p.is_dir())
          frames = [f"{h:03d}" for h in range(0, 49, 3)]
          if len(cities) != 27: raise SystemExit(f"Esperadas 27 capitais; encontradas {len(cities)}")
          for city in cities:
              expected = {f"{city.name}-f{frame}.png" for frame in frames}
              actual = {p.name for p in city.glob("*.png")}
              if actual != expected: raise SystemExit(f"Frames inesperados: {city.name}")
              archive = root / f"{city.name}.zip"
              with ZipFile(archive, "w", compression=ZIP_STORED) as z:
                  for name in sorted(expected): z.write(city / name, arcname=name)
              with ZipFile(archive) as z:
                  if sorted(z.namelist()) != sorted(expected) or z.testzip() is not None:
                      raise SystemExit(f"ZIP inválido: {archive}")
              if archive.stat().st_size >= 95 * 1024 * 1024:
                  raise SystemExit(f"ZIP quase no limite de 100 MB: {archive}")
          if len(list(root.glob("*.zip"))) != 27: raise SystemExit("Esperados 27 ZIPs")
          print("27 ZIPs validados; 459 PNGs preservados.")
          PY
      - name: Preparar nome da publicação
        shell: bash
        run: |
          set -euo pipefail
          case "$MODELE" in
            icon) tag_base='skewt-icon-global'; title_base='DWD ICON Global ~11 km'; data_base='skewt-data-icon-global' ;;
            ecmwf-hybrid) tag_base='skewt-ecmwf-hres9km-hybrid'; title_base='ECMWF HRES ~9 km híbrido + IFS 0.25° níveis de pressão'; data_base='skewt-data-ecmwf-hybrid' ;;
            ukmo10km) tag_base='skewt-ukmo-global10km'; title_base='UK Met Office Global 10 km'; data_base='skewt-data-ukmo10km' ;;
            nems10) tag_base='skewt-nems10-nemssa-live'; title_base='meteoblue NEMS10 NEMSSA 10 km — previsão mais recente'; data_base='skewt-data-nems10' ;;
            *) echo "Modelo inválido"; exit 1 ;;
          esac
          if [[ "$MODELE" == "nems10" ]]; then
            tag="$tag_base"; title="$title_base — 27 capitais"; data_branch="$data_base-live"
          else
            tag="${tag_base}-${CYCLE}"; title="$title_base $CYCLE Z — 27 capitais"; data_branch="${data_base}-${CYCLE}"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "TITLE=$title" >> "$GITHUB_ENV"
          echo "DATA_BRANCH=$data_branch" >> "$GITHUB_ENV"


      - name: Construir índice público dos assets compactados
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(f"build/skewt-models/{os.environ['MODELE']}")
          branch=os.environ["DATA_BRANCH"]
          cities=sorted(p for p in root.iterdir() if p.is_dir())
          archives=sorted(p.name for p in root.glob("*.zip"))
          if len(cities)!=27 or len(archives)!=27: raise SystemExit("Esperados 27 diretórios e 27 ZIPs")
          for city in cities:
              with ZipFile(root/f"{city.name}.zip") as z:
                  if len(z.namelist())!=17 or z.testzip() is not None: raise SystemExit(f"ZIP inválido: {city.name}")
          publication={
            "schema":"sideral-skewt-publication-v2","repository":os.environ["GH_REPO"],
            "tag":os.environ["TAG"],"data_branch":branch,"model_id":os.environ["MODELE"],
            "asset_count":27,"png_count":459,"cities":27,"frames_per_city":17,
            "frames":[f"{h:03d}" for h in range(0,49,3)],"cycles":["06","12","18"],
            "archive_format":"zip",
            "download_base":f"https://raw.githubusercontent.com/{os.environ['GH_REPO']}/{branch}/",
            "city_archives":{city.name:f"{city.name}.zip" for city in cities},"assets":archives
          }
          (root/"publication.json").write_text(json.dumps(publication,ensure_ascii=False,indent=2),encoding="utf-8")
          PY


      - name: Publicar pacote estático sem API REST
        shell: bash
        env:
          SIDERAL_RELEASE_TOKEN: ${{ secrets.SIDERAL_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          root="build/skewt-models/$MODELE"
          mapfile -d '' zip_files < <(find "$root" -maxdepth 1 -type f -name '*.zip' -print0 | sort -z)
          test "${#zip_files[@]}" -eq 27
          publish_dir="$(mktemp -d)"
          cp "${zip_files[@]}" "$root/manifest.json" "$root/publication.json" "$publish_dir/"
          test "$(find "$publish_dir" -maxdepth 1 -name '*.zip' | wc -l)" -eq 27
          test "$(find "$publish_dir" -maxdepth 1 -type f | wc -l)" -eq 29
          git -C "$publish_dir" init -b "$DATA_BRANCH"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -m "Publish $MODELE Skew-T $CYCLE Z: 27 capital ZIPs"
          git -C "$publish_dir" remote add origin "https://github.com/${GH_REPO}.git"
          auth_header="$(printf '%s:%s' "$GITHUB_REPOSITORY_OWNER" "$SIDERAL_RELEASE_TOKEN" | base64 -w0)"
          git -C "$publish_dir" -c "http.extraheader=AUTHORIZATION: basic $auth_header" push --force origin "HEAD:refs/heads/$DATA_BRANCH"
          unset auth_header
          echo "Pacotes publicados na branch $DATA_BRANCH via Git, sem chamadas REST de Release."

