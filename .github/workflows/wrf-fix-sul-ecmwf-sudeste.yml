name: WRF - corrigir Sul ECMWF e Sudeste agora

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-fix-sul-ecmwf-sudeste.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: sideral-wrf-fix-sul-ecmwf-sudeste
  cancel-in-progress: true

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Corrigir contratos de grade e spin-up no main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/sideral-wrf-fix
          rm -rf "$work"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"
          git checkout main

          python3 - <<'PY'
          from pathlib import Path

          # 1) Remover qualquer alvo antigo 220x180/240x200 dos pipelines do Sudeste.
          # Os extratores no branch wrf-runner medem XLAT + DX/DY diretamente do wrfout
          # e recusam qualquer grade que nao seja a grade WRF nativa de 4 km.
          targets = [
              Path('.github/workflows/wrf-source-parallel-sudeste-reusable.yml'),
              Path('.github/workflows/wrf-sudeste-gfs-4km.yml'),
          ]

          for path in targets:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              out = []
              i = 0
              while i < len(lines):
                  if i + 1 < len(lines):
                      pair = (lines[i], lines[i + 1])
                      if (('--grid-x 220' in pair[0] and '--grid-y 180' in pair[1]) or
                          ('--grid-x 240' in pair[0] and '--grid-y 200' in pair[1])):
                          if out and out[-1].rstrip().endswith('\\'):
                              # Se os parametros removidos eram os ultimos do comando,
                              # retire a barra da linha anterior para manter shell valido.
                              next_line = lines[i + 2] if i + 2 < len(lines) else ''
                              if not next_line.lstrip().startswith('--'):
                                  out[-1] = out[-1].rstrip()[:-1].rstrip()
                          i += 2
                          continue
                  out.append(lines[i])
                  i += 1
              path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          # 2) Tornar o spin-up do GFS Sudeste explicito no workflow.
          gfs = Path('.github/workflows/wrf-sudeste-gfs-4km.yml')
          text = gfs.read_text(encoding='utf-8')
          matrix = {
              '- { id: "000-009", start: 0, end: 9 }': '- { id: "000-009", start: 0,  spinup_start: 0,  end: 9 }',
              '- { id: "009-018", start: 9, end: 18 }': '- { id: "009-018", start: 9,  spinup_start: 3,  end: 18 }',
              '- { id: "018-027", start: 18, end: 27 }': '- { id: "018-027", start: 18, spinup_start: 12, end: 27 }',
              '- { id: "027-036", start: 27, end: 36 }': '- { id: "027-036", start: 27, spinup_start: 21, end: 36 }',
              '- { id: "036-045", start: 36, end: 45 }': '- { id: "036-045", start: 36, spinup_start: 30, end: 45 }',
              '- { id: "045-054", start: 45, end: 54 }': '- { id: "045-054", start: 45, spinup_start: 39, end: 54 }',
              '- { id: "054-063", start: 54, end: 63 }': '- { id: "054-063", start: 54, spinup_start: 48, end: 63 }',
              '- { id: "063-072", start: 63, end: 72 }': '- { id: "063-072", start: 63, spinup_start: 57, end: 72 }',
          }
          for old, new in matrix.items():
              text = text.replace(old, new)

          text = text.replace('      - name: Rodar segmento independente\n', '      - name: Rodar segmento com spin-up de 6 h\n')
          old_env = '          WRF_START_HOUR: ${{ matrix.start }}\n          WRF_END_HOUR: ${{ matrix.end }}\n          WRF_COLD_START: "1"\n'
          new_env = '          WRF_START_HOUR: ${{ matrix.spinup_start }}\n          WRF_END_HOUR: ${{ matrix.end }}\n          WRF_NOMINAL_START_HOUR: ${{ matrix.start }}\n          WRF_SPINUP_HOURS: "6"\n          WRF_COLD_START: "1"\n'
          if old_env in text:
              text = text.replace(old_env, new_env, 1)

          marker = "          assert hours == sorted(hours) and all(hour % 3 == 0 for hour in hours), hours\n"
          validation = marker + "          assert data.get('segmentSpinupProtected') is True, data\n          for frame in data['frames']:\n              hour = int(frame['forecastHour'])\n              age = int(frame.get('integrationHours', 0))\n              assert age >= min(hour, 9), (hour, age, frame)\n"
          if "assert data.get('segmentSpinupProtected') is True" not in text:
              text = text.replace(marker, validation, 1)

          gfs.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet; then
            git config user.name "sideral-wrf-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/wrf-source-parallel-sudeste-reusable.yml .github/workflows/wrf-sudeste-gfs-4km.yml
            git commit -m "WRF: grade nativa Sudeste e spin-up GFS [skip render]"
            git push origin HEAD:main
          else
            echo "Contratos ja estavam corrigidos no main."
          fi

      - name: Cancelar antigas e iniciar novas rodadas corrigidas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cancel_active() {
            local workflow="$1" label="$2"
            mapfile -t ids < <(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 50 \
                --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId'
            )
            for id in "${ids[@]}"; do
              echo "Cancelando $label run=$id"
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            done
          }

          start_fresh() {
            local workflow="$1" label="$2"
            cancel_active "$workflow" "$label"
            sleep 2
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            echo "INICIADO: $label"
          }

          start_fresh wrf-ecmwf-4km-native.yml "ECMWF Sul 4 km"
          start_fresh wrf-sudeste-gfs-4km.yml "GFS Sudeste 4 km"
          start_fresh wrf-sudeste-icon-4km.yml "ICON Sudeste 4 km"
          start_fresh wrf-sudeste-ecmwf-4km.yml "ECMWF Sudeste 4 km"

          gh workflow run wrf-resolution-contract.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          echo "Auditoria de resolucao/refletividade solicitada."
