            label: 'Foz do Iguacu'
          - lat: '-29.17'
            lon: '-51.18'
            label: 'Serra Gaucha'
          - lat: '-30.88'
            lon: '-55.53'
            label: 'Campanha Gaucha'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: System libraries for SHARPpy
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install SHARPpy and data libraries
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'git+https://github.com/sharppy/SHARPpy.git@main'
          python -m pip install PySide2 ecmwf-opendata eccodes numpy pillow

      - name: Generate complete pre-rendered point
        env:
          LAT: ${{ matrix.lat }}
          LON: ${{ matrix.lon }}
          LABEL: ${{ matrix.label }}
        run: |
          rm -rf /tmp/skewt-out
          mkdir -p /tmp/skewt-out
          xvfb-run -a python tools/skewt/generate_sharppy_product_operational.py \
            --lat "$LAT" --lon "$LON" --label "$LABEL" --out /tmp/skewt-out

      - name: Verify complete product
        run: |
          test -s /tmp/skewt-out/latest.json
          test -s /tmp/skewt-out/animation.gif
          test -s /tmp/skewt-out/f000/skewt.png
          test -s /tmp/skewt-out/f000/hodograph.png
          test -s /tmp/skewt-out/f000/full.png
          test -s /tmp/skewt-out/f000/variables.json

      - name: Publish complete pre-rendered point
        env:
          LAT: ${{ matrix.lat }}
          LON: ${{ matrix.lon }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os, shutil; from pathlib import Path; lat=float(os.environ["LAT"]); lon=float(os.environ["LON"]); key=f"{lat:.2f}_{lon:.2f}".replace("-","m").replace(".","p"); src=Path("/tmp/skewt-out"); dst=Path("data/skewt/points")/key; dst.mkdir(parents=True, exist_ok=True); [shutil.copy2(src/name, dst/name) for name in ("latest.json","variables.json","full.png","skewt.png","hodograph.png","animation.gif")]; [(shutil.copy2(child/"full.png", dst/f"{child.name}.png"), shutil.copy2(child/"skewt.png", dst/f"{child.name}_skewt.png"), shutil.copy2(child/"hodograph.png", dst/f"{child.name}_hodograph.png"), shutil.copy2(child/"variables.json", dst/f"{child.name}.json")) for child in sorted(src.glob("f[0-9][0-9][0-9]"))]'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/skewt/points
          git commit -m "chore: publish Brazil Skew-T point $LAT $LON" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
