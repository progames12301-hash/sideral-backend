name: Sideral Skew-T SHARPpy Brasil

on:
  schedule:
    - cron: '30 8,20 * * *'
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude do ponto (opcional; vazio = grade Brasil)'
        required: false
        default: ''
        type: string
      lon:
        description: 'Longitude do ponto (opcional; vazio = grade Brasil)'
        required: false
        default: ''
        type: string
      label:
        description: 'Local'
        required: false
        default: 'Brasil'
        type: string
      mode:
        description: 'Modo de geração'
        required: true
        default: 'brazil-grid'
        type: choice
        options:
          - brazil-grid
          - single-point
  repository_dispatch:
    types: [skewt_request]

permissions:
  contents: write

concurrency:
  group: sideral-skewt-${{ github.event.client_payload.lat || inputs.lat || 'brazil-grid' }}-${{ github.event.client_payload.lon || inputs.lon || 'brazil-grid' }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  ECMWF_SOURCE: aws
  PYTHONUNBUFFERED: '1'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lat: '-33.75'
            lon: '-53.25'
            label: 'Brasil Sul extremo'
          - lat: '-31.77'
            lon: '-52.34'
            label: 'Pelotas'
