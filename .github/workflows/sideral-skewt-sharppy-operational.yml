name: Sideral Skew-T SHARPpy Brasil

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 6 * * *'
    - cron: '30 12 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Geração'
        required: true
        default: 'national'
        type: choice
        options:
          - national
          - point
      lat:
        description: 'Latitude — somente Point'
        required: false
        default: ''
        type: string
      lon:
        description: 'Longitude — somente Point'
        required: false
        default: ''
        type: string
      label:
        description: 'Local — somente Point'
        required: false
        default: ''
        type: string
      cycle:
        description: 'Ciclo ECMWF'
        required: true
        default: '00'
        type: choice
        options:
          - '00'
          - '06'
          - '12'
          - '18'
  repository_dispatch:
    types: [skewt_request]

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  ECMWF_SOURCE: aws
  PYTHONUNBUFFERED: '1'

jobs:
  national-grid:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'national')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install grid dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --prefer-binary shapely==2.0.6

      - name: Build Brazil 0.25 degree ECMWF grid
        run: |
          rm -rf data/skewt/grid
          mkdir -p data/skewt/grid
          python tools/skewt/build_brazil_grid.py --out data/skewt/grid/brazil-0p25.json

      - name: Set cycle metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '30 0 * * *') CYCLE='00' ;;
              '30 6 * * *') CYCLE='06' ;;
              '30 12 * * *') CYCLE='12' ;;
              '30 18 * * *') CYCLE='18' ;;
              *) CYCLE='00' ;;
            esac
          else
            CYCLE='${{ inputs.cycle }}'
          fi
          python - "$CYCLE" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('data/skewt/grid/brazil-0p25.json')
          d = json.loads(p.read_text())
          d['cycle_utc'] = sys.argv[1]
          d['updated_by'] = 'Sideral Skew-T'
          p.write_text(json.dumps(d, ensure_ascii=False, separators=(',', ':')))
          Path('data/skewt/grid/latest.json').write_text(json.dumps(d, ensure_ascii=False, separators=(',', ':')))
          PY

      - name: Publish national grid
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/skewt/grid
          git commit -m "chore: refresh national ECMWF 0.25 grid" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

  generate-point:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'point') || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select point and cycle
        id: point
        shell: bash
        run: |
          LAT='${{ github.event.client_payload.lat || inputs.lat }}'
          LON='${{ github.event.client_payload.lon || inputs.lon }}'
          LABEL='${{ github.event.client_payload.label || inputs.label }}'
          CYCLE='${{ github.event.client_payload.cycle || inputs.cycle || '00' }}'
          test -n "$LAT" && test -n "$LON"
          echo "lat=$LAT" >> "$GITHUB_OUTPUT"
          echo "lon=$LON" >> "$GITHUB_OUTPUT"
          echo "label=${LABEL:-Sideral}" >> "$GITHUB_OUTPUT"
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libx11-xcb1 libxcb1

      - name: Install SHARPpy and data libraries
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --prefer-binary 'numpy==1.26.4'
          python -m pip install --prefer-binary 'PySide2==5.15.2.1'
          python -m pip install --prefer-binary 'Pillow>=10,<12' 'ecmwf-opendata>=0.3,<0.4' 'eccodes>=2.36,<3'
          python -m pip install --prefer-binary 'git+https://github.com/sharppy/SHARPpy.git@main'

      - name: Generate pre-rendered SHARPpy product
        env:
          LAT: ${{ steps.point.outputs.lat }}
          LON: ${{ steps.point.outputs.lon }}
          LABEL: ${{ steps.point.outputs.label }}
          CYCLE: ${{ steps.point.outputs.cycle }}
        run: |
          rm -rf /tmp/skewt-out
          mkdir -p /tmp/skewt-out
          xvfb-run -a python tools/skewt/generate_sharppy_product_operational.py --lat "$LAT" --lon "$LON" --label "$LABEL" --cycle "$CYCLE" --out /tmp/skewt-out

      - name: Verify product
        run: |
          test -s /tmp/skewt-out/latest.json
          test -s /tmp/skewt-out/animation.gif
          test -s /tmp/skewt-out/f000/full.png
          test -s /tmp/skewt-out/f000/skewt.png
          test -s /tmp/skewt-out/f000/hodograph.png
          test -s /tmp/skewt-out/f000/variables.json

      - name: Publish point
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          d=json.loads(Path('/tmp/skewt-out/latest.json').read_text())
          lat=float(d['latitude']); lon=float(d['longitude'])
          key=f'{lat:.2f}_{lon:.2f}'.replace('-','m').replace('.','p')
          src=Path('/tmp/skewt-out'); dst=Path('data/skewt/points')/key; dst.mkdir(parents=True, exist_ok=True)
          for name in ('latest.json','variables.json','full.png','skewt.png','hodograph.png','animation.gif'):
              shutil.copy2(src/name,dst/name)
          for child in sorted(src.glob('f[0-9][0-9][0-9]')):
              if child.is_dir():
                  for srcname,dstname in [('full.png',f'{child.name}.png'),('skewt.png',f'{child.name}_skewt.png'),('hodograph.png',f'{child.name}_hodograph.png'),('variables.json',f'{child.name}.json')]:
                      shutil.copy2(child/srcname,dst/dstname)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/skewt/points
          git commit -m "chore: publish ECMWF Skew-T point" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
