name: Sideral Skew-T SHARPpy Brasil

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 6 * * *'
    - cron: '30 12 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude (qualquer ponto do Brasil; associada à grade ECMWF 0.25°)'
        required: true
        default: '-15.78'
        type: string
      lon:
        description: 'Longitude (qualquer ponto do Brasil; associada à grade ECMWF 0.25°)'
        required: true
        default: '-47.93'
        type: string
      label:
        description: 'Local'
        required: false
        default: 'Brasil'
        type: string
      cycle:
        description: 'Ciclo ECMWF'
        required: true
        default: '00'
        type: choice
        options: ['00','06','12','18']
  repository_dispatch:
    types: [skewt_request]

permissions:
  contents: write

concurrency:
  group: sideral-skewt-${{ github.event.client_payload.lat || inputs.lat || 'scheduled' }}-${{ github.event.client_payload.lon || inputs.lon || github.event.schedule || 'manual' }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  ECMWF_SOURCE: aws
  PYTHONUNBUFFERED: '1'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select ECMWF cycle
        id: cycle
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.client_payload.cycle || '' }}" ]; then
            CYCLE="${{ github.event.client_payload.cycle }}"
          elif [ -n "${{ inputs.cycle || '' }}" ]; then
            CYCLE="${{ inputs.cycle }}"
          else
            case "${{ github.event.schedule }}" in
              '30 0 * * *') CYCLE='00' ;;
              '30 6 * * *') CYCLE='06' ;;
              '30 12 * * *') CYCLE='12' ;;
              '30 18 * * *') CYCLE='18' ;;
              *) CYCLE='00' ;;
            esac
          fi
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"

      - name: Select point
        id: point
        shell: bash
        run: |
          echo "lat=${{ github.event.client_payload.lat || inputs.lat || '-15.78' }}" >> "$GITHUB_OUTPUT"
          echo "lon=${{ github.event.client_payload.lon || inputs.lon || '-47.93' }}" >> "$GITHUB_OUTPUT"
          echo "label=${{ github.event.client_payload.label || inputs.label || 'Brasil' }}" >> "$GITHUB_OUTPUT"

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: System libraries for SHARPpy
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install SHARPpy and data libraries
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'git+https://github.com/sharppy/SHARPpy.git@main'
          python -m pip install 'numpy<2' PySide2 ecmwf-opendata eccodes pillow

      - name: Generate complete pre-rendered point
        env:
          LAT: ${{ steps.point.outputs.lat }}
          LON: ${{ steps.point.outputs.lon }}
          LABEL: ${{ steps.point.outputs.label }}
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          rm -rf /tmp/skewt-out
          mkdir -p /tmp/skewt-out
          xvfb-run -a python tools/skewt/generate_sharppy_product_operational.py \
            --lat "$LAT" --lon "$LON" --label "$LABEL" --cycle "$CYCLE" --out /tmp/skewt-out

      - name: Verify complete product
        run: |
          test -s /tmp/skewt-out/latest.json
          test -s /tmp/skewt-out/animation.gif
          test -s /tmp/skewt-out/f000/full.png
          test -s /tmp/skewt-out/f000/skewt.png
          test -s /tmp/skewt-out/f000/hodograph.png
          test -s /tmp/skewt-out/f000/variables.json

      - name: Publish snapped ECMWF 0.25 degree point
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          d=json.loads(Path('/tmp/skewt-out/latest.json').read_text())
          lat=float(d['latitude']); lon=float(d['longitude'])
          key=f'{lat:.2f}_{lon:.2f}'.replace('-','m').replace('.','p')
          src=Path('/tmp/skewt-out')
          dst=Path('data/skewt/points')/key
          dst.mkdir(parents=True, exist_ok=True)
          for name in ('latest.json','variables.json','full.png','skewt.png','hodograph.png','animation.gif'):
              shutil.copy2(src/name,dst/name)
          for child in sorted(src.glob('f[0-9][0-9][0-9]')):
              if child.is_dir():
                  fh=child.name
                  shutil.copy2(child/'full.png',dst/f'{fh}.png')
                  shutil.copy2(child/'skewt.png',dst/f'{fh}_skewt.png')
                  shutil.copy2(child/'hodograph.png',dst/f'{fh}_hodograph.png')
                  shutil.copy2(child/'variables.json',dst/f'{fh}.json')
          print('published', key)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/skewt/points
          git commit -m "chore: publish ECMWF Skew-T point" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
