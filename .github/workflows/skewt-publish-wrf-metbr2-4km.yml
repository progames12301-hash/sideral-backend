name: Publish Skew-T — METBR WRF2 4 km

on:
  workflow_run:
    workflows: ["METBR WRF2 4 KM - ICON válido amanhã"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ID da execução concluída do modelo WRF de origem
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: skewt-publish-wrf-metbr2-4km-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/skewt-wrf-publish-reusable.yml
    permissions:
      contents: write
      actions: read
    with:
      source-run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      expected-source-workflow: "METBR WRF2 4 KM - ICON válido amanhã"
      model-key: "wrf-metbr2-4km"
      model-label: "METBR WRF2 4 km"
      resolution-km: "4"
      source-mode: checkpoint
      checkpoint-prefix: "metbr-wrf2-4km-checkpoint-"
      asset-prefix: ""
      require-metbr-marker: true
