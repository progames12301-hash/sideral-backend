name: Dispatch validated CIM WRF2 5 km checkpoint publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-cim-wrf2-validated-checkpoint.yml

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Publish verified complete CIM WRF2 5 km run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f "event_type=cim4-wrf2-checkpoint-published" \
            -f "client_payload[run_id]=42599605356"
          echo "Solicitada publicação dos 41 horários do checkpoint WRF2 5 km 42599605356."
