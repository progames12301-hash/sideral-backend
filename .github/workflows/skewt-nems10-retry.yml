name: Sideral Skew-T — Teste exclusivo NEMS10

on:
  workflow_dispatch:
permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  SIDERAL_QT_COMPAT: '1'
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}
  GH_REPO: ${{ github.repository }}

jobs:
  render:
    if: false  # Desativado para reduzir carga de runners.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: skewt-multimodel-nems10-live
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sistema gráfico Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Dependências meteorológicas
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Verificar Qt/SHARPpy
        run: |
          python - <<'PY'
          import os, sitecustomize
          sitecustomize.enable_qt_compat()
          from PyQt5 import QtCore
          print('PYTHONPATH=', os.environ.get('PYTHONPATH'))
          print('QRect compatibility:', QtCore.QRect(1, 2, 3, 4.7).width())
          PY

      - name: Gerar NEMS10 para 27 capitais e F000–F048
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: |
          set -euo pipefail
          export MODELE=nems10
          export CYCLE=06
          python tools/skewt/generate_multimodel_capitals.py --model "$MODELE" --cycle "$CYCLE" --out "build/skewt-models/$MODELE"

      - name: Validar 459 PNGs
        shell: bash
        run: |
          set -euo pipefail
          root="build/skewt-models/nems10"
          count=$(find "$root" -type f -name '*.png' | wc -l)
          echo "PNG encontrados: $count"
          test "$count" -eq 459
          capitals=(rio-branco maceio macapa manaus salvador fortaleza brasilia vitoria goiania sao-luis cuiaba campo-grande belo-horizonte belem joao-pessoa curitiba recife teresina rio-de-janeiro natal porto-alegre porto-velho boa-vista florianopolis sao-paulo aracaju palmas)
          for city in "${capitals[@]}"; do
            dir="$root/$city"
            test -d "$dir" || { echo "Diretório ausente: $dir"; exit 1; }
            test "$(find "$dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 17
            for fh in 000 003 006 009 012 015 018 021 024 027 030 033 036 039 042 045 048; do
              test -s "$dir/$city-f$fh.png" || { echo "PNG ausente: $dir/$city-f$fh.png"; exit 1; }
            done
          done
          test -s "$root/manifest.json"

      - name: Preparar publicação
        run: |
          echo "TAG=skewt-nems10-nemssa-live" >> "$GITHUB_ENV"
          echo "TITLE=meteoblue NEMS10 NEMSSA 10 km — previsão mais recente — 27 capitais" >> "$GITHUB_ENV"

      - name: Construir índice público dos assets
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("build/skewt-models/nems10")
          assets=sorted(p.name for p in root.glob('*/*.png'))
          if len(assets)!=459: raise SystemExit(f"Esperados 459 PNG, encontrados {len(assets)}")
          publication={
            "schema":"sideral-skewt-publication-v1",
            "repository":os.environ["GH_REPO"],
            "tag":os.environ["TAG"],
            "model_id":"nems10",
            "asset_count":459,
            "cities":27,
            "frames_per_city":17,
            "cycles":["latest-hourly"],
            "download_base":f"https://github.com/{os.environ['GH_REPO']}/releases/download/{os.environ['TAG']}/",
            "assets":assets
          }
          (root/"publication.json").write_text(json.dumps(publication,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Publicar release operacional
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="build/skewt-models/nems10"
          notes="meteoblue NEMS10 NEMSSA ~10 km sobre a América do Sul. Perfil vertical do próprio NEMSSA, com temperatura, umidade relativa, vento U/V e geopotencial até os níveis disponibilizados pela API. Previsão mais recente por validade horária; chave da API não faz parte dos assets."
          release_state=unknown
          for attempt in 1 2 3 4 5; do
            if response="$(gh api "repos/$GH_REPO/releases/tags/$TAG" 2>&1)"; then
              release_state=present; break
            elif grep -Eqi 'HTTP 404|404 Not Found|Not Found' <<< "$response"; then
              release_state=missing; break
            else
              echo "Consulta da release falhou (tentativa $attempt/5): $response"
              sleep $((attempt * 5))
            fi
          done
          [[ "$release_state" != unknown ]] || { echo "Estado da release desconhecido; não será apagada."; exit 1; }
          if [[ "$release_state" == missing ]]; then
            gh release create "$TAG" --repo "$GH_REPO" --title "$TITLE" --notes "$notes"
          else
            gh release edit "$TAG" --repo "$GH_REPO" --title "$TITLE" --notes "$notes"
          fi
          mapfile -d '' png_files < <(find "$root" -mindepth 2 -maxdepth 2 -type f -name '*.png' -print0 | sort -z)
          test "${#png_files[@]}" -eq 459
          files=("${png_files[@]}" "$root/manifest.json" "$root/publication.json")
          upload_ok=false
          for attempt in 1 2 3; do
            if gh release upload "$TAG" --repo "$GH_REPO" --clobber "${files[@]}"; then upload_ok=true; break; fi
            echo "Upload falhou, tentativa $attempt/3"
            sleep $((attempt * 10))
          done
          [[ "$upload_ok" == true ]] || { echo "Falha ao publicar assets."; exit 1; }

      - name: Verificar publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '[.assets[].name | select(endswith(".png"))] | length')" -eq 459
          test "$(gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets|map(.name)|map(select(.=="publication.json"))|length')" -eq 1
