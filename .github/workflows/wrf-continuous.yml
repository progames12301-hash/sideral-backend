name: Previsões contínuas — próximo dia

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wrf-continuous.yml
      - .github/workflows/wrf-4km-next-day-auto.yml
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows:
      - "GFS Global — dados para Modelos"
      - "ICON Global - PROXIMO DIA AUTOMATICO"
      - "ECMWF IFS - PROXIMO DIA AUTOMATICO"
      - "WRF 4 km - DOIS DIAS AUTOMATICO"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-forecast-controller
  cancel-in-progress: true

jobs:
  ensure-next-day:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Conferir modelos globais e iniciar o próximo WRF
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(TZ=America/Sao_Paulo date -d tomorrow +%F)"
          echo "Data local necessária: $target"

          has_target() {
            local branch="$1" minimum="$2" metadata="/tmp/${branch}.json"
            curl -fsSL --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${branch}/metadata.json?controller=${GITHUB_RUN_ID}" \
              -o "$metadata" || return 1
            python3 - "$metadata" "$target" "$minimum" <<'PY'
          import datetime as dt
          import json
          import sys
          from zoneinfo import ZoneInfo

          path, target, minimum = sys.argv[1], sys.argv[2], int(sys.argv[3])
          data = json.load(open(path, encoding='utf-8'))
          if data.get('forecastLocalDate') == target and int(data.get('frameCount', 0)) >= minimum:
              raise SystemExit(0)
          if target in (data.get('forecastLocalDates') or []):
              raise SystemExit(0)
          count = 0
          for frame in data.get('frames') or []:
              value = frame.get('validTime') or frame.get('valid_time')
              if not value:
                  continue
              try:
                  parsed = dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
                  if parsed.astimezone(ZoneInfo('America/Sao_Paulo')).date().isoformat() == target:
                      count += 1
              except ValueError:
                  pass
          raise SystemExit(0 if count >= minimum else 1)
          PY
          }

          may_dispatch() {
            local workflow="$1" active
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 \
              --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
            [ "$active" = "0" ]
          }

          ensure_forecast() {
            local label="$1" branch="$2" workflow="$3" minimum="$4"
            if has_target "$branch" "$minimum"; then
              echo "$label já cobre $target."
              return
            fi
            if may_dispatch "$workflow"; then
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
              echo "$label iniciado para atualizar $target."
            else
              echo "$label já está em execução."
            fi
          }

          latest_complete_gfs() {
            python3 - <<'PY'
          import datetime as dt
          import urllib.request

          now = dt.datetime.now(dt.timezone.utc)
          base = now.replace(hour=(now.hour // 6) * 6, minute=0, second=0, microsecond=0)
          for offset in range(0, 97, 6):
              run = base - dt.timedelta(hours=offset)
              date, cycle = run.strftime('%Y%m%d'), run.strftime('%H')
              url = f'https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{date}/{cycle}/atmos/gfs.t{cycle}z.pgrb2.0p25.f072'
              req = urllib.request.Request(url, method='HEAD')
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status in (200, 206):
                          print(f'{date}\t{cycle}\t{date}{cycle}')
                          raise SystemExit(0)
              except Exception:
                  continue
          raise SystemExit(1)
          PY
          }

          published_wrf_id() {
            curl -fsSL --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-data/metadata.json?controller=${GITHUB_RUN_ID}" |
            python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          date=str(data.get("runDate") or "").replace("-", "")
          cycle="".join(ch for ch in str(data.get("runCycle") or "") if ch.isdigit()).zfill(2)[:2]
          print((date+cycle) if len(date)==8 and cycle else "")
          ' || true
          }

          ensure_wrf_latest_cycle() {
            local date cycle candidate published
            IFS=$'\t' read -r date cycle candidate < <(latest_complete_gfs)
            published="$(published_wrf_id)"
            echo "WRF publicado: ${published:-nenhum}"
            echo "GFS completo mais recente: $candidate (${cycle}Z)"

            if [ -n "$published" ] && [ "$candidate" -le "$published" ]; then
              echo "WRF já está na rodada GFS completa mais recente."
              return
            fi

            if ! may_dispatch "wrf-4km-next-day-auto.yml"; then
              echo "WRF já está em execução; a próxima rodada será conferida ao terminar."
              return
            fi

            if [ "$EVENT_NAME" = "workflow_run" ] && [ "$COMPLETED_WORKFLOW" = "WRF 4 km - DOIS DIAS AUTOMATICO" ]; then
              echo "WRF terminou. Aguardando 1 segundo antes de iniciar a próxima rodada..."
              sleep 1
            fi

            gh workflow run wrf-4km-next-day-auto.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f run_date="$date" \
              -f run_cycle="$cycle"
            echo "WRF $candidate iniciado imediatamente."
          }

          ensure_forecast "GFS" "gfs-model-data" "gfs-global-models.yml" 8
          ensure_forecast "ICON" "icon-data" "icon-global-auto.yml" 24
          ensure_forecast "ECMWF" "ecmwf-data" "ecmwf-ifs-auto.yml" 8
          ensure_wrf_latest_cycle
