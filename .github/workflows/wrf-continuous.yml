name: WRF contínuo — encadear rodadas

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wrf-continuous.yml
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["WRF 4 km - DOIS DIAS AUTOMATICO"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-wrf-gfs
  cancel-in-progress: true

jobs:
  next-run:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Comparar GFS disponível com a rodada publicada
        id: cycle
        shell: bash
        run: |
          candidate="$(python3 - <<'PY'
          import datetime as dt
          import urllib.request
          now = dt.datetime.now(dt.timezone.utc)
          base = now.replace(hour=(now.hour // 6) * 6, minute=0, second=0, microsecond=0)
          for offset in range(0, 55, 6):
              run = base - dt.timedelta(hours=offset)
              date, cycle = run.strftime('%Y%m%d'), run.strftime('%H')
              url = f'https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{date}/{cycle}/atmos/gfs.t{cycle}z.pgrb2.0p25.f006'
              request = urllib.request.Request(url, method='HEAD')
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status in (200, 206):
                          print(date + cycle)
                          break
              except Exception:
                  pass
          else:
              raise SystemExit('Nenhuma rodada GFS com F006 disponivel')
          PY
          )"

          published=""
          if curl -fsSL --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-data/metadata.json?check=${GITHUB_RUN_ID}" -o /tmp/meta.json; then
            published="$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/meta.json',encoding='utf-8'))
          print(str(data.get('runDate','')) + str(data.get('runCycle','')).replace('Z','').zfill(2))
          PY
            )"
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ -z "$published" ] || [[ "$candidate" > "$published" ]]; then
            echo "start=true" >> "$GITHUB_OUTPUT"
          else
            echo "start=false" >> "$GITHUB_OUTPUT"
          fi
          echo "GFS disponivel: $candidate · publicado: ${published:-nenhum}"

      - name: Verificar se já existe WRF ativo
        if: steps.cycle.outputs.start == 'true'
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow wrf-4km-native-reflectivity.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Iniciar a nova rodada imediatamente
        if: steps.cycle.outputs.start == 'true' && steps.active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-4km-native-reflectivity.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Excluir artefatos WRF com mais de três dias
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cutoff="$(date -u -d '72 hours ago' +%s)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.name | startswith("wrf-") or startswith("gfs-") or startswith("icon-") or startswith("ecmwf-")) | [.id, .name, .created_at] | @tsv' |
          while IFS=$'\t' read -r id name created_at; do
            [ -n "$id" ] || continue
            created="$(date -u -d "$created_at" +%s)"
            if [ "$created" -lt "$cutoff" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              echo "Removido: $name ($created_at)"
            fi
          done

