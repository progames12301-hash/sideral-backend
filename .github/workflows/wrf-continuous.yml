name: Previsões contínuas — próximo dia

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wrf-continuous.yml
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "GFS Global — dados para Modelos"
      - "ICON Global - PROXIMO DIA AUTOMATICO"
      - "ECMWF IFS - PROXIMO DIA AUTOMATICO"
      - "WRF 4 km - DOIS DIAS AUTOMATICO"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-forecast-controller
  cancel-in-progress: true

jobs:
  ensure-next-day:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Conferir e iniciar previsões necessárias
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(TZ=America/Sao_Paulo date -d tomorrow +%F)"
          echo "Data local necessária: $target"

          has_target() {
            local branch="$1" minimum="$2" metadata="/tmp/${branch}.json"
            curl -fsSL --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${branch}/metadata.json?controller=${GITHUB_RUN_ID}" \
              -o "$metadata" || return 1
            python3 - "$metadata" "$target" "$minimum" <<'PY'
          import datetime as dt
          import json
          import sys
          from zoneinfo import ZoneInfo

          path, target, minimum = sys.argv[1], sys.argv[2], int(sys.argv[3])
          data = json.load(open(path, encoding='utf-8'))
          if data.get('forecastLocalDate') == target and int(data.get('frameCount', 0)) >= minimum:
              raise SystemExit(0)
          if target in (data.get('forecastLocalDates') or []):
              raise SystemExit(0)
          count = 0
          for frame in data.get('frames') or []:
              value = frame.get('validTime') or frame.get('valid_time')
              if not value:
                  continue
              try:
                  parsed = dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
                  if parsed.astimezone(ZoneInfo('America/Sao_Paulo')).date().isoformat() == target:
                      count += 1
              except ValueError:
                  pass
          raise SystemExit(0 if count >= minimum else 1)
          PY
          }

          may_dispatch() {
            local workflow="$1" active latest_status latest_conclusion latest_updated now updated
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 \
              --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
            [ "$active" = "0" ] || return 1
            IFS=$'\t' read -r latest_status latest_conclusion latest_updated < <(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 1 \
                --json status,conclusion,updatedAt --jq '.[0] | [.status, (.conclusion // ""), .updatedAt] | @tsv'
            )
            if [ "$latest_status" = "completed" ] && { [ "$latest_conclusion" = "failure" ] || [ "$latest_conclusion" = "cancelled" ] || [ "$latest_conclusion" = "timed_out" ]; }; then
              now="$(date -u +%s)"
              updated="$(date -u -d "$latest_updated" +%s)"
              [ $((now - updated)) -ge 2700 ] || return 1
            fi
            return 0
          }

          ensure_forecast() {
            local label="$1" branch="$2" workflow="$3" minimum="$4"
            if has_target "$branch" "$minimum"; then
              echo "$label já cobre $target."
              return
            fi
            if may_dispatch "$workflow"; then
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
              echo "$label iniciado para atualizar $target."
            else
              echo "$label já está em execução ou aguardando nova tentativa."
            fi
          }

          ensure_forecast "GFS" "gfs-model-data" "gfs-global-models.yml" 8
          ensure_forecast "ICON" "icon-data" "icon-global-auto.yml" 24
          ensure_forecast "ECMWF" "ecmwf-data" "ecmwf-ifs-auto.yml" 8
          ensure_forecast "WRF 4 km" "wrf-data" "wrf-4km-next-day-auto.yml" 24

      - name: Manter somente três dias de rodadas arquivadas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cutoff="$(date -u -d '72 hours ago' +%s)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.name | startswith("wrf-") or startswith("gfs-") or startswith("icon-") or startswith("ecmwf-") or startswith("aifs-")) | [.id, .name, .created_at] | @tsv' |
          while IFS=$'\t' read -r id name created_at; do
            [ -n "$id" ] || continue
            created="$(date -u -d "$created_at" +%s)"
            if [ "$created" -lt "$cutoff" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              echo "Removido: $name ($created_at)"
            fi
          done

