name: METBR WRF 4 KM - Publicar Refletividade

on:
  workflow_run:
    workflows: ["METBR WRF 4 KM - ICON"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout executor
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'xarray>=2024.1,<2026' 'netCDF4>=1.7,<2' 'scipy>=1.11,<2'

      - name: Baixar wrfout da execução METBR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          TAG="metbr-wrf-4km-checkpoint-${RUN_ID}"
          mkdir -p metbr_publish_input
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wrfout_d01_*' \
            --dir metbr_publish_input \
            --clobber
          find metbr_publish_input -type f -name 'wrfout_d01_*' -size +0c | sort
          test "$(find metbr_publish_input -type f -name 'wrfout_d01_*' -size +0c | wc -l)" -gt 0

      - name: Extrair REFL_10CM nativo
        run: |
          set -euo pipefail
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py \
            --run-dir metbr_publish_input \
            --output-dir wrf_publish
          test -s wrf_publish/metadata.json

      - name: Validar publicação METBR
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('wrf_publish')
          meta = json.loads((root / 'metadata.json').read_text())
          assert meta.get('model') == 'icon', meta.get('model')
          assert meta.get('resolutionKm') == 4, meta.get('resolutionKm')
          assert meta.get('reflectivitySource') == 'REFL_10CM_NATIVE', meta.get('reflectivitySource')
          frames = meta.get('frames') or []
          assert frames, 'sem frames'
          for frame in frames:
              assert (root / frame['file']).is_file(), frame['file']
          print(f"METBR validado: {len(frames)} frames, {meta.get('runDate')} {meta.get('runCycle')}")
          PY

      - name: Publicar em metbr-wrf-data
        run: |
          set -euo pipefail
          git fetch origin metbr-wrf-data || true
          rm -rf published-metbr
          if git show-ref --verify --quiet refs/remotes/origin/metbr-wrf-data; then
            git worktree add --detach published-metbr origin/metbr-wrf-data
            find published-metbr -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git worktree add --detach published-metbr HEAD
            find published-metbr -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          cp -a wrf_publish/. published-metbr/
          git -C published-metbr config user.name 'github-actions[bot]'
          git -C published-metbr config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published-metbr add --all
          git -C published-metbr commit -m "METBR WRF 4 km: publicação mais recente" || true
          git -C published-metbr push origin HEAD:metbr-wrf-data
          git worktree remove --force published-metbr

      - name: Confirmar URL fixa
        run: |
          echo "METBR latest: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/metbr-wrf-data/metadata.json"
