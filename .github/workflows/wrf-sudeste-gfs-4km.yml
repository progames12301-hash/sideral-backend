name: WRF 7 km SUDESTE GFS - AUTOMATICO DIARIO

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Rodada GFS em YYYYMMDD (vazio = mais recente com F042)"
        required: false
        type: string
      run_cycle:
        description: "Ciclo GFS: 00, 06, 12 ou 18"
        required: false
        type: string
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sudeste-gfs-7km
  cancel-in-progress: false

jobs:
  wrf:
    uses: ./.github/workflows/wrf-regional-7km-single.yml
    with:
      model: gfs
      domain: sudeste
      publish_branch: wrf-sudeste-gfs-data
      run_date: ${{ inputs.run_date || '' }}
      run_cycle: ${{ inputs.run_cycle || '' }}
    secrets: inherit
