name: WRF 7 km SUDESTE GFS - AUTOMATICO DIARIO

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Rodada GFS em YYYYMMDD (vazio = mais recente com F042)"
        required: false
        type: string
      run_cycle:
        description: "Ciclo GFS: 00, 06, 12 ou 18"
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/wrf-sudeste-gfs-4km.yml'
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sudeste-gfs-7km
  cancel-in-progress: true

jobs:
  wrf:
    # Descontinuado em 2026-10-26: WRF Sudeste 7 km
    if: ${{ false }}
    uses: ./.github/workflows/wrf-regional-7km-single.yml
    with:
      model: gfs
      domain: sudeste
      publish_branch: wrf-sudeste-gfs-data
      run_date: ${{ inputs.run_date || '' }}
      run_cycle: ${{ inputs.run_cycle || '' }}
    secrets: inherit
