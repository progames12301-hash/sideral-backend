name: WRF Sudeste 4 km GFS - 48H REFL NATIVO

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3,15 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-sudeste-gfs-4km.yml"
      - ".github/workflows/wrf-regional-48h-reusable.yml"

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sudeste-gfs
  cancel-in-progress: false

jobs:
  wrf:
    uses: ./.github/workflows/wrf-regional-48h-reusable.yml
    with:
      model: gfs
      source_data_branch: ''
      publish_branch: wrf-sudeste-gfs-data
      run_script: run_gfs_segment_sudeste.sh
      publish_severe: true
    secrets: inherit
