name: CIM WRF 3 km - diário
on:
  schedule:
    # Executa após a rodada operacional principal do Sul.
    - cron: '37 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cim-wrf-3km-operational.yml"
permissions:
  contents: write
concurrency:
  group: cim-wrf-3km-daily
  cancel-in-progress: false
jobs:
  run-and-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: icon
            branch: cim-wrf-3km-icon-data
            runner: wrf/run_icon_wrf.sh
          - model: ecmwf
            branch: cim-wrf-3km-ecmwf-data
            runner: wrf/run_ecmwf_wrf.sh
    name: CIM 3 km (${{ matrix.model }})
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências do WRF e pós-processamento
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'xarray>=2024.1,<2026' 'netCDF4>=1.7,<2' 'scipy>=1.11,<2' 'requests>=2.31' 'ecmwf-opendata==0.3.34'
      - name: Executar CIM WRF 3 km
        env:
          WRF_DX_METERS: '3000'
          WRF_DY_METERS: '3000'
          WRF_E_WE: '370'
          WRF_E_SN: '440'
          WRF_TIME_STEP: '18'
          WRF_REF_LAT: '-28.35'
          WRF_REF_LON: '-54.80'
          WRF_STAND_LON: '-54.80'
          WRF_RUN_HOURS: '6'
        run: |
          set -euxo pipefail
          test "$WRF_DX_METERS" = '3000'
          test "$WRF_DY_METERS" = '3000'
          grep -Fq 'dx = ${WRF_DX_METERS}' wrf/run_wrf_with_source.sh
          grep -Fq 'dy = ${WRF_DY_METERS}' wrf/run_wrf_with_source.sh
          echo "CIM grade validada: ${WRF_DX_METERS} m x ${WRF_DY_METERS} m"
          sed -i 's/WRF 4 km/WRF 3 km/g' wrf/run_icon_wrf.sh wrf/run_ecmwf_wrf.sh wrf/run_wrf_with_source.sh
          sed -i 's/WRF 4 KM/WRF 3 KM/g' wrf/run_icon_wrf.sh wrf/run_ecmwf_wrf.sh wrf/run_wrf_with_source.sh
          chmod +x ${{ matrix.runner }}
          ${{ matrix.runner }}
      - name: Extrair os cinco campos CIM
        run: python wrf/extract_cim_wrf.py --model ${{ matrix.model }} --output-dir cim_publish
      - name: Validar publicação CIM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('cim_publish'); meta=json.loads((root/'metadata.json').read_text())
          assert meta['resolutionKm']==3 and meta['reflectivitySource']=='REFL_10CM_NATIVE'
          assert set(meta['availableVariables']) == {'reflectivity','stp','scp','temperature','humidity'}
          assert len(meta['frames']) >= 3
          for frame in meta['frames']: assert (root/frame['file']).is_file()
          PY
      - name: Publicar produto validado
        run: |
          set -euxo pipefail
          if git ls-remote --exit-code --heads origin '${{ matrix.branch }}'; then
            git fetch origin '${{ matrix.branch }}'
            git worktree add --detach published-cim 'origin/${{ matrix.branch }}'
          else
            git worktree add --detach published-cim
          fi
          find published-cim -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a cim_publish/. published-cim/
          git -C published-cim config user.name 'github-actions[bot]'
          git -C published-cim config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published-cim add --all
          git -C published-cim diff --cached --quiet && exit 0
          git -C published-cim commit -m "CIM WRF 3 km ${{ matrix.model }}: $(jq -r '.runDate + " " + .runCycle' cim_publish/metadata.json)"
          git -C published-cim push origin 'HEAD:${{ matrix.branch }}'
      - name: Guardar wrfout para recuperação após falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cim-wrf-${{ matrix.model }}-wrfout-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: wrf_work/run/wrfout_d01_*
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cim-wrf-${{ matrix.model }}-diagnostics
          path: |
            wrf_diagnostics/
            wrf_work/run/rsl.*
          if-no-files-found: ignore
          retention-days: 7

