name: CIM WRF 3 km - 48h com spin-up

on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cim-wrf-3km-operational.yml"

permissions:
  contents: write

concurrency:
  group: cim-wrf-3km-daily
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  WRF_HISTORY_INTERVAL_MINUTES: '180'
  CIM_DOMAIN_VERSION: 'south-cone-v2'
  CIM_GRID_X: '619'
  CIM_GRID_Y: '659'

jobs:
  resolve_runs:
    name: Resolver rodadas ICON e ECMWF com F048 disponível
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      icon_date: ${{ steps.resolve.outputs.icon_date }}
      icon_cycle: ${{ steps.resolve.outputs.icon_cycle }}
      ecmwf_date: ${{ steps.resolve.outputs.ecmwf_date }}
      ecmwf_cycle: ${{ steps.resolve.outputs.ecmwf_cycle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar cliente ECMWF
        run: python -m pip install --disable-pip-version-check 'ecmwf-opendata==0.3.34'
      - name: Fixar as duas rodadas antes de abrir os segmentos
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          read -r ECMWF_DATE ECMWF_CYCLE < <(python - <<'PY'
          import datetime as dt
          from ecmwf.opendata import Client
          c = Client(source='ecmwf', model='ifs')
          value = c.latest(type='fc', step=48, param=['2t'])
          if not isinstance(value, dt.datetime):
              value = dt.datetime.fromisoformat(str(value))
          if value.tzinfo is None:
              value = value.replace(tzinfo=dt.timezone.utc)
          value = value.astimezone(dt.timezone.utc)
          print(value.strftime('%Y%m%d %H'))
          PY
          )

          ICON_DATE=''
          ICON_CYCLE=''
          while read -r DATE CYCLE; do
            URL="https://opendata.dwd.de/weather/nwp/icon/grib/${CYCLE}/t_2m/icon_global_icosahedral_single-level_${DATE}${CYCLE}_048_T_2M.grib2.bz2"
            echo "Testando ICON ${DATE} ${CYCLE}Z F048"
            if curl -fsSL --range 0-0 --connect-timeout 15 --max-time 45 -o /dev/null "$URL"; then
              ICON_DATE="$DATE"
              ICON_CYCLE="$CYCLE"
              break
            fi
          done < <(python - <<'PY'
          import datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          base = now.replace(hour=(now.hour // 6) * 6, minute=0, second=0, microsecond=0)
          for n in range(8):
              x = base - dt.timedelta(hours=6*n)
              print(x.strftime('%Y%m%d %H'))
          PY
          )

          test -n "$ICON_DATE"
          test -n "$ECMWF_DATE"
          echo "ICON fixado: ${ICON_DATE} ${ICON_CYCLE}Z"
          echo "ECMWF fixado: ${ECMWF_DATE} ${ECMWF_CYCLE}Z"
          echo "icon_date=$ICON_DATE" >> "$GITHUB_OUTPUT"
          echo "icon_cycle=$ICON_CYCLE" >> "$GITHUB_OUTPUT"
          echo "ecmwf_date=$ECMWF_DATE" >> "$GITHUB_OUTPUT"
          echo "ecmwf_cycle=$ECMWF_CYCLE" >> "$GITHUB_OUTPUT"

  segments:
    name: CIM ${{ matrix.model }} F${{ matrix.segment.start }}-F${{ matrix.segment.end }}
    needs: resolve_runs
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        model: [icon, ecmwf]
        segment:
          - { id: '000-009', start: 0,  end: 9 }
          - { id: '006-015', start: 6,  end: 15 }
          - { id: '012-021', start: 12, end: 21 }
          - { id: '018-027', start: 18, end: 27 }
          - { id: '024-033', start: 24, end: 33 }
          - { id: '030-039', start: 30, end: 39 }
          - { id: '036-045', start: 36, end: 45 }
          - { id: '042-048', start: 42, end: 48 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Restaurar segmento já calculado
        id: checkpoint
        shell: bash
        env:
          ICON_DATE: ${{ needs.resolve_runs.outputs.icon_date }}
          ICON_CYCLE: ${{ needs.resolve_runs.outputs.icon_cycle }}
          ECMWF_DATE: ${{ needs.resolve_runs.outputs.ecmwf_date }}
          ECMWF_CYCLE: ${{ needs.resolve_runs.outputs.ecmwf_cycle }}
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'
          if [[ "$MODEL" == 'icon' ]]; then
            RUN_DATE="$ICON_DATE"; RUN_CYCLE="$ICON_CYCLE"
          else
            RUN_DATE="$ECMWF_DATE"; RUN_CYCLE="$ECMWF_CYCLE"
          fi
          RUN_CYCLE="$(printf '%02d' "$((10#$RUN_CYCLE))")"
          BRANCH="cim-checkpoint-${CIM_DOMAIN_VERSION}-${MODEL}-${RUN_DATE}${RUN_CYCLE}-${{ matrix.segment.id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "hit=false" >> "$GITHUB_OUTPUT"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Checkpoint ausente: $BRANCH"
            exit 0
          fi

          git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}"
          rm -rf checkpoint cim_publish
          git worktree add --detach checkpoint "refs/remotes/origin/${BRANCH}"
          mkdir -p cim_publish
          find checkpoint -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} cim_publish/ \;
          git worktree remove --force checkpoint

          if python3 - <<'PY'; then
          import json
          from pathlib import Path
          root = Path('cim_publish')
          meta = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          assert meta.get('domainId') == 'south-cone-v2', meta
          assert meta.get('resolutionKm') == 3, meta
          assert meta.get('reflectivitySource') == 'REFL_10CM_NATIVE', meta
          assert meta.get('frames'), meta
          for frame in meta['frames']:
              assert int(frame['gridX']) == 619, frame
              assert int(frame['gridY']) == 659, frame
              assert (root / frame['file']).is_file(), frame
          print('CHECKPOINT VALIDO:', meta.get('model'), [f['forecastHour'] for f in meta['frames']])
          PY
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Reutilizando $BRANCH; WRF deste segmento não será recalculado."
          else
            echo "Checkpoint inválido; recalculando $BRANCH"
            rm -rf cim_publish
          fi

      - name: Liberar espaço e preparar runner
        if: steps.checkpoint.outputs.hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools

      - uses: actions/setup-python@v5
        if: steps.checkpoint.outputs.hit != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências do WRF e pós-processamento
        if: steps.checkpoint.outputs.hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'xarray>=2024.1,<2026' 'netCDF4>=1.7,<2' 'scipy>=1.11,<2' 'requests>=2.31' 'ecmwf-opendata==0.3.34'

      - name: Executar segmento CIM 3 km Cone Sul ampliado
        if: steps.checkpoint.outputs.hit != 'true'
        env:
          ICON_DATE: ${{ needs.resolve_runs.outputs.icon_date }}
          ICON_CYCLE: ${{ needs.resolve_runs.outputs.icon_cycle }}
          ECMWF_DATE: ${{ needs.resolve_runs.outputs.ecmwf_date }}
          ECMWF_CYCLE: ${{ needs.resolve_runs.outputs.ecmwf_cycle }}
          WRF_DX_METERS: '3000'
          WRF_DY_METERS: '3000'
          WRF_E_WE: '620'
          WRF_E_SN: '660'
          WRF_TIME_STEP: '18'
          WRF_REF_LAT: '-27.60'
          WRF_REF_LON: '-56.00'
          WRF_STAND_LON: '-56.00'
          WRF_RUN_HOURS: '48'
          WRF_START_HOUR: ${{ matrix.segment.start }}
          WRF_END_HOUR: ${{ matrix.segment.end }}
          WRF_HISTORY_INTERVAL_MINUTES: '180'
          ICON_SOURCE_XSIZE: '105'
          ICON_SOURCE_YSIZE: '97'
          ICON_SOURCE_XFIRST: '-69.0'
          ICON_SOURCE_YFIRST: '-40.0'
          ICON_SOURCE_XINC: '0.25'
          ICON_SOURCE_YINC: '0.25'
          ECMWF_SOURCE_WEST: '-69'
          ECMWF_SOURCE_EAST: '-43'
          ECMWF_SOURCE_SOUTH: '-40'
          ECMWF_SOURCE_NORTH: '-16'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ '${{ matrix.model }}' == 'icon' ]]; then
            export FORCE_RUN_DATE="$ICON_DATE"
            export FORCE_RUN_CYCLE="$ICON_CYCLE"
            RUNNER='wrf/run_icon_wrf.sh'
          else
            export FORCE_RUN_DATE="$ECMWF_DATE"
            export FORCE_RUN_CYCLE="$ECMWF_CYCLE"
            RUNNER='wrf/run_ecmwf_wrf.sh'
          fi

          test "$WRF_DX_METERS" = '3000'
          test "$WRF_DY_METERS" = '3000'
          test "$WRF_E_WE" = '620'
          test "$WRF_E_SN" = '660'
          echo "CIM ${{ matrix.model }}: F${WRF_START_HOUR}-F${WRF_END_HOUR}; 3 km; Cone Sul ampliado"
          echo "Alvos: Sul do Brasil, Paraguai, Uruguai, norte/centro da Argentina e parte de SP/MS"
          chmod +x "$RUNNER"
          "$RUNNER"

      - name: Extrair CIM nativo do segmento
        if: steps.checkpoint.outputs.hit != 'true'
        run: python wrf/extract_cim_wrf.py --model ${{ matrix.model }} --output-dir cim_publish

      - name: Identificar domínio no metadata
        if: steps.checkpoint.outputs.hit != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('cim_publish/metadata.json')
          meta = json.loads(path.read_text(encoding='utf-8'))
          meta['domainId'] = 'south-cone-v2'
          meta['domainName'] = 'CIM Cone Sul ampliado'
          meta['domainTargets'] = [
              'Sul do Brasil', 'Paraguai', 'Uruguai',
              'norte/centro da Argentina', 'parte de SP/MS'
          ]
          meta['sourceBoundingBox'] = {
              'west': -69.0, 'east': -43.0, 'south': -40.0, 'north': -16.0
          }
          meta['wrfGridConfig'] = {
              'e_we': 620, 'e_sn': 660, 'gridX': 619, 'gridY': 659,
              'dxMeters': 3000, 'dyMeters': 3000,
              'refLat': -27.60, 'refLon': -56.00, 'standLon': -56.00
          }
          path.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Validar segmento
        if: steps.checkpoint.outputs.hit != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('cim_publish')
          meta = json.loads((root / 'metadata.json').read_text())
          assert meta['domainId'] == 'south-cone-v2'
          assert meta['resolutionKm'] == 3
          assert meta['reflectivitySource'] == 'REFL_10CM_NATIVE'
          assert set(meta['availableVariables']) == {'reflectivity','stp','scp','temperature','humidity'}
          assert meta['frames']
          for frame in meta['frames']:
              assert int(frame['gridX']) == 619, frame
              assert int(frame['gridY']) == 659, frame
              assert (root / frame['file']).is_file(), frame
          print('SEGMENTO OK:', [(f['forecastHour'], f['gridX'], f['gridY']) for f in meta['frames']])
          PY

      - name: Salvar checkpoint permanente do segmento
        if: steps.checkpoint.outputs.hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          BRANCH='${{ steps.checkpoint.outputs.branch }}'
          rm -rf checkpoint-write
          git worktree add --detach checkpoint-write
          git -C checkpoint-write checkout --orphan checkpoint
          git -C checkpoint-write rm -rf . || true
          git -C checkpoint-write clean -fdx || true
          cp -a cim_publish/. checkpoint-write/
          printf '# CIM checkpoint\n%s\n' "$BRANCH" > checkpoint-write/README.md
          git -C checkpoint-write config user.name 'github-actions[bot]'
          git -C checkpoint-write config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C checkpoint-write add --all
          git -C checkpoint-write commit -m "CIM checkpoint: $BRANCH"
          git -C checkpoint-write push --force origin "HEAD:refs/heads/$BRANCH"
          git worktree remove --force checkpoint-write
          echo "CHECKPOINT PUBLICADO: $BRANCH"

      - uses: actions/upload-artifact@v4
        with:
          name: cim-${{ matrix.model }}-${{ matrix.segment.id }}
          path: cim_publish/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0

      - name: Guardar diagnósticos se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cim-${{ matrix.model }}-${{ matrix.segment.id }}-diagnostics
          path: |
            wrf_diagnostics/
            wrf_work/run/rsl.*
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: Publicar CIM 48h (${{ matrix.model }})
    needs: [resolve_runs, segments]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [icon, ecmwf]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: cim-${{ matrix.model }}-*
          path: segments

      - name: Unir segmentos e remover cold-start F000/F003
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t roots < <(find segments -type f -name metadata.json -printf '%h\n' | sort)
          test "${#roots[@]}" -eq 8
          args=()
          for root in "${roots[@]}"; do args+=(--input "$root"); done
          python wrf/merge_wrf_segments.py "${args[@]}" --output cim_publish

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('cim_publish')
          path = root / 'metadata.json'
          meta = json.loads(path.read_text(encoding='utf-8'))
          keep = []
          for frame in meta.get('frames', []):
              hour = int(frame['forecastHour'])
              if 6 <= hour <= 48 and hour % 3 == 0:
                  keep.append(frame)
              else:
                  target = root / frame['file']
                  if target.exists():
                      target.unlink()

          keep.sort(key=lambda f: int(f['forecastHour']))
          for index, frame in enumerate(keep):
              frame['index'] = index

          meta['frames'] = keep
          meta['frameCount'] = len(keep)
          meta['forecastHourStart'] = 6
          meta['forecastHourEnd'] = 48
          meta['horizonHours'] = 48
          meta['spinupHoursMinimum'] = 6
          meta['temporalResolutionMinutes'] = 180
          meta['segmentSpinupProtected'] = True
          meta['status'] = 'complete'
          path.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Validar produto CIM 48h pós-spin-up
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('cim_publish')
          meta = json.loads((root / 'metadata.json').read_text())
          frames = meta['frames']
          hours = [int(f['forecastHour']) for f in frames]
          assert meta['domainId'] == 'south-cone-v2', meta
          assert meta['resolutionKm'] == 3, meta
          assert meta['reflectivitySource'] == 'REFL_10CM_NATIVE', meta
          assert meta['horizonHours'] == 48, meta
          assert meta['spinupHoursMinimum'] == 6, meta
          assert meta['segmentSpinupProtected'] is True, meta
          assert hours == list(range(6, 49, 3)), hours
          assert len(frames) == 15, len(frames)
          assert min(int(f.get('integrationHours', -1)) for f in frames) >= 6, frames
          for frame in frames:
              assert int(frame['gridX']) == 619 and int(frame['gridY']) == 659, frame
              assert (root / frame['file']).is_file(), frame
          print('CIM 48H VALIDADO:', meta['model'], hours)
          print('GRADE NATIVA:', frames[0]['gridX'], 'x', frames[0]['gridY'])
          print('SPIN-UP MÍNIMO:', min(int(f['integrationHours']) for f in frames), 'h')
          PY

      - name: Publicar com histórico de rodadas
        shell: bash
        run: |
          set -euxo pipefail
          if [[ '${{ matrix.model }}' == 'icon' ]]; then
            BRANCH='cim-wrf-3km-icon-data'
            TITLE='CIM WRF 3 km ICON'
          else
            BRANCH='cim-wrf-3km-ecmwf-data'
            TITLE='CIM WRF 3 km ECMWF'
          fi
          python wrf/publish_with_archive.py \
            --source cim_publish \
            --branch "$BRANCH" \
            --readme-title "$TITLE" \
            --readme-text 'CIM Cone Sul ampliado: Sul do Brasil, Paraguai, Uruguai, norte/centro da Argentina e parte de SP/MS; F006-F048, 3 km, REFL_10CM nativo.' \
            --retention-hours 96 \
            --max-runs 8

      - name: Remover checkpoints desta rodada após publicação
        shell: bash
        env:
          ICON_DATE: ${{ needs.resolve_runs.outputs.icon_date }}
          ICON_CYCLE: ${{ needs.resolve_runs.outputs.icon_cycle }}
          ECMWF_DATE: ${{ needs.resolve_runs.outputs.ecmwf_date }}
          ECMWF_CYCLE: ${{ needs.resolve_runs.outputs.ecmwf_cycle }}
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'
          if [[ "$MODEL" == 'icon' ]]; then
            RUN_DATE="$ICON_DATE"; RUN_CYCLE="$ICON_CYCLE"
          else
            RUN_DATE="$ECMWF_DATE"; RUN_CYCLE="$ECMWF_CYCLE"
          fi
          RUN_CYCLE="$(printf '%02d' "$((10#$RUN_CYCLE))")"
          for SEGMENT in 000-009 006-015 012-021 018-027 024-033 030-039 036-045 042-048; do
            BRANCH="cim-checkpoint-${CIM_DOMAIN_VERSION}-${MODEL}-${RUN_DATE}${RUN_CYCLE}-${SEGMENT}"
            git push origin --delete "$BRANCH" || true
          done

  verify_published:
    name: Confirmar publicação dupla CIM 48h
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar ICON e ECMWF diretamente nas branches publicadas
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin cim-wrf-3km-icon-data:cim-icon-verify
          git fetch origin cim-wrf-3km-ecmwf-data:cim-ecmwf-verify
          git show cim-icon-verify:metadata.json > /tmp/icon.json
          git show cim-ecmwf-verify:metadata.json > /tmp/ecmwf.json
          python - <<'PY'
          import json
          for model in ('icon', 'ecmwf'):
              meta = json.load(open(f'/tmp/{model}.json', encoding='utf-8'))
              hours = [int(f['forecastHour']) for f in meta['frames']]
              assert meta['model'] == model, meta
              assert meta['domainId'] == 'south-cone-v2', meta
              assert meta['resolutionKm'] == 3, meta
              assert meta['reflectivitySource'] == 'REFL_10CM_NATIVE', meta
              assert meta['horizonHours'] == 48, meta
              assert meta['spinupHoursMinimum'] == 6, meta
              assert meta['segmentSpinupProtected'] is True, meta
              assert hours == list(range(6, 49, 3)), hours
              assert len(meta['frames']) == 15, len(meta['frames'])
              assert min(int(f['integrationHours']) for f in meta['frames']) >= 6, meta['frames']
              assert all(int(f['gridX']) == 619 and int(f['gridY']) == 659 for f in meta['frames']), meta['frames']
              assert meta.get('archiveIndex') == 'runs.json', meta
              print(model.upper(), 'PUBLICADO:', meta['initTime'], hours, 'grid=619x659', 'domain=south-cone-v2')
          PY
