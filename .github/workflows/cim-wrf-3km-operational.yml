name: CIM WRF 8 km - 40h horario

on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cim-wrf-3km-operational.yml"

permissions:
  contents: write

# Mantemos o mesmo grupo da versao antiga para que esta migracao cancele
# imediatamente qualquer CIM 3 km antigo que ainda esteja queued/in_progress.
concurrency:
  group: cim-wrf-3km-daily
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  WRF_HISTORY_INTERVAL_MINUTES: '60'
  CIM_RESOLUTION_KM: '8'
  CIM_OUTPUT_INTERVAL_HOURS: '1'
  CIM_MAX_PUBLISHED_HOUR: '40'
  CIM_DOMAIN_VERSION: 'cim-sigma-area-v1-8km'
  CIM_GRID_X: '279'
  CIM_GRID_Y: '234'

jobs:
  resolve_runs:
    name: Resolver ICON e ECMWF com cobertura ate F042
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      icon_date: ${{ steps.resolve.outputs.icon_date }}
      icon_cycle: ${{ steps.resolve.outputs.icon_cycle }}
      ecmwf_date: ${{ steps.resolve.outputs.ecmwf_date }}
      ecmwf_cycle: ${{ steps.resolve.outputs.ecmwf_cycle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar cliente ECMWF
        run: python -m pip install --disable-pip-version-check 'ecmwf-opendata==0.3.34'
      - name: Fixar rodadas com F042 disponivel
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          read -r ECMWF_DATE ECMWF_CYCLE < <(python - <<'PY'
          import datetime as dt
          from ecmwf.opendata import Client
          c = Client(source='ecmwf', model='ifs')
          value = c.latest(type='fc', step=42, param=['2t'])
          if not isinstance(value, dt.datetime):
              value = dt.datetime.fromisoformat(str(value))
          if value.tzinfo is None:
              value = value.replace(tzinfo=dt.timezone.utc)
          value = value.astimezone(dt.timezone.utc)
          print(value.strftime('%Y%m%d %H'))
          PY
          )

          ICON_DATE=''
          ICON_CYCLE=''
          while read -r DATE CYCLE; do
            URL="https://opendata.dwd.de/weather/nwp/icon/grib/${CYCLE}/t_2m/icon_global_icosahedral_single-level_${DATE}${CYCLE}_042_T_2M.grib2.bz2"
            echo "Testando ICON ${DATE} ${CYCLE}Z F042"
            if curl -fsSL --range 0-0 --connect-timeout 15 --max-time 45 -o /dev/null "$URL"; then
              ICON_DATE="$DATE"
              ICON_CYCLE="$CYCLE"
              break
            fi
          done < <(python - <<'PY'
          import datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          base = now.replace(hour=(now.hour // 6) * 6, minute=0, second=0, microsecond=0)
          for n in range(10):
              x = base - dt.timedelta(hours=6*n)
              print(x.strftime('%Y%m%d %H'))
          PY
          )

          test -n "$ICON_DATE"
          test -n "$ECMWF_DATE"
          echo "ICON fixado: ${ICON_DATE} ${ICON_CYCLE}Z"
          echo "ECMWF fixado: ${ECMWF_DATE} ${ECMWF_CYCLE}Z"
          echo "icon_date=$ICON_DATE" >> "$GITHUB_OUTPUT"
          echo "icon_cycle=$ICON_CYCLE" >> "$GITHUB_OUTPUT"
          echo "ecmwf_date=$ECMWF_DATE" >> "$GITHUB_OUTPUT"
          echo "ecmwf_cycle=$ECMWF_CYCLE" >> "$GITHUB_OUTPUT"

  run_cim:
    name: CIM 8 km ${{ matrix.model }} - F000 a F040 horario
    needs: resolve_runs
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [icon, ecmwf]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Preparar runner
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'xarray>=2024.1,<2026' 'netCDF4>=1.7,<2' 'scipy>=1.11,<2' 'requests>=2.31' 'ecmwf-opendata==0.3.34'

      - name: Executar CIM 8 km
        env:
          ICON_DATE: ${{ needs.resolve_runs.outputs.icon_date }}
          ICON_CYCLE: ${{ needs.resolve_runs.outputs.icon_cycle }}
          ECMWF_DATE: ${{ needs.resolve_runs.outputs.ecmwf_date }}
          ECMWF_CYCLE: ${{ needs.resolve_runs.outputs.ecmwf_cycle }}
          WRF_DX_METERS: '8000'
          WRF_DY_METERS: '8000'
          WRF_E_WE: '280'
          WRF_E_SN: '235'
          WRF_TIME_STEP: '48'
          WRF_REF_LAT: '-27.50'
          WRF_REF_LON: '-52.75'
          WRF_STAND_LON: '-52.75'
          # A fonte global chega de 3 em 3 h. Integramos ate F042 para manter
          # a fronteira completa e publicamos exatamente F000..F040.
          WRF_RUN_HOURS: '42'
          WRF_START_HOUR: '0'
          WRF_END_HOUR: '42'
          WRF_HISTORY_INTERVAL_MINUTES: '60'
          CIM_RESOLUTION_KM: '8'
          CIM_OUTPUT_INTERVAL_HOURS: '1'
          CIM_MAX_PUBLISHED_HOUR: '40'
          # Buffer da fonte global ao redor da area exibida no mapa Sigma.
          ICON_SOURCE_XSIZE: '113'
          ICON_SOURCE_YSIZE: '89'
          ICON_SOURCE_XFIRST: '-67.0'
          ICON_SOURCE_YFIRST: '-39.0'
          ICON_SOURCE_XINC: '0.25'
          ICON_SOURCE_YINC: '0.25'
          ECMWF_SOURCE_WEST: '-67'
          ECMWF_SOURCE_EAST: '-39'
          ECMWF_SOURCE_SOUTH: '-39'
          ECMWF_SOURCE_NORTH: '-17'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ '${{ matrix.model }}' == 'icon' ]]; then
            export FORCE_RUN_DATE="$ICON_DATE"
            export FORCE_RUN_CYCLE="$ICON_CYCLE"
            RUNNER='wrf/run_icon_wrf.sh'
          else
            export FORCE_RUN_DATE="$ECMWF_DATE"
            export FORCE_RUN_CYCLE="$ECMWF_CYCLE"
            RUNNER='wrf/run_ecmwf_wrf.sh'
          fi
          test "$WRF_DX_METERS" = '8000'
          test "$WRF_DY_METERS" = '8000'
          test "$WRF_HISTORY_INTERVAL_MINUTES" = '60'
          echo "CIM ${{ matrix.model }}: grade 8 km, 280x235 pontos WRF, saida horaria, horizonte publicado F040"
          echo "Area alvo visual: ~63.6W..41.8W / 35.6S..19.4S"
          chmod +x "$RUNNER"
          "$RUNNER"

      - name: Extrair grade nativa horaria
        env:
          CIM_RESOLUTION_KM: '8'
          CIM_OUTPUT_INTERVAL_HOURS: '1'
          CIM_MAX_PUBLISHED_HOUR: '40'
        run: python wrf/extract_cim_wrf.py --model ${{ matrix.model }} --output-dir cim_publish

      - name: Identificar dominio e viewport CIM
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('cim_publish/metadata.json')
          meta = json.loads(path.read_text(encoding='utf-8'))
          meta['domainId'] = 'cim-sigma-area-v1-8km'
          meta['domainName'] = 'CIM Sul/Sudeste 8 km'
          meta['domainTargets'] = [
              'Sul do Brasil', 'Sudeste do Brasil', 'Uruguai',
              'leste do Paraguai', 'nordeste/centro-leste da Argentina'
          ]
          meta['displayBoundingBox'] = {
              'west': -63.6, 'east': -41.8, 'south': -35.6, 'north': -19.4
          }
          meta['sourceBoundingBox'] = {
              'west': -67.0, 'east': -39.0, 'south': -39.0, 'north': -17.0
          }
          meta['wrfGridConfig'] = {
              'e_we': 280, 'e_sn': 235, 'gridX': 279, 'gridY': 234,
              'dxMeters': 8000, 'dyMeters': 8000,
              'refLat': -27.50, 'refLon': -52.75, 'standLon': -52.75,
              'timeStepSeconds': 48, 'historyIntervalMinutes': 60,
              'integrationHours': 42, 'publishedHorizonHours': 40
          }
          path.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Validar CIM 8 km F000-F040
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path('cim_publish')
          meta = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          assert float(meta['resolutionKm']) == 8.0, meta.get('resolutionKm')
          assert meta['reflectivitySource'] == 'REFL_10CM_NATIVE'
          assert meta['nativeGrid'] is True
          assert meta['temporalResolutionMinutes'] == 60
          frames = meta['frames']
          hours = [int(f['forecastHour']) for f in frames]
          assert hours == list(range(0, 41)), hours
          assert len(frames) == 41
          for frame in frames:
              assert int(frame['gridX']) == 279, frame
              assert int(frame['gridY']) == 234, frame
              assert frame.get('nativeGrid') is True, frame
              assert frame.get('reflectivitySource') == 'REFL_10CM_NATIVE', frame
              assert (root / frame['file']).is_file(), frame
          with gzip.open(root / frames[0]['file'], 'rt', encoding='utf-8') as fh:
              payload = json.load(fh)
          assert int(payload['dxMeters']) == 8000 and int(payload['dyMeters']) == 8000, payload
          assert int(payload['gridX']) == 279 and int(payload['gridY']) == 234, payload
          assert payload.get('nativeGrid') is True, payload
          assert payload.get('reflectivitySource') == 'REFL_10CM_NATIVE', payload
          print('CIM 8 KM VALIDADO:', meta['model'], 'F000-F040 horario', 'grid=279x234')
          PY

      - name: Publicar no branch compativel com o site atual
        shell: bash
        run: |
          set -euxo pipefail
          if [[ '${{ matrix.model }}' == 'icon' ]]; then
            BRANCH='cim-wrf-3km-icon-data'
          else
            BRANCH='cim-wrf-3km-ecmwf-data'
          fi
          rm -rf publish-tree
          git worktree add --detach publish-tree
          git -C publish-tree checkout --orphan cim-data
          git -C publish-tree rm -rf . || true
          git -C publish-tree clean -fdx || true
          cp -a cim_publish/. publish-tree/
          printf '# CIM WRF 8 km\n41 quadros horarios F000-F040\n' > publish-tree/README.md
          git -C publish-tree config user.name 'github-actions[bot]'
          git -C publish-tree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publish-tree add --all
          git -C publish-tree commit -m "CIM WRF 8 km ${{ matrix.model }}: F000-F040 horario"
          git -C publish-tree push --force origin "HEAD:refs/heads/$BRANCH"
          git worktree remove --force publish-tree
          echo "PUBLICADO: $BRANCH"

      - name: Guardar diagnosticos se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cim-8km-${{ matrix.model }}-diagnostics
          path: |
            wrf_diagnostics/
            wrf_work/run/rsl.*
          if-no-files-found: ignore
          retention-days: 3

  verify_published:
    name: Confirmar publicacao dupla CIM 8 km
    needs: run_cim
    if: ${{ always() && needs.run_cim.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir ICON e ECMWF publicados
        shell: bash
        run: |
          set -euxo pipefail
          for item in icon:refs/remotes/origin/cim-wrf-3km-icon-data ecmwf:refs/remotes/origin/cim-wrf-3km-ecmwf-data; do
            MODEL="${item%%:*}"
            REF="${item#*:}"
            BRANCH="cim-wrf-3km-${MODEL}-data"
            git fetch --force origin "$BRANCH:$REF"
            git show "$REF:metadata.json" > "/tmp/${MODEL}-metadata.json"
            MODEL="$MODEL" python - <<'PY'
          import json, os
          from pathlib import Path
          model = os.environ['MODEL']
          meta = json.loads(Path(f'/tmp/{model}-metadata.json').read_text())
          assert float(meta['resolutionKm']) == 8.0, meta
          assert meta['reflectivitySource'] == 'REFL_10CM_NATIVE', meta
          assert meta.get('nativeGrid') is True, meta
          hours = [int(x['forecastHour']) for x in meta['frames']]
          assert hours == list(range(41)), hours
          assert all(int(x['gridX']) == 279 and int(x['gridY']) == 234 for x in meta['frames'])
          print(model.upper(), 'PUBLICADO: 8 km, F000-F040 horario, 279x234')
          PY
          done
