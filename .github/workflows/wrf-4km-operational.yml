name: WRF Sul 4 km - LEGADO MANUAL

on:
  workflow_dispatch:

# Este workflow fica disponível apenas para diagnóstico manual.
# A operação automática do GFS Sul usa wrf-4km-native-reflectivity.yml
# e wrf-4km-next-day-auto.yml, evitando duas rotinas publicando wrf-data.
permissions:
  contents: write

concurrency:
  group: wrf-gfs-operacional-legado
  cancel-in-progress: false

jobs:
  run-and-publish:
    name: Gerar e publicar WRF Sul 4 km manual
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout do executor
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Preparar Python para o pós-processamento
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de extração
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'xarray>=2024.1,<2026' 'netCDF4>=1.7,<2' 'scipy>=1.11,<2'

      - name: Liberar espaço do runner
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          df -h

      - name: Executar WRF com a rodada GFS disponível
        run: |
          set -euxo pipefail
          chmod +x wrf/run_gfs_test.sh
          wrf/run_gfs_test.sh

      - name: Extrair campos nativos do wrfout
        run: |
          set -euxo pipefail
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish

      - name: Validar a rodada antes da publicação
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('wrf_publish')
          metadata = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          frames = metadata.get('frames') or []
          assert metadata.get('model') == 'gfs', 'Modelo publicado inesperado'
          assert metadata.get('resolutionKm') == 4, 'WRF Sul não está em 4 km'
          assert metadata.get('reflectivitySource') == 'REFL_10CM_NATIVE', 'Refletividade não é nativa'
          assert len(frames) >= 3, 'Rodada incompleta'
          for frame in frames:
              assert (root / frame['file']).is_file(), f"Arquivo ausente: {frame['file']}"
          print('Rodada manual validada:', metadata['runDate'], metadata['runCycle'])
          PY

      - name: Publicar a rodada validada em wrf-data
        run: |
          set -euxo pipefail
          git fetch origin wrf-data
          git worktree add --detach published-wrf origin/wrf-data
          find published-wrf -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a wrf_publish/. published-wrf/
          git -C published-wrf config user.name 'github-actions[bot]'
          git -C published-wrf config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published-wrf add --all
          if git -C published-wrf diff --cached --quiet; then
            echo 'A rodada validada já está publicada.'
            exit 0
          fi
          git -C published-wrf commit -m "WRF Sul 4 km manual: $(jq -r '.runDate + " " + .runCycle' wrf_publish/metadata.json)"
          git -C published-wrf push origin HEAD:wrf-data

      - name: Preparar três quadros nativos do WRF Sul 4 km para Skew-T
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf skewt-staged skewt-wrfout.tar.gz
          python - <<'PY'
          import datetime as dt, re, shutil
          from pathlib import Path
          root=Path("wrf_work/run")
          staged=Path("skewt-staged")
          staged.mkdir(parents=True,exist_ok=True)
          pattern=re.compile(r"^wrfout_d01_(\d{4}-\d{2}-\d{2})_(\d{2})[:.](\d{2})[:.](\d{2})$")
          found={}
          for path in root.glob("wrfout_d01_*"):
              match=pattern.fullmatch(path.name)
              if not match or not path.is_file() or path.stat().st_size==0:
                  continue
              valid=dt.datetime.strptime("_".join((match.group(1),match.group(2),match.group(3),match.group(4))),"%Y-%m-%d_%H_%M_%S")
              found[valid]=path
          if len(found)<3:
              raise SystemExit(f"WRF Sul 4 km legado precisa de 3 WRFOUTs; encontrou {len(found)}")
          start=min(found)
          selected=[]
          for hour in (0,3,6):
              valid=start+dt.timedelta(hours=hour)
              if valid not in found:
                  raise SystemExit(f"Validade F{hour:03d} ausente no WRF Sul 4 km legado: {valid}")
              target=staged/("wrfout_d01_"+valid.strftime("%Y-%m-%d_%H:%M:%S"))
              shutil.copy2(found[valid],target)
              selected.append(target)
          print("Skew-T WRF Sul 4 km legado: F000, F003 e F006 nativos.")
          PY
          tar -czf skewt-wrfout.tar.gz -C skewt-staged .
          test -s skewt-wrfout.tar.gz

      - name: Disponibilizar WRFOUTs nativos ao publicador individual do Skew-T
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skewt-wrfout-sul-gfs-4km-legacy
          path: skewt-wrfout.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Salvar diagnósticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-failure-diagnostics
          path: |
            wrf_diagnostics/
            wrf_work/*.stdout
            wrf_work/*.log
            wrf_work/run/rsl.*
          if-no-files-found: ignore
          retention-days: 7
