name: WRF - bootstrap das rodadas corrigidas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-corrected-bootstrap.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: sideral-wrf-corrected-bootstrap
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Corrigir workflows antigos que ainda pedem grade reduzida
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/sideral-main-fix
          rm -rf "$work"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"
          git checkout main
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          changed = []
          for path in sorted(root.glob('*.yml')):
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines()
              out = []
              i = 0
              touched = False
              while i < len(lines):
                  line = lines[i]
                  if i + 1 < len(lines) and '--grid-x 220' in line and '--grid-y 180' in lines[i + 1]:
                      next_line = lines[i + 2] if i + 2 < len(lines) else ''
                      if not next_line.lstrip().startswith('--') and out and out[-1].rstrip().endswith('\\'):
                          out[-1] = out[-1].rstrip()[:-1].rstrip()
                      i += 2
                      touched = True
                      continue
                  if i + 1 < len(lines) and '--grid-x 240' in line and '--grid-y 200' in lines[i + 1]:
                      next_line = lines[i + 2] if i + 2 < len(lines) else ''
                      if not next_line.lstrip().startswith('--') and out and out[-1].rstrip().endswith('\\'):
                          out[-1] = out[-1].rstrip()[:-1].rstrip()
                      i += 2
                      touched = True
                      continue
                  out.append(line)
                  i += 1
              updated = '\n'.join(out) + ('\n' if original.endswith('\n') else '')
              if touched and updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('WORKFLOWS CORRIGIDOS:', changed)
          if not changed:
              print('Nenhum workflow antigo ainda continha downsampling hardcoded.')
          PY

          if ! git diff --quiet; then
            git config user.name "sideral-wrf-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows
            git commit -m "WRF: remover grades artificiais antigas dos workflows [skip render]"
            git push origin HEAD:main
          fi

      - name: Cancelar rodadas antigas e iniciar somente as corrigidas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cancel_active() {
            local workflow="$1" label="$2"
            mapfile -t ids < <(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --limit 50 \
                --json databaseId,status \
                --jq '.[] | select(.status != "completed") | .databaseId'
            )
            if [ "${#ids[@]}" -eq 0 ]; then
              echo "SEM EXECUCAO ANTIGA: $label"
              return 0
            fi
            for id in "${ids[@]}"; do
              echo "CANCELANDO ANTIGA: $label run=$id"
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            done
          }

          start_fresh() {
            local workflow="$1" label="$2"
            cancel_active "$workflow" "$label"
            sleep 2
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            echo "INICIADO CORRIGIDO: $label"
          }

          # Remove execucoes GFS Sul antigas, inclusive a cadeia F000-F072.
          cancel_active wrf-4km-next-day-auto.yml "GFS Sul 4 km F000-F072"
          cancel_active wrf-4km-operational.yml "GFS Sul legado"
          cancel_active wrf-4km-native-reflectivity.yml "GFS Sul 4 km nativo"
          gh workflow run wrf-sul-gfs-runner-relief.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          sleep 3
          gh workflow run wrf-4km-native-reflectivity.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "INICIADO CORRIGIDO: GFS Sul 4 km nativo; ao concluir dispara F000-F072."

          # Sul: ICON e ECMWF corrigidos.
          start_fresh wrf-icon-4km-native.yml "ICON Sul 4 km"
          start_fresh wrf-ecmwf-4km-native.yml "ECMWF Sul 4 km"

          # Sudeste: os tres modelos corrigidos substituem qualquer fila/run antigo.
          start_fresh wrf-sudeste-gfs-4km.yml "GFS Sudeste 4 km"
          start_fresh wrf-sudeste-icon-4km.yml "ICON Sudeste 4 km"
          start_fresh wrf-sudeste-ecmwf-4km.yml "ECMWF Sudeste 4 km"

          # CIM: sempre substitui a tentativa antiga por uma execucao nova em 3 km.
          start_fresh cim-wrf-3km-operational.yml "CIM ICON+ECMWF 3 km"

          # Auditoria final do contrato de resolucao/refletividade.
          gh workflow run wrf-resolution-contract.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          echo "Auditoria WRF 4 km / CIM 3 km solicitada."
