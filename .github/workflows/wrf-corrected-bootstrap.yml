name: WRF - validar e iniciar rodadas corrigidas

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-wrf-bootstrap
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Validar WRF Sudeste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run validate-wrf-sudeste.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sul GFS 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-4km-next-day-auto.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sul ICON 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-icon-4km-native.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sul ECMWF 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-ecmwf-4km-native.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sudeste GFS 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-sudeste-gfs-4km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sudeste ICON 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-sudeste-icon-4km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sudeste ECMWF 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-sudeste-ecmwf-4km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF2 Sudeste GFS 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf2-sudeste-gfs-7km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF2 Sudeste ICON 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf2-sudeste-icon-7km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF2 Sudeste ECMWF 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf2-sudeste-ecmwf-7km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar METBR ICON 4 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run metbr-wrf-4km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Resumo
        run: |
          echo 'WRF regionais: 7 km, saida horaria, aproximadamente 40 h.'
          echo 'WRF2 Sudeste: 7 km, 48 h, diagnosticos severos derivados dos wrfout.'
          echo 'CIM: contrato separado em 8 km.'
          echo 'METBR: 4 km ICON, separado dos WRF regionais.'
