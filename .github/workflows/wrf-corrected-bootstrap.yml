name: WRF - validar e iniciar rodadas corrigidas

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-wrf-bootstrap
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verificar contrato operacional
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run wrf-resolution-contract.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Contrato WRF disparado para validar resolução e saída horária."

      - name: Iniciar WRF Sul GFS 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-4km-next-day-auto.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sul ECMWF 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-ecmwf-4km-native.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sudeste GFS 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-sudeste-gfs-4km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sudeste ICON 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-sudeste-icon-4km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar WRF Sudeste ECMWF 7 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wrf-sudeste-ecmwf-4km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Iniciar METBR ICON 4 km
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run metbr-wrf-4km.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Resumo
        run: |
          echo 'WRF regionais: 7 km, saída horária, aproximadamente 40-48 h.'
          echo 'CIM: contrato separado em 8 km.'
          echo 'METBR: 4 km ICON, separado dos WRF regionais.'
          echo 'Nenhum bootstrap antigo de 4 km regional será executado.'
