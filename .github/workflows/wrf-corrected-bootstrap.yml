name: WRF - bootstrap das rodadas corrigidas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-corrected-bootstrap.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-wrf-corrected-bootstrap
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Iniciar rodadas corrigidas sem duplicar as que já estão ativas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          dispatch_if_idle() {
            local workflow="$1" label="$2" active
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$active" = "0" ]; then
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
              echo "INICIADO: $label"
            else
              echo "PRESERVADO: $label já possui $active execução(ões) ativa(s)."
            fi
          }

          # O GFS Sul tinha execuções iniciadas antes do contrato de grade nativa.
          # A rotina de relief usa o mesmo grupo de concorrência do WRF 72 h e
          # encerra uma rodada velha antes de dispararmos a cadeia corrigida.
          gh workflow run wrf-sul-gfs-runner-relief.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          sleep 3
          gh workflow run wrf-4km-native-reflectivity.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "INICIADO: GFS Sul 4 km nativo; ao concluir dispara o WRF 72 h."

          dispatch_if_idle wrf-icon-4km-native.yml "ICON Sul 4 km"
          dispatch_if_idle wrf-ecmwf-4km-native.yml "ECMWF Sul 4 km"
          dispatch_if_idle wrf-sudeste-gfs-4km.yml "GFS Sudeste 4 km"
          dispatch_if_idle wrf-sudeste-icon-4km.yml "ICON Sudeste 4 km"
          dispatch_if_idle wrf-sudeste-ecmwf-4km.yml "ECMWF Sudeste 4 km"
          dispatch_if_idle cim-wrf-3km-operational.yml "CIM ICON+ECMWF 3 km"

          # Auditoria independente do cálculo; valida código, agendas e branches.
          gh workflow run wrf-resolution-contract.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          echo "Auditoria do contrato WRF/CIM solicitada."
