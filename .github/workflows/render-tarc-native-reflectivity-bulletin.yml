name: Render Sideral native TARC reflectivity bulletin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-tarc-native-reflectivity-bulletin.yml"
      - "tools/render_tarc_native_reflectivity_bulletin.py"
      - "tools/render_tarc_native_reflectivity_mp4.py"
  workflow_run:
    workflows:
      - "WRF TARC 3 KM — fallback ICON → ECMWF → GFS"
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execução TARC concluída; vazio seleciona a mais recente válida"
        required: false
        type: string

permissions:
  contents: write

jobs:
  render-native-reflectivity:
    name: Render from the latest completed native TARC checkpoint
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select latest completed TARC checkpoint
        env:
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          candidates=""
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$EVENT_CONCLUSION" == "success" ]] || { echo "TARC não concluiu com sucesso; boletim ignorado."; exit 0; }
            candidates="$EVENT_RUN_ID"
          elif [[ -n "$INPUT_RUN_ID" ]]; then
            candidates="$INPUT_RUN_ID"
          else
            candidates="$(gh run list --repo "$GH_REPO" --workflow wrf-tarc-3km.yml --status success --limit 50 --json databaseId --jq '.[].databaseId')"
          fi

          selected=""
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            tag="tarc-wrf-3km-checkpoint-$run_id"
            assets="$(gh release view "$tag" --repo "$GH_REPO" --json assets 2>/dev/null || true)"
            [[ -n "$assets" ]] || { echo "Checkpoint $tag indisponível; tentando outro."; continue; }
            npz_count="$(jq '[.assets[] | select(.name | endswith(".npz"))] | length' <<< "$assets")"
            products_count="$(jq '[.assets[] | select(.name == "tarc-products-3km.tar.gz")] | length' <<< "$assets")"
            severe_count="$(jq '[.assets[] | select(.name == "tarc-severe-3km.tar.gz")] | length' <<< "$assets")"
            if (( npz_count >= 2 && products_count >= 1 && severe_count >= 1 )); then
              selected="$run_id"
              break
            fi
            echo "Ignorando $tag: os produtos completos ainda não foram publicados."
          done <<< "$candidates"

          [[ -n "$selected" ]] || { echo "Nenhum checkpoint TARC completo encontrado; nenhum boletim será gerado de um ID fixo antigo." >&2; exit 1; }
          echo "SOURCE_TAG=tarc-wrf-3km-checkpoint-$selected" >> "$GITHUB_ENV"
          echo "OUTPUT_TAG=tarc-native-refl-boletim-$selected" >> "$GITHUB_ENV"
          echo "OUTPUT_PNG=dist/sideral-tarc-3km-refletividade-nativa-latest.png" >> "$GITHUB_ENV"
          echo "OUTPUT_MP4=dist/sideral-tarc-3km-refletividade-nativa.mp4" >> "$GITHUB_ENV"
          echo "TARC selecionado: tarc-wrf-3km-checkpoint-$selected"

      - name: Checkout renderer
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install map-rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "matplotlib==3.9.4" "cartopy==0.24.1" "Pillow>=10,<12"

      - name: Download the selected native NPZ from the checkpoint release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native_input dist
          gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          # Download all native hourly frames plus the authoritative run initialization.
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.npz' --dir native_input --clobber
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'tarc-run.env' --dir native_input --clobber
          test -s "native_input/tarc-run.env"
          count="$(find native_input -maxdepth 1 -type f -name '*.npz' -size +0c | wc -l)"
          test "$count" -ge 2
          source native_input/tarc-run.env
          INIT_TIME="$(python - "$RUN_DATE" "$RUN_CYCLE" <<'PY'
          import re, sys
          from datetime import datetime, timezone
          run_date = re.sub(r'[^0-9]', '', sys.argv[1])
          cycle = re.sub(r'[^0-9]', '', sys.argv[2])[:2].zfill(2)
          init = datetime.strptime(run_date + cycle, "%Y%m%d%H").replace(tzinfo=timezone.utc)
          print(init.strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )"
          SOURCE_ASSET="$(find native_input -maxdepth 1 -type f -name '*.npz' -printf '%f\n' | sort | tail -n 1)"
          [[ -n "$SOURCE_ASSET" && -s "native_input/$SOURCE_ASSET" ]]
          echo "INIT_TIME=$INIT_TIME" >> "$GITHUB_ENV"
          echo "SOURCE_ASSET=$SOURCE_ASSET" >> "$GITHUB_ENV"
          echo "Usando $count frames NPZ nativos de $SOURCE_TAG; PNG terminal=$SOURCE_ASSET; init=$INIT_TIME"

      - name: Render the bulletin from native REFL_10CM-derived data
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/render_tarc_native_reflectivity_bulletin.py
          python tools/render_tarc_native_reflectivity_bulletin.py \
            --input "native_input/$SOURCE_ASSET" \
            --output "$OUTPUT_PNG" \
            --init-time "$INIT_TIME" \
            --source-tag "$SOURCE_TAG"
          test -s "$OUTPUT_PNG"
          test -s "${OUTPUT_PNG%.png}.json"
          python - "$OUTPUT_PNG" <<'PY'
          import sys
          from PIL import Image
          p=sys.argv[1]
          with Image.open(p) as im:
              im.verify()
          with Image.open(p) as im:
              assert im.format == "PNG", im.format
              assert im.width >= 1800 and im.height >= 1100, im.size
              print(f"PNG validated: {im.width}x{im.height}")
          PY

      - name: Render fast MP4 from all available native reflectivity frames
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m py_compile tools/render_tarc_native_reflectivity_mp4.py
          python tools/render_tarc_native_reflectivity_mp4.py \
            --input-dir native_input \
            --output "$OUTPUT_MP4" \
            --init-time "$INIT_TIME" \
            --source-tag "$SOURCE_TAG" \
            --fps 8
          test -s "$OUTPUT_MP4"
          test -s "${OUTPUT_MP4%.mp4}.png"
          test -s "${OUTPUT_MP4%.mp4}.json"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size -of json "$OUTPUT_MP4" > dist/mp4-validation.json
          python - "$OUTPUT_MP4" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          data=json.loads(pathlib.Path('dist/mp4-validation.json').read_text())
          stream=data['streams'][0]
          assert stream['codec_name']=='h264', stream
          assert (stream['width'],stream['height'])==(1280,800), stream
          assert float(data['format']['duration']) > 1, data
          print(f"MP4 validated: {stream['width']}x{stream['height']}, {data['format']['duration']} s, {p.stat().st_size} bytes")
          PY

      - name: Publish bulletin in its own release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$OUTPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$OUTPUT_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$OUTPUT_TAG" \
            "$OUTPUT_PNG" "${OUTPUT_PNG%.png}.json" \
            "$OUTPUT_MP4" "${OUTPUT_MP4%.mp4}.png" "${OUTPUT_MP4%.mp4}.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sideral — Boletim MP4 de Refletividade Nativa TARC 3 km" \
            --notes "MP4 renderizado a partir de todos os NPZ nativos disponíveis no release $SOURCE_TAG no momento da geração. Campo: máximo vertical derivado de REFL_10CM nativa; cada quadro mantém a grade do modelo e o perímetro do domínio. Não representa radar observado." \
            --prerelease --latest=false
          gh release view "$OUTPUT_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets \
            --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'

      - name: Upload MP4 for direct download
        uses: actions/upload-artifact@v4
        with:
          name: tarc-native-reflectivity-mp4
          path: |
            dist/sideral-tarc-3km-refletividade-nativa.mp4
            dist/sideral-tarc-3km-refletividade-nativa.png
            dist/sideral-tarc-3km-refletividade-nativa.json
          if-no-files-found: error
          retention-days: 7
