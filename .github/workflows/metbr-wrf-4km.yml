name: METBR WRF 4 KM - restart continuo

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metbr-wrf-4km
  cancel-in-progress: false

jobs:
  seg00:
    name: METBR WRF 4 KM F000-F004
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 0 4 0 1

  seg01:
    name: METBR WRF 4 KM F004-F008
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg00
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 4 8 1 0

  seg02:
    name: METBR WRF 4 KM F008-F012
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 8 12 2 0

  seg03:
    name: METBR WRF 4 KM F012-F016
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg02
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 12 16 3 0

  seg04:
    name: METBR WRF 4 KM F016-F020
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg03
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 16 20 4 0

  seg05:
    name: METBR WRF 4 KM F020-F024
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 20 24 5 0

  seg06:
    name: METBR WRF 4 KM F024-F028
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg05
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 24 28 6 0

  seg07:
    name: METBR WRF 4 KM F028-F032
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg06
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 28 32 7 0

  seg08:
    name: METBR WRF 4 KM F032-F036
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg07
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 32 36 8 0

  seg09:
    name: METBR WRF 4 KM F036-F040
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg08
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Executar segmento
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 36 40 9 0

  publish:
    name: Publicar METBR WRF 4 KM F000-F040
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg09
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Baixar e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final_wrfouts wrf_work wrf_publish wrf_diagnostics
          mkdir -p final_wrfouts wrf_work/run wrf_publish wrf_diagnostics
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-wrfout-*' --dir final_wrfouts --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr_run.env' --dir . --clobber
          find final_wrfouts -type f -name 'metbr-wrfout-*' | while read -r f; do
            base=$(basename "$f")
            name="${base#metbr-wrfout-}"
            name="${name#*-}"
            cp -f "$f" "wrf_work/run/$name"
          done
          test "$(find wrf_work/run -maxdepth 1 -name 'wrfout_d01_*' | wc -l)" -eq 41
          cp -f metbr_run.env wrf_diagnostics/run.env
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 300 --grid-y 360
          python3 -c 'import json,pathlib; p=pathlib.Path("wrf_publish/metadata.json"); m=json.loads(p.read_text()); fs=[f for f in m.get("frames",[]) if 0 <= int(f.get("forecastHour",-1)) <= 40]; assert len(fs)==41 and [int(f["forecastHour"]) for f in fs]==list(range(41)), "METBR: frames F000-F040 invalidos"; m.update({"model":"metbr","source":"METBR WRF 4 km (REFL_10CM nativo)","resolutionKm":4,"dxMeters":4000,"dyMeters":4000,"nativeGrid":True,"reflectivitySource":"REFL_10CM_NATIVE","frameCount":41,"temporalResolutionMinutes":60}); [f.update({"source":"METBR WRF 4 km (REFL_10CM nativo)","file":str(f["file"]).replace("gfs/","metbr/")}) for f in fs]; m["frames"]=fs; p.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding="utf-8")'
          rm -rf /tmp/metbr-publication
          git clone --depth 1 --branch wrf-runner "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/metbr-publication
          cd /tmp/metbr-publication
          if git ls-remote --exit-code --heads origin metbr-wrf-4km-data >/dev/null 2>&1; then
            git fetch --depth 1 origin metbr-wrf-4km-data
            git checkout -B metbr-wrf-4km-data FETCH_HEAD
          else
            git checkout -B metbr-wrf-4km-data
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'publish: METBR WRF 4 km F000-F040 nativo'
          git push origin metbr-wrf-4km-data
          gh release delete "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
