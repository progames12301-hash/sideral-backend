name: METBR WRF 4 KM - ICON

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: write

env:
  CHECKPOINT_PREFIX: metbr-wrf-4km-checkpoint
  WRF_MPI_PROCS: 8

jobs:
  seg00:
    name: METBR ICON F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Run F000-F003
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 0 3 0 1

  seg01:
    name: METBR ICON F003-F006
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg00
