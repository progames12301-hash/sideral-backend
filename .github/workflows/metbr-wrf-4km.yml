name: METBR WRF 4 KM - ICON 3h restart continuo

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metbr-wrf-4km
  cancel-in-progress: false

jobs:
  seg00:
    name: METBR ICON 4 KM F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: {ref: wrf-runner, fetch-depth: 1}
      - name: Executar segmento
        env: {GH_TOKEN: ${{ github.token }}, CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }} }
        run: bash wrf/run_metbr_checkpoint_segment.sh 0 3 0 1

  seg01:
    name: METBR ICON 4 KM F003-F006
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg00
    steps:
      - uses: actions/checkout@v4
        with: {ref: wrf-runner, fetch-depth: 1}
      - name: Executar segmento
        env: {GH_TOKEN: ${{ github.token }}, CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }} }
        run: bash wrf/run_metbr_checkpoint_segment.sh 3 6 1 0

  seg02:
    name: METBR ICON 4 KM F006-F009
    runs-on: ubuntu-22.04
    timeout-minutes: 355
