        run: bash wrf/run_metbr_checkpoint_segment.sh 36 39 12 0

  seg13:
    name: METBR ICON 4 KM F039-F042
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg12
    steps:
      - uses: actions/checkout@v4
        with: {ref: wrf-runner, fetch-depth: 1}
      - name: Executar segmento
        env: {GH_TOKEN: ${{ github.token }}, CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }} }
        run: bash wrf/run_metbr_checkpoint_segment.sh 39 42 13 0

  publish:
    name: Publicar METBR WRF 4 KM F000-F040
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg13
    steps:
      - uses: actions/checkout@v4
        with: {ref: wrf-runner, fetch-depth: 1}
      - name: Baixar e publicar
        env: {GH_TOKEN: ${{ github.token }}, CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }} }
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final_wrfouts wrf_work wrf_publish wrf_diagnostics
          mkdir -p final_wrfouts wrf_work/run wrf_publish wrf_diagnostics
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-wrfout-*' --dir final_wrfouts --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-run.env' --dir . --clobber
          find final_wrfouts -type f -name 'metbr-wrfout-*' | while read -r f; do
            base=$(basename "$f")
            name="${base#metbr-wrfout-}"
            name="${name#*-}"
            cp -f "$f" "wrf_work/run/$name"
          done
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env metbr-run.env --output-dir wrf_publish --grid-x 300 --grid-y 360
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('wrf_publish/metadata.json')
          m=json.loads(p.read_text())
          frames=[f for f in m.get('frames',[]) if 0 <= int(f.get('forecastHour',-1)) <= 40]
          hours=[int(f['forecastHour']) for f in frames]
          assert hours == list(range(41)), f'METBR: frames invalidos: {hours}'
          keep={str(f.get('file','')) for f in frames}
          for f in list(m.get('frames',[])):
              if int(f.get('forecastHour',-1)) > 40:
                  q=pathlib.Path('wrf_publish')/str(f.get('file',''))
                  if q.is_file(): q.unlink()
          m.update({'model':'metbr','source':'METBR WRF 4 km (ICON / REFL_10CM nativo)','resolutionKm':4,'dxMeters':4000,'dyMeters':4000,'nativeGrid':True,'reflectivitySource':'REFL_10CM_NATIVE','frameCount':41,'temporalResolutionMinutes':60})
          for f in frames:
              f['source']='METBR WRF 4 km (ICON / REFL_10CM nativo)'
              f['file']=str(f['file']).replace('gfs/','metbr/')
          m['frames']=frames
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          rm -rf /tmp/metbr-publication
          git clone --depth 1 --branch wrf-runner "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/metbr-publication
          cd /tmp/metbr-publication
          if git ls-remote --exit-code --heads origin metbr-wrf-4km-data >/dev/null 2>&1; then git fetch --depth 1 origin metbr-wrf-4km-data && git checkout -B metbr-wrf-4km-data FETCH_HEAD; else git checkout -B metbr-wrf-4km-data; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'publish: METBR WRF 4 km ICON F000-F040'
          git push origin metbr-wrf-4km-data
          gh release delete "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
