          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-restart-*' --dir metbr_restart_input --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-boundary-*' --dir metbr_restart_input --clobber
          for f in metbr_restart_input/metbr-boundary-*; do cp -f "$f" metbr_restart_input/wrfbdy_d01; break; done
          for f in metbr_restart_input/metbr-restart-*; do cp -f "$f" "metbr_restart_input/$(basename "$f" | sed -E 's/^metbr-restart-[0-9]{3}-//')"; done
          source metbr_run.env
