      - name: Executar segmento
        env: {GH_TOKEN: ${{ github.token }}, CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }} }
        run: bash wrf/run_metbr_checkpoint_segment.sh 15 18 5 0

  seg06:
    name: METBR ICON 4 KM F018-F021
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg05
    steps:
      - uses: actions/checkout@v4
        with: {ref: wrf-runner, fetch-depth: 1}
      - name: Executar segmento
