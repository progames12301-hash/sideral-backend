  publish:
    name: Publicar METBR WRF 4 KM F000-F040
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg09
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Baixar saidas
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final_wrfouts wrf_work
          mkdir -p final_wrfouts wrf_work/run
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-wrfout-*' --dir final_wrfouts --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr_run.env' --dir . --clobber
          find final_wrfouts -type f -name 'metbr-wrfout-*' | while read -r f; do
            base=$(basename "$f")
            name="${base#metbr-wrfout-}"
            name="${name#*-}"
            cp -f "$f" "wrf_work/run/$name"
          done
          test "$(find wrf_work/run -maxdepth 1 -name 'wrfout_d01_*' | wc -l)" -eq 41
      - name: Extrair e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wrf_publish wrf_diagnostics
          mkdir -p wrf_publish wrf_diagnostics
          cp -f metbr_run.env wrf_diagnostics/run.env
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 300 --grid-y 360
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('wrf_publish/metadata.json')
          m=json.loads(p.read_text())
          frames=[f for f in m.get('frames',[]) if 0 <= int(f.get('forecastHour',-1)) <= 40]
          if len(frames) != 41 or [int(f['forecastHour']) for f in frames] != list(range(41)):
              raise SystemExit('METBR: frames F000-F040 invalidos')
          m.update({'model':'metbr','source':'METBR WRF 4 km (REFL_10CM nativo)','resolutionKm':4,'dxMeters':4000,'dyMeters':4000,'nativeGrid':True,'reflectivitySource':'REFL_10CM_NATIVE','frameCount':41,'temporalResolutionMinutes':60})
          for f in frames:
              if int(f.get('gridX',0)) != 300 or int(f.get('gridY',0)) != 360:
                  raise SystemExit('METBR: grade publicada diferente de 300x360')
              f['file']=str(f['file']).replace('gfs/','metbr/')
              f['source']='METBR WRF 4 km (REFL_10CM nativo)'
          m['frames']=frames
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          for f in frames:
              if not (Path('wrf_publish')/f['file']).is_file():
