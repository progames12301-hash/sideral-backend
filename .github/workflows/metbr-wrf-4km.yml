          gh release upload "$CHECKPOINT_TAG" metbr_run.env --repo "$GITHUB_REPOSITORY" --clobber
          for f in wrf_work/run/wrfrst_d01_*; do cp "$f" "metbr-restart-036-$(basename "$f")"; done
          cp wrf_work/run/wrfbdy_d01 metbr-boundary-036
          gh release upload "$CHECKPOINT_TAG" metbr-restart-036-* metbr-boundary-036 --repo "$GITHUB_REPOSITORY"
          for old in $(gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E '^metbr-(restart|boundary)-' | grep -vE '^metbr-restart-036-|^metbr-boundary-036$' || true); do gh release delete-asset "$CHECKPOINT_TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes || true; done
          for f in wrf_work/run/wrfout_d01_*; do cp "$f" "metbr-wrfout-08-$(basename "$f")"; done
          gh release upload "$CHECKPOINT_TAG" metbr-wrfout-08-* --repo "$GITHUB_REPOSITORY"

  seg09:
    name: METBR WRF 4 KM F036-F040
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg08
    steps:
      - uses: actions/checkout@v4
        with: {ref: wrf-runner, fetch-depth: 1}
      - name: Executar segmento
        env: {GH_TOKEN: ${{ github.token }}, CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf metbr_restart_input && mkdir -p metbr_restart_input
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" -p 'metbr_run.env' -D . --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" -p 'metbr-restart-*' -D metbr_restart_input --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" -p 'metbr-boundary-*' -D metbr_restart_input --clobber
          cp metbr_restart_input/metbr-boundary-* metbr_restart_input/wrfbdy_d01
          for f in metbr_restart_input/metbr-restart-*; do b=$(basename "$f"); n=$(printf '%s' "$b" | sed -E 's/^metbr-restart-[0-9]{3}-//'); cp "$f" "metbr_restart_input/$n"; done
          source metbr_run.env
          export FORCE_RUN_DATE="$RUN_DATE" FORCE_RUN_CYCLE="$RUN_CYCLE" WRF_START_HOUR=36 WRF_END_HOUR=40 METBR_COLD_START=0
          chmod +x wrf/run_metbr_gfs_segment.sh && wrf/run_metbr_gfs_segment.sh
          gh release upload "$CHECKPOINT_TAG" metbr_run.env --repo "$GITHUB_REPOSITORY" --clobber
          for f in wrf_work/run/wrfrst_d01_*; do cp "$f" "metbr-restart-040-$(basename "$f")"; done
          cp wrf_work/run/wrfbdy_d01 metbr-boundary-040
          gh release upload "$CHECKPOINT_TAG" metbr-restart-040-* metbr-boundary-040 --repo "$GITHUB_REPOSITORY"
          for old in $(gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E '^metbr-(restart|boundary)-' | grep -vE '^metbr-restart-040-|^metbr-boundary-040$' || true); do gh release delete-asset "$CHECKPOINT_TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes || true; done
          for f in wrf_work/run/wrfout_d01_*; do cp "$f" "metbr-wrfout-09-$(basename "$f")"; done
          gh release upload "$CHECKPOINT_TAG" metbr-wrfout-09-* --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publicar METBR WRF 4 KM F000-F040
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg09
    steps:
      - name: Checkout wrf-runner
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1

      - name: Baixar todos os wrfout
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final_wrfouts wrf_work
          mkdir -p final_wrfouts wrf_work/run
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-wrfout-*' --dir final_wrfouts --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr_run.env' --dir . --clobber
          test -s metbr_run.env
          find final_wrfouts -type f -name 'metbr-wrfout-*' | while read -r f; do
            base=$(basename "$f")
            name="${base#metbr-wrfout-}"
            name="${name#*-}"
            cp -f "$f" "wrf_work/run/$name"
          done
          count=$(find wrf_work/run -maxdepth 1 -name 'wrfout_d01_*' | wc -l)
          test "$count" -eq 41
          ls -lh wrf_work/run/wrfout_d01_* | head

      - name: Extrair JSON nativo METBR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wrf_publish wrf_diagnostics
          mkdir -p wrf_publish wrf_diagnostics
          cp -f metbr_run.env wrf_diagnostics/run.env
          python wrf/extract_wrf_json.py \
            --run-dir wrf_work/run \
            --run-env wrf_diagnostics/run.env \
            --output-dir wrf_publish \
            --grid-x 300 \
            --grid-y 360

      - name: Identificar payloads como METBR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, shutil
          from pathlib import Path
          root=Path('wrf_publish')
          src=root/'gfs'
          dst=root/'metbr'
          if src.exists():
              dst.mkdir(parents=True, exist_ok=True)
              for path in sorted(src.glob('f*.json.gz')):
                  with gzip.open(path,'rt',encoding='utf-8') as fh:
                      payload=json.load(fh)
                  payload['model']='metbr'
                  payload['source']='METBR WRF 4 km (REFL_10CM nativo)'
                  out=dst/path.name
                  with gzip.open(out,'wt',encoding='utf-8') as fh:
                      json.dump(payload,fh,ensure_ascii=False,separators=(',',':'),allow_nan=False)
              shutil.rmtree(src)
          for tree in ('soundings','severe'):
              s=root/tree/'gfs'
              if s.exists():
                  d=root/tree/'metbr'
                  s.rename(d)
          PY

      - name: Corrigir metadados e validar F000-F040
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('wrf_publish/metadata.json')
          m=json.loads(p.read_text())
          frames=[f for f in m.get('frames',[]) if 0 <= int(f.get('forecastHour',-1)) <= 40]
          if len(frames) != 41:
              raise SystemExit(f'Esperados 41 frames F000-F040, recebidos {len(frames)}')
          for f in frames:
              if int(f.get('gridX',0)) != 300 or int(f.get('gridY',0)) != 360:
                  raise SystemExit(f'Grade publicada nao e nativa 300x360: {f}')
          if [int(f['forecastHour']) for f in frames] != list(range(41)):
              raise SystemExit('Forecast hours nao sao F000-F040 continuos')
          m['model']='metbr'
          m['source']='METBR WRF 4 km (REFL_10CM nativo)'
          m['resolutionKm']=4
          m['dxMeters']=4000
          m['dyMeters']=4000
          m['nativeGrid']=True
          m['reflectivitySource']='REFL_10CM_NATIVE'
          m['frameCount']=41
          m['temporalResolutionMinutes']=60
          for f in frames:
              f['file']=str(f['file']).replace('gfs/','metbr/')
              if 'soundingFile' in f:
                  f['soundingFile']=str(f['soundingFile']).replace('/gfs/','/metbr/')
              if 'severeFile' in f:
                  f['severeFile']=str(f['severeFile']).replace('/gfs/','/metbr/')
              f['source']='METBR WRF 4 km (REFL_10CM nativo)'
          m['frames']=frames
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          for f in frames:
              q=Path('wrf_publish')/f['file']
              if not q.is_file():
                  raise SystemExit(f'Arquivo ausente: {q}')
          print('METBR VALIDADO: 4 km, REFL_10CM_NATIVE, 41 frames F000-F040, grade 300x360, 60 min.')
          PY

      - name: Publicar branch metbr-wrf-4km-data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/metbr-publication
          git clone --depth 1 --branch wrf-runner "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/metbr-publication
          cd /tmp/metbr-publication
          if git ls-remote --exit-code --heads origin metbr-wrf-4km-data >/dev/null 2>&1; then
            git fetch --depth 1 origin metbr-wrf-4km-data
            git checkout -B metbr-wrf-4km-data FETCH_HEAD
          else
            git checkout -B metbr-wrf-4km-data
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'publish: METBR WRF 4 km F000-F040 nativo' || true
          git push origin metbr-wrf-4km-data

      - name: Remover checkpoint temporario
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: gh release delete "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
