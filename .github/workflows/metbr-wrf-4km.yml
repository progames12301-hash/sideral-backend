name: METBR WRF 4 KM - restart continuo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metbr-wrf-4km
  cancel-in-progress: false

jobs:
  seg00:
    name: METBR WRF 4 KM F000-F004
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout wrf-runner
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1

      - name: Preparar checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf metbr_restart_input
          mkdir -p metbr_restart_input
          now=$(date -u +%s)
          selected=''
          for offset in $(seq 0 6 96); do
            ts=$((now-offset*3600))
            date=$(date -u -d "@$ts" +%Y%m%d)
            cycle=$(date -u -d "@$ts" +%H)
            case "$cycle" in 00|06|12|18) ;; *) continue;; esac
            url="https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.${date}/${cycle}/atmos/gfs.t${cycle}z.pgrb2.0p25.f006"
            if curl -fsSL --range 0-0 --connect-timeout 15 --max-time 45 -o /dev/null "$url"; then selected="$date $cycle"; break; fi
          done
          test -n "$selected"
          read -r RUN_DATE RUN_CYCLE <<< "$selected"
          printf 'RUN_DATE=%s\nRUN_CYCLE=%s\n' "$RUN_DATE" "$RUN_CYCLE" > metbr_run.env
          gh release create "$CHECKPOINT_TAG" --target wrf-runner --prerelease --latest=false --notes "METBR WRF 4 KM checkpoint for Actions run ${{ github.run_id }}"
          gh release upload "$CHECKPOINT_TAG" metbr_run.env --repo "$GITHUB_REPOSITORY"

      - name: Executar segmento
        shell: bash
        run: |
          set -euo pipefail
          source metbr_run.env
          export FORCE_RUN_DATE="$RUN_DATE" FORCE_RUN_CYCLE="$RUN_CYCLE"
          export WRF_START_HOUR=0 WRF_END_HOUR=4 METBR_COLD_START=1
          chmod +x wrf/run_metbr_gfs_segment.sh
          wrf/run_metbr_gfs_segment.sh

      - name: Publicar checkpoint e wrfout
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$CHECKPOINT_TAG" metbr_run.env --repo "$GITHUB_REPOSITORY" --clobber
          for f in wrf_work/run/wrfrst_d01_*; do cp -f "$f" "metbr-restart-004-$(basename "$f")"; done
          cp -f wrf_work/run/wrfbdy_d01 metbr-boundary-004
          gh release upload "$CHECKPOINT_TAG" metbr-restart-004-* metbr-boundary-004 --repo "$GITHUB_REPOSITORY"
          for old in $(gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E '^metbr-(restart|boundary)-' | grep -vE '^metbr-restart-004-|^metbr-boundary-004$' || true); do gh release delete-asset "$CHECKPOINT_TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes || true; done
          for f in wrf_work/run/wrfout_d01_*; do cp -f "$f" "metbr-wrfout-00-$(basename "$f")"; done
          gh release upload "$CHECKPOINT_TAG" metbr-wrfout-00-* --repo "$GITHUB_REPOSITORY"

      - name: Diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metbr-segment-00-diagnostics-${{ github.run_id }}
          path: wrf_diagnostics/**
          retention-days: 3
          if-no-files-found: ignore

  seg01:
    name: METBR WRF 4 KM F004-F008
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    needs: seg00
    steps:
      - name: Checkout wrf-runner
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 1
      - name: Preparar checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf metbr_restart_input && mkdir -p metbr_restart_input
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr_run.env' --dir . --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-restart-*' --dir metbr_restart_input --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-boundary-*' --dir metbr_restart_input --clobber
          for f in metbr_restart_input/metbr-boundary-*; do cp -f "$f" metbr_restart_input/wrfbdy_d01; break; done
          for f in metbr_restart_input/metbr-restart-*; do b=$(basename "$f"); name=$(printf '%s' "$b" | sed -E 's/^metbr-restart-[0-9]{3}-//'); cp -f "$f" "metbr_restart_input/$name"; done
          test -f metbr_restart_input/wrfbdy_d01
          compgen -G 'metbr_restart_input/wrfrst_d01_*' > /dev/null
      - name: Executar segmento
        shell: bash
        run: |
          set -euo pipefail
          source metbr_run.env
          export FORCE_RUN_DATE="$RUN_DATE" FORCE_RUN_CYCLE="$RUN_CYCLE"
          export WRF_START_HOUR=4 WRF_END_HOUR=8 METBR_COLD_START=0
          chmod +x wrf/run_metbr_gfs_segment.sh
          wrf/run_metbr_gfs_segment.sh
      - name: Publicar checkpoint e wrfout
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: metbr-wrf-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$CHECKPOINT_TAG" metbr_run.env --repo "$GITHUB_REPOSITORY" --clobber
          for f in wrf_work/run/wrfrst_d01_*; do cp -f "$f" "metbr-restart-008-$(basename "$f")"; done
          cp -f wrf_work/run/wrfbdy_d01 metbr-boundary-008
          gh release upload "$CHECKPOINT_TAG" metbr-restart-008-* metbr-boundary-008 --repo "$GITHUB_REPOSITORY"
          for old in $(gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E '^metbr-(restart|boundary)-' | grep -vE '^metbr-restart-008-|^metbr-boundary-008$' || true); do gh release delete-asset "$CHECKPOINT_TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes || true; done
          for f in wrf_work/run/wrfout_d01_*; do cp -f "$f" "metbr-wrfout-01-$(basename "$f")"; done
          gh release upload "$CHECKPOINT_TAG" metbr-wrfout-01-* --repo "$GITHUB_REPOSITORY"
      - name: Diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metbr-segment-01-diagnostics-${{ github.run_id }}
          path: wrf_diagnostics/**
          retention-days: 3
