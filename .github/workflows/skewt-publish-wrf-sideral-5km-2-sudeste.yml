name: Publish Skew-T — WRF SIDERAL 5 km 2 Sudeste

on:
  workflow_run:
    workflows: ["WRF SIDERAL 5 KM 2 Sudeste — ICON"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ID da execução concluída do modelo WRF de origem
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: skewt-publish-wrf-sideral-5km-2-sudeste-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/skewt-wrf-publish-reusable.yml
    permissions:
      contents: write
      actions: read
    with:
      source-run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      expected-source-workflow: "WRF SIDERAL 5 KM 2 Sudeste — ICON"
      model-key: "wrf-sideral-5km-2-sudeste"
      model-label: "WRF SIDERAL 5 km 2 Sudeste"
      resolution-km: "5"
      source-mode: checkpoint
      checkpoint-prefix: "sideral-wrf-5km-2-sudeste-checkpoint-"
      asset-prefix: "tarc-wrfout-"
      require-metbr-marker: false
