name: Sideral — Diagnóstico meteoblue Forecast API NEMS10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skewt-nems10-forecast-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar pacote de perfil no domínio NEMSSA
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          key = os.environ.get("METEOBLUE_API_KEY", "").strip()
          if not key:
              raise SystemExit("METEOBLUE_API_KEY está vazio no runner.")
          params = {
              "lat": -23.5505,
              "lon": -46.6333,
              "apikey": key,
              "tz": "UTC",
              "forecastDays": 3,
              "domain": "NEMSSA",
              "raw": "true",
              "format": "json",
          }
          url = "https://my.meteoblue.com/packages/profiletemp-1h,profileheight-1h,profilerh-1h,profilewind-1h?" + urlencode(params)
          request = Request(url, headers={"Accept":"application/json","User-Agent":"Sideral-SkewT/1.0"})
          try:
              with urlopen(request, timeout=30) as response:
                  status = response.status
                  raw = response.read().decode("utf-8", "replace")
          except HTTPError as exc:
              status = exc.code
              raw = exc.read().decode("utf-8", "replace")
          except (URLError, TimeoutError) as exc:
              raise SystemExit(f"Erro de rede no Forecast API: {type(exc).__name__}: {exc}")
          print(f"HTTP_STATUS={status}")
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              print("BODY_NON_JSON=" + raw[:600].replace(key, "[redacted]"))
              raise SystemExit(1)
          if status != 200:
              if isinstance(payload, dict):
                  payload.pop("apikey", None)
                  payload.pop("apiKey", None)
              print("BODY=" + json.dumps(payload, ensure_ascii=False)[:1500].replace(key, "[redacted]"))
              raise SystemExit(1)
          print("TOP_LEVEL_KEYS=" + ",".join(sorted(payload.keys()) if isinstance(payload, dict) else [type(payload).__name__]))
          if isinstance(payload, dict):
              print("DATA_KEYS=" + ",".join(sorted(k for k in payload if k.startswith("data_"))))
              for k, v in payload.items():
                  if k.startswith("data_") and isinstance(v, dict):
                      print(f"{k}_SAMPLE_KEYS=" + ",".join(list(v.keys())[:20]))
                      break
          print("Forecast API profile package access and NEMSSA domain succeeded.")
          PY
