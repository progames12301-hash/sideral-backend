name: WRF TARC 3 KM - ICON

on:
  workflow_dispatch:
  schedule:
    - cron: '45 7 * * *'

permissions:
  contents: write
  actions: read

env:
  TARC_CHECKPOINT_PREFIX: tarc-wrf-3km-checkpoint
  WRF_MPI_PROCS: 4
  WRF_TARGET_RESOLUTION_KM: 3
  WRF_DX_METERS: 3000
  WRF_DY_METERS: 3000
  WRF_E_WE: 361
  WRF_E_SN: 445
  WRF_TIME_STEP: 18
  WRF_HISTORY_INTERVAL_MINUTES: 60
  WRF_REF_LAT: -28.0
  WRF_REF_LON: -53.5
  WRF_STAND_LON: -53.5

jobs:
  seg00:
    name: TARC ICON F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 478
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Pré-validar scripts Bash e ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find wrf -maxdepth 1 -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          if grep -nIl $'\r' "${scripts[@]}"; then
            echo "ERRO: existe CRLF em script wrf/*.sh; converta para LF." >&2
            exit 1
          fi
          for f in "${scripts[@]}"; do
            test -x "$f" || { echo "ERRO: script não executável: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
      - name: Executar F000-F003
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: tarc-wrf-3km-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 0 3 0 1
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarc-diagnostics-seg00
          path: |
            tarc_diagnostics/
            tarc_segment_output/rsl.*
          if-no-files-found: ignore
          retention-days: 7

