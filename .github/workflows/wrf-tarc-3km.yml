          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 24 30 4 0

  seg05:
    name: TARC ICON F030-F036
    runs-on: ubuntu-22.04
    needs: seg04
    timeout-minutes: 355
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Executar F030-F036
        env:
          GH_TOKEN: ${{ github.token }}
