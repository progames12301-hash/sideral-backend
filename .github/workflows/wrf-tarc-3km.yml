          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 36 42 6 0

  seg07:
    name: TARC ICON F042-F048
    runs-on: ubuntu-22.04
    needs: seg06
    timeout-minutes: 355
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Executar F042-F048
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: tarc-wrf-3km-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 42 48 7 0

  complete:
    name: TARC 3 KM F000-F048 completo e pós-processado
    runs-on: ubuntu-22.04
    needs: [seg00, seg01, seg02, seg03, seg04, seg05, seg06, seg07]
    timeout-minutes: 45
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Baixar WRFOUT da rodada completa
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: tarc-wrf-3km-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf tarc_all_wrfout tarc_products
          mkdir -p tarc_all_wrfout
          gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'wrfout_d01_*' --dir tarc_all_wrfout --clobber
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'tarc-run.env' --dir . --clobber
          test -n "$(find tarc_all_wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print -quit)"
          echo "WRFOUT completos encontrados:"
          find tarc_all_wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print | sort
      - name: Instalar dependências de pós-processamento
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027'
      - name: Gerar produtos TARC
        run: |
          python wrf/tarc_postprocess.py tarc_all_wrfout/wrfout_d01_* --output-dir tarc_products
          test -s tarc_products/metadata.json
          test -n "$(find tarc_products -type f -name '*.npz' -size +0c -print -quit)"
          cp -f wrf/tarc_variable_catalog.json tarc_products/variable_catalog.json
      - name: Validar produtos
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path('tarc_products/metadata.json').read_text(encoding='utf-8'))
          assert m['model']=='WRF TARC 3 KM'
          assert m['resolutionKm']==3
          assert m['nativeReflectivity']=='REFL_10CM'
          assert m['domain']['e_we']==361 and m['domain']['e_sn']==445
          assert m['frames'], 'Nenhum frame TARC produzido'
          print('TARC produtos:', len(m['frames']), 'frames')
          print('Variáveis compactas:', sorted(set(v for f in m['frames'] for v in f['variables'])))
          PY
      - name: Publicar produtos no Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: tarc-wrf-3km-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          tar -czf tarc-products-3km.tar.gz -C tarc_products .
          test -s tarc-products-3km.tar.gz
          gh release upload "$CHECKPOINT_TAG" tarc-products-3km.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$CHECKPOINT_TAG" wrf/tarc_variable_catalog.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "TARC 3 KM: pós-processamento publicado."