name: WRF TARC 3 KM - ICON



on:

  workflow_dispatch:

  schedule:

    - cron: '45 7 * * *'



permissions:

  contents: write

  actions: read



env:

  TARC_CHECKPOINT_PREFIX: tarc-wrf-3km-checkpoint

  WRF_MPI_PROCS: 4

  WRF_TARGET_RESOLUTION_KM: 3

  WRF_DX_METERS: 3000

  WRF_DY_METERS: 3000

  WRF_E_WE: 361

  WRF_E_SN: 445

  WRF_TIME_STEP: 18

  WRF_HISTORY_INTERVAL_MINUTES: 60

  WRF_REF_LAT: -28.0

  WRF_REF_LON: -53.5

  WRF_STAND_LON: -53.5



jobs:

  seg00:
    name: TARC ICON F000-F006
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Executar F000-F006
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: tarc-wrf-3km-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 0 6 0 1

  seg01:
    name: TARC ICON F006-F012
    runs-on: ubuntu-22.04
    needs: seg00
    timeout-minutes: 355
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Executar F006-F012
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: tarc-wrf-3km-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 6 12 1 0

  seg02:
    name: TARC ICON F012-F018
    runs-on: ubuntu-22.04
    needs: seg01
    timeout-minutes: 355
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Executar F012-F018
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: tarc-wrf-3km-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 12 18 2 0

  seg03:
    name: TARC ICON F018-F024
    runs-on: ubuntu-22.04
    needs: seg02
    timeout-minutes: 355
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Executar F018-F024
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: tarc-wrf-3km-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 18 24 3 0

  seg04:
    name: TARC ICON F024-F030
    runs-on: ubuntu-22.04
    needs: seg03
    timeout-minutes: 355
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Executar F024-F030
        env:
          GH_TOKEN: ${{ github.token }}
