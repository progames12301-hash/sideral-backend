          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 30 36 5 0

  seg06:
    name: TARC ICON F036-F042
    runs-on: ubuntu-22.04
    needs: seg05
    timeout-minutes: 355
    steps:
      - name: Checkout TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1
      - name: Executar F036-F042
        env:
          GH_TOKEN: ${{ github.token }}
