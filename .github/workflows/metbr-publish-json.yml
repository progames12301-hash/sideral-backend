name: METBR WRF 4 KM - Legacy publisher disabled

# This legacy publisher used a different JSON contract and could overwrite
# metbr-json-data with a payload without grid.json or per-hour GZIP frames.
# The canonical publisher is .github/workflows/metbr-json-temporary.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-22.04
    steps:
      - name: Explain canonical publisher
        run: echo "Legacy publisher disabled. Use .github/workflows/metbr-json-temporary.yml; it publishes metadata.json, grid.json and frames/fNNN.json.gz from the METBR WRFOUTs."
