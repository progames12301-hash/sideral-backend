name: METBR WRF 4 KM - Legacy publisher disabled

# This legacy publisher used a different JSON contract and could overwrite
# metbr-json-data with a payload without grid.json or per-hour GZIP frames.
# The canonical publisher is .github/workflows/metbr-maestro.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: false  # Desativado: não alocar runner para este fluxo obsoleto.
    runs-on: ubuntu-22.04
    steps:
      - name: Explain canonical publisher
        run: echo "Legacy publisher disabled. Use .github/workflows/metbr-maestro.yml; it publishes metadata.json, grid.json, vertical-f000.npz and frames/fNNN.json.gz from the native METBR WRFOUTs."
