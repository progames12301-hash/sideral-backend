name: WRF Sudeste ICON ECMWF paralelo - HORARIO 48H

on:
  workflow_call:
    inputs:
      model:
        required: true
        type: string
      source_data_branch:
        required: true
        type: string
      publish_branch:
        required: true
        type: string
      run_script:
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  WRF_HISTORY_INTERVAL_MINUTES: '60'
  WRF_TARGET_HOURS: '48'

jobs:
  run-info:
    runs-on: ubuntu-22.04
    outputs:
      run_date: ${{ steps.info.outputs.run_date }}
      run_cycle: ${{ steps.info.outputs.run_cycle }}
      init_time: ${{ steps.info.outputs.init_time }}
    steps:
      - name: Validar rodada fonte
        id: info
        env:
          SOURCE_BRANCH: ${{ inputs.source_data_branch }}
          EXPECTED_MODEL: ${{ inputs.model }}
          REPOSITORY: ${{ github.repository }}
          CACHE_BUSTER: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request
          from zoneinfo import ZoneInfo
          url=(f"https://raw.githubusercontent.com/{os.environ['REPOSITORY']}/{os.environ['SOURCE_BRANCH']}/metadata.json?run={os.environ['CACHE_BUSTER']}")
          req=urllib.request.Request(url, headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(req, timeout=30) as r: meta=json.load(r)
          expected=os.environ['EXPECTED_MODEL'].lower()
          if str(meta.get('model')).lower()!=expected: raise SystemExit(f"Modelo fonte incorreto: {meta.get('model')}")
          tomorrow=dt.datetime.now(ZoneInfo('America/Sao_Paulo')).date()+dt.timedelta(days=1)
          forecast=dt.date.fromisoformat(meta['forecastLocalDate'])
          if forecast < tomorrow: raise SystemExit(f"Rodada desatualizada: {forecast}; esperado {tomorrow}")
          date=str(meta['runDate']).replace('-','')
          cycle=''.join(c for c in str(meta['runCycle']) if c.isdigit()).zfill(2)[:2]
          if len(date)!=8 or cycle not in {'00','06','12','18'}: raise SystemExit(f"Rodada invalida: {date} {cycle}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
              o.write(f'run_date={date}\nrun_cycle={cycle}\ninit_time={meta["initTime"]}\n')
          print(f'{expected.upper()} selecionado: {meta["initTime"]}; publicacao horaria por 48 h')
          PY

  segments:
    name: ${{ inputs.model }} WRF Sudeste F${{ matrix.start }}-F${{ matrix.end }} horario
    needs: run-info
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {id: '000-009', start: 0, spinup_start: 0, end: 9}
          - {id: '009-018', start: 9, spinup_start: 3, end: 18}
          - {id: '018-027', start: 18, spinup_start: 12, end: 27}
          - {id: '027-036', start: 27, spinup_start: 21, end: 36}
          - {id: '036-045', start: 36, spinup_start: 30, end: 45}
          - {id: '045-054', start: 45, spinup_start: 39, end: 54}
          - {id: '054-063', start: 54, spinup_start: 48, end: 63}
          - {id: '063-072', start: 63, spinup_start: 57, end: 72}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - name: Preparar runner
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          docker pull dtcenter/wps_wrf:latest
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests numpy xarray netCDF4 ecmwf-opendata
      - name: Executar segmento WRF com spin-up
        env:
          FORCE_RUN_DATE: ${{ needs.run-info.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.run-info.outputs.run_cycle }}
          WRF_START_HOUR: ${{ matrix.spinup_start }}
          WRF_END_HOUR: ${{ matrix.end }}
          WRF_RUN_HOURS: ${{ matrix.end }}
          WRF_NOMINAL_START_HOUR: ${{ matrix.start }}
          WRF_SPINUP_HOURS: '6'
          WRF_HISTORY_INTERVAL_MINUTES: '60'
          SOURCE_MODEL: ${{ inputs.model }}
          RUN_SCRIPT: ${{ inputs.run_script }}
        run: |
          set -euo pipefail
          chmod +x "wrf/$RUN_SCRIPT" wrf/run_wrf_with_source.sh
          "wrf/$RUN_SCRIPT"
      - name: Extrair REFL nativo
        env:
          SOURCE_MODEL: ${{ inputs.model }}
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 220 --grid-y 180
          python wrf/retag_wrf_model.py --root wrf_publish --model "$SOURCE_MODEL"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model }}-frames-${{ matrix.id }}
          path: wrf_publish/
          retention-days: 1
          if-no-files-found: error
      - name: Extrair diagnosticos WRF2
        if: always()
        continue-on-error: true
        env:
          SOURCE_MODEL: ${{ inputs.model }}
          SEGMENT_START: ${{ matrix.start }}
          SEGMENT_END: ${{ matrix.end }}
        run: |
          rm -rf wrf2_publish
          python wrf/extract_wrf_severe.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf2_publish --grid-x 220 --grid-y 180 --model "$SOURCE_MODEL" --interval-hours 3 --expected-start "$SEGMENT_START" --expected-end "$SEGMENT_END"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ${{ inputs.model }}-severe-${{ matrix.id }}
          path: wrf2_publish/
          retention-days: 1
          if-no-files-found: warn
      - name: Diagnosticos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model }}-diagnostics-${{ matrix.id }}
          path: wrf_diagnostics/
          retention-days: 3
          if-no-files-found: warn

  publish:
    name: Publicar ${{ inputs.model }} WRF Sudeste 48H horario
    needs: [run-info, segments]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.model }}-frames-*
          path: segments
      - name: Unir e validar 48 horas horarias
        env:
          SOURCE_MODEL: ${{ inputs.model }}
          EXPECTED_INIT: ${{ needs.run-info.outputs.init_time }}
        run: |
          set -euo pipefail
          mapfile -t roots < <(find segments -type f -name metadata.json -printf '%h\n' | sort)
          test "${#roots[@]}" -eq 8
          args=(); for root in "${roots[@]}"; do args+=(--input "$root"); done
          python wrf/merge_wrf_segments.py "${args[@]}" --output wrf_publish
          python wrf/retag_wrf_model.py --root wrf_publish --model "$SOURCE_MODEL"
          python wrf/filter_next_day.py --root wrf_publish --days 2 --interval-hours 1
          python3 - <<'PY'
          import json, os
          data=json.load(open('wrf_publish/metadata.json', encoding='utf-8'))
          assert data['model']==os.environ['SOURCE_MODEL'], data
          assert data['initTime']==os.environ['EXPECTED_INIT'], data
          assert data['reflectivitySource']=='REFL_10CM_NATIVE', data
          assert data['frameCount']==48, data
          assert data['temporalResolutionMinutes']==60, data
          assert len(data['forecastLocalDates'])==2, data
          assert data.get('segmentSpinupProtected') is True, data
          frames=sorted(data['frames'], key=lambda f:f['validTime'])
          assert all(int(frames[i+1]['forecastHour'])-int(frames[i]['forecastHour'])==1 for i in range(len(frames)-1)), [f['forecastHour'] for f in frames]
          print('WRF SUDESTE HORARIO VALIDADO:', data['model'], data['initTime'], data['frameCount'], 'frames / 48 h')
          PY
      - name: Publicar branch isolada
        env:
          PUBLISH_BRANCH: ${{ inputs.publish_branch }}
          SOURCE_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="/tmp/wrf-${SOURCE_MODEL}-data"
          rm -rf "$target"
          git worktree add --detach "$target"
          cd "$target"
          git checkout --orphan "wrf-${SOURCE_MODEL}-data-next"
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          printf '# Sideral WRF Sudeste %s Data\nPrevisao de 48 horas com quadros de 1 em 1 hora. REFL_10CM nativo, grade nativa e spin-up protegido.\n' "${SOURCE_MODEL^^}" > README.md
          git add .
          git commit -m "${SOURCE_MODEL^^}-WRF Sudeste publica 48h horario [skip render]"
          git push --force origin "HEAD:$PUBLISH_BRANCH"

  publish-severe:
    continue-on-error: true
    name: Publicar WRF2 severo
    needs: [run-info, segments]
    if: ${{ !cancelled() && needs.run-info.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.model }}-severe-*
          path: severe-segments
      - name: Consolidar WRF2
        env:
          SOURCE_MODEL: ${{ inputs.model }}
        run: |
          set -u
          mapfile -t roots < <(find severe-segments -type f -name metadata.json -printf '%h\n' 2>/dev/null | sort -u)
          args=(); for root in "${roots[@]}"; do args+=(--input "$root"); done
          python wrf/publish_wrf2_severe.py "${args[@]}" --output wrf2_publish --model "$SOURCE_MODEL" --temporal-resolution-minutes 180 || exit 0
          test -s wrf2_publish/metadata.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.model }}-wrf2-severe-published
          path: wrf2_publish/
          retention-days: 3
          if-no-files-found: warn
      - name: Publicar branch WRF2
        if: always()
        env:
          SOURCE_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          test -s wrf2_publish/metadata.json || exit 0
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish_branch="wrf2-${SOURCE_MODEL}-data"
          target="/tmp/${publish_branch}"
          rm -rf "$target"
          git worktree add --detach "$target"
          cd "$target"
          git checkout --orphan "${publish_branch}-next"
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf2_publish/." .
          printf '# Sideral WRF2 Sudeste %s\nDiagnosticos severos independentes; REFL_10CM_NATIVE permanece no produto nativo.\n' "${SOURCE_MODEL^^}" > README.md
          git add .
          git commit -m "${SOURCE_MODEL^^}-WRF2 Sudeste atualiza diagnosticos [skip render]"
          git push --force origin "HEAD:${publish_branch}"
