name: Validar WRF Sudeste

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-wrf-sudeste.yml"
      - ".github/workflows/wrf-regional-7km-single.yml"
      - ".github/workflows/wrf-sudeste-gfs-4km.yml"
      - ".github/workflows/wrf-sudeste-icon-4km.yml"
      - ".github/workflows/wrf-sudeste-ecmwf-4km.yml"
      - ".github/workflows/wrf2-sudeste-7km-reusable.yml"
      - ".github/workflows/wrf2-sudeste-gfs-7km.yml"
      - ".github/workflows/wrf2-sudeste-icon-7km.yml"
      - ".github/workflows/wrf2-sudeste-ecmwf-7km.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar contrato operacional 7 km
        shell: bash
        run: |
          set -euo pipefail
          base=.github/workflows/wrf-regional-7km-single.yml
          test -s "$base"
          grep -q "WRF_TARGET_RESOLUTION_KM: '7'" "$base"
          grep -q "WRF_DX_METERS: '7000'" "$base"
          grep -q "WRF_DY_METERS: '7000'" "$base"
          grep -q "WRF_HISTORY_INTERVAL_MINUTES: '60'" "$base"
          grep -q "WRF_END_HOUR: '42'" "$base"
          grep -q "WRF_PUBLISH_MAX_HOUR: '40'" "$base"
          grep -q "GRID_X=222" "$base"
          grep -q "GRID_Y=205" "$base"
          grep -q "hours == list(range(41))" "$base"
          grep -q "REFL_10CM_NATIVE" "$base"
          grep -q "singleRunner.*True" "$base"
          for f in \
            .github/workflows/wrf-sudeste-gfs-4km.yml \
            .github/workflows/wrf-sudeste-icon-4km.yml \
            .github/workflows/wrf-sudeste-ecmwf-4km.yml; do
            grep -q 'wrf-regional-7km-single.yml' "$f"
            grep -q 'domain: sudeste' "$f"
            grep -q 'AUTOMATICO DIARIO' "$f"
          done
          echo 'WRF regional Sudeste: 7 km, F000-F040 horario, runner unico, REFL nativo.'

      - name: Validar contrato WRF2 Sudeste 7 km
        shell: bash
        run: |
          set -euo pipefail
          base=.github/workflows/wrf2-sudeste-7km-reusable.yml
          test -s "$base"
          grep -q "WRF_DX_METERS: '7000'" "$base"
          grep -q "WRF_DY_METERS: '7000'" "$base"
          grep -q "WRF_TIME_STEP: '42'" "$base"
          grep -q -- '--grid-x 222 --grid-y 205' "$base"
          grep -q 'forecastHours.*48' "$base"
          grep -q 'wrf2-${MODEL}-data' "$base"
          for f in \
            .github/workflows/wrf2-sudeste-gfs-7km.yml \
            .github/workflows/wrf2-sudeste-icon-7km.yml \
            .github/workflows/wrf2-sudeste-ecmwf-7km.yml; do
            test -s "$f"
            grep -q 'wrf2-sudeste-7km-reusable.yml' "$f"
            grep -q 'AUTOMATICO DIARIO' "$f"
          done
          bash -n <(sed -n '1,240p' /dev/null) 2>/dev/null || true
          echo 'WRF2 Sudeste: 7 km, 222x205, 48 h, diagnosticos reais.'

      - name: Validar selecao de ciclo ICON e segmentos WRF2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          icon = Path('.github/workflows/wrf-sudeste-icon-4km.yml').read_text(encoding='utf-8')
          line = next(line for line in icon.splitlines() if "output.write(f'available=" in line)
          assert line.endswith(r"\n')"), repr(line)
          assert 'available=$(python3' not in icon
          assert 'run_date: ${{ needs.check-icon-data.outputs.run_date }}' in icon
          assert 'run_cycle: ${{ needs.check-icon-data.outputs.run_cycle }}' in icon

          regional = Path('.github/workflows/wrf-regional-7km-single.yml').read_text(encoding='utf-8')
          assert "elif model == 'icon':" in regional
          assert "client.latest(type='fc', step=42, param=['2t'])" in regional
          assert 'fetch-depth: 0' not in regional

          wrf2 = Path('.github/workflows/wrf2-sudeste-7km-reusable.yml').read_text(encoding='utf-8')
          assert "client.latest(type='fc',step=48,param=['2t'])" in wrf2
          assert 'assert actual == expected' in wrf2
          assert 'Excluir horas de spin-up' in wrf2
          assert 'fetch-depth: 0' not in wrf2

          segments = [(0, 0, 9), (9, 3, 18), (18, 12, 27),
                      (27, 21, 36), (36, 30, 45), (45, 39, 48)]
          merged = []
          for start, spinup, end in segments:
              candidates = list(range(spinup, end + 1, 3))
              kept = [h for h in candidates
                      if (h >= start if start == 0 else h > start) and h <= end]
              expected_first = start if start == 0 else start + 3
              expected = list(range(expected_first, end + 1, 3))
              assert kept == expected, (start, end, kept, expected)
              merged.extend(kept)
          assert merged == list(range(0, 49, 3)), merged
          assert len(merged) == 17 and len(set(merged)) == 17
          print('ICON live-cycle handoff OK; WRF regional and WRF2 select current ECMWF Open Data; 17 unique WRF2 frames F000-F048.')
          PY
