name: Ligar WRF Data ao Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/link-wrf-data-to-render.yml"
  workflow_run:
    workflows: ["WRF 4 km - REFL NATIVO - USE ESTE"]
    types: [completed]

permissions:
  contents: write

jobs:
  link-backend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirmar dados WRF publicados
        run: |
          set -euxo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-data/metadata.json?link=${GITHUB_RUN_ID}"
          curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 10 --max-time 30 "$URL" -o /tmp/wrf-metadata.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/wrf-metadata.json', encoding='utf-8'))
          assert d.get('schema') == 'sideral-wrf-metadata-v1', d
          assert d.get('frameCount', 0) >= 3, d
          assert d.get('reflectivitySource') == 'REFL_10CM_NATIVE', d
          assert all(x.get('reflectivitySource') == 'REFL_10CM_NATIVE' for x in d.get('frames', [])), d
          print('WRF remoto nativo confirmado:', d.get('initTime'), d.get('frameCount'))
          print('Frames:', [(x.get('forecastHour'), x.get('validTime'), x.get('reflectivityStats')) for x in d.get('frames', [])])
          PY

      - name: Obter patch da branch wrf-runner
        run: |
          set -euxo pipefail
          git fetch origin wrf-runner
          git show origin/wrf-runner:wrf/patch_server_remote.py > /tmp/patch_server_remote.py
          python /tmp/patch_server_remote.py server.py

      - name: Normalizar integração server.py
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('server.py')
          text = path.read_text(encoding='utf-8')

          old = '''    frame_index = min(max(0, int(hours)), len(frames) - 1)\n    frame_meta = frames[frame_index]\n'''
          new = '''    requested_hour = max(0, int(hours))\n    frame_index = min(\n        range(len(frames)),\n        key=lambda index: abs(int(frames[index].get("forecastHour") or 0) - requested_hour),\n    )\n    frame_meta = frames[frame_index]\n'''
          if old in text:
              text = text.replace(old, new, 1)

          text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar server.py
        run: |
          set -euxo pipefail
          python -m py_compile server.py
          grep -q "SIDERAL_WRF_GITHUB_REMOTE_V1" server.py
          grep -q "build_remote_wrf_cells" server.py
          grep -q "requested_hour" server.py
          grep -q "forecastHour" server.py
          git diff --check
          git diff -- server.py | sed -n '1,320p'

      - name: Publicar server.py no main
        run: |
          set -euxo pipefail
          if git diff --quiet -- server.py; then
            echo "server.py ja estava integrado; nada para publicar."
            exit 0
          fi
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "Liga server.py aos dados WRF 4 km nativos do GitHub"
          git push origin main
          echo "server.py validado com REFL_10CM nativo."
