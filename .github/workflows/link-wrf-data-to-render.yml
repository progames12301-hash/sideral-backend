name: Ligar Model Data ao Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/link-wrf-data-to-render.yml"
  workflow_run:
    workflows:
      - "WRF 4 km - REFL NATIVO - USE ESTE"
      - "WRF 4 km - PROXIMO DIA AUTOMATICO"
      - "ICON Global - PROXIMO DIA AUTOMATICO"
      - "ECMWF IFS - PROXIMO DIA AUTOMATICO"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-link-model-data
  cancel-in-progress: false

jobs:
  link-backend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirmar WRF GFS nativo publicado
        run: |
          set -euxo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-data/metadata.json?link=${GITHUB_RUN_ID}"
          curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 10 --max-time 30 "$URL" -o /tmp/wrf-metadata.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/wrf-metadata.json', encoding='utf-8'))
          assert d.get('schema') == 'sideral-wrf-metadata-v1', d
          assert d.get('frameCount', 0) >= 3, d
          assert d.get('reflectivitySource') == 'REFL_10CM_NATIVE', d
          assert all(x.get('reflectivitySource') == 'REFL_10CM_NATIVE' for x in d.get('frames', [])), d
          print('WRF GFS remoto confirmado:', d.get('initTime'), d.get('frameCount'))
          PY

      - name: Aplicar integracao multi-modelo V2
        run: |
          set -euxo pipefail
          git fetch origin wrf-runner
          git show origin/wrf-runner:wrf/patch_server_remote_v2.py > /tmp/patch_server_remote_v2.py
          python /tmp/patch_server_remote_v2.py server.py
          python - <<'PY'
          from pathlib import Path
          path=Path('server.py')
          text='\n'.join(line.rstrip() for line in path.read_text(encoding='utf-8').splitlines())+'\n'
          path.write_text(text,encoding='utf-8')
          PY

      - name: Validar server.py
        run: |
          set -euxo pipefail
          python -m py_compile server.py
          grep -q "SIDERAL_MODEL_GITHUB_REMOTE_V2" server.py
          grep -q "icon-data" server.py
          grep -q "ecmwf-data" server.py
          grep -q "build_remote_wrf_cells" server.py
          grep -q "MODEL_REMOTE_CACHE_SECONDS" server.py
          grep -q 'status_query.get("model"' server.py
          git diff --check
          git diff -- server.py | sed -n '1,420p'

      - name: Publicar server.py no main
        run: |
          set -euxo pipefail
          if git diff --quiet -- server.py; then
            echo "server.py ja usa integracao multi-modelo V2; nada para publicar."
            exit 0
          fi
          git config user.name "sideral-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "Integra backend com GFS ICON e ECMWF automaticos"
          git push origin main
          echo "server.py multi-modelo publicado; Render pode redeployar automaticamente."
