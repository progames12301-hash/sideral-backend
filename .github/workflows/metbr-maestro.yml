name: METBR Maestro - bot diário de publicação

on:
  workflow_run:
    workflows: ["METBR WRF 4 KM - ICON"]
    types: [completed]
  schedule:
    # fallback diário após a janela máxima do WRF METBR
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: metbr-maestro-publication
  cancel-in-progress: false

env:
  TARGET_BRANCH: metbr-json-data
  METBR_WORKFLOW: metbr-wrf-4km.yml

jobs:
  publish:
    name: Detectar, validar e publicar a rodada METBR
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do controlador
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências NetCDF
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'netCDF4>=1.7,<2'

      - name: Instalar GitHub CLI
        run: |
          set -euo pipefail
          gh --version
          gh auth status
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Definir a rodada do evento ou recuperar a última rodada com WRFOUTs
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf discover_tmp
          mkdir -p discover_tmp

          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          event = os.environ['GITHUB_EVENT_NAME']
          event_path = os.environ['GITHUB_EVENT_PATH']

          def gh_json(*args):
              return json.loads(subprocess.check_output(['gh', *args], text=True))

          def parse_run_env(path):
              vals = {}
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if '=' in line:
                      k, v = line.split('=', 1)
                      vals[k.strip()] = v.strip()
              date = re.sub(r'[^0-9]', '', vals.get('RUN_DATE', ''))
              cycle = re.sub(r'[^0-9]', '', vals.get('RUN_CYCLE', ''))
              if len(date) != 8 or cycle not in {'00', '06', '12', '18'}:
                  return None
              return int(date), int(cycle), date, cycle

          def inspect_release(run_id):
              tag = f"metbr-wrf-4km-checkpoint-{run_id}"
              dest = Path('discover_tmp') / str(run_id)
              dest.mkdir(parents=True, exist_ok=True)

              # Não exige metbr-latest-complete.txt. A configuração restaurada
              # do METBR termina em F042 e publica os WRFOUTs diretamente.
              subprocess.run([
                  'gh', 'release', 'download', tag, '--repo', repo,
                  '--pattern', 'metbr-run.env',
                  '--dir', str(dest), '--clobber'
              ], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

              run_env = dest / 'metbr-run.env'
              parsed = parse_run_env(run_env) if run_env.is_file() else None

              subprocess.run([
                  'gh', 'release', 'download', tag, '--repo', repo,
                  '--pattern', 'wrfout_d01_*',
                  '--dir', str(dest), '--clobber'
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

              files = sorted(f for f in dest.glob('wrfout_d01_*') if f.is_file() and f.stat().st_size > 0)
              if not files:
                  return None

              if parsed is None:
                  for file in files:
                      m = re.search(r'wrfout_d01_(\d{4}-\d{2}-\d{2})_(\d{2})[:.]\d{2}[:.]\d{2}', file.name)
                      if m:
                          date = m.group(1).replace('-', '')
                          cycle = m.group(2)
                          parsed = (int(date), int(cycle), date, cycle)
                          break
              if parsed is None:
                  return None

              date, cycle, ds, cs = parsed

              # Confirma o horizonte real pelo timestamp dos WRFOUTs.
              # Com a configuração atual esperamos chegar a F042; versões
              # posteriores que produzam F045/F048 também continuam aceitas.
              max_fh = -1
              init_minutes = cycle * 60
              for file in files:
                  m = re.search(r'wrfout_d01_(\d{4})-(\d{2})-(\d{2})_(\d{2})[:.](\d{2})[:.](\d{2})', file.name)
                  if not m:
                      continue
                  from datetime import datetime, timezone
                  valid = datetime(
                      int(m.group(1)), int(m.group(2)), int(m.group(3)),
                      int(m.group(4)), int(m.group(5)), int(m.group(6)),
                      tzinfo=timezone.utc
                  )
                  init = datetime.strptime(
                      f'{date}{cycle:02d}', '%Y%m%d%H'
                  ).replace(tzinfo=timezone.utc)
                  max_fh = max(max_fh, int(round((valid-init).total_seconds()/3600)))

              if max_fh >= 42:
                  horizon = f'F{max_fh:03d}'
              else:
                  horizon = f'F{max_fh:03d}' if max_fh >= 0 else 'desconhecido'

              return date, cycle, ds, cs, run_id, tag, len(files), max_fh, horizon

          if event == 'workflow_run':
              ev = json.load(open(event_path, encoding='utf-8'))
              wr = ev['workflow_run']
              if wr.get('conclusion') != 'success':
                  raise SystemExit(f"workflow_run não foi concluído com sucesso: {wr.get('conclusion')}")
              run_id = int(wr['id'])
              info = inspect_release(run_id)
              if info is None:
                  raise SystemExit(f'checkpoint METBR sem WRFOUTs válidos no run {run_id}')
              date, cycle, ds, cs, run_id, tag, file_count, max_fh, horizon = info
              # Para o workflow restaurado, F042 é o horizonte esperado.
              if max_fh < 42:
                  raise SystemExit(f'rodada METBR incompleta: horizonte máximo {horizon}; esperado pelo menos F042')
              print(f"RODADA DO EVENTO: {date:08d} {cycle:02d}Z | run_id={run_id} | WRFOUTs={file_count} | horizonte={horizon}")
          else:
              candidates = []
              raw = gh_json('release', 'list', '--repo', repo, '--limit', '50',
                            '--json', 'tagName,createdAt')
              for item in raw:
                  tag = item.get('tagName', '')
                  m = re.fullmatch(r'metbr-wrf-4km-checkpoint-(\d+)', tag)
                  if m:
                      candidates.append((int(m.group(1)), tag))

              best = None
              for rid, tag in sorted(candidates, reverse=True):
                  try:
                      info = inspect_release(rid)
                      if info is None or info[7] < 42:
                          continue
                      key = (info[0], info[1], info[4])
                      if best is None or key > (best[0], best[1], best[4]):
                          best = info
                  except Exception:
                      continue

              if best is None:
                  raise SystemExit('Nenhuma rodada METBR completa até F042 encontrada nos releases')

              date, cycle, ds, cs, run_id, tag, file_count, max_fh, horizon = best
              print(f"RECUPERAÇÃO: {date:08d} {cycle:02d}Z | run_id={run_id} | WRFOUTs={file_count} | horizonte={horizon}")

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'run_id={run_id}\n')
              f.write(f'run_date={date:08d}\n')
              f.write(f'run_cycle={cycle:02d}\n')
          PY

      - name: Baixar assets da rodada METBR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="metbr-wrf-4km-checkpoint-${RUN_ID}"
          rm -rf metbr_raw
          mkdir -p metbr_raw
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'wrfout_d01_*' --dir metbr_raw --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-run.env' --dir metbr_raw --clobber || true
          COUNT="$(find metbr_raw -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c | wc -l)"
          echo "WRFOUT baixados: $COUNT"
          test "$COUNT" -ge 3
          # O Maestro aceita a configuração F042; F045/F048 também são aceitos
          # caso o workflow seja ampliado futuramente.
          python - <<'PY'
          import re
          from pathlib import Path
          files = sorted(Path('metbr_raw').glob('wrfout_d01_*'))
          max_fh = -1
          run_env = {}
          p = Path('metbr_raw/metbr-run.env')
          if p.is_file():
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '=' in line:
                      k,v=line.split('=',1)
                      run_env[k.strip()]=v.strip()
          if run_env.get('RUN_DATE') and run_env.get('RUN_CYCLE'):
              from datetime import datetime, timezone
              init = datetime.strptime(
                  run_env['RUN_DATE'].replace('-','') + run_env['RUN_CYCLE'].zfill(2),
                  '%Y%m%d%H'
              ).replace(tzinfo=timezone.utc)
              for f in files:
                  m = re.search(r'wrfout_d01_(\d{4}-\d{2}-\d{2})_(\d{2})[:.](\d{2})[:.](\d{2})', f.name)
                  if not m:
                      continue                  valid = datetime.strptime(
                      m.group(1).replace('-','') + m.group(2)+m.group(3)+m.group(4),                      '%Y%m%d%H%M%S'
                  ).replace(tzinfo=timezone.utc)
                  max_fh = max(max_fh, int(round((valid-init).total_seconds()/3600)))
          print(f'Maestro: horizonte detectado F{max_fh:03d}')
          if max_fh < 42:
              raise SystemExit(f'Rodada incompleta para o METBR Maestro: máximo F{max_fh:03d}; esperado F042.')
          PY

      - name: Extrair rodada nativa para publicação
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(sed -n 's/^run_date=//p' metbr_raw/metbr-latest-complete.txt)"
          RUN_CYCLE="$(sed -n 's/^run_cycle=//p' metbr_raw/metbr-latest-complete.txt)"
          test -n "$RUN_DATE"; test -n "$RUN_CYCLE"
          rm -rf metbr_publish
          python wrf/extract_metbr_4km.py --run-dir metbr_raw --output-dir metbr_publish --run-date "$RUN_DATE" --run-cycle "$RUN_CYCLE"

      - name: Criar JSON compacto completo para o HTML METBR
        shell: bash
        run: |
          set -euo pipefail
          test -s metbr_publish/metadata.json
          test -d metbr_publish/icon
          python - <<'PY'
          import gzip, json
          from pathlib import Path

          root = Path('metbr_publish')
          meta = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          frames = []
          skipped = []

          def flatten(values):
              out = []
              def walk(x):
                  if isinstance(x, list):
                      for item in x:
                          walk(item)
                  else:
                      out.append(x)
              walk(values)
              return out

          grid = meta.get('grid') or {}
          meta_nx = int(grid.get('nx') or 0)
          meta_ny = int(grid.get('ny') or 0)
          expected_meta = meta_nx * meta_ny

          for f in meta.get('frames') or []:
              rel = f.get('file')
              if not rel:
                  raise SystemExit('frame sem file')
              src = root / rel
              if not src.is_file() or src.stat().st_size == 0:
                  raise SystemExit(f'frame ausente: {src}')

              with gzip.open(src, 'rt', encoding='utf-8') as fh:
                  data = json.load(fh)

              values = data.get('reflectivityDbz')
              if not isinstance(values, list):
                  values = (data.get('fields') or {}).get('reflectivity')              if not isinstance(values, list):
                  values = data.get('reflectivity')
              if not isinstance(values, list):
                  values = None

              gx = int(f.get('gridX') or data.get('gridX') or meta_nx or 0)
              gy = int(f.get('gridY') or data.get('gridY') or meta_ny or 0)
              expected = gx * gy

              flat = flatten(values) if isinstance(values, list) else []
              valid = expected > 0 and len(flat) == expected

              if not valid:
                  is_f000 = (
                      int(f.get('index') or -1) == 0
                      or int(f.get('forecastHour') or -1) == 0
                      or Path(rel).name == 'f000.json.gz'
                  )

                  if is_f000 and expected > 0:
                      # F000 é mantido como frame inicial, mas sem inventar
                      # refletividade: toda a grade recebe o valor de no-data.
                      flat = [-9999.0] * expected
                      print(
                          f'[METBR] F000 sem grade dBZ válida em {src.name}: '
                          f'{len(flatten(values)) if isinstance(values,list) else 0} valores; '
                          f'mantendo frame inicial como no-data ({gx}x{gy})'
                      )
                  else:
                      skipped.append(
                          f'{src}: {len(flat)} valores para {gx}x{gy}'
                      )
                      print(f'[METBR] pulando frame inválido: {src} ({len(flat)} valores para {gx}x{gy})')
                      continue

              frames.append({
                  'file': rel,
                  'index': f.get('index'),
                  'forecastHour': f.get('forecastHour'),
                  'validTime': f.get('validTime') or data.get('validTime'),
                  'gridX': gx,
                  'gridY': gy,
                  'reflectivityDbz': flat
              })

          if expected_meta > 0:
              print(f'[METBR] grade declarada: {meta_nx}x{meta_ny}')
          print(f'[METBR] frames publicados no JSON compacto: {len(frames)}')
          if skipped:
              print('[METBR] frames ignorados por saída inválida:')
              for item in skipped:
                  print(f'  - {item}')

          if len(frames) < 3:
              raise SystemExit(
                  f'Poucos frames válidos para publicar: {len(frames)}'              )

          payload = {              'schemaVersion': '1.1',
              'model': 'METBR WRF 4 km',
              'modelKey': 'metbr_wrf',
              'resolutionKm': 4,
              'grid': meta.get('grid'),
              'runDate': meta.get('runDate'),
              'runCycle': meta.get('runCycle'),
              'initTime': meta.get('initTime'),
              'reflectivitySource': meta.get('reflectivitySource', 'REFL_10CM'),
              'nativeGrid': True,
              'frameCount': len(frames),
              'temporalResolutionMinutes': 60,
              'frames': frames
          }

          out = root / 'metbr_wrf_4km.json'
          out.write_text(
              json.dumps(
                  payload,
                  separators=(',', ':'),
                  ensure_ascii=False,
                  allow_nan=False
              ),
              encoding='utf-8'
          )

          size_mb = out.stat().st_size / (1024 * 1024)
          print(f'JSON METBR compacto: {len(frames)} frames; {size_mb:.2f} MiB')

          if out.stat().st_size >= 100_000_000:
              raise SystemExit(
                  f'metbr_wrf_4km.json ainda excede o limite do GitHub: {size_mb:.2f} MiB'
              )
          PY
          test -s metbr_publish/metbr_wrf_4km.json

      - name: Validar produto antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          d=json.loads(Path('metbr_publish/metadata.json').read_text(encoding='utf-8')); errors=[]
          if str(d.get('model','')).lower() not in {'icon','metbr wrf 4 km'}: errors.append(f"model={d.get('model')!r}")
          if float(d.get('resolutionKm',0))!=4: errors.append(f"resolutionKm={d.get('resolutionKm')!r}")
          if not d.get('reflectivitySource'): errors.append('reflectivitySource ausente')
          frames=d.get('frames') or []
          if len(frames)<3: errors.append(f'frames={len(frames)}')
          grid=d.get('grid') or {}; nx=int(grid.get('nx',0)); ny=int(grid.get('ny',0))
          if nx<=0 or ny<=0: errors.append(f'grid inválida={grid!r}')
          index=Path('metbr_publish/metbr_wrf_4km.json')
          if not index.is_file() or index.stat().st_size==0: errors.append('metbr_wrf_4km.json ausente')
          if index.is_file() and index.stat().st_size>=100000000: errors.append('metbr_wrf_4km.json excede 100 MB')
          for f in frames:
              q=Path('metbr_publish')/f['file']
              if not q.is_file() or q.stat().st_size==0: errors.append(f'frame ausente/vazio: {q}'); continue
              try:
                  with gzip.open(q,'rt',encoding='utf-8') as fh: frame=json.load(fh)
                  if int(frame.get('gridX',0))!=nx or int(frame.get('gridY',0))!=ny: errors.append(f'grade inconsistente em {q}')
              except Exception as exc: errors.append(f'frame inválido {q}: {exc}')          if errors: raise RuntimeError('Validação METBR falhou: '+'; '.join(errors))
          print('Produto METBR validado:',d.get('runDate'),d.get('runCycle'),len(frames),f'grade={nx}x{ny}',f'index={index.stat().st_size} bytes')
          PY

      - name: Publicar a rodada METBR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf published-metbr
          git clone --depth 1 --branch "$TARGET_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" published-metbr

          # Não apagar os diagnósticos WRF2 já publicados.
          if [[ -d published-metbr/severe ]]; then
            cp -a published-metbr/severe /tmp/metbr-severe-preserve
          else
            rm -rf /tmp/metbr-severe-preserve
          fi

          find published-metbr -mindepth 1 -maxdepth 1 ! -name .git ! -name severe -exec rm -rf {} +
          cp -a metbr_publish/. published-metbr/
          if [[ -d /tmp/metbr-severe-preserve ]]; then
            rm -rf published-metbr/severe
            cp -a /tmp/metbr-severe-preserve published-metbr/severe
          fi

          # Reanexar WRF2 somente quando a pasta severe pertence à mesma rodada.
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("published-metbr")
          meta_path = root / "metadata.json"
          severe_path = root / "severe" / "icon" / "metadata.json"
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          meta.pop("wrf2SevereDiagnostics", None)
          meta.pop("wrf2SevereMetadata", None)
          meta.pop("wrf2SevereFields", None)

          if severe_path.is_file():
              severe = json.loads(severe_path.read_text(encoding="utf-8"))
              same_run = (
                  str(severe.get("runDate", "")) == str(meta.get("runDate", ""))
                  and str(severe.get("runCycle", "")).rstrip("Z") == str(meta.get("runCycle", "")).rstrip("Z")
              )
              fields = sorted(
                  k for k, v in (severe.get("variables") or {}).items()
                  if isinstance(v, dict) and v.get("status") == "available"
              )
              if same_run and fields:
                  meta["wrf2SevereDiagnostics"] = True
                  meta["wrf2SevereMetadata"] = "severe/icon/metadata.json"
                  meta["wrf2SevereFields"] = fields
                  by_hour = {
                      int(f["forecastHour"]): f["file"]
                      for f in (severe.get("frames") or [])
                      if "forecastHour" in f and f.get("file")
                  }
                  for frame in meta.get("frames") or []:
                      fh = int(frame.get("forecastHour", -1))
                      if fh in by_hour:
                          frame["severeFile"] = by_hour[fh]
                  meta["availableMapFields"] = sorted(
                      set(meta.get("availableMapFields") or []) | set(fields)
                  )

          meta_path.write_text(
              json.dumps(meta, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

          test -s published-metbr/metbr_wrf_4km.json
          cd published-metbr
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "METBR Maestro: publicar rodada mais recente com frames compactados" || true
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Registrar status
        if: always()
        run: |
          jq -r '"METBR Maestro: \(.runDate // "indisponível") \(.runCycle // "") | frames=\(.frameCount // 0)"' metbr_publish/metadata.json 2>/dev/null || true