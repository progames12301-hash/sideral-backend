name: METBR Maestro - bot diário de publicação

on:
  workflow_run:
    workflows: ["METBR WRF 4 KM - ICON"]
    types: [completed]
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: metbr-maestro-publication
  cancel-in-progress: false

env:
  TARGET_BRANCH: metbr-json-data
  METBR_WORKFLOW: metbr-wrf-4km.yml

jobs:
  publish:
    name: Detectar, validar e publicar a última rodada METBR
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do controlador
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências NetCDF
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'netCDF4>=1.7,<2'

      - name: Instalar GitHub CLI
        run: |
          set -euo pipefail
          gh --version
          gh auth status
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Selecionar a rodada METBR mais recente
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf discover_tmp
          mkdir -p discover_tmp
          python - <<'PY'
          import json, os, subprocess, re
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; event=os.environ['GITHUB_EVENT_NAME']; event_path=os.environ['GITHUB_EVENT_PATH']
          def run(cmd): return subprocess.check_output(cmd,text=True).strip()
          def parse_complete(path):
              vals={}
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if '=' in line:
                      k,v=line.split('=',1); vals[k.strip()]=v.strip()
              date=re.sub(r'[^0-9]','',vals.get('run_date','')); cycle=re.sub(r'[^0-9]','',vals.get('run_cycle',''))
              if len(date)!=8 or cycle not in {'00','06','12','18'} or vals.get('status')!='complete': return None
              return int(date),int(cycle),date,cycle
          candidates=[]
          if event=='workflow_run':
              ev=json.load(open(event_path)); wr=ev['workflow_run']
              if wr.get('conclusion')=='success': candidates.append((int(wr['id']),f"metbr-wrf-4km-checkpoint-{wr['id']}"))
          raw=run(['gh','release','list','--repo',repo,'--limit','50','--json','tagName,createdAt'])
          for r in json.loads(raw):
              tag=r.get('tagName','')
              if re.fullmatch(r'metbr-wrf-4km-checkpoint-\d+',tag):
                  item=(int(tag.rsplit('-',1)[1]),tag)
                  if item not in candidates: candidates.append(item)
          best=None
          for rid,tag in candidates:
              dest=Path('discover_tmp')/str(rid); dest.mkdir(parents=True,exist_ok=True)
              try:
                  subprocess.run(['gh','release','download',tag,'--repo',repo,'--pattern','metbr-latest-complete.txt','--dir',str(dest),'--clobber'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  p=dest/'metbr-latest-complete.txt'
                  if not p.is_file(): continue
                  parsed=parse_complete(p)
                  if parsed is None: continue
                  date,cycle,ds,cs=parsed; candidate=(date,cycle,rid,tag)
                  if best is None or candidate[:3]>best[:3]: best=candidate
              except Exception: continue
          if best is None: raise SystemExit('Nenhuma rodada METBR completa encontrada nos releases')
          date,cycle,run_id,tag=best
          print(f'RODADA MAIS RECENTE: {date:08d} {cycle:02d}Z | run_id={run_id} | tag={tag}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'run_id={run_id}\nrun_date={date:08d}\nrun_cycle={cycle:02d}\n')
          PY

      - name: Baixar assets da rodada completa
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="metbr-wrf-4km-checkpoint-${RUN_ID}"
          mkdir -p metbr_raw
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'wrfout_d01_*' --dir metbr_raw --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'metbr-latest-complete.txt' --dir metbr_raw --clobber
          COUNT="$(find metbr_raw -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c | wc -l)"
          echo "wrfout baixados: $COUNT"
          test "$COUNT" -ge 3
          grep -q '^status=complete' metbr_raw/metbr-latest-complete.txt

      - name: Extrair rodada nativa para publicação
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(sed -n 's/^run_date=//p' metbr_raw/metbr-latest-complete.txt)"
          RUN_CYCLE="$(sed -n 's/^run_cycle=//p' metbr_raw/metbr-latest-complete.txt)"
          test -n "$RUN_DATE"; test -n "$RUN_CYCLE"
          rm -rf metbr_publish
          python wrf/extract_metbr_4km.py --run-dir metbr_raw --output-dir metbr_publish --run-date "$RUN_DATE" --run-cycle "$RUN_CYCLE"

      - name: Criar JSON compacto completo para o HTML METBR
        shell: bash
        run: |
          set -euo pipefail
          test -s metbr_publish/metadata.json
          test -d metbr_publish/icon
          python - <<'PY'
          import gzip, json
          from pathlib import Path

          root = Path('metbr_publish')
          meta = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          frames = []

          for f in meta.get('frames') or []:
              rel = f.get('file')
              if not rel:
                  raise SystemExit('frame sem file')
              src = root / rel
              if not src.is_file() or src.stat().st_size == 0:
                  raise SystemExit(f'frame ausente: {src}')

              with gzip.open(src, 'rt', encoding='utf-8') as fh:
                  data = json.load(fh)

              values = data.get('reflectivityDbz')
              if not isinstance(values, list):
                  values = (data.get('fields') or {}).get('reflectivity')
              if not isinstance(values, list):
                  values = data.get('reflectivity')
              if not isinstance(values, list):
                  raise SystemExit(f'reflectivityDbz ausente ou inválido: {src}')

              gx = int(f.get('gridX') or data.get('gridX') or 0)
              gy = int(f.get('gridY') or data.get('gridY') or 0)
              expected = gx * gy
              if expected <= 0 or len(values) != expected:
                  raise SystemExit(
                      f'grade/refletividade inconsistente em {src}: '
                      f'{len(values)} valores para {gx}x{gy}'
                  )

              frames.append({
                  'file': rel,
                  'index': f.get('index'),
                  'forecastHour': f.get('forecastHour'),
                  'validTime': f.get('validTime') or data.get('validTime'),
                  'gridX': gx,
                  'gridY': gy,
                  'reflectivityDbz': values
              })

          payload = {
              'schemaVersion': '1.1',
              'model': 'METBR WRF 4 km',
              'modelKey': 'metbr_wrf',
              'resolutionKm': 4,
              'grid': meta.get('grid'),
              'runDate': meta.get('runDate'),
              'runCycle': meta.get('runCycle'),
              'initTime': meta.get('initTime'),
              'reflectivitySource': meta.get('reflectivitySource', 'REFL_10CM'),
              'nativeGrid': True,
              'frameCount': len(frames),
              'temporalResolutionMinutes': 60,
              'frames': frames
          }

          out = root / 'metbr_wrf_4km.json'
          out.write_text(
              json.dumps(payload, separators=(',', ':'), ensure_ascii=False, allow_nan=False),
              encoding='utf-8'
          )

          size_mb = out.stat().st_size / (1024 * 1024)
          print(f'JSON METBR completo: {len(frames)} frames; {size_mb:.2f} MiB')

          # O arquivo continua sendo um único JSON com reflectivityDbz por frame,
          # mas não carrega os demais campos meteorológicos, evitando >100 MB.
          if out.stat().st_size >= 100_000_000:
              raise SystemExit(
                  f'metbr_wrf_4km.json ainda excede o limite do GitHub: {size_mb:.2f} MiB'
              )
          PY
          test -s metbr_publish/metbr_wrf_4km.json

      - name: Validar produto antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          d=json.loads(Path('metbr_publish/metadata.json').read_text(encoding='utf-8')); errors=[]
          if d.get('model')!='icon': errors.append(f"model={d.get('model')!r}")
          if float(d.get('resolutionKm',0))!=4: errors.append(f"resolutionKm={d.get('resolutionKm')!r}")
          if not d.get('reflectivitySource'): errors.append('reflectivitySource ausente')
          frames=d.get('frames') or []
          if len(frames)<3: errors.append(f'frames={len(frames)}')
          grid=d.get('grid') or {}; nx=int(grid.get('nx',0)); ny=int(grid.get('ny',0))
          if nx<=0 or ny<=0: errors.append(f'grid inválida={grid!r}')
          index=Path('metbr_publish/metbr_wrf_4km.json')
          if not index.is_file() or index.stat().st_size==0: errors.append('metbr_wrf_4km.json ausente')
          if index.is_file() and index.stat().st_size>=100000000: errors.append('metbr_wrf_4km.json excede 100 MB')
          for f in frames:
              q=Path('metbr_publish')/f['file']
              if not q.is_file() or q.stat().st_size==0: errors.append(f'frame ausente/vazio: {q}'); continue
              try:
                  with gzip.open(q,'rt',encoding='utf-8') as fh: frame=json.load(fh)
                  if int(frame.get('gridX',0))!=nx or int(frame.get('gridY',0))!=ny: errors.append(f'grade inconsistente em {q}')
              except Exception as exc: errors.append(f'frame inválido {q}: {exc}')
          if errors: raise RuntimeError('Validação METBR falhou: '+'; '.join(errors))
          print('Produto METBR validado:',d.get('runDate'),d.get('runCycle'),len(frames),f'grade={nx}x{ny}',f'index={index.stat().st_size} bytes')
          PY

      - name: Publicar sempre a rodada METBR mais recente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf published-metbr
          git clone --depth 1 --branch "$TARGET_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" published-metbr
          find published-metbr -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a metbr_publish/. published-metbr/
          test -s published-metbr/metbr_wrf_4km.json
          cd published-metbr
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "METBR Maestro: publicar rodada mais recente com frames compactados" || true
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Registrar status
        if: always()
        run: |
          jq -r '"METBR Maestro: \(.runDate // "indisponível") \(.runCycle // "") | frames=\(.frameCount // 0)"' metbr_publish/metadata.json 2>/dev/null || true
