name: METBR + TARC Maestro - publicação diária de JSON

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metbr-maestro.yml'
  workflow_run:
    workflows:
      - "METBR WRF 4 KM - ICON"
      - "WRF TARC 3 KM — fallback ICON → ECMWF → GFS"
    types: [completed]
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo para extrair/publicar"
        required: false
        default: both
        type: choice
        options:
          - both
          - metbr
          - tarc
      run_id:
        description: "Run ID específico do modelo selecionado; vazio = última execução bem-sucedida"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish-metbr-json:
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'METBR WRF 4 KM - ICON' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.model == 'both' || inputs.model == 'metbr'))
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout do extrator METBR
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Definir run ID METBR
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_MODEL: ${{ inputs.model }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_MODEL" == "metbr" && -n "$INPUT_RUN_ID" ]]; then
            RUN_ID="$INPUT_RUN_ID"
          elif [[ "$EVENT_WORKFLOW" == "METBR WRF 4 KM - ICON" && -n "$EVENT_RUN_ID" ]]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow metbr-wrf-4km.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "tag=metbr-wrf-4km-checkpoint-$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "METBR Maestro selecionou run_id=$RUN_ID"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'xarray>=2024.1,<2027' 'netCDF4>=1.7,<2'

      - name: Baixar WRFOUT METBR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf metbr_work
          mkdir -p metbr_work/run
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'wrfout_d01_*' --dir metbr_work/run --clobber
          test -n "$(find metbr_work/run -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print -quit)"

      - name: Extrair JSON METBR
        run: |
          set -euo pipefail
          rm -rf metbr_publish
          python wrf/metbr_extract_json.py --run-dir metbr_work/run --output-dir metbr_publish
          for file in metadata.json metbr_wrf_4km.json grid.json vertical-f000.npz; do
            test -s "metbr_publish/$file" || { echo "Arquivo obrigatório ausente: $file" >&2; exit 1; }
          done
          test -d metbr_publish/frames
          test "$(find metbr_publish/frames -maxdepth 1 -type f -name 'f*.json.gz' -size +0c | wc -l)" -eq 43

      - name: Validar publicação METBR completa
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          import numpy as np

          root = Path("metbr_publish")
          meta = json.loads((root / "metadata.json").read_text(encoding="utf-8"))
          data = json.loads((root / "metbr_wrf_4km.json").read_text(encoding="utf-8"))
          grid = json.loads((root / "grid.json").read_text(encoding="utf-8"))
          assert meta.get("modelKey") == "metbr_wrf", meta.get("modelKey")
          assert int(meta.get("resolutionKm", 0)) == 4
          assert meta.get("gridFile") == "grid.json"
          assert meta.get("verticalProfileFile") == "vertical-f000.npz"
          frames = meta.get("frames") or []
          assert len(frames) == 43, f"Esperados F000-F042; recebidos {len(frames)}"
          assert data.get("modelKey") == "metbr_wrf"
          assert len(data.get("frames", [])) == len(frames)
          nx, ny = int(meta["grid"]["nx"]), int(meta["grid"]["ny"])
          expected = nx * ny
          assert grid.get("schema") == "sideral-metbr-grid-v1"
          assert grid.get("modelKey") == "metbr_wrf"
          assert int(grid["grid"]["nx"]) == nx and int(grid["grid"]["ny"]) == ny
          assert len(grid["fields"]["lat"]) == expected
          assert len(grid["fields"]["lon"]) == expected

          with np.load(root / "vertical-f000.npz", allow_pickle=False) as vertical:
              shape = vertical["pressure_hpa"].shape
              assert len(shape) == 3 and shape[0] >= 10, shape
              assert shape[1:] == (ny, nx), shape
              for name in ("temperature_c", "dewpoint_c", "height_m", "u_kt", "v_kt", "omega_pa_s"):
                  assert vertical[name].shape == shape, (name, vertical[name].shape)
              assert vertical["lat"].shape == (ny, nx)
              assert vertical["lon"].shape == (ny, nx)
              assert vertical["terrain_m"].shape == (ny, nx)

          available_from_payload = set()
          actual_hours = set()
          for item in frames:
              forecast = int(item["forecastHour"])
              actual_hours.add(forecast)
              file = item.get("dataFile") or f"frames/f{forecast:03d}.json.gz"
              with gzip.open(root / file, "rt", encoding="utf-8") as handle:
                  frame = json.load(handle)
              assert frame.get("modelKey") == "metbr_wrf", file
              assert frame.get("reflectivitySource") == "REFL_10CM_NATIVE", file
              assert int(frame["gridX"]) == nx and int(frame["gridY"]) == ny, file
              assert int(frame["forecastHour"]) == forecast, file
              assert len(frame.get("reflectivityDbz", [])) == expected, file
              fields = frame.get("fields") or {}
              assert isinstance(fields, dict), (file, fields)
              for field_name, values in fields.items():
                  assert isinstance(values, list) and len(values) == expected, (file, field_name)
                  assert all(value is None or isinstance(value, (int, float)) for value in values), (file, field_name)
                  if any(value is not None for value in values):
                      available_from_payload.add(field_name)
          assert actual_hours == set(range(43)), f"Horas ausentes: {sorted(set(range(43)) - actual_hours)}"
          sources = meta.get("reflectivitySource")
          sources = [sources] if isinstance(sources, str) else sources if isinstance(sources, list) else []
          assert any("REFL_10CM" in str(item).upper() for item in sources), sources
          assert "reflectivity" in available_from_payload, "Refletividade ausente nos frames"
          declared = set(meta.get("availableVariablesAnyFrame") or [])
          assert declared <= available_from_payload, (declared, available_from_payload)
          print(f"METBR validado: {len(frames)} frames F000-F042, grade nativa {nx}x{ny}, NPZ vertical e REFL_10CM nativa.")

          PY

      - name: Selecionar branch do ciclo METBR
        run: |
          set -euo pipefail
          RUN_CYCLE="$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          meta = json.loads(Path("metbr_publish/metadata.json").read_text(encoding="utf-8"))
          init_time = str(meta.get("initTime") or "")
          if not init_time:
              raise SystemExit("metadata.json não informa initTime")
          stamp = datetime.fromisoformat(init_time.replace("Z", "+00:00"))
          print(stamp.strftime("%H"))
          PY
          )"
          [[ "$RUN_CYCLE" =~ ^(00|06|12|18|21)$ ]] || { echo "Ciclo METBR não suportado: $RUN_CYCLE" >&2; exit 20; }
          echo "METBR_RUN_CYCLE=$RUN_CYCLE" >> "$GITHUB_ENV"
          echo "METBR_JSON_BRANCH=metbr-json-data-$RUN_CYCLE" >> "$GITHUB_ENV"
          echo "METBR ciclo $RUN_CYCLE Z validado; publicarei a branch por ciclo e metbr-json-data."

      - name: Publicar pacote METBR completo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin metbr-json-data
          rm -rf /tmp/metbr-json-publication
          git worktree add --detach /tmp/metbr-json-publication origin/metbr-json-data
          find /tmp/metbr-json-publication -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a metbr_publish/. /tmp/metbr-json-publication/
          cat > /tmp/metbr-json-publication/README.md <<'EOF'
          # METBR WRF 4 km — publicação JSON nativa

          - metadata.json: horários, variáveis e contrato de publicação
          - grid.json: coordenadas nativas XLAT/XLONG
          - vertical-f000.npz: grade vertical nativa para o Skew-T click-to-point
          - frames/fNNN.json.gz: refletividade REFL_10CM nativa e demais campos disponíveis
          - metbr_wrf_4km.json: índice compatível com a interface legada

          A publicação só é atualizada após validar os 43 frames F000-F042, a grade, os perfis verticais e a refletividade nativa.
          EOF
          cd /tmp/metbr-json-publication
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "publish: METBR WRF 4 km ciclo $METBR_RUN_CYCLE Z $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          git push --force origin HEAD:"$METBR_JSON_BRANCH"
          git push --force origin HEAD:metbr-json-data
          cd - >/dev/null
          git worktree remove --force /tmp/metbr-json-publication
          echo "METBR publicado integralmente em $METBR_JSON_BRANCH e metbr-json-data."


  publish-tarc-json:
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'WRF TARC 3 KM — fallback ICON → ECMWF → GFS' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.model == 'both' || inputs.model == 'tarc'))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout dos extratores TARC
        uses: actions/checkout@v4
        with:
          ref: tarc-wrf-3km
          fetch-depth: 1

      - name: Definir run ID TARC
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_MODEL: ${{ inputs.model }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_MODEL" == "tarc" && -n "$INPUT_RUN_ID" ]]; then
            RUN_ID="$INPUT_RUN_ID"
          elif [[ "$EVENT_WORKFLOW" == "WRF TARC 3 KM — fallback ICON → ECMWF → GFS" && -n "$EVENT_RUN_ID" ]]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wrf-tarc-3km.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "tag=tarc-wrf-3km-checkpoint-$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "TARC Maestro selecionou run_id=$RUN_ID"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027'

      - name: Baixar WRFOUT TARC
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf tarc_work
          mkdir -p tarc_work/run
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'wrfout_d01_*' --dir tarc_work/run --clobber
          test -n "$(find tarc_work/run -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print -quit)"
          count="$(find tarc_work/run -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c | wc -l)"
          echo "[TARC][MAESTRO] WRFOUT encontrados: $count"

      - name: Extrair JSON TARC por frame
        run: |
          set -euo pipefail
          rm -rf tarc_publish
          python wrf/tarc_extract_json.py --run-dir tarc_work/run --output-dir tarc_publish --expected-start 0 --expected-end 48
          test -s tarc_publish/metadata.json
          test -n "$(find tarc_publish/frames -maxdepth 1 -type f -name 'f*.json.gz' -size +0c -print -quit)"

      - name: Gerar diagnósticos severos TARC na grade nativa
        env:
          WRF_DX_METERS: 3000
          WRF_PRODUCT_LABEL: WRF TARC 3 KM ICON · diagnósticos severos
        run: |
          set -euo pipefail
          rm -rf tarc_severe
          python wrf/extract_wrf_severe.py --run-dir tarc_work/run --output-dir tarc_severe --grid-x 361 --grid-y 445 --model icon --interval-hours 3 --expected-start 0 --expected-end 48
          test -s tarc_severe/metadata.json
          test -s tarc_severe/diagnostics.json

      - name: Validar JSON TARC
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          meta = json.loads(Path('tarc_publish/metadata.json').read_text(encoding='utf-8'))
          assert meta['model'] == 'WRF TARC 3 KM'
          assert meta['resolutionKm'] == 3
          assert meta['nativeReflectivity'] == 'REFL_10CM'
          assert meta['grid']['nx'] == 361 and meta['grid']['ny'] == 445
          assert meta['status'] == 'complete', meta.get('missingForecastHours')
          expected = set(range(49))
          actual = {int(x['forecastHour']) for x in meta['frames']}
          assert actual == expected, f'frames TARC inesperados: faltantes={sorted(expected-actual)} extras={sorted(actual-expected)}'
          for item in meta['frames']:
              p = Path('tarc_publish') / item['file']
              with gzip.open(p, 'rt', encoding='utf-8') as fh:
                  data = json.load(fh)
              assert len(data['fields']['lat']) == 361*445
              assert len(data['fields']['lon']) == 361*445
              assert len(data['fields']['reflectivityDbz']) == 361*445
              assert len(data['fields']['reflectivityCompositeDbz']) == 361*445
          print(f"[TARC][VALID] {len(meta['frames'])} frames; 361x445; REFL_10CM + composta + vento + superfície")
          PY

      - name: Publicar TARC na branch tarc-json-data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin tarc-json-data
          rm -rf /tmp/tarc-json-publication
          git worktree add --detach /tmp/tarc-json-publication origin/tarc-json-data
          find /tmp/tarc-json-publication -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a tarc_publish/. /tmp/tarc-json-publication/
          cp -f wrf/tarc_variable_catalog.json /tmp/tarc-json-publication/variable_catalog.json
          mkdir -p /tmp/tarc-json-publication/severe
          cp -a tarc_severe/. /tmp/tarc-json-publication/severe/
          cd /tmp/tarc-json-publication
          git add -A
          git commit -m "publish: WRF TARC 3 KM JSON $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push origin HEAD:tarc-json-data
          cd - >/dev/null
          git worktree remove --force /tmp/tarc-json-publication
          echo "TARC JSON publicado em branch tarc-json-data."
