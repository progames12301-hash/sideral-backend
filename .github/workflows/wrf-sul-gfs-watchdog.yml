name: WRF Sul GFS - WATCHDOG AUTOMATICO

on:
  workflow_dispatch:
  schedule:
    # Confere quatro vezes por dia. So dispara se nao houver rodada ativa
    # e se nenhuma rodada bem-sucedida tiver sido iniciada nas ultimas 10 h.
    - cron: "5 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-sul-gfs-watchdog.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-wrf-sul-gfs-watchdog
  cancel-in-progress: true

jobs:
  garantir-wrf-sul-gfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Conferir execucao e disparar somente se necessario
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_WORKFLOW: wrf-4km-next-day-auto.yml
        shell: bash
        run: |
          set -euo pipefail

          echo "Verificando $TARGET_WORKFLOW"
          gh run list --workflow "$TARGET_WORKFLOW" --limit 20 \
            --json databaseId,status,conclusion,createdAt,event > /tmp/wrf-runs.json
          cat /tmp/wrf-runs.json

          python3 - <<'PY'
          import datetime as dt
          import json

          runs = json.load(open('/tmp/wrf-runs.json', encoding='utf-8'))
          active = [r for r in runs if r.get('status') in {'queued', 'in_progress', 'waiting', 'pending'}]
          if active:
              print('WRF Sul GFS ja possui execucao ativa:', active[0])
              raise SystemExit(10)

          now = dt.datetime.now(dt.timezone.utc)
          successes = [r for r in runs if r.get('status') == 'completed' and r.get('conclusion') == 'success']
          for run in successes:
              created = dt.datetime.fromisoformat(run['createdAt'].replace('Z', '+00:00'))
              age_h = (now - created).total_seconds() / 3600
              if age_h <= 10:
                  print(f'WRF Sul GFS recente: {age_h:.1f} h; nao precisa disparar.')
                  raise SystemExit(11)

          print('Nenhuma execucao ativa ou sucesso recente: deve disparar.')
          PY
          rc=$?
          if [ "$rc" -eq 10 ] || [ "$rc" -eq 11 ]; then
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          echo "Disparando WRF Sul GFS completo..."
          gh workflow run "$TARGET_WORKFLOW" --ref main
          sleep 5
          gh run list --workflow "$TARGET_WORKFLOW" --limit 3 \
            --json databaseId,status,conclusion,createdAt,event
