name: WRF Sul GFS - WATCHDOG AUTOMATICO

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0,6,12,18 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-wrf-sul-gfs-watchdog
  cancel-in-progress: true

jobs:
  garantir-wrf-sul-gfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Conferir produto 7 km e disparar somente se necessario
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_WORKFLOW: wrf-4km-next-day-auto.yml
        shell: bash
        run: |
          set -euo pipefail

          healthy=0
          if curl -fsSL --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/${GH_REPO}/wrf-data/metadata.json?watch=${GITHUB_RUN_ID}" -o /tmp/wrf-data.json; then
            if python3 - <<'PY'
          import json
          d=json.load(open('/tmp/wrf-data.json', encoding='utf-8'))
          frames=d.get('frames') or []
          hours=[int(f.get('forecastHour',-1)) for f in frames]
          assert int(d.get('resolutionKm',0)) == 7
          assert d.get('reflectivitySource') == 'REFL_10CM_NATIVE'
          assert d.get('nativeGrid') is True
          assert d.get('singleRunner') is True
          assert int(d.get('temporalResolutionMinutes',0)) == 60
          assert int(d.get('frameCount',0)) == 41
          assert hours == list(range(41))
          assert all((int(f.get('gridX',0)), int(f.get('gridY',0))) == (171,205) for f in frames)
          PY
            then healthy=1; fi
          fi

          if [ "$healthy" = "1" ]; then
            echo "GFS Sul ja publicado em 7 km, F000-F040 horario e runner unico."
            exit 0
          fi

          active="$(gh run list --repo "$GH_REPO" --workflow "$TARGET_WORKFLOW" --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$active" != "0" ]; then
            echo "GFS Sul ja possui rodada ativa."
            exit 0
          fi

          gh api "repos/$GH_REPO/actions/runs?status=queued&per_page=100" > /tmp/queued.json
          gh api "repos/$GH_REPO/actions/runs?status=in_progress&per_page=100" > /tmp/in-progress.json
          if ! python3 - <<'PY'
          import json
          others=[]
          for path in ('/tmp/queued.json','/tmp/in-progress.json'):
              for run in json.load(open(path,encoding='utf-8')).get('workflow_runs',[]):
                  name=str(run.get('name') or '')
                  if not name.startswith('WRF') or name in {'WRF 4 km - DOIS DIAS AUTOMATICO','WRF Sul GFS - WATCHDOG AUTOMATICO'}:
                      continue
                  if 'RUNNER RELIEF' in name:
                      continue
                  others.append((name,run.get('status'),run.get('id')))
          if others:
              print('Outros WRF regionais usando/aguardando runners:', others[:8])
              raise SystemExit(1)
          PY
          then
            echo "GFS Sul espera a proxima checagem para nao disputar runners."
            exit 0
          fi

          echo "Disparando WRF Sul GFS 7 km F000-F040 horario em runner unico..."
          gh workflow run "$TARGET_WORKFLOW" --repo "$GH_REPO" --ref main
