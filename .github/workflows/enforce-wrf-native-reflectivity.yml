name: WRF - enforce native reflectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/enforce_wrf_native_reflectivity.py"
      - ".github/workflows/enforce-wrf-native-reflectivity.yml"
      - "server.py"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: enforce-wrf-native-reflectivity
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover qualquer fallback artificial de dBZ
        run: python tools/enforce_wrf_native_reflectivity.py

      - name: Validar extrator operacional publicado
        shell: bash
        run: |
          git fetch origin wrf-runner:refs/remotes/origin/wrf-runner
          git show refs/remotes/origin/wrf-runner:wrf/extract_wrf_json_core.py > /tmp/extract_wrf_json_core.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/extract_wrf_json_core.py').read_text(encoding='utf-8')
          assert 'REFL_10CM' in text
          assert 'REFL_10CM_NATIVE' in text
          assert 'nao publica refletividade aproximada' in text
          start = text.index('def native_composite_reflectivity')
          end = text.index('\ndef ', start + 5)
          block = text[start:end]
          forbidden = ('QRAIN', 'QSNOW', 'QGRAUP', 'precipitation_to_dbz', 'approximate_reflectivity')
          bad = [item for item in forbidden if item in block]
          assert not bad, bad
          print('Extrator publicado: somente REFL_10CM nativo.')
          PY

      - name: Commitar correcao se necessario
        shell: bash
        run: |
          if git diff --quiet -- server.py; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "Remove fallback artificial de refletividade WRF [skip render]"
          git push origin HEAD:main
