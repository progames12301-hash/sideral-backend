name: WRF 4 km - Bootstrap V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Verificar ambiente WRF/WPS - V2
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirmar versao do workflow
        run: |
          echo "SIDERAL WRF BOOTSTRAP V2"
          echo "Esta versao NAO usa tar | head."

      - name: Recursos do runner
        run: |
          set -euxo pipefail
          echo "=== CPU ==="
          nproc
          lscpu | sed -n '1,25p'
          echo "=== RAM ==="
          free -h
          echo "=== DISCO ==="
          df -h

      - name: Liberar espaco que nao sera usado pelo WRF
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          echo "=== DISCO APOS LIMPEZA ==="
          df -h

      - name: Baixar imagem WRF/WPS pre-compilada
        run: |
          set -euxo pipefail
          docker pull dtcenter/wps_wrf:latest
          docker image ls dtcenter/wps_wrf:latest

      - name: Localizar executaveis WRF e WPS
        run: |
          set -euxo pipefail
          mkdir -p diagnostics
          docker run --rm dtcenter/wps_wrf:latest /bin/bash -lc '
            echo "=== SISTEMA ==="
            uname -a
            echo "=== EXECUTAVEIS ==="
            find / -type f \( -name wrf.exe -o -name real.exe -o -name geogrid.exe -o -name ungrib.exe -o -name metgrid.exe \) 2>/dev/null | sort
            echo "=== DIRETORIOS WRF/WPS ==="
            find / -maxdepth 3 -type d \( -iname "*wrf*" -o -iname "*wps*" \) 2>/dev/null | sort
          ' | tee diagnostics/wrf-container.txt

      - name: Testar pacote geografico WPS de baixa resolucao
        run: |
          set -euxo pipefail
          mkdir -p diagnostics/geog
          curl -fL --retry 3 --connect-timeout 20 \
            -o diagnostics/geog/geog_low_res_mandatory.tar.gz \
            https://www2.mmm.ucar.edu/wrf/src/wps_files/geog_low_res_mandatory.tar.gz
          ls -lh diagnostics/geog/geog_low_res_mandatory.tar.gz
          tar -tzf diagnostics/geog/geog_low_res_mandatory.tar.gz > diagnostics/geog/geog-all-files.txt
          sed -n '1,100p' diagnostics/geog/geog-all-files.txt > diagnostics/geog/geog-files.txt
          echo "=== PRIMEIROS 100 ARQUIVOS DO PACOTE ==="
          cat diagnostics/geog/geog-files.txt
          du -sh diagnostics/geog
          df -h

      - name: Resumo
        if: always()
        run: |
          echo "Bootstrap V2 concluido. O proximo passo sera montar o dominio Sul do Brasil em 4 km e testar GFS para previsao de amanha."

      - name: Salvar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-bootstrap-v2-diagnostics
          path: diagnostics/
          retention-days: 7
