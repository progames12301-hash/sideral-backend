name: WRF2 7 km SUDESTE ECMWF - AUTOMATICO DIARIO

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
  workflow_run:
    workflows: ["ECMWF IFS - PROXIMO DIA AUTOMATICO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf2-sudeste-ecmwf-7km
  cancel-in-progress: false

jobs:
  wrf2:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/wrf2-sudeste-7km-reusable.yml
    with:
      model: ecmwf
      source_data_branch: ecmwf-data
      run_script: run_ecmwf_wrf_sudeste.sh
    secrets: inherit
