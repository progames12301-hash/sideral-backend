name: Repair stale WRF GFS one-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-wrf-gfs-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Forcar cancelamento da run antiga sem bloquear
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 15s gh api --method POST repos/progames12301-hash/sideral-backend/actions/runs/34101333192/force-cancel || true

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Impedir rodada nova de ficar presa atras da antiga
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/wrf-sudeste-gfs-4km.yml')
          s = p.read_text(encoding='utf-8')
          old = '  cancel-in-progress: false'
          new = '  cancel-in-progress: true'
          if new in s:
              print('cancel-in-progress ja esta true')
          else:
              if old not in s:
                  raise SystemExit('linha de concurrency esperada nao encontrada')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('cancel-in-progress alterado para true')
          PY
          if git diff --quiet -- .github/workflows/wrf-sudeste-gfs-4km.yml; then
            exit 0
          fi
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/wrf-sudeste-gfs-4km.yml
          git commit -m "WRF Sudeste GFS: priorizar rodada mais nova"
          git push origin HEAD:main
