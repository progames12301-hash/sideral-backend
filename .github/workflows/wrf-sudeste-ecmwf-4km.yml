name: WRF 7 km SUDESTE ECMWF - AUTOMATICO DIARIO

on:
  workflow_dispatch:
  schedule:
    - cron: '8 7 * * *'
  workflow_run:
    workflows: ["ECMWF IFS - PROXIMO DIA AUTOMATICO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sudeste-ecmwf-7km
  cancel-in-progress: true

jobs:
  wrf:
    # Descontinuado em 2026-10-26: WRF Sudeste 7 km
    if: ${{ false }}
    uses: ./.github/workflows/wrf-regional-7km-single.yml
    with:
      model: ecmwf
      domain: sudeste
      source_data_branch: ecmwf-data
      publish_branch: wrf-sudeste-ecmwf-data
      run_script: run_ecmwf_wrf_sudeste.sh
    secrets: inherit
