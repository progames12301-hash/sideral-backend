name: WRF Sudeste 4 km ECMWF - REFL NATIVO

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11,23 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-sudeste-ecmwf-4km.yml"
      - ".github/workflows/wrf-source-parallel-sudeste-reusable.yml"
  workflow_run:
    workflows: ["ECMWF IFS - PROXIMO DIA AUTOMATICO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sudeste-ecmwf
  cancel-in-progress: false

jobs:
  wrf:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/wrf-source-parallel-sudeste-reusable.yml
    with:
      model: ecmwf
      source_data_branch: ecmwf-data
      publish_branch: wrf-sudeste-ecmwf-data
      run_script: run_ecmwf_wrf_sudeste.sh
    secrets: inherit
