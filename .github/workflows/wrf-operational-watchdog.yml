name: Sideral WRF operational watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '45 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wrf-operational-watchdog.yml'
      - '.github/workflows/wrf-regional-7km-single.yml'
      - '.github/workflows/wrf-brasil-12km.yml'
      - '.github/workflows/cim-wrf-3km-operational.yml'
      - '.github/workflows/wrf-4km-next-day-auto.yml'
      - '.github/workflows/wrf-icon-4km-native.yml'
      - '.github/workflows/wrf-ecmwf-4km-native.yml'
      - '.github/workflows/wrf-sudeste-gfs-4km.yml'
      - '.github/workflows/wrf-sudeste-icon-4km.yml'
      - '.github/workflows/wrf-sudeste-ecmwf-4km.yml'
      - '.github/workflows/metbr-wrf-4km.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: sideral-wrf-operational-watchdog
  cancel-in-progress: true

jobs:
  verify-and-recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Encerrar run regional legada anterior aos 7 km
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_RUN_ID: '34905051262'
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LEGACY_RUN_ID}" --jq '.status' 2>/dev/null || echo completed)"
          if [[ "$status" == 'queued' || "$status" == 'in_progress' || "$status" == 'waiting' || "$status" == 'pending' ]]; then
            echo "Cancelando run legada ${LEGACY_RUN_ID} (status=${status})"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${LEGACY_RUN_ID}/cancel"
          else
            echo "Run legada ${LEGACY_RUN_ID} ja encerrada: ${status}"
          fi

      - name: Verificar produtos e listar workflows que precisam rodar
        id: health
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          now = dt.datetime.now(dt.timezone.utc)

          products = [
              ('metbr-json-data', 4, 43, '.github/workflows/metbr-wrf-4km.yml', 36),
              ('wrf-data', 7, 41, '.github/workflows/wrf-4km-next-day-auto.yml', 24),
              ('wrf-icon-data', 7, 41, '.github/workflows/wrf-icon-4km-native.yml', 24),
              ('wrf-ecmwf-data', 7, 41, '.github/workflows/wrf-ecmwf-4km-native.yml', 24),
              ('wrf-sudeste-gfs-data', 7, 41, '.github/workflows/wrf-sudeste-gfs-4km.yml', 24),
              ('wrf-sudeste-icon-data', 7, 41, '.github/workflows/wrf-sudeste-icon-4km.yml', 24),
              ('wrf-sudeste-ecmwf-data', 7, 41, '.github/workflows/wrf-sudeste-ecmwf-4km.yml', 24),
              ('wrf-brasil-12km-data', 13, 49, '.github/workflows/wrf-brasil-12km.yml', 24),
          ]
          cim = [
              ('cim-wrf-3km-icon-data', 8, 41),
              ('cim-wrf-3km-ecmwf-data', 8, 41),
          ]

          def fetch_meta(branch):
              url = f'https://raw.githubusercontent.com/{repo}/{branch}/metadata.json?watch={int(now.timestamp())}'
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Sideral-WRF-watchdog'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
                  if not isinstance(data, dict):
                      raise TypeError(f'{branch}: metadata.json nao e um objeto JSON')
                  return data

          def check(branch, km, frames_expected, max_age_h=24):
              meta = None
              try:
                  meta = fetch_meta(branch)
                  assert int(meta.get('resolutionKm')) == km
                  assert meta.get('reflectivitySource') == 'REFL_10CM_NATIVE'
                  assert int(meta.get('temporalResolutionMinutes', 0)) == 60
                  assert meta.get('nativeGrid') is True
                  frames = meta.get('frames') or []
                  assert len(frames) == frames_expected
                  hours = [int(f.get('forecastHour', -1)) for f in frames]
                  assert hours == list(range(frames_expected)), hours
                  generated = str(meta.get('generatedAt') or '')
                  assert generated, 'generatedAt ausente'
                  stamp = dt.datetime.fromisoformat(generated.replace('Z', '+00:00'))
                  age = (now - stamp.astimezone(dt.timezone.utc)).total_seconds() / 3600
                  assert age <= max_age_h, f'stale {age:.1f}h'
                  return True, 'ok'
              except Exception as exc:
                  detail = repr(exc)
                  if meta is not None:
                      detail += f"; keys={sorted(meta.keys())[:12]}"
                  return False, detail

          ecmwf_source_fresh = True
          try:
              source_meta = fetch_meta('ecmwf-data')
              init_value = str(source_meta.get('initTime') or '')
              assert init_value, 'initTime ausente em ecmwf-data'
              source_stamp = dt.datetime.fromisoformat(init_value.replace('Z', '+00:00'))
              source_age = (now - source_stamp.astimezone(dt.timezone.utc)).total_seconds() / 3600
              assert source_age <= 36, f'ECMWF IFS fonte stale {source_age:.1f}h'
              print('OK ecmwf-data fonte:', init_value, f'age={source_age:.1f}h')
          except Exception as exc:
              ecmwf_source_fresh = False
              ecmwf_source_reason = f'ecmwf-data: {exc!r}'
              print('RECOVER ECMWF fonte:', ecmwf_source_reason)

          needed = []
          for branch, km, count, workflow, max_age_h in products:
              ok, why = check(branch, km, count, max_age_h)
              print(('OK' if ok else 'RECOVER'), branch, why)
              if not ok:
                  needed.append((workflow, f'{branch}: {why}'))

          if not ecmwf_source_fresh:
              # Regional WRFs resolve a fresh run directly from ECMWF Open Data;
              # refresh the South America/global ecmwf-data publication separately.
              needed.append(('.github/workflows/ecmwf-ifs-auto.yml', ecmwf_source_reason))
              print('Solicitada atualizacao do produto ecmwf-data; WRF regionais seguem independentes.')

          cim_bad = []
          for branch, km, count in cim:
              ok, why = check(branch, km, count)
              print(('OK' if ok else 'RECOVER'), branch, why)
              if not ok:
                  cim_bad.append(f'{branch}: {why}')
          if cim_bad:
              needed.append(('.github/workflows/cim-wrf-3km-operational.yml', '; '.join(cim_bad)))

          seen = set()
          unique = []
          for workflow, reason in needed:
              if workflow in seen:
                  continue
              seen.add(workflow)
              unique.append((workflow, reason))

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a', encoding='utf-8') as handle:
              handle.write('workflows<<EOF\n')
              for workflow, reason in unique:
                  handle.write(f'{workflow}\t{reason}\n')
              handle.write('EOF\n')
          print('Workflows candidatos a recuperacao:', len(unique))
          PY

      - name: Reexecutar apenas produtos ausentes, antigos ou fora do contrato
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOWS: ${{ steps.health.outputs.workflows }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WORKFLOWS//$'\n'/}" ]]; then
            echo 'Todos os WRF estao saudaveis; nada a disparar.'
            exit 0
          fi

          while IFS=$'\t' read -r workflow reason; do
            [[ -n "$workflow" ]] || continue
            echo "Verificando atividade: $workflow"

            # Cancelar somente execucoes claramente travadas no checkout (>20 min).
            # Nunca cancelar jobs que ja estejam preparando/rodando WRF ou gerando ECMWF.
            runs_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 20 --json databaseId,status,createdAt)"
            while IFS=$'\t' read -r run_id created_at; do
              [[ -n "$run_id" && -n "$created_at" ]] || continue
              status="$(jq -r --argjson id "$run_id" '.[] | select(.databaseId == $id) | .status' <<< "$runs_json" | head -1)"
              [[ "$status" == "in_progress" ]] || continue
              age_seconds="$(( $(date -u +%s) - $(date -u -d "$created_at" +%s) ))"
              (( age_seconds > 1200 )) || continue
              jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs")"
              checkout_active="$(jq '[.jobs[]? | select(.status == "in_progress") | .steps[]? | select(.status == "in_progress") | select((.name | ascii_downcase) | contains("checkout"))] | length' <<< "$jobs_json")"
              if [[ "$checkout_active" != "0" ]]; then
                echo "CANCEL STUCK CHECKOUT: run=$run_id age=${age_seconds}s workflow=$workflow"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
                sleep 5
              fi
            done < <(jq -r '.[] | select(.status == "in_progress") | [.databaseId, .createdAt] | @tsv' <<< "$runs_json")

            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 20 --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')"
            if [[ "$active" != "0" ]]; then
              echo "SKIP: $workflow ja possui run ativa ($active). Motivo de saude: $reason"
              continue
            fi
            echo "RECOVERY DISPATCH: $workflow | $reason"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            sleep 12
          done <<< "$WORKFLOWS"
