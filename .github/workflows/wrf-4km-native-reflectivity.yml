name: WRF 4 km - REFL NATIVO - USE ESTE

# Nome legado preservado porque o workflow regional completo usa workflow_run.
# Este workflow agora e apenas um gatilho leve: confirma uma rodada GFS com F042
# e deixa o WRF regional 7 km F000-F040 executar em seguida em um unico runner.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: read

concurrency:
  group: sideral-wrf-native-daily
  cancel-in-progress: true

jobs:
  gfs-ready:
    name: Confirmar GFS com F042 disponivel
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Procurar ciclo GFS recente com F042
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import urllib.request

          now = dt.datetime.now(dt.timezone.utc)
          base = now.replace(hour=(now.hour // 6) * 6, minute=0, second=0, microsecond=0)
          for offset in range(0, 97, 6):
              run = base - dt.timedelta(hours=offset)
              date, cycle = run.strftime('%Y%m%d'), run.strftime('%H')
              url = f'https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{date}/{cycle}/atmos/gfs.t{cycle}z.pgrb2.0p25.f042'
              try:
                  req = urllib.request.Request(url, method='HEAD', headers={'User-Agent': 'Sideral-WRF-7km-trigger'})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      if response.status in (200, 206):
                          print(f'GFS PRONTO: {date} {cycle}Z possui F042; liberando WRF regional 7 km.')
                          raise SystemExit(0)
              except Exception:
                  continue
          raise SystemExit('Nenhuma rodada GFS recente com F042 disponivel.')
          PY
