    needs: [seg00, seg01, seg02, seg03, seg04, seg05, seg06, seg07, seg08, seg09, seg10, seg11, seg12, seg13]
    timeout-minutes: 90
    steps:
      - name: Checkout CBR
        uses: actions/checkout@v4
        with:
          ref: cbr-wrf-4km
          fetch-depth: 1
      - name: Pré-validar CBR antes de downloads
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cbr_checkpoint_segment.sh
            wrf/run_cbr_icon_wrf.sh
            wrf/run_cbr_ecmwf_wrf.sh
            wrf/run_cbr_gfs_wrf.sh
            wrf/run_cbr_wrf_with_source.sh
            wrf/run_cbr_restart_segment.sh
          )
          for f in "${scripts[@]}"; do
            test -f "$f" || { echo "ERRO: CBR script ausente: $f" >&2; exit 1; }
          done
          for f in "${scripts[@]}"; do
            bash -n "$f"
            stat -c 'CBR script: %A %a %n' "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/select_cbr_icon_run.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/cbr_extract_json.py wrf/cbr_postprocess.py wrf/validate_cbr_extraction.py
          test -s wrf/Vtable.ECMWF_OPEN || { echo "Vtable ECMWF CBR ausente" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("wrf/cbr_variable_catalog.json").read_text(encoding="utf-8"))
          if m.get("model") != "WRF CBR 4 KM":
              raise SystemExit(f"Catálogo CBR com model inválido: {m.get('model')!r}")
          if m.get("resolutionKm") != 4:
              raise SystemExit(f"Catálogo CBR deve declarar 4 km, veio {m.get('resolutionKm')!r}")
          domain = m.get("domain") or {}
          if (domain.get("e_we"), domain.get("e_sn")) != (401, 501):
              raise SystemExit(f"Grade de namelist CBR inválida: e_we={domain.get('e_we')}, e_sn={domain.get('e_sn')}; esperado 401x501")
          forecast = m.get("forecast") or {}
          if forecast.get("hours") != 42:
              raise SystemExit(f"Previsão CBR deve ter 42 h, veio {forecast.get('hours')!r}")
          print("CBR preflight: catálogo/grade de namelist OK (grade mass-point esperada 400x500)")
          PY
      - name: Baixar WRFOUT completo
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: cbr-wrf2-4km-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf cbr_raw_wrfout cbr_all_wrfout cbr_json cbr_products
          mkdir -p cbr_raw_wrfout cbr_all_wrfout
          gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'cbr-wrfout-*' --dir cbr_raw_wrfout --clobber
          for f in cbr_raw_wrfout/cbr-wrfout-*; do
            [[ -f "$f" ]] || continue
            n="$(basename "$f" | sed -E 's/^cbr-wrfout-[0-9]+-//; s/_([0-9]{2})[.]([0-9]{2})[.]([0-9]{2})$/_\1:\2:\3/')"
            mv -f "$f" "cbr_all_wrfout/$n"
          done
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'cbr-run.env' --dir . --clobber
          test -s cbr-run.env
          count="$(find cbr_all_wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c | wc -l)"
          test "$count" -gt 0
          echo "WRFOUT CBR baixados: $count"

      - name: Gerar JSON CBR
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q 'numpy>=1.24,<3' 'netCDF4>=1.6,<2'
          python3 wrf/cbr_extract_json.py --run-dir cbr_all_wrfout --output-dir cbr_json --run-env cbr-run.env --catalog wrf/cbr_variable_catalog.json --expected-start 0 --expected-end 42 --require-complete
          test -s cbr_json/metadata.json
          test "$(find cbr_json/frames -maxdepth 1 -type f -name 'f*.json.gz' | wc -l)" -eq 43 || { echo "Esperados 43 frames horários; extração incompleta" >&2; exit 1; }

      - name: Validar JSON CBR
        run: |
          set -euo pipefail
          python3 wrf/validate_cbr_extraction.py --metadata cbr_json/metadata.json --catalog wrf/cbr_variable_catalog.json --expected-start 0 --expected-end 42

      - name: Publicar JSON no branch cbr-wrf2-json-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf cbr_json_data_checkout
          git clone --depth 1 --branch cbr-wrf2-json-data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cbr_json_data_checkout

          # Runs may overlap. Never let a late-finishing older cycle overwrite newer CBR data.
          CANDIDATE_INIT="$(python3 -c 'import json; print(json.load(open("cbr_json/metadata.json"))["initTime"])')"
          CANDIDATE_END="$(python3 -c 'import json; m=json.load(open("cbr_json/metadata.json")); f=max(m["frames"], key=lambda x:int(x["forecastHour"])); print(f["time"])')"
          EXISTING_INIT="$(python3 -c 'import json; print(json.load(open("cbr_json_data_checkout/metadata.json")).get("initTime", ""))' 2>/dev/null || true)"
          EXISTING_END="$(python3 -c 'import json; m=json.load(open("cbr_json_data_checkout/metadata.json")); f=max(m.get("frames", []), key=lambda x:int(x.get("forecastHour", -1))); print(f.get("time", ""))' 2>/dev/null || true)"
          ALLOW_PUBLISH="$(python3 - "$CANDIDATE_INIT" "$CANDIDATE_END" "$EXISTING_INIT" "$EXISTING_END" <<'PY'
          import sys
          from datetime import datetime
          def parse(v):
              return datetime.fromisoformat(v.replace("Z", "+00:00")) if v else None
          ci, ce, ei, ee = map(parse, sys.argv[1:5])
          allow = ei is None or ci > ei or (ci == ei and (ee is None or ce >= ee))
          print("true" if allow else "false")
          PY
          )"
          if [[ "$ALLOW_PUBLISH" != "true" ]]; then
            echo "CBR mantém publicação existente: candidato init=$CANDIDATE_INIT fim=$CANDIDATE_END; público init=$EXISTING_INIT fim=$EXISTING_END."
            exit 0
          fi
          echo "Publicando CBR init=$CANDIDATE_INIT até $CANDIDATE_END."
          rm -rf cbr_json_data_checkout/frames
          mkdir -p cbr_json_data_checkout/frames
          cp -f cbr_json/metadata.json cbr_json_data_checkout/metadata.json
          cp -f cbr_json/frames/*.json.gz cbr_json_data_checkout/frames/
          cp -f wrf/cbr_variable_catalog.json cbr_json_data_checkout/variable_catalog.json
          cd cbr_json_data_checkout
          git config user.name "sideral-cbr-bot"
          git config user.email "sideralmeteorologia@gmail.com"
          git add metadata.json variable_catalog.json frames/
          git diff --cached --quiet && exit 0
          git commit -m "CBR WRF2: publicar ICON válido amanhã"
          git push origin cbr-wrf2-json-data

      - name: Publicar produtos compactos no Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: cbr-wrf2-4km-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          tar -czf cbr-products-4km.tar.gz -C cbr_json .
          test -s cbr-products-4km.tar.gz
          gh release upload "$CHECKPOINT_TAG" cbr-products-4km.tar.gz wrf/cbr_variable_catalog.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "CBR 4 KM: rodada completa publicada.";
