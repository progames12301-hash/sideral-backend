name: WRF2 CBR 4 KM — ICON válido amanhã

on:
  workflow_dispatch:
  schedule:
    - cron: '45 10 * * *'

permissions:
  contents: write
  actions: read

env:
  WRF2_TOMORROW: '1'
  WRF2_ICON_ONLY: '1'
  CBR_CHECKPOINT_PREFIX: cbr-wrf2-4km-checkpoint
  WRF_MPI_PROCS: 8
  WRF_TARGET_RESOLUTION_KM: 4
  WRF_DX_METERS: 4000
  WRF_DY_METERS: 4000
  WRF_E_WE: 401
  WRF_E_SN: 501
  WRF_TIME_STEP: 20
  WRF_HISTORY_INTERVAL_MINUTES: 60
  WRF_REF_LAT: -10.5
  WRF_REF_LON: -40.0
  WRF_STAND_LON: -40.0

jobs:
  seg00:
    name: CBR WRF2 ICON F000-F003
    runs-on: ubuntu-22.04
    
    timeout-minutes: 355
    steps:
      - name: Checkout CBR
        uses: actions/checkout@v4
        with:
          ref: cbr-wrf-4km
          fetch-depth: 1
      - name: Pré-validar CBR antes de downloads
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cbr_checkpoint_segment.sh
            wrf/run_cbr_icon_wrf.sh
            wrf/run_cbr_ecmwf_wrf.sh
            wrf/run_cbr_gfs_wrf.sh
            wrf/run_cbr_wrf_with_source.sh
            wrf/run_cbr_restart_segment.sh
          )
          for f in "${scripts[@]}"; do
            test -f "$f" || { echo "ERRO: CBR script ausente: $f" >&2; exit 1; }
          done
          for f in "${scripts[@]}"; do
            bash -n "$f"
            stat -c 'CBR script: %A %a %n' "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/select_cbr_icon_run.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/cbr_extract_json.py wrf/cbr_postprocess.py wrf/validate_cbr_extraction.py
          test -s wrf/Vtable.ECMWF_OPEN || { echo "Vtable ECMWF CBR ausente" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("wrf/cbr_variable_catalog.json").read_text(encoding="utf-8"))
          if m.get("model") != "WRF CBR 4 KM":
              raise SystemExit(f"Catálogo CBR com model inválido: {m.get('model')!r}")
          if m.get("resolutionKm") != 4:
              raise SystemExit(f"Catálogo CBR deve declarar 4 km, veio {m.get('resolutionKm')!r}")
          domain = m.get("domain") or {}
          if (domain.get("e_we"), domain.get("e_sn")) != (401, 501):
              raise SystemExit(f"Grade de namelist CBR inválida: e_we={domain.get('e_we')}, e_sn={domain.get('e_sn')}; esperado 401x501")
          forecast = m.get("forecast") or {}
          if forecast.get("hours") != 42:
              raise SystemExit(f"Previsão CBR deve ter 42 h, veio {forecast.get('hours')!r}")
          print("CBR preflight: catálogo/grade de namelist OK (grade mass-point esperada 400x500)")
          PY
      - name: Executar CBR F000-F003
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: cbr-wrf2-4km-checkpoint-${{ github.run_id }}
        run: |
          bash wrf/run_cbr_checkpoint_segment.sh 0 3 0 1
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbr-diagnostics-seg00
          path: |
            cbr_diagnostics/
            cbr_segment_output/rsl.*
          if-no-files-found: ignore
          retention-days: 7

