name: WRF 7 km SUL ECMWF - AUTOMATICO DIARIO

on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sul-ecmwf-7km
  cancel-in-progress: false

jobs:
  wrf:
    uses: ./.github/workflows/wrf-regional-7km-single.yml
    with:
      model: ecmwf
      domain: sul
      source_data_branch: ecmwf-data
      publish_branch: wrf-ecmwf-data
      run_script: run_ecmwf_wrf.sh
    secrets: inherit
