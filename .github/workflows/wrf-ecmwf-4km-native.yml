name: WRF 4 km ECMWF - REFL NATIVO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ECMWF IFS - PROXIMO DIA AUTOMATICO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-ecmwf-daily
  cancel-in-progress: true

jobs:
  wrf:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/wrf-source-parallel-reusable.yml
    with:
      model: ecmwf
      source_data_branch: ecmwf-data
      publish_branch: wrf-ecmwf-data
      run_script: run_ecmwf_wrf.sh
    secrets: inherit

