name: WRF 4 km ECMWF - REFL NATIVO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-ecmwf-4km-native.yml"
  schedule:
    # 23:30 UTC = 20:30 BRT
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-wrf-ecmwf-daily
  cancel-in-progress: false

jobs:
  short:
    name: ECMWF para WRF - primeira previsao
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    outputs:
      run_date: ${{ steps.runinfo.outputs.run_date }}
      run_cycle: ${{ steps.runinfo.outputs.run_cycle }}

    steps:
      - name: Checkout wrf-runner
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Liberar espaco
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h

      - name: Preparar Python e ecCodes
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ferramentas
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install requests ecmwf-opendata
          grib_set -V
          docker pull dtcenter/wps_wrf:latest

      - name: Rodar ECMWF para WRF 4 km ate F006
        env:
          WRF_RUN_HOURS: '6'
        run: |
          set -euxo pipefail
          chmod +x wrf/run_ecmwf_wrf.sh wrf/run_wrf_with_source.sh
          ./wrf/run_ecmwf_wrf.sh

      - name: Guardar rodada selecionada
        id: runinfo
        run: |
          set -euxo pipefail
          source wrf_diagnostics/run.env
          test "$SOURCE_MODEL" = ecmwf
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "run_cycle=$RUN_CYCLE" >> "$GITHUB_OUTPUT"
          echo "ECMWF rodada ${RUN_DATE} ${RUN_CYCLE}Z"

      - name: Instalar extrator WRF
        run: |
          python -m pip install numpy xarray netCDF4

      - name: Extrair REFL_10CM nativo
        run: |
          set -euxo pipefail
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py \
            --run-dir wrf_work/run \
            --run-env wrf_diagnostics/run.env \
            --output-dir wrf_publish \
            --grid-x 220 \
            --grid-y 180
          python wrf/retag_wrf_model.py --root wrf_publish --model ecmwf
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          d=json.loads(Path('wrf_publish/metadata.json').read_text(encoding='utf-8'))
          assert d.get('model')=='ecmwf', d
          assert d.get('reflectivitySource')=='REFL_10CM_NATIVE', d
          assert d.get('frameCount',0)>=7, d
          for f in d['frames']:
              with gzip.open(Path('wrf_publish')/f['file'],'rt',encoding='utf-8') as fh:
                  x=json.load(fh)
              assert x.get('model')=='ecmwf', x
              assert x.get('reflectivitySource')=='REFL_10CM_NATIVE', x
          print('ECMWF->WRF curto OK:', d['initTime'], d['frameCount'])
          PY

      - name: Publicar primeira previsao em wrf-ecmwf-data
        run: |
          set -euxo pipefail
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/sideral-wrf-ecmwf-data
          git worktree add --detach /tmp/sideral-wrf-ecmwf-data
          cd /tmp/sideral-wrf-ecmwf-data
          git checkout --orphan wrf-ecmwf-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          cat > README.md <<'EOF'
          # Sideral WRF ECMWF Data
          WRF Sul 4 km inicializado com atmosfera ECMWF IFS Open Data.
          Refletividade publicada: REFL_10CM nativo calculado pela microfisica do WRF.
          EOF
          git add .
          git commit -m "Publica ECMWF para WRF 4 km REFL nativo [skip render]"
          git push --force origin HEAD:wrf-ecmwf-data

      - name: Salvar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-ecmwf-short-diagnostics
          path: |
            wrf_diagnostics/
            wrf_publish/
          retention-days: 5
          if-no-files-found: warn

  next-day:
    name: ECMWF para WRF - 24 horas do proximo dia
    needs: short
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout wrf-runner
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Liberar espaco
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h

      - name: Preparar Python e ecCodes
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ferramentas
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install requests ecmwf-opendata numpy xarray netCDF4
          docker pull dtcenter/wps_wrf:latest

      - name: Aguardar ECMWF F045 da mesma rodada
        env:
          FORCE_RUN_DATE: ${{ needs.short.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.short.outputs.run_cycle }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os, time
          from pathlib import Path
          from ecmwf.opendata import Client
          client=Client(source='ecmwf',model='ifs')
          date=os.environ['FORCE_RUN_DATE']
          cycle=int(os.environ['FORCE_RUN_CYCLE'])
          for attempt in range(1,19):
              target=Path('/tmp/ecmwf-f45-test.grib2')
              target.unlink(missing_ok=True)
              try:
                  client.retrieve(date=date,time=cycle,type='fc',step=[45],param=['2t'],target=str(target))
                  if target.exists() and target.stat().st_size>1000:
                      print('ECMWF F045 disponivel na tentativa',attempt)
                      raise SystemExit(0)
              except Exception as exc:
                  print('ECMWF F045 ainda indisponivel:',repr(exc))
              if attempt<18:
                  time.sleep(300)
          raise SystemExit('ECMWF F045 nao ficou disponivel')
          PY

      - name: Continuar mesma rodada ECMWF ate F045
        env:
          WRF_RUN_HOURS: '45'
          FORCE_RUN_DATE: ${{ needs.short.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.short.outputs.run_cycle }}
        run: |
          set -euxo pipefail
          chmod +x wrf/run_ecmwf_wrf.sh wrf/run_wrf_with_source.sh
          ./wrf/run_ecmwf_wrf.sh

      - name: Extrair 24 horarios REFL_10CM nativo
        run: |
          set -euxo pipefail
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py \
            --run-dir wrf_work/run \
            --run-env wrf_diagnostics/run.env \
            --output-dir wrf_publish \
            --grid-x 220 \
            --grid-y 180
          python wrf/retag_wrf_model.py --root wrf_publish --model ecmwf
          python wrf/filter_next_day.py --root wrf_publish
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('wrf_publish/metadata.json').read_text(encoding='utf-8'))
          assert d.get('model')=='ecmwf', d
          assert d.get('reflectivitySource')=='REFL_10CM_NATIVE', d
          assert d.get('scope')=='next_local_day', d
          assert d.get('frameCount')==24, d
          assert d.get('localHours')==list(range(24)), d
          print('ECMWF->WRF 24h OK:', d['forecastLocalDate'])
          PY

      - name: Publicar 24 horas em wrf-ecmwf-data
        run: |
          set -euxo pipefail
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/sideral-wrf-ecmwf-data
          git worktree add --detach /tmp/sideral-wrf-ecmwf-data
          cd /tmp/sideral-wrf-ecmwf-data
          git checkout --orphan wrf-ecmwf-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          cat > README.md <<'EOF'
          # Sideral WRF ECMWF Data
          Previsao WRF Sul 4 km inicializada pelo ECMWF IFS.
          24 quadros horarios do proximo dia em BRT.
          Refletividade: REFL_10CM nativo do WRF.
          EOF
          git add .
          git commit -m "Publica ECMWF-WRF 4 km horario do proximo dia [skip render]"
          git push --force origin HEAD:wrf-ecmwf-data

      - name: Confirmar publicacao
        run: |
          set -euxo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/wrf-ecmwf-data/metadata.json?run=${GITHUB_RUN_ID}"
          for N in $(seq 1 12); do
            if curl -fsSL --connect-timeout 10 --max-time 30 "$URL-$N" -o /tmp/meta.json; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/meta.json',encoding='utf-8'))
          ok=(d.get('model')=='ecmwf' and d.get('frameCount')==24 and d.get('reflectivitySource')=='REFL_10CM_NATIVE' and d.get('localHours')==list(range(24)))
          print(d)
          raise SystemExit(0 if ok else 1)
          PY
              then exit 0; fi
            fi
            sleep 5
          done
          exit 41

      - name: Salvar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-ecmwf-nextday-diagnostics
          path: |
            wrf_diagnostics/
            wrf_publish/
          retention-days: 5
          if-no-files-found: warn
