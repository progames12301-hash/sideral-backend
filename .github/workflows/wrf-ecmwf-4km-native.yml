name: WRF 4 km ECMWF - 48H REFL NATIVO

on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-ecmwf-4km-native.yml"
      - ".github/workflows/wrf-regional-48h-reusable.yml"
  workflow_run:
    workflows: ["ECMWF IFS - PROXIMO DIA AUTOMATICO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-ecmwf-daily
  cancel-in-progress: false

jobs:
  wrf:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/wrf-regional-48h-reusable.yml
    with:
      model: ecmwf
      source_data_branch: ecmwf-data
      publish_branch: wrf-ecmwf-data
      run_script: run_ecmwf_wrf.sh
      publish_severe: false
    secrets: inherit
