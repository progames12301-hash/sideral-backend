name: WRF 7 km SUL ECMWF - REFL NATIVO

on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * *'
  workflow_run:
    workflows: ["ECMWF IFS - PROXIMO DIA AUTOMATICO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-ecmwf-daily
  cancel-in-progress: false

jobs:
  wrf:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/wrf-regional-7km-single.yml
    with:
      model: ecmwf
      domain: sul
      source_data_branch: ecmwf-data
      publish_branch: wrf-ecmwf-data
      run_script: run_ecmwf_wrf.sh
    secrets: inherit
