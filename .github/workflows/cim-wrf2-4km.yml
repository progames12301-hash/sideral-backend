name: CIM WRF2 4 KM - ICON valido amanha · 40h horario

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cim-wrf2-4km.yml'
      - '.github/workflows/cim-wrf-4km-reusable.yml'
      - 'wrf/publish_sideral_checkpoint_json.py'
  schedule:
    - cron: '17 19 * * *'
  # Rebuild after CIM 4 km runner maintenance.
  # Retry with persisted WRF2 ICON-only mode across all restart segments.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  operational:
    name: CIM 4 km WRF2
    uses: ./.github/workflows/cim-wrf-4km-reusable.yml
    with:
      wrf2: true
      scheduled_cycle: '12'
    secrets: inherit
