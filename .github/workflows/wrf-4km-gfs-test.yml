name: WRF 4 km - GFS F000-F006 + JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrf-test:
    name: Rodar WRF Sul 4 km e publicar JSON
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout branch WRF
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Identificar versao
        run: |
          echo "SIDERAL WRF 4KM GFS JSON V2"
          echo "Branch de processamento: wrf-runner"
          git rev-parse --short HEAD

      - name: Liberar espaco do runner
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h

      - name: Baixar container WRF/WPS
        run: |
          set -euxo pipefail
          docker pull dtcenter/wps_wrf:latest
          docker image ls dtcenter/wps_wrf:latest
          df -h

      - name: Executar GFS WPS WRF 4 km
        run: |
          chmod +x wrf/run_gfs_test.sh
          ./wrf/run_gfs_test.sh

      - name: Preparar Python para extracao
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias do extrator
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy xarray netCDF4

      - name: Extrair WRF para JSON gzip compacto
        run: |
          set -euxo pipefail
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py \
            --run-dir wrf_work/run \
            --run-env wrf_diagnostics/run.env \
            --output-dir wrf_publish \
            --grid-x 220 \
            --grid-y 180
          echo "=== ARQUIVOS PUBLICAVEIS ==="
          find wrf_publish -type f -maxdepth 3 -print -exec ls -lh {} \;
          python - <<'PY'
          import gzip, json, pathlib
          meta = json.loads(pathlib.Path('wrf_publish/metadata.json').read_text(encoding='utf-8'))
          assert meta['frameCount'] >= 3, meta
          for frame in meta['frames']:
              p = pathlib.Path('wrf_publish') / frame['file']
              with gzip.open(p, 'rt', encoding='utf-8') as f:
                  data = json.load(f)
              assert len(data['fields']['lat']) == data['gridX'] * data['gridY']
              assert len(data['fields']['reflectivity']) == data['gridX'] * data['gridY']
              print(frame['forecastHour'], frame['validTime'], p, p.stat().st_size)
          PY

      - name: Publicar somente dados na branch wrf-data
        run: |
          set -euxo pipefail
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/sideral-wrf-data
          git worktree add --detach /tmp/sideral-wrf-data
          cd /tmp/sideral-wrf-data
          git checkout --orphan wrf-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          cat > README.md <<'EOF'
          # Sideral WRF Data
          Dados processados do WRF 4 km gerados automaticamente pelo GitHub Actions.
          Os arquivos GRIB, WPS e wrfout não são publicados nesta branch.
          EOF
          git add .
          git commit -m "Atualiza dados WRF 4 km GFS [skip render]"
          git push --force origin HEAD:wrf-data
          echo "Dados publicados em wrf-data"

      - name: Salvar JSON como diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-4km-json-preview
          path: wrf_publish/
          retention-days: 7
          if-no-files-found: warn

      - name: Salvar diagnosticos WRF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-4km-gfs-test-diagnostics
          path: wrf_diagnostics/
          retention-days: 7
          if-no-files-found: warn
