name: SIDERAL WRF Brasil 12 km - 48h horario

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Rodada GFS em YYYYMMDD (vazio = mais recente com F048)"
        required: false
        type: string
      run_cycle:
        description: "Ciclo GFS: 00, 06, 12 ou 18 (vazio = mais recente com F048)"
        required: false
        type: string
  schedule:
    - cron: '25 5 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-wrf-brasil-12km-daily
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  WRF_TARGET_RESOLUTION_KM: '12'
  WRF_DX_METERS: '12000'
  WRF_DY_METERS: '12000'
  WRF_HISTORY_INTERVAL_MINUTES: '60'
  WRF_START_HOUR: '0'
  WRF_END_HOUR: '48'
  WRF_RUN_HOURS: '48'
  WRF_TIME_STEP: '60'
  WRF_E_WE: '421'
  WRF_E_SN: '421'
  WRF_GRID_X: '420'
  WRF_GRID_Y: '420'

jobs:
  brasil:
    name: GFS -> WRF Brasil 12 km F000-F048 horario
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Preparar runner
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          docker pull dtcenter/wps_wrf:latest
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias de extracao
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'xarray>=2024.1,<2026' 'netCDF4>=1.7,<2' 'scipy>=1.11,<2' 'requests>=2.31'

      - name: Resolver rodada GFS com F048
        id: run
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date || '' }}
          INPUT_RUN_CYCLE: ${{ inputs.run_cycle || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import os
          import urllib.request

          requested_date = os.environ.get('INPUT_RUN_DATE', '').strip().replace('-', '')
          requested_cycle_raw = os.environ.get('INPUT_RUN_CYCLE', '').strip()
          requested_cycle_digits = ''.join(ch for ch in requested_cycle_raw if ch.isdigit())
          requested_cycle = requested_cycle_digits.zfill(2)[:2] if requested_cycle_digits else ''
          manual_requested = bool(requested_date or requested_cycle_raw)

          def ready(date, cycle):
              url = f'https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{date}/{cycle}/atmos/gfs.t{cycle}z.pgrb2.0p25.f048'
              try:
                  req = urllib.request.Request(url, method='HEAD', headers={'User-Agent': 'Sideral-WRF-Brasil-12km'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status in (200, 206)
              except Exception:
                  return False

          selected = None
          if manual_requested:
              if len(requested_date) != 8 or not requested_date.isdigit():
                  raise SystemExit('run_date deve estar em YYYYMMDD quando a rodada manual for usada')
              if requested_cycle not in {'00', '06', '12', '18'}:
                  raise SystemExit('run_cycle deve ser 00, 06, 12 ou 18 quando a rodada manual for usada')
              if not ready(requested_date, requested_cycle):
                  raise SystemExit(f'GFS {requested_date} {requested_cycle}Z ainda nao possui F048')
              selected = (requested_date, requested_cycle)
          else:
              now = dt.datetime.now(dt.timezone.utc)
              base = now.replace(hour=(now.hour // 6) * 6, minute=0, second=0, microsecond=0)
              for offset in range(0, 97, 6):
                  run = base - dt.timedelta(hours=offset)
                  date, cycle = run.strftime('%Y%m%d'), run.strftime('%H')
                  if ready(date, cycle):
                      selected = (date, cycle)
                      break

          if selected is None:
              raise SystemExit('Nenhuma rodada GFS recente com F048 disponivel')

          run_date, run_cycle = selected
          init_time = dt.datetime.strptime(run_date + run_cycle, '%Y%m%d%H').replace(tzinfo=dt.timezone.utc).isoformat().replace('+00:00', 'Z')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run_date={run_date}\n')
              output.write(f'run_cycle={run_cycle}\n')
              output.write(f'init_time={init_time}\n')
          print(f'GFS selecionado: {run_date} {run_cycle}Z; Brasil 12 km F000-F048 horario')
          PY

      - name: Adaptar executor para Brasil 12 km
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Padrao nao encontrado em {path}: {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          replace('wrf/extract_wrf_json.py', [
              ('data.get("resolutionKm") != 4', 'data.get("resolutionKm") != 12'),
              ('resolutionKm=4', 'resolutionKm=12'),
              ('(4000, 4000)', '(12000, 12000)'),
              ('WRF 4 km', 'WRF Brasil 12 km'),
          ])
          replace('wrf/extract_wrf_severe.py', [
              ('(4000, 4000)', '(12000, 12000)'),
              ('WRF2 4 km', 'WRF Brasil 12 km'),
              ('WRF 4 km', 'WRF Brasil 12 km'),
          ])
          replace('wrf/extract_wrf_json_core.py', [
              ('"source": "WRF 4 km GFS (REFL_10CM nativo)"', '"source": "SIDERAL WRF Brasil 12 km GFS (REFL_10CM nativo)"'),
              ('"resolutionKm": 4,', '"resolutionKm": 12,'),
              ('WRF 2 Sudeste 4 km', 'SIDERAL WRF Brasil 12 km'),
          ])

          p = Path('wrf/run_gfs_test.sh')
          text = p.read_text(encoding='utf-8')
          pairs = [
              (' e_we              = 300,', ' e_we              = 421,'),
              (' e_sn              = 360,', ' e_sn              = 421,'),
              (' e_we = 300,', ' e_we = 421,'),
              (' e_sn = 360,', ' e_sn = 421,'),
              (' dx = 4000,', ' dx = 12000,'),
              (' dy = 4000,', ' dy = 12000,'),
              (' ref_lat   = -28.10,', ' ref_lat   = -14.50,'),
              (' ref_lon   = -53.45,', ' ref_lon   = -54.00,'),
              (' truelat1  = -25.0,', ' truelat1  = -10.0,'),
              (' truelat2  = -35.0,', ' truelat2  = -30.0,'),
              (' stand_lon = -53.45,', ' stand_lon = -54.00,'),
              (' time_step = 18,', ' time_step = 60,'),
              (' e_vert = 45,', ' e_vert = 40,'),
              (' cu_physics = 0,', ' cu_physics = 3,'),
              (' cudt = 0,', ' cudt = 5,'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'Padrao GFS ausente: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          print('Executor preparado: 12 km, 421x421 WRF, 40 niveis, cumulus ativo, saida horaria.')
          PY

      - name: Executar WRF Brasil 12 km em um unico runner
        env:
          FORCE_RUN_DATE: ${{ steps.run.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ steps.run.outputs.run_cycle }}
          WRF_COLD_START: '1'
          WRF_START_HOUR: '0'
          WRF_END_HOUR: '48'
          WRF_RUN_HOURS: '48'
          WRF_HISTORY_INTERVAL_MINUTES: '60'
          WRF_DX_METERS: '12000'
          WRF_DY_METERS: '12000'
          WRF_TIME_STEP: '60'
          WRF_E_WE: '421'
          WRF_E_SN: '421'
          WRF_REF_LAT: '-14.50'
          WRF_REF_LON: '-54.00'
          WRF_STAND_LON: '-54.00'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x wrf/run_gfs_segment.sh
          wrf/run_gfs_segment.sh
          grep -q 'SUCCESS COMPLETE WRF' wrf_work/run/rsl.error.0000
          echo 'SUCCESS COMPLETE WRF confirmado para Brasil 12 km.'
          ls -lh wrf_work/run/wrfout_d01_* | tail -10
          df -h

      - name: Liberar espaco antes da extracao
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf wrf_work/gfs wrf_work/geog_extract wrf_work/WPS_GEOG wrf_work/geog wrf_work/geog.tar.gz || true
          rm -f wrf_work/GRIBFILE.* wrf_work/FILE:* wrf_work/met_em.d01.* wrf_work/geo_em.d01.nc || true
          docker image rm dtcenter/wps_wrf:latest || true
          docker system prune -af || true
          df -h

      - name: Extrair produto nacional nativo e diagnosticos severos
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py \
            --run-dir wrf_work/run \
            --run-env wrf_diagnostics/run.env \
            --output-dir wrf_publish \
            --grid-x 420 \
            --grid-y 420

      - name: Validar Brasil 12 km F000-F048
        env:
          EXPECTED_INIT: ${{ steps.run.outputs.init_time }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path('wrf_publish')
          path = root / 'metadata.json'
          meta = json.loads(path.read_text(encoding='utf-8'))
          frames = sorted(meta.get('frames') or [], key=lambda x: int(x['forecastHour']))
          hours = [int(frame['forecastHour']) for frame in frames]

          assert hours == list(range(49)), hours
          assert int(meta.get('frameCount', 0)) == 49, meta.get('frameCount')
          assert int(meta.get('resolutionKm')) == 12, meta.get('resolutionKm')
          assert meta.get('reflectivitySource') == 'REFL_10CM_NATIVE', meta
          assert meta.get('wrf2SevereDiagnostics') is True, meta.get('wrf2SevereDiagnostics')
          assert str(meta.get('initTime')) == os.environ['EXPECTED_INIT'], (meta.get('initTime'), os.environ['EXPECTED_INIT'])

          for index, frame in enumerate(frames):
              frame['index'] = index
              assert int(frame['gridX']) == 420 and int(frame['gridY']) == 420, frame
              assert frame.get('reflectivitySource') == 'REFL_10CM_NATIVE', frame
              assert (root / frame['file']).is_file(), frame
              assert frame.get('severeFile') and (root / frame['severeFile']).is_file(), frame

          with gzip.open(root / frames[0]['file'], 'rt', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert int(payload['dxMeters']) == 12000 and int(payload['dyMeters']) == 12000, payload
          assert int(payload['gridX']) == 420 and int(payload['gridY']) == 420, payload
          assert payload.get('reflectivitySource') == 'REFL_10CM_NATIVE', payload

          shutil.rmtree(root / 'soundings', ignore_errors=True)
          for frame in frames:
              frame.pop('soundingFile', None)

          meta.update({
              'product': 'SIDERAL WRF Brasil 12 km',
              'domain': 'brasil',
              'domainName': 'Brasil inteiro',
              'resolutionKm': 12,
              'nativeGrid': True,
              'singleRunner': True,
              'frameCount': 49,
              'temporalResolutionMinutes': 60,
              'forecastHourStart': 0,
              'forecastHourEnd': 48,
              'horizonHours': 48,
              'status': 'complete',
              'scope': 'brazil_48_hours_hourly',
              'displayBoundingBoxTarget': {
                  'west': -75.5, 'east': -32.0, 'south': -35.5, 'north': 7.0
              },
              'wrfGridConfig': {
                  'e_we': 421, 'e_sn': 421, 'gridX': 420, 'gridY': 420,
                  'dxMeters': 12000, 'dyMeters': 12000,
                  'refLat': -14.50, 'refLon': -54.00, 'standLon': -54.00,
                  'timeStepSeconds': 60, 'verticalLevels': 40,
                  'historyIntervalMinutes': 60,
                  'integrationHours': 48, 'publishedHorizonHours': 48,
                  'cumulusPhysics': 3
              },
              'frames': frames,
          })
          path.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          print('BRASIL 12 KM VALIDADO: F000-F048 horario, 420x420, REFL_10CM_NATIVE + diagnosticos severos.')
          PY
          rm -f wrf_work/run/wrfout_d01_* || true
          df -h

      - name: Publicar branch WRF Brasil 12 km
        shell: bash
        run: |
          set -euxo pipefail
          BRANCH='wrf-brasil-12km-data'
          git config user.name 'sideral-wrf-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target="/tmp/${BRANCH}"
          rm -rf "$target"
          git worktree add --detach "$target"
          cd "$target"
          git checkout --orphan "${BRANCH}-next"
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          printf '# SIDERAL WRF Brasil 12 km\nGFS -> WRF · Brasil inteiro · F000-F048 de 1 em 1 hora · REFL_10CM nativo · grade nativa · diagnosticos severos.\n' > README.md
          git add .
          git commit -m 'SIDERAL WRF Brasil 12 km: F000-F048 horario [skip render]'
          git push --force origin "HEAD:${BRANCH}"
          echo "PUBLICADO: ${BRANCH}"

      - name: Guardar diagnosticos se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-brasil-12km-diagnostics-${{ github.run_id }}
          path: |
            wrf_diagnostics/
            wrf_work/run/rsl.error.0000
            wrf_work/run/rsl.out.0000
          retention-days: 3
          if-no-files-found: warn