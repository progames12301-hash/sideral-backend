name: ECMWF IFS - PROXIMO DIA AUTOMATICO

# Publica o IFS HRES em 0-120h com superficie, pressao/isobaras e niveis de pressao.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecmwf-ifs-auto.yml"
      - "wrf/ecmwf_ifs_runner.py"
  schedule:
    - cron: '10 10 * * *'
    - cron: '10 22 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-ecmwf-ifs-daily
  cancel-in-progress: false

jobs:
  ecmwf-ifs:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout wrf-runner
        uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias ECMWF
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy scipy requests eccodes ecmwf-opendata

      - name: Limitar leitura do GRIB ao dominio da America do Sul
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('wrf/ecmwf_ifs_runner.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def read_grib(path: Path) -> list[dict]:')
          end = text.index('\ndef grib_step', start)
          replacement = '''def read_grib(path: Path) -> list[dict]:
              """Read GRIB messages while retaining only South America in RAM."""
              out = []
              with path.open("rb") as fh:
                  while True:
                      gid = codes_grib_new_from_file(fh)
                      if gid is None:
                          break
                      try:
                          item = {"shortName": str(codes_get(gid, "shortName")), "values": None}
                          for key in ("endStep", "forecastTime", "level", "typeOfLevel", "units"):
                              try:
                                  item[key] = codes_get(gid, key)
                              except Exception:
                                  item[key] = None
                          lat = np.asarray(codes_get_array(gid, "latitudes"), dtype=float)
                          lon = np.asarray(codes_get_array(gid, "longitudes"), dtype=float)
                          lon = ((lon + 180.0) % 360.0) - 180.0
                          mask = ((lat >= SOUTH - 1.0) & (lat <= NORTH + 1.0) &
                                  (lon >= WEST - 1.0) & (lon <= EAST + 1.0))
                          idx = np.flatnonzero(mask)
                          if idx.size < 100:
                              raise RuntimeError(f"Poucos pontos no dominio {path.name}: {idx.size}")
                          values = np.asarray(codes_get_values(gid), dtype=float)
                          item["latitudes"] = lat[idx]
                          item["longitudes"] = lon[idx]
                          item["values"] = values[idx]
                          out.append(item)
                      finally:
                          codes_release(gid)
              if not out:
                  raise RuntimeError(f"GRIB vazio: {path}")
              return out
          '''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('Extrator IFS: leitura regional ativa para', p)
          PY

      - name: Gerar IFS 0-120h
        run: |
          set -euxo pipefail
          rm -rf ecmwf_publish
          python wrf/ecmwf_ifs_runner.py --output ecmwf_publish

      - name: Validar produto
        run: |
          set -euxo pipefail
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          meta = json.loads(Path('ecmwf_publish/metadata.json').read_text(encoding='utf-8'))
          assert meta['model'] == 'ecmwf-ifs', meta
          assert meta['runCycle'].startswith(('00Z','12Z')), meta
          assert meta['frameCount'] == 40, meta
          assert meta['forecastHours'][0] == 3 and meta['forecastHours'][-1] == 120, meta
          assert meta['temporalResolutionMinutes'] == 180, meta
          assert meta['resolutionKm'] == 9, meta
          assert meta['publishedGridDegrees'] == 0.25, meta
          for key in ('temperature','humidity','pressure','isobars','precipitation','mucape','bulkShear','upperAir','vorticity850','waterVapor'):
              assert meta['capabilities'][key] is True, key
          for f in meta['frames']:
              p = Path('ecmwf_publish') / f['file']
              assert p.stat().st_size > 0, p
              with gzip.open(p, 'rt', encoding='utf-8') as fh:
                  payload = json.load(fh)
              for key in ('temperature','humidity','pressure','mslp','windSpeed','precipitation','mucape','bulkShear','vorticity850','waterVapor','upperAir'):
                  assert key in payload['fields'], (f['file'], key)
          print('IFS validado:', meta['runDate'], meta['runCycle'], 'frames=', meta['frameCount'])
          PY

      - name: Publicar em ecmwf-data
        run: |
          set -euxo pipefail
          git config user.name "sideral-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/sideral-ecmwf-data
          git worktree add --detach /tmp/sideral-ecmwf-data
          cd /tmp/sideral-ecmwf-data
          git checkout --orphan ecmwf-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/ecmwf_publish/." .
          cat > README.md <<'EOF'
          # Sideral ECMWF IFS Data
          IFS HRES Open Data 0.25 grau (~9 km de resolucao do modelo), publicado em grade regular 0.25 grau para a America do Sul.
          Frames de 3 em 3 horas de F003 a F120.
          Inclui superficie, MSLP para isobaras, precipitacao/QPF, MUCAPE, cisalhamento 925-500 hPa e campos em 925/850/700/500/300/200 hPa.
          Refletividade radar nao e sintetizada.
          EOF
          git add .
          git commit -m "Atualiza ECMWF IFS 0-120h [skip render]"
          git push --force origin HEAD:ecmwf-data

      - name: Confirmar publicacao
        run: |
          set -euxo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ecmwf-data/metadata.json?run=${GITHUB_RUN_ID}"
          for N in $(seq 1 18); do
            if curl -fsSL --connect-timeout 10 --max-time 30 "$URL-$N" -o /tmp/ecmwf-meta.json; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/ecmwf-meta.json',encoding='utf-8'))
          ok=(d.get('model')=='ecmwf-ifs' and d.get('frameCount')==40 and d.get('forecastHours',[None])[0]==3 and d.get('forecastHours',[None])[-1]==120)
          print(d.get('runDate'), d.get('runCycle'), d.get('frameCount'))
          raise SystemExit(0 if ok else 1)
          PY
              then
                echo "ECMWF-DATA PUBLICADO"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 41

      - name: Salvar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecmwf-ifs-0-120h
          path: ecmwf_publish/
          retention-days: 3
          if-no-files-found: warn
