name: Publish Skew-T — WRF Sul 7 km GFS

on:
  workflow_run:
    workflows: ["WRF 7 km SUL GFS - AUTOMATICO DIARIO"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ID da execução concluída do WRF Sul 7 km
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: skewt-publish-wrf-sul-gfs-7km-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/skewt-wrf-publish-reusable.yml
    permissions:
      contents: write
      actions: read
    with:
      source-run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      expected-source-workflow: "WRF 7 km SUL GFS - AUTOMATICO DIARIO"
      model-key: "wrf-sul-gfs-7km"
      model-label: "WRF Sul 7 km GFS"
      resolution-km: "7"
      source-mode: artifact
      artifact-name: "skewt-wrfout-sul-gfs-7km"
