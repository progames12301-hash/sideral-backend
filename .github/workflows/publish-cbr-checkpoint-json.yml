name: Publish CBR compact checkpoint JSON

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cbr-checkpoint-json.yml'
      - 'wrf/publish_compact_checkpoint_json.py'
      - 'wrf/cbr_variable_catalog.json'
  repository_dispatch:
    types: [cbr-checkpoint-published]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execução CBR; vazio seleciona a execução mais recente"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: cbr-json-data-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish latest CBR checkpoint without re-running WRF
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_BRANCH: cbr-json-data
      RUN_ENV_FILE: cbr-run.env
      WORKFLOW_FILE: wrf-cbr-4km.yml
      MODEL: cbr
      MAX_HOUR: "42"
    steps:
      - name: Checkout publisher and converter
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Select newest available checkpoint and check whether JSON needs updating
        id: checkpoint
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.client_payload.run_id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          FORCE_REPUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          RUN_ID=""
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            RUN_ID="$EVENT_RUN_ID"
          elif [[ -n "$INPUT_RUN_ID" ]]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW_FILE" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Não foi possível identificar uma execução CBR válida; publicação adiada."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="cbr-wrf-4km-checkpoint-$RUN_ID"
          RELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets 2>/dev/null || true)"
          if [[ -z "$RELEASE" ]]; then
            echo "Checkpoint $TAG ainda não existe; aguardando o próximo segmento."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSET_COUNT="$(jq '[.assets[].name | select(test("^[0-9]{8}_[0-9]{6}[.]npz$"))] | length' <<< "$RELEASE")"
          LATEST_NPZ="$(jq -r '[.assets[].name | select(test("^[0-9]{8}_[0-9]{6}[.]npz$"))] | sort | last // empty' <<< "$RELEASE")"
          if [[ "$ASSET_COUNT" -lt 1 || -z "$LATEST_NPZ" ]]; then
            echo "Checkpoint $TAG ainda não publicou os NPZ compactos; publicação adiada."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p checkpoint_probe
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$RUN_ENV_FILE" --dir checkpoint_probe --clobber
          if gh api "repos/$GITHUB_REPOSITORY/contents/metadata.json?ref=$DATA_BRANCH" > existing-api.json 2>/dev/null; then
            jq -r '.content' existing-api.json | base64 --decode > existing-metadata.json
          else
            printf '{"initTime":"","frames":[],"frameCount":0,"status":"partial"}\n' > existing-metadata.json
          fi
          SHOULD_PUBLISH="$(python3 - "$RUN_ENV_FILE" "$LATEST_NPZ" "$ASSET_COUNT" existing-metadata.json "$FORCE_REPUBLISH" <<'PY'
          import json, re, sys
          from datetime import datetime, timezone
          from pathlib import Path
          env_path = Path("checkpoint_probe") / sys.argv[1]
          values = {}
          for line in env_path.read_text(encoding="utf-8").splitlines():
              if "=" in line and not line.strip().startswith("#"):
                  k, v = line.split("=", 1); values[k.strip()] = v.strip().strip('"').strip("'")
          date = values.get("RUN_DATE", "").replace("-", "")
          cycle = values.get("RUN_CYCLE", "")
          if not re.fullmatch(r"\d{8}", date) or cycle not in {"00","06","12","18"}:
              raise SystemExit(f"RUN_DATE/RUN_CYCLE inválidos em {env_path}")
          candidate_init = datetime.strptime(date + cycle, "%Y%m%d%H").replace(tzinfo=timezone.utc)
          match = re.fullmatch(r"(\d{8})_(\d{6})\.npz", sys.argv[2])
          if not match:
              raise SystemExit("Nome NPZ inesperado: " + sys.argv[2])
          candidate_end = datetime.strptime(match.group(1) + match.group(2), "%Y%m%d%H%M%S").replace(tzinfo=timezone.utc)
          candidate_count = int(sys.argv[3])
          force = sys.argv[5].lower() == "true"
          try:
              existing = json.loads(Path(sys.argv[4]).read_text(encoding="utf-8"))
          except Exception:
              existing = {}
          ei = existing.get("initTime")
          if not ei:
              publish = True
          else:
              existing_init = datetime.fromisoformat(ei.replace("Z", "+00:00"))
              frames = existing.get("frames") or []
              last = max(frames, key=lambda f: int(f.get("forecastHour", -1))) if frames else {}
              end_s = last.get("time") or last.get("validTime")
              existing_end = datetime.fromisoformat(end_s.replace("Z", "+00:00")) if end_s else None
              existing_count = int(existing.get("frameCount", len(frames)))
              if candidate_init < existing_init:
                  publish = False
              elif force or candidate_init > existing_init:
                  publish = True
              elif existing.get("status") == "complete" and candidate_count < int(existing.get("frameCount", 0)):
                  publish = False
              else:
                  publish = (existing_end is None or candidate_end > existing_end or candidate_count > existing_count)
          print("true" if publish else "false")
          PY
          )"
          if [[ "$SHOULD_PUBLISH" != "true" ]]; then
            echo "JSON CBR já cobre este checkpoint ou uma previsão mais nova; nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest_npz=$LATEST_NPZ" >> "$GITHUB_OUTPUT"
          echo "asset_count=$ASSET_COUNT" >> "$GITHUB_OUTPUT"
          echo "CBR incremental selecionado: $TAG; NPZ=$ASSET_COUNT; último=$LATEST_NPZ."

      - name: Download compact NPZ checkpoint assets
        if: steps.checkpoint.outputs.publish == 'true'
        env:
          TAG: ${{ steps.checkpoint.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf cbr_input cbr_publish
          mkdir -p cbr_input
          cp checkpoint_probe/cbr-run.env cbr_input/cbr-run.env
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.npz' --dir cbr_input --clobber
          test -n "$(find cbr_input -maxdepth 1 -type f -name '*.npz' -size +0c -print -quit)"
          python3 -m pip install --disable-pip-version-check -q 'numpy>=1.24,<3'

      - name: Build incremental JSON from compact NPZs
        if: steps.checkpoint.outputs.publish == 'true'
        env:
          RUN_ID: ${{ steps.checkpoint.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 -m py_compile wrf/publish_compact_checkpoint_json.py
          python3 wrf/publish_compact_checkpoint_json.py --model cbr --input-dir cbr_input --run-env cbr_input/cbr-run.env --output-dir cbr_publish --source-run-id "$RUN_ID"
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path("cbr_publish")
          meta = json.loads((root / "metadata.json").read_text(encoding="utf-8"))
          files = sorted((root / "frames").glob("f*.json.gz"))
          assert meta["modelKey"] == "cbr_wrf_4km"
          assert meta["frameCount"] == len(files) >= 1
          assert meta["status"] in {"partial", "complete"}
          assert len({int(f["forecastHour"]) for f in meta["frames"]}) == meta["frameCount"]
          for f in files:
              with gzip.open(f, "rt", encoding="utf-8") as stream:
                  item = json.load(stream)
              assert item["modelKey"] == "cbr_wrf_4km"
              assert item["fields"]["lat"] and item["fields"]["lon"]
          print(f"CBR JSON validado: {meta['frameCount']}/43 frames; status={meta['status']}; init={meta['initTime']}")
          PY

      - name: Publish CBR metadata and frames with a sparse checkout
        if: steps.checkpoint.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf cbr_data_checkout
          git clone --filter=blob:none --depth 1 --sparse --branch cbr-json-data \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" cbr_data_checkout
          cd cbr_data_checkout
          git sparse-checkout set --no-cone README.md metadata.json variable_catalog.json
          mkdir -p frames
          cp -f ../cbr_publish/metadata.json metadata.json
          cp -f ../wrf/cbr_variable_catalog.json variable_catalog.json
          cp -f ../cbr_publish/frames/*.json.gz frames/
          git config user.name "sideral-cbr-bot"
          git config user.email "sideralmeteorologia@gmail.com"
          git add --sparse metadata.json variable_catalog.json frames/
          if git diff --cached --quiet; then
            echo "CBR: branch já contém os mesmos dados."
            exit 0
          fi
          git commit -m "publish: CBR WRF 4 km checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin cbr-json-data
