name: WRF 4 km ICON - REFL NATIVO

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 20:00 BRT
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-wrf-icon-daily
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  short:
    name: ICON para WRF - primeira previsao F006
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    outputs:
      run_date: ${{ steps.runinfo.outputs.run_date }}
      run_cycle: ${{ steps.runinfo.outputs.run_cycle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - name: Liberar espaco
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install requests numpy xarray netCDF4
          docker pull dtcenter/wps_wrf:latest
      - name: Rodar ICON ate F006
        env:
          WRF_RUN_HOURS: '6'
        run: |
          chmod +x wrf/run_icon_wrf.sh wrf/run_wrf_with_source.sh
          ./wrf/run_icon_wrf.sh
      - name: Guardar rodada
        id: runinfo
        run: |
          source wrf_diagnostics/run.env
          test "$SOURCE_MODEL" = icon
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "run_cycle=$RUN_CYCLE" >> "$GITHUB_OUTPUT"
      - name: Extrair primeira previsao
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 220 --grid-y 180
          python wrf/retag_wrf_model.py --root wrf_publish --model icon
          python - <<'PY'
          import json
          d=json.load(open('wrf_publish/metadata.json',encoding='utf-8'))
          assert d['model']=='icon' and d['reflectivitySource']=='REFL_10CM_NATIVE' and d['frameCount']>=7, d
          PY
      - name: Publicar primeira previsao
        run: |
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/wrf-icon-data
          git worktree add --detach /tmp/wrf-icon-data
          cd /tmp/wrf-icon-data
          git checkout --orphan wrf-icon-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          printf '# Sideral WRF ICON Data\nWRF Sul 4 km inicializado pelo ICON. REFL_10CM nativo.\n' > README.md
          git add .
          git commit -m "ICON-WRF primeira previsao [skip render]"
          git push --force origin HEAD:wrf-icon-data
      - name: Diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-icon-short-diagnostics
          path: wrf_diagnostics/
          retention-days: 3
          if-no-files-found: warn

  segment-1:
    name: ICON WRF segmento F000-F024
    needs: short
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - name: Preparar runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias
        run: python -m pip install requests numpy xarray netCDF4
      - name: Rodar F000-F024 e gerar restart
        env:
          WRF_RUN_HOURS: '24'
          FORCE_RUN_DATE: ${{ needs.short.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.short.outputs.run_cycle }}
        run: |
          python wrf/prepare_restart_segment.py --start-hour 0 --end-hour 24
          chmod +x wrf/run_icon_wrf.sh wrf/run_wrf_with_source.sh
          ./wrf/run_icon_wrf.sh
          ls -lh wrf_work/run/wrfrst_d01_*
      - name: Extrair segmento 1
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 220 --grid-y 180
          python wrf/retag_wrf_model.py --root wrf_publish --model icon
      - uses: actions/upload-artifact@v4
        with:
          name: icon-restart-f024
          path: wrf_work/run/wrfrst_d01_*
          retention-days: 2
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: icon-frames-f000-f024
          path: wrf_publish/
          retention-days: 2

  segment-2:
    name: ICON WRF segmento F024-F048
    needs: [short, segment-1]
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: icon-restart-f024
          path: restart_in
      - name: Preparar runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias
        run: python -m pip install requests numpy xarray netCDF4
      - name: Continuar F024-F048
        env:
          WRF_RUN_HOURS: '48'
          FORCE_RUN_DATE: ${{ needs.short.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.short.outputs.run_cycle }}
        run: |
          RST=$(find restart_in -type f -name 'wrfrst_d01_*' | head -1)
          test -n "$RST"
          python wrf/prepare_restart_segment.py --start-hour 24 --end-hour 48 --restart-file "$RST"
          chmod +x wrf/run_icon_wrf.sh wrf/run_wrf_with_source.sh
          ./wrf/run_icon_wrf.sh
          ls -lh wrf_work/run/wrfrst_d01_*
      - name: Extrair segmento 2
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 220 --grid-y 180
          python wrf/retag_wrf_model.py --root wrf_publish --model icon
      - uses: actions/upload-artifact@v4
        with:
          name: icon-restart-f048
          path: wrf_work/run/wrfrst_d01_*
          retention-days: 2
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: icon-frames-f024-f048
          path: wrf_publish/
          retention-days: 2

  segment-3:
    name: ICON WRF segmento F048-F069
    needs: [short, segment-2]
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: icon-restart-f048
          path: restart_in
      - name: Preparar runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias
        run: python -m pip install requests numpy xarray netCDF4
      - name: Continuar F048-F069
        env:
          WRF_RUN_HOURS: '69'
          FORCE_RUN_DATE: ${{ needs.short.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ needs.short.outputs.run_cycle }}
        run: |
          RST=$(find restart_in -type f -name 'wrfrst_d01_*' | head -1)
          test -n "$RST"
          python wrf/prepare_restart_segment.py --start-hour 48 --end-hour 69 --restart-file "$RST"
          chmod +x wrf/run_icon_wrf.sh wrf/run_wrf_with_source.sh
          ./wrf/run_icon_wrf.sh
      - name: Extrair segmento 3
        run: |
          rm -rf wrf_publish
          python wrf/extract_wrf_json.py --run-dir wrf_work/run --run-env wrf_diagnostics/run.env --output-dir wrf_publish --grid-x 220 --grid-y 180
          python wrf/retag_wrf_model.py --root wrf_publish --model icon
      - uses: actions/upload-artifact@v4
        with:
          name: icon-frames-f048-f069
          path: wrf_publish/
          retention-days: 2

  publish-two-days:
    name: ICON publicar dois dias completos
    needs: [short, segment-1, segment-2, segment-3]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-runner
      - uses: actions/download-artifact@v4
        with:
          name: icon-frames-f000-f024
          path: segments/a
      - uses: actions/download-artifact@v4
        with:
          name: icon-frames-f024-f048
          path: segments/b
      - uses: actions/download-artifact@v4
        with:
          name: icon-frames-f048-f069
          path: segments/c
      - name: Unir e filtrar 48 horarios BRT
        run: |
          python wrf/merge_wrf_segments.py --input segments/a --input segments/b --input segments/c --output wrf_publish
          python wrf/filter_next_day.py --root wrf_publish --days 2
          python - <<'PY'
          import json
          d=json.load(open('wrf_publish/metadata.json',encoding='utf-8'))
          assert d['model']=='icon', d
          assert d['reflectivitySource']=='REFL_10CM_NATIVE', d
          assert d['scope']=='next_two_local_days', d
          assert d['frameCount']==48, d
          assert len(d['forecastLocalDates'])==2, d
          print('ICON 48h OK', d['forecastLocalDates'])
          PY
      - name: Publicar 48 horas
        run: |
          git config user.name "sideral-wrf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/wrf-icon-data
          git worktree add --detach /tmp/wrf-icon-data
          cd /tmp/wrf-icon-data
          git checkout --orphan wrf-icon-data-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/wrf_publish/." .
          printf '# Sideral WRF ICON Data\nDois dias completos em BRT. WRF Sul 4 km / REFL_10CM nativo.\n' > README.md
          git add .
          git commit -m "ICON-WRF publica dois dias [skip render]"
          git push --force origin HEAD:wrf-icon-data
