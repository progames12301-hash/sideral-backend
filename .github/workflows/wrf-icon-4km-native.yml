name: WRF 4 km ICON - REFL NATIVO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-icon-4km-native.yml"
      - ".github/workflows/wrf-source-parallel-reusable.yml"
  workflow_run:
    workflows: ["ICON Global - PROXIMO DIA AUTOMATICO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sideral-wrf-icon-daily
  cancel-in-progress: true

jobs:
  wrf:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/wrf-source-parallel-reusable.yml
    with:
      model: icon
      source_data_branch: icon-data
      publish_branch: wrf-icon-data
      run_script: run_icon_wrf.sh
    secrets: inherit
