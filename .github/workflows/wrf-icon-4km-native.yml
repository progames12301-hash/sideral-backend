name: WRF 7 km SUL ICON - AUTOMATICO DIARIO

on:
  workflow_dispatch:
  schedule:
    - cron: '10 1 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sul-icon-7km
  cancel-in-progress: false

jobs:
  wrf:
    uses: ./.github/workflows/wrf-regional-7km-single.yml
    with:
      model: icon
      domain: sul
      source_data_branch: icon-data
      publish_branch: wrf-icon-data
      run_script: run_icon_wrf.sh
    secrets: inherit
