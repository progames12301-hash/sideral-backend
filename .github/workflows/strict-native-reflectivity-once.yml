name: Strict native WRF reflectivity patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch server
        run: python .github/scripts/patch_native_reflectivity.py

      - name: Syntax check
        run: python -m py_compile server.py

      - name: Commit final patch
        shell: bash
        run: |
          rm -f .github/workflows/strict-native-reflectivity-once.yml
          rm -f .github/scripts/patch_native_reflectivity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py .github/workflows/strict-native-reflectivity-once.yml .github/scripts/patch_native_reflectivity.py
          git diff --cached --check
          git commit -m "fix: require native REFL_10CM for WRF reflectivity"
          git push origin HEAD:main
