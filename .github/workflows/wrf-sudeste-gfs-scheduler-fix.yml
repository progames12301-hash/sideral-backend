name: WRF Sudeste GFS - DISPARADOR DE SEGURANCA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-sudeste-gfs-scheduler-fix.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: sideral-wrf-sudeste-gfs-scheduler
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Disparar WRF Sudeste GFS como workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/wrf-sudeste-gfs-4km.yml/runs?per_page=30" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [ "$active" != "0" ]; then
            echo "WRF Sudeste GFS ja ativo; preservando processamento."
            exit 0
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/wrf-sudeste-gfs-4km.yml/dispatches" \
            -f ref=main
          echo "WRF Sudeste GFS disparado via workflow_dispatch."
