name: METBR WRF 4 km — gerar boletins
# Republish trigger: renderer fix for blank reflectivity frames after F000.
# Verify incremental variable batches and immediate branch publication.

on:
  push:
    branches: [main, metbr-json-data]
    paths:
      - '.github/workflows/metbr-bulletins-images.yml'
      - 'wrf/render_metbr_bulletins.py'
      - 'wrf/render_metbr_animations.py'
      - 'metadata.json'
      - 'grid.json'
      - 'frames/**'
  repository_dispatch:
    types: [metbr-json-published]
  # A periodic publisher retries when the JSON/checkpoint becomes available after a partial run.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: metbr-wrf-bulletins
  # Let the active render finish; keep only the latest queued retry if one arrives.
  cancel-in-progress: false

jobs:
  render-and-publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout do renderer
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validar sintaxe do renderer
        run: python -m py_compile wrf/render_metbr_bulletins.py

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar bibliotecas de mapas
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'matplotlib>=3.8,<4' 'cartopy>=0.23,<0.26' 'shapely>=2,<3' 'requests>=2.31,<3'

      - name: Preparar FFmpeg para exportar MP4
        run: |
          python -m pip install --disable-pip-version-check 'imageio-ffmpeg>=0.5,<1'
          python - <<'PY'
          import imageio_ffmpeg
          from pathlib import Path
          binary = Path(imageio_ffmpeg.get_ffmpeg_exe())
          if not binary.is_file():
              raise SystemExit(f"FFmpeg empacotado ausente: {binary}")
          print(f"FFmpeg pronto: {binary}")
          PY

      - name: Baixar os JSON publicados sem alterar a branch de dados
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUN_ID: ${{ github.event.client_payload.run_id }}
          EXPECTED_INIT_TIME: ${{ github.event.client_payload.init_time }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, json, time, os
          from pathlib import Path, PurePosixPath
          import requests

          repo = os.environ["GITHUB_REPOSITORY"]
          gh_headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          # The JSON branch is the canonical latest *published checkpoint*.
          # Do not compare it to the latest workflow run: a newer run may be pending
          # with no WRFOUT assets yet. The Maestro scans recent runs for the newest
          # checkpoint that exists and publishes its JSON here.
          branch = "metbr-json-data"
          base = f"https://raw.githubusercontent.com/{repo}/{branch}/"
          root = Path("metbr-source")
          headers = {"User-Agent": "Sideral-METBR-Bulletins/1.0", "Accept": "application/json,application/octet-stream,*/*"}

          def download(rel):
              path = PurePosixPath(rel)
              if path.is_absolute() or ".." in path.parts:
                  raise RuntimeError(f"Caminho de origem inválido: {rel}")
              target = root.joinpath(*path.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              last = None
              for attempt in range(4):
                  try:
                      response = requests.get(base + str(path), headers=headers, timeout=(10, 90))
                      if response.status_code == 404:
                          raise RuntimeError(f"Ausente na branch {branch}: {rel}")
                      response.raise_for_status()
                      if not response.content:
                          raise RuntimeError(f"Arquivo vazio: {rel}")
                      target.write_bytes(response.content)
                      return rel, len(response.content)
                  except Exception as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(f"Falha ao baixar {rel}: {last}")

          response = requests.get(base + "metadata.json", headers=headers, timeout=(10, 45))
          response.raise_for_status()
          meta = response.json()
          if meta.get("model") != "METBR WRF 4 km":
              raise SystemExit("A branch metbr-json-data não contém METBR WRF 4 km.")
          published_run_id = str(meta.get("sourceRunId") or "")
          published_init_time = str(meta.get("initTime") or "")
          expected_run_id = os.environ.get("EXPECTED_RUN_ID", "").strip()
          expected_init_time = os.environ.get("EXPECTED_INIT_TIME", "").strip()
          if not published_run_id:
              print("JSON publicado não informa sourceRunId; render ignorado.")
              Path(os.environ["GITHUB_OUTPUT"]).write_text("publish=false\n", encoding="utf-8")
              raise SystemExit(0)

          print(
              f"Usando o pacote JSON publicado mais recente com checkpoint disponível: "
              f"run={published_run_id}; initTime={published_init_time}; "
              f"status={meta.get('publicationStatus', 'unknown')}; "
              f"horários={len(meta.get('frames') or [])}"
          )

          # A dispatch may arrive slightly late. If the branch already points to a
          # newer published run/cycle, use that newer package instead of discarding it.
          # Skip only when the dispatch expects a newer source that is not on the
          # canonical JSON branch yet; the 30-minute retry will pick it up afterward.
          if expected_run_id and expected_run_id != published_run_id:
              try:
                  branch_run_number = int(published_run_id)
                  expected_run_number = int(expected_run_id)
              except ValueError:
                  branch_run_number = 0
                  expected_run_number = 0
              if branch_run_number < expected_run_number:
                  print(
                      f"JSON branch ainda está no run {published_run_id}, mas o dispatch "
                      f"pede o run {expected_run_id}; aguardando o Maestro publicar o checkpoint."
                  )
                  Path(os.environ["GITHUB_OUTPUT"]).write_text("publish=false\n", encoding="utf-8")
                  raise SystemExit(0)
              print(
                  f"Dispatch do run {expected_run_id} chegou após o pacote {published_run_id}; "
                  "usando o pacote mais recente da branch JSON."
              )
          if expected_init_time and expected_init_time != published_init_time:
              if published_init_time and published_init_time < expected_init_time:
                  print(
                      f"JSON branch está no ciclo {published_init_time}, anterior ao dispatch "
                      f"{expected_init_time}; aguardando a publicação desse checkpoint."
                  )
                  Path(os.environ["GITHUB_OUTPUT"]).write_text("publish=false\n", encoding="utf-8")
                  raise SystemExit(0)
              print(
                  f"Dispatch do ciclo {expected_init_time} chegou após o ciclo publicado "
                  f"{published_init_time}; usando o ciclo publicado mais recente."
              )
          # Idempotency guard: don't re-render the same published source every 30 minutes.
          # A main-branch renderer change still rebuilds if the published package is
          # missing/old or doesn't advertise real UHD MP4 profiles.
          existing_response = requests.get(
              f"https://raw.githubusercontent.com/{repo}/metbr-boletins-imagens/metadata.json",
              headers={"Cache-Control": "no-cache", "User-Agent": "Sideral-METBR-Bulletins/1.0"},
              timeout=(10, 30),
          )
          if existing_response.ok:
              try:
                  existing = existing_response.json()
              except Exception:
                  existing = {}
              source_frames = meta.get("frames") or []
              image_frames = existing.get("frames") or []
              source_hours = {int(frame.get("forecastHour", -1)) for frame in source_frames}
              image_by_hour = {
                  int(frame.get("forecastHour", -1)): frame for frame in image_frames
              }
              source_variables = set(
                  meta.get("availableVariablesAnyFrame") or meta.get("availableVariables") or []
              )
              image_variables = set(existing.get("availableVariables") or [])
              profiles = existing.get("animationProfiles") or {}
              animations = existing.get("animations") or {}
              display = existing.get("displayProcessing") or {}
              profiles_are_uhd = (
                  profiles.get("compositionVersion") == 2
                  and str(profiles.get("bulletinCropMode") or "").startswith("painel quadrado recortado")
                  and profiles.get("mp4ResolutionPx") == [3840, 2160]
                  and profiles.get("bulletinResolutionPx") == [3840, 3840]
                  and profiles.get("videoContentResolutionPx") == [2160, 2160]
                  and profiles.get("gifResolutionPx") == [720, 720]
                  and profiles.get("videoAspectRatio")
                      == "16:9 UHD 3840x2160; mapa quadrado recortado à cobertura nativa, com painéis laterais informativos"
              )
              crop_is_valid = (
                  display.get("renderResolutionPx") == [3840, 3840]
                  and bool(display.get("coverageCrop"))
                  and bool(display.get("previewFormat", "").startswith("WebP"))
              )
              frame_package_complete = bool(source_hours) and source_hours == set(image_by_hour)
              if frame_package_complete:
                  for hour in source_hours:
                      frame = image_by_hour[hour]
                      files_map = frame.get("files") or {}
                      previews_map = frame.get("previewFiles") or {}
                      skipped = frame.get("skippedVariables") or {}
                      for variable in source_variables:
                          if variable == "reflectivity" and skipped.get(variable) == "no_visible_echo_below_5_dBZ":
                              continue
                          if not files_map.get(variable) or not previews_map.get(variable):
                              frame_package_complete = False
                              break
                      if not frame_package_complete:
                          break
              animations_complete = bool(source_variables) and source_variables.issubset(set(animations))
              if animations_complete:
                  for variable in source_variables:
                      profiles_for_variable = animations.get(variable) or {}
                      for speed in ("slow", "ultra-fast"):
                          for fmt in ("gif", "mp4"):
                              if not profiles_for_variable.get(speed, {}).get(fmt):
                                  animations_complete = False
                                  break
                          if not animations_complete:
                              break
                      if not animations_complete:
                          break
              same_package = (
                  str(existing.get("sourceRunId") or "") == published_run_id
                  and str(existing.get("initTime") or "") == str(meta.get("initTime") or "")
                  and int(existing.get("sourceFrameCount") or existing.get("frameCount") or 0) == len(source_frames)
                  and image_variables == source_variables
                  and frame_package_complete
                  and animations_complete
                  and profiles_are_uhd
                  and crop_is_valid
              )
              if same_package:
                  print(
                      f"Pacote de imagens já está completo para a rodada {meta.get('initTime')} "
                      f"({len(source_variables)} variáveis, {len(source_hours)} horários, MP4 UHD). "
                      "Não vou renderizar tudo novamente nesta tentativa de 30 minutos."
                  )
                  Path(os.environ["GITHUB_OUTPUT"]).write_text("publish=false\n", encoding="utf-8")
                  raise SystemExit(0)

          Path(os.environ["GITHUB_OUTPUT"]).write_text("publish=true\n", encoding="utf-8")
          files = ["metadata.json", "grid.json"]
          files += [str(frame.get("dataFile") or f"frames/f{int(frame['forecastHour']):03d}.json.gz") for frame in meta.get("frames", [])]
          if not meta.get("frames"):
              raise SystemExit("metadata.json não lista frames publicados.")
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              result = list(pool.map(download, files))
          total = sum(size for _, size in result)
          print(f"METBR JSON lidos da branch existente: {len(result)} arquivos, {total / 1024 / 1024:.1f} MiB; ciclo {meta.get('initTime')}")
          PY

      - name: Preservar prévias já publicadas do mesmo ciclo
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          from pathlib import Path, PurePosixPath
          import requests

          repo = os.environ["GITHUB_REPOSITORY"]
          source = json.loads(Path("metbr-source/metadata.json").read_text(encoding="utf-8"))
          root = Path("metbr-bulletins")
          branch = "metbr-boletins-imagens"
          base = f"https://raw.githubusercontent.com/{repo}/{branch}/"
          headers = {"User-Agent": "Sideral-METBR-Bulletins/1.0"}

          response = requests.get(base + "metadata.json", headers=headers, timeout=(10, 30))
          if response.status_code == 404:
              print("Sem pacote anterior de imagens; começando do zero.")
              raise SystemExit(0)
          response.raise_for_status()
          published = response.json()
          same_cycle = (
              str(published.get("sourceRunId") or "") == str(source.get("sourceRunId") or "")
              and str(published.get("initTime") or "") == str(source.get("initTime") or "")
          )
          policy = published.get("displayProcessing") or {}
          if not (
              same_cycle
              and str(policy.get("previewFormat") or "").startswith("WebP")
              and bool(policy.get("coverageCrop"))
          ):
              print("Pacote anterior de outro ciclo ou sem prévias/recorte verificados; começando do zero.")
              raise SystemExit(0)

          items = {"metadata.json": response.content}
          for frame in published.get("frames", []):
              for key in ("files", "previewFiles"):
                  for rel in (frame.get(key) or {}).values():
                      path = PurePosixPath(str(rel))
                      if path.is_absolute() or ".." in path.parts:
                          raise RuntimeError(f"Caminho inseguro no metadata publicado: {rel}")
                      items[str(path)] = None

          def download(item):
              rel, existing = item
              if existing is not None:
                  return rel, existing
              response = requests.get(base + rel, headers=headers, timeout=(10, 60))
              response.raise_for_status()
              if not response.content:
                  raise RuntimeError(f"Arquivo anterior vazio: {rel}")
              return rel, response.content

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              result = list(pool.map(download, items.items()))
          root.mkdir(parents=True, exist_ok=True)
          for rel, content in result:
              destination = root / rel
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)
          published.pop("animations", None)
          published.pop("animationProfiles", None)
          (root / "metadata.json").write_text(
              json.dumps(published, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          (root / ".nojekyll").write_text("", encoding="utf-8")
          source_hours = {
              int(frame.get("forecastHour", -1)) for frame in source.get("frames", [])
          }
          published_by_hour = {
              int(frame.get("forecastHour", -1)): frame
              for frame in published.get("frames", [])
          }
          core_fields = {"precipitation", "temperature", "humidity", "windSpeed"}
          core_complete = bool(source_hours) and source_hours.issubset(published_by_hour) and all(
              core_fields.issubset(set((published_by_hour[hour].get("files") or {}).keys()))
              and (
                  "reflectivity" in (published_by_hour[hour].get("files") or {})
                  or (published_by_hour[hour].get("skippedVariables") or {}).get("reflectivity") == "no_visible_echo_below_5_dBZ"
              )
              for hour in source_hours
          )
          Path("metbr-source/.seeded-image-package").write_text(
              f"{source.get('initTime')}|{source.get('sourceRunId')}", encoding="utf-8"
          )
          if core_complete:
              Path("metbr-source/.seeded-core-complete").write_text("true", encoding="utf-8")
          print(
              f"Preservados {len(result)-1} PNGs/WebPs do mesmo ciclo {source.get('initTime')}; "
              f"núcleo principal completo={core_complete}."
          )
          PY

      - name: Gerar e publicar PNGs em lotes incrementais
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p metbr-bulletins

          publish_batch() {
            local batch="$1"
            local variables="$2"
            local hours="${3:-all}"
            echo "::group::METBR lote $batch — $variables — horas $hours"

            if python - "$variables" "$hours" <<'PY'
          import json
          import sys
          from pathlib import Path

          required = {name.strip() for name in sys.argv[1].split(",") if name.strip()}
          hour_arg = sys.argv[2].strip()
          source = json.loads(Path("metbr-source/metadata.json").read_text(encoding="utf-8"))
          output_root = Path("metbr-bulletins")
          output_meta_path = output_root / "metadata.json"
          if not output_meta_path.is_file():
              raise SystemExit(1)
          current = json.loads(output_meta_path.read_text(encoding="utf-8"))
          if (
              current.get("initTime") != source.get("initTime")
              or str(current.get("sourceRunId") or "") != str(source.get("sourceRunId") or "")
          ):
              raise SystemExit(1)
          frames = {
              int(frame.get("forecastHour", -1)): frame
              for frame in current.get("frames", [])
          }
          hours = (
              [int(value.strip().upper().lstrip("F")) for value in hour_arg.split(",") if value.strip()]
              if hour_arg != "all"
              else [int(frame.get("forecastHour", -1)) for frame in source.get("frames", [])]
          )
          source_hours = {int(frame.get("forecastHour", -1)) for frame in source.get("frames", [])}
          if not hours or not set(hours).issubset(source_hours):
              raise SystemExit(1)
          for hour in hours:
              frame = frames.get(hour)
              if frame is None:
                  raise SystemExit(1)
              files = frame.get("files") or {}
              previews = frame.get("previewFiles") or {}
              skipped = frame.get("skippedVariables") or {}
              for variable in required:
                  if variable == "reflectivity" and skipped.get(variable) == "no_visible_echo_below_5_dBZ":
                      continue
                  relative = files.get(variable)
                  preview = previews.get(variable)
                  if not relative or not preview:
                      raise SystemExit(1)
                  png = output_root / relative
                  webp = output_root / preview
                  if not png.is_file() or png.stat().st_size <= 5000:
                      raise SystemExit(1)
                  if not webp.is_file() or webp.stat().st_size <= 1000:
                      raise SystemExit(1)
          print(f"Grupo já completo: {len(hours)} horários, {len(required)} variáveis.")
          PY
            then
              echo "Lote $batch já tem PNG 4K e WebP válidos; não será renderizado novamente."
              echo "::endgroup::"
              return 0
            fi

            if [[ "$hours" == "all" ]]; then
              python wrf/render_metbr_bulletins.py --input-dir metbr-source --output-dir metbr-bulletins --variables "$variables"
            else
              python wrf/render_metbr_bulletins.py --input-dir metbr-source --output-dir metbr-bulletins --variables "$variables" --hours "$hours"
            fi
            python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path("metbr-bulletins")
          meta = json.loads((root / "metadata.json").read_text(encoding="utf-8"))
          pngs = list(root.rglob("*.png"))
          assert meta.get("model") == "METBR WRF 4 km"
          assert meta.get("frameCount", 0) >= 1
          assert meta.get("imageCount", 0) == len(pngs), (meta.get("imageCount"), len(pngs))
          assert all(p.stat().st_size > 5000 for p in pngs)
          policy = meta.get("displayProcessing") or {}
          assert policy.get("previewFormat", "").startswith("WebP"), "renderer sem prévias WebP"
          assert policy.get("previewResolutionMaxPx") == [1200, 1200], "resolução de prévia inesperada"
          assert policy.get("renderResolutionPx") == [3840, 3840], "PNG não foi renderizado em 4K"
          assert policy.get("skipBlankReflectivityAfterF000") is True, "Renderer sem regra anti-piscamento"
          assert policy.get("windBarbs"), "Renderer sem barbelas de vento"
          assert policy.get("outerModelBoundaryCellsMasked") == 2, "Recorte da borda WRF não aplicado"
          assert policy.get("coverageCrop"), "PNG sem recorte da cobertura geográfica METBR"
          first = pngs[0]
          with Image.open(first) as im:
              assert im.size == (3840, 3840), (first, im.size)
              assert im.mode == "RGBA", f"PNG precisa preservar máscara transparente: {im.mode}"
              assert im.getchannel("A").getextrema()[0] == 0, "PNG não removeu os cantos fora da cobertura"
          print(f"Lote publicado: {len(pngs)} PNGs 4K / {len(meta.get('availableVariables', []))} variáveis; rodada {meta['initTime']}")
          PY
            local publish_dir
            publish_dir="$(mktemp -d)"
            cp -a metbr-bulletins/. "$publish_dir/"
            git -C "$publish_dir" init -b metbr-boletins-imagens
            git -C "$publish_dir" config user.name 'github-actions[bot]'
            git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$publish_dir" add -A
            git -C "$publish_dir" commit -m "publish: METBR lote $batch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git -C "$publish_dir" remote add origin "https://x-access-token:$GH_TOKEN@github.com/${GITHUB_REPOSITORY}.git"
            git -C "$publish_dir" push --force origin HEAD:metbr-boletins-imagens
            rm -rf "$publish_dir"
            echo "Lote $batch publicado incrementalmente."
            echo "::endgroup::"
          }

          if [[ -f metbr-source/.seeded-core-complete ]]; then
            echo "Pacote core está completo em todos os horários; preservando-o e renderizando os grupos restantes."
          else
            publish_batch "1-core-F000" "reflectivity,precipitation,temperature,humidity,windSpeed" "0"
            publish_batch "2-core-F001-F004" "reflectivity,precipitation,temperature,humidity,windSpeed" "1,2,3,4"
            publish_batch "3-core-F005-F012" "reflectivity,precipitation,temperature,humidity,windSpeed" "5,6,7,8,9,10,11,12"
          fi
          publish_batch "4-wind-moisture" "windDirection,bulkShear,vorticity850,waterVapor,dewpoint2m"
          publish_batch "5-severe" "cin,kIndex,lcl,lclHeight,mlcape,mucapeWrf2,sbcape,stp,scp,srh01,srh03"
          publish_batch "6-thermo" "thetaE2m,thetaE850,thetaEAdvection,temperature850,windDirection850,windSpeed850,seaLevelPressure,surfacePressure,mslp,pwat"
          publish_batch "7-upper" "bulkShear06,effectiveBulkShear,omega700,thickness,totalTotals,vorticity500,wind500,wind850"
          du -sh metbr-bulletins

      - name: Gerar GIF e MP4 lentos e ultra-rápidos
        if: steps.source.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python -m py_compile wrf/render_metbr_animations.py
          python wrf/render_metbr_animations.py --output-dir metbr-bulletins
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("metbr-bulletins")
          meta = json.loads((root / "metadata.json").read_text(encoding="utf-8"))
          assert meta.get("animations"), "nenhuma animação publicada"
          profiles = meta.get("animationProfiles") or {}
          assert profiles.get("compositionVersion") == 2, f"composição de vídeo antiga: {profiles.get('compositionVersion')}"
          assert str(profiles.get("bulletinCropMode") or "").startswith("painel quadrado recortado"), "MP4 sem corte à cobertura nativa"
          assert profiles.get("mp4ResolutionPx") == [3840, 2160], f"MP4 não está em 4K UHD: {profiles.get('mp4ResolutionPx')}"
          assert profiles.get("bulletinResolutionPx") == [3840, 3840], f"boletim não está quadrado 4K: {profiles.get('bulletinResolutionPx')}"
          assert profiles.get("gifResolutionPx") == [720, 720], f"GIF com resolução inesperada: {profiles.get('gifResolutionPx')}"
          assert profiles.get("videoAspectRatio") == "16:9 UHD 3840x2160; mapa quadrado recortado à cobertura nativa, com painéis laterais informativos"
          for variable, speeds in meta["animations"].items():
              for speed in ("slow", "ultra-fast"):
                  for fmt in ("gif", "mp4"):
                      rel = speeds.get(speed, {}).get(fmt)
                      assert rel, f"faltou {fmt} {speed} para {variable}"
                      path = root / rel
                      assert path.is_file() and path.stat().st_size > 5000, f"animação inválida: {rel}"
          previews = [Path("metbr-bulletins") / rel for frame in meta["frames"] for rel in frame.get("previewFiles", {}).values()]
          assert previews and all(p.is_file() and p.stat().st_size > 1000 for p in previews), "prévia WebP ausente"
          print(f"Animações validadas: {sum(len(v) for v in meta['animations'].values())} perfis velocidade/formato; {len(previews)} prévias WebP")
          PY

      - name: Publicar somente as imagens na branch metbr-boletins-imagens
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PUBLISH_DIR="$(mktemp -d)"
          cp -a metbr-bulletins/. "$PUBLISH_DIR/"
          cd "$PUBLISH_DIR"
          git init -b metbr-boletins-imagens
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "publish: METBR WRF 4 km boletins $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:metbr-boletins-imagens
          echo "Imagens publicadas na branch metbr-boletins-imagens; metbr-json-data ficou intacta."
