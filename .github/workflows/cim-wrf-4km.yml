name: CIM WRF 5 KM - ICON → ECMWF → GFS · 40h horario

on:
  schedule:
    - cron: '37 10 * * *'
  # Rebuild after CIM 5 km runner maintenance.
  workflow_dispatch:

concurrency:
  group: cim-wrf-5km-primary
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  operational:
    name: CIM 5 km principal
    uses: ./.github/workflows/cim-wrf-4km-reusable.yml
    with:
      wrf2: false
      scheduled_cycle: ''
    secrets: inherit
