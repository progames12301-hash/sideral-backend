name: WRF resolution and native-reflectivity contract

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'

permissions:
  contents: read

concurrency:
  group: wrf-resolution-contract
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar contrato dos WRF regionais 7 km
        shell: bash
        run: |
          set -euo pipefail
          base=.github/workflows/wrf-regional-7km-single.yml
          test -s "$base"
          grep -q "WRF_TARGET_RESOLUTION_KM: '7'" "$base"
          grep -q "WRF_DX_METERS: '7000'" "$base"
          grep -q "WRF_DY_METERS: '7000'" "$base"
          grep -q "WRF_HISTORY_INTERVAL_MINUTES: '60'" "$base"
          grep -q "WRF_END_HOUR: '42'" "$base"
          grep -q "WRF_PUBLISH_MAX_HOUR: '40'" "$base"
          grep -q "REFL_10CM_NATIVE" "$base"
          grep -q "singleRunner.*True" "$base"
          echo 'CONTRATO REGIONAL: 7 km · F000-F040 horario · runner unico · REFL nativo.'

      - name: Impedir configuracao operacional WRF em 4 km
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='*.yml' --include='*.yaml' "WRF_TARGET_RESOLUTION_KM: '4'" .github/workflows; then
            echo 'ERRO: existe workflow operacional configurado explicitamente para WRF 4 km.'
            exit 1
          fi
          if grep -R -n --include='*.yml' --include='*.yaml' "WRF_DX_METERS: '4000'" .github/workflows; then
            echo 'ERRO: existe workflow operacional configurado explicitamente para DX 4000 m.'
            exit 1
          fi
          echo 'OK: nenhum workflow operacional exige WRF 4 km.'

      - name: Validar contrato CIM 8 km independente
        shell: bash
        run: |
          set -euo pipefail
          cim=.github/workflows/cim-wrf-3km-operational.yml
          test -s "$cim"
          grep -q "WRF_DX_METERS: '8000'" "$cim"
          grep -q "WRF_DY_METERS: '8000'" "$cim"
          grep -q "WRF_HISTORY_INTERVAL_MINUTES: '60'" "$cim"
          grep -q "CIM_MAX_PUBLISHED_HOUR: '40'" "$cim"
          echo 'CONTRATO CIM: 8 km · F000-F040 horario preservado.'

      - name: Validar contrato Brasil Scope 21 km
        shell: bash
        run: |
          set -euo pipefail
          brasil=.github/workflows/wrf-brasil-12km.yml
          test -s "$brasil"
          grep -q "WRF_TARGET_RESOLUTION_KM: '21'" "$brasil"
          grep -q "WRF_DX_METERS: '21000'" "$brasil"
          grep -q "WRF_DY_METERS: '21000'" "$brasil"
          grep -q "WRF_HISTORY_INTERVAL_MINUTES: '60'" "$brasil"
          grep -q "WRF_START_HOUR: '0'" "$brasil"
          grep -q "WRF_END_HOUR: '48'" "$brasil"
          grep -q "WRF_GRID_X: '215'" "$brasil"
          grep -q "WRF_GRID_Y: '215'" "$brasil
          grep -q "REFL_10CM_NATIVE" "$brasil"
          echo 'CONTRATO BRASIL SCOPE: 21 km · 215x215 · F000-F048 horario · REFL nativo.'

      - name: Auditar branches publicadas
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip
          import io
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          products = {
              'wrf-data': (7, 7000, 7000, 171, 205),
              'wrf-icon-data': (7, 7000, 7000, 171, 205),
              'wrf-ecmwf-data': (7, 7000, 7000, 171, 205),
              'wrf-sudeste-gfs-data': (7, 7000, 7000, 222, 205),
              'wrf-sudeste-icon-data': (7, 7000, 7000, 222, 205),
              'wrf-sudeste-ecmwf-data': (7, 7000, 7000, 222, 205),
              'cim-wrf-3km-icon-data': (8, 8000, 8000, 279, 234),
              'cim-wrf-3km-ecmwf-data': (8, 8000, 8000, 279, 234),
              'wrf-brasil-12km-data': (21, 21000, 21000, 215, 215),
          }

          def get(url):
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Sideral-WRF-contract'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read()

          failures = []
          for branch, (km, dx, dy, nx, ny) in products.items():
              try:
                  base = f'https://raw.githubusercontent.com/{repo}/{branch}'
                  meta = json.loads(get(f'{base}/metadata.json?audit=1'))
                  assert int(meta.get('resolutionKm')) == km, (branch, 'resolutionKm', meta.get('resolutionKm'), km)
                  assert meta.get('reflectivitySource') == 'REFL_10CM_NATIVE', (branch, 'reflectivitySource')
                  assert int(meta.get('temporalResolutionMinutes', 0)) == 60, (branch, 'temporalResolutionMinutes')
                  frames = meta.get('frames') or []
                  expected_hours = list(range(49)) if branch == 'wrf-brasil-12km-data' else list(range(41))
                  assert [int(frame.get('forecastHour', -1)) for frame in frames] == expected_hours, (branch, 'hours')
                  assert int(meta.get('frameCount', 0)) == len(expected_hours), (branch, 'frameCount')
                  assert meta.get('nativeGrid') is True, (branch, 'nativeGrid')
                  for frame in frames:
                      assert int(frame.get('gridX')) == nx and int(frame.get('gridY')) == ny, (branch, 'grid')
                      assert frame.get('reflectivitySource') == 'REFL_10CM_NATIVE', (branch, 'frame reflectivity')

                  raw = get(f"{base}/{frames[0]['file']}?audit=1")
                  try:
                      body = gzip.GzipFile(fileobj=io.BytesIO(raw)).read()
                  except OSError:
                      body = raw
                  payload = json.loads(body)
                  assert int(payload.get('dxMeters')) == dx and int(payload.get('dyMeters')) == dy, (branch, 'DX/DY')
                  assert int(payload.get('gridX')) == nx and int(payload.get('gridY')) == ny, (branch, 'payload grid')
                  assert payload.get('reflectivitySource') == 'REFL_10CM_NATIVE', (branch, 'payload reflectivity')
                  print(f'OK {branch}: {km} km, {nx}x{ny}, REFL_10CM_NATIVE')
              except Exception as exc:
                  failures.append(f'{branch}: {exc!r}')

          if failures:
              print('\nPUBLICACOES FORA DO CONTRATO:')
              for item in failures:
                  print(' -', item)
              raise SystemExit(1)
          print('\nTODAS AS PUBLICACOES ESTAO NO CONTRATO OPERACIONAL.')
          PY
