name: Patch e validação WRF regional 48h

on:
  push:
    branches: [wrf-regional-48h]
    paths:
      - ".github/workflows/patch-regional-48h-branch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrf-regional-48h
          fetch-depth: 0

      - name: Corrigir nomes de artifacts e validar YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/wrf-regional-48h-reusable.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'name: regional-${{ inputs.model }}-severe-${{ matrix.id }}',
              'name: severe-regional-${{ inputs.model }}-${{ matrix.id }}',
          )
          text = text.replace(
              'pattern: regional-${{ inputs.model }}-severe-*',
              'pattern: severe-regional-${{ inputs.model }}-*',
          )
          p.write_text(text, encoding='utf-8')
          PY

          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              '.github/workflows/wrf-regional-48h-reusable.yml',
              '.github/workflows/wrf-ecmwf-4km-native.yml',
              '.github/workflows/wrf-sudeste-gfs-4km.yml',
              '.github/workflows/wrf-sudeste-icon-4km.yml',
              '.github/workflows/wrf-sudeste-ecmwf-4km.yml',
          ]
          for f in files:
              yaml.safe_load(Path(f).read_text(encoding='utf-8'))
              print('YAML OK:', f)
          PY

      - name: Commitar ajuste e remover patch temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sideral-wrf-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-regional-48h-branch.yml
          git add .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'WRF regional 48h: validar YAML e separar artifacts severos'
          git push origin HEAD:wrf-regional-48h
