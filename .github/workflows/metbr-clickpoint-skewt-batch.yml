name: METBR Click-to-Point Skew-T — lote sob demanda

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: Latitude do ponto selecionado no mapa METBR
        required: true
        type: string
      longitude:
        description: Longitude do ponto selecionado no mapa METBR
        required: true
        type: string
      cycle:
        description: Rodada METBR (latest ou 00, 06, 12, 18, 21)
        required: true
        default: latest
        type: string
      request_id:
        description: Identificador único criado pelo Render
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: metbr-clickpoint-skewt-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      expected_hours: ${{ steps.meta.outputs.expected_hours }}
      run_time: ${{ steps.meta.outputs.run_time }}
      source_tag: ${{ steps.meta.outputs.source_tag }}
      branch: ${{ steps.meta.outputs.branch }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout do extrator Sideral
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validar pedido e carregar manifesto da rodada
        id: meta
        shell: bash
        env:
          LATITUDE: ${{ inputs.latitude }}
          LONGITUDE: ${{ inputs.longitude }}
          CYCLE: ${{ inputs.cycle }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os, re, urllib.request
          from pathlib import Path

          lat = float(os.environ["LATITUDE"])
          lon = float(os.environ["LONGITUDE"])
          cycle = os.environ["CYCLE"].strip().lower()
          request_id = os.environ["REQUEST_ID"].strip()
          if not (-90 <= lat <= 90 and -180 <= lon <= 180):
              raise SystemExit("Latitude/longitude fora dos limites geográficos.")
          if not re.fullmatch(r"[a-f0-9]{32}", request_id):
              raise SystemExit("request_id inválido.")
          if cycle == "latest":
              branch = "metbr-json-data"
          elif cycle in {"00", "06", "12", "18", "21"}:
              branch = "metbr-json-data-" + cycle
          else:
              raise SystemExit("Rodada inválida. Use latest, 00, 06, 12, 18 ou 21.")

          url = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{branch}/metadata.json"
          request = urllib.request.Request(url, headers={"User-Agent": "Sideral-METBR-SkewT/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              metadata = json.load(response)

          if metadata.get("modelKey") != "metbr_wrf" or int(metadata.get("resolutionKm", 0)) != 4:
              raise SystemExit("A branch selecionada não contém METBR WRF 4 km.")
          run_time = str(metadata.get("initTime") or "")
          if not run_time:
              raise SystemExit("metadata.json não informa initTime.")
          if cycle != "latest" and run_time[11:13] != cycle:
              raise SystemExit(
                  f"A branch {branch} contém a rodada {run_time[11:13]}Z, não {cycle}Z."
              )

          source_tag = str(metadata.get("sourceReleaseTag") or "").strip()
          if not re.fullmatch(r"metbr-wrf-4km-checkpoint-[0-9]+", source_tag):
              source_run_id = str(metadata.get("sourceRunId") or "")
              if not source_run_id.isdigit():
                  raise SystemExit("metadata.json não identifica o checkpoint WRF de origem.")
              source_tag = "metbr-wrf-4km-checkpoint-" + source_run_id

          frames = metadata.get("frames")
          if not isinstance(frames, list):
              raise SystemExit("metadata.json não contém a lista de validades.")
          include = []
          seen = set()
          for row in frames:
              try:
                  hour = int(row["forecastHour"])
                  asset = str(row["file"])
                  valid_time = str(row["time"])
              except (KeyError, TypeError, ValueError):
                  continue
              if not (0 <= hour <= 42) or hour in seen:
                  continue
              if not re.fullmatch(r"wrfout_d01_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}\.[0-9]{2}\.[0-9]{2}", asset):
                  raise SystemExit(f"Nome de WRFOUT inválido na validade F{hour:03d}.")
              if not valid_time:
                  raise SystemExit(f"Validade F{hour:03d} sem horário UTC.")
              include.append({"hour": hour, "file": asset, "valid_time": valid_time})
              seen.add(hour)

          include.sort(key=lambda item: item["hour"])
          if 0 not in seen:
              raise SystemExit("F000 não está publicado nesta rodada.")
          if not include:
              raise SystemExit("Nenhuma validade METBR disponível para o lote.")

          matrix = {"include": include}
          expected = [item["hour"] for item in include]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              out.write("expected_hours=" + json.dumps(expected, separators=(",", ":")) + "\n")
              out.write("run_time=" + run_time + "\n")
              out.write("source_tag=" + source_tag + "\n")
              out.write("branch=" + branch + "\n")
              out.write("release_tag=metbr-skewt-click-" + request_id + "\n")
          print(f"Rodada {run_time}; origem {source_tag}; {len(include)} validades: {expected}")
          PY

      - name: Criar release temporária e publicar status de execução
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_TAG: metbr-skewt-click-${{ inputs.request_id }}
          LATITUDE: ${{ inputs.latitude }}
          LONGITUDE: ${{ inputs.longitude }}
          CYCLE: ${{ inputs.cycle }}
        run: |
          set -euo pipefail
          mkdir -p batch-status
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
            "schema": "sideral-metbr-skewt-click-status-v1",
            "request_id": os.environ["REQUEST_ID"],
            "status": "running",
            "latitude": float(os.environ["LATITUDE"]),
            "longitude": float(os.environ["LONGITUDE"]),
            "cycle": os.environ["CYCLE"],
            "release_tag": os.environ["RELEASE_TAG"],
          }
          Path("batch-status/status.json").write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          PY
          gh release create "$RELEASE_TAG" batch-status/status.json \
            --repo "$GH_REPO" \
            --title "METBR Click-to-Point — ${{ inputs.latitude }}, ${{ inputs.longitude }}" \
            --notes "Sondagens METBR WRF 4 km geradas sob demanda para uma coordenada selecionada no mapa. Request: $REQUEST_ID" \
            --latest=false

      - name: Publicar falha da preparação
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_TAG: metbr-skewt-click-${{ inputs.request_id }}
        run: |
          set +e
          mkdir -p batch-status
          printf '{"schema":"sideral-metbr-skewt-click-status-v1","request_id":"%s","status":"failed","error":"Não foi possível validar ou preparar a rodada METBR selecionada.","release_tag":"%s"}\n' "$REQUEST_ID" "$RELEASE_TAG" > batch-status/status.json
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" batch-status/status.json --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" batch-status/status.json --repo "$GH_REPO" --title "METBR Click-to-Point — falha de preparação" --notes "A preparação deste lote falhou." --latest=false
          fi

  generate:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout do extrator Sideral
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preparar Python e SHARPpy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências nativas
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'netCDF4>=1.7,<2' 'matplotlib>=3.8,<4' \
            'Pillow>=10,<11' 'SHARPpy @ git+https://github.com/sharppy/SHARPpy.git@main'

      - name: Baixar somente o WRFOUT da validade solicitada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
          WRFOUT_ASSET: ${{ matrix.file }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$SOURCE_TAG" --repo "$GH_REPO" \
            --pattern "$WRFOUT_ASSET" --dir input --clobber
          test -s "input/$WRFOUT_ASSET"

      - name: Gerar Skew-T nativo do ponto e validade
        shell: bash
        env:
          LATITUDE: ${{ inputs.latitude }}
          LONGITUDE: ${{ inputs.longitude }}
          FORECAST_HOUR: ${{ matrix.hour }}
          RUN_TIME: ${{ needs.prepare.outputs.run_time }}
          VALID_TIME: ${{ matrix.valid_time }}
          REQUEST_ID: ${{ inputs.request_id }}
          WRFOUT_ASSET: ${{ matrix.file }}
        run: |
          set -euo pipefail
          mkdir -p output
          python wrf/metbr_skewt_clickpoint.py \
            --wrfout "input/$WRFOUT_ASSET" \
            --forecast-hour "$FORECAST_HOUR" \
            --latitude "$LATITUDE" \
            --longitude "$LONGITUDE" \
            --run-time "$RUN_TIME" \
            --valid-time "$VALID_TIME" \
            --request-id "$REQUEST_ID" \
            --output-dir output
          test -s "output/f$(printf '%03d' "$FORECAST_HOUR").png"
          test -s "output/f$(printf '%03d' "$FORECAST_HOUR").json"

      - name: Guardar PNG e perfil desta validade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metbr-clickpoint-${{ inputs.request_id }}-f${{ matrix.hour }}
          path: output/*
          if-no-files-found: ignore
          retention-days: 1

  publish:
    if: always()
    needs: [prepare, generate]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Baixar todas as validades geradas
        if: ${{ needs.prepare.outputs.release_tag != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: metbr-clickpoint-${{ inputs.request_id }}-*
          path: batch-output
          merge-multiple: true

      - name: Validar imagens, criar manifesto e estado final
        id: result
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          EXPECTED_HOURS: ${{ needs.prepare.outputs.expected_hours }}
          REQUEST_ID: ${{ inputs.request_id }}
          LATITUDE: ${{ inputs.latitude }}
          LONGITUDE: ${{ inputs.longitude }}
          CYCLE: ${{ inputs.cycle }}
          RUN_TIME: ${{ needs.prepare.outputs.run_time }}
          RELEASE_TAG: metbr-skewt-click-${{ inputs.request_id }}
        run: |
          set -euo pipefail
          mkdir -p batch-output
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path("batch-output")
          try:
              expected = [int(v) for v in json.loads(os.environ.get("EXPECTED_HOURS") or "[]")]
          except Exception:
              expected = []
          found = []
          for path in sorted(root.glob("f[0-9][0-9][0-9].png")):
              match = re.fullmatch(r"f(\d{3})\.png", path.name)
              if match and path.stat().st_size > 10000 and path.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n":
                  found.append(int(match.group(1)))
          found = sorted(set(found))
          missing = sorted(set(expected) - set(found))
          success = (
              os.environ.get("PREPARE_RESULT") == "success"
              and os.environ.get("GENERATE_RESULT") == "success"
              and bool(expected)
              and not missing
              and found == expected
          )
          state = "completed" if success else "failed"
          payload = {
              "schema": "sideral-metbr-skewt-click-manifest-v1",
              "request_id": os.environ["REQUEST_ID"],
              "status": state,
              "model": "METBR WRF 4 km",
              "model_key": "metbr_wrf_4km",
              "latitude": float(os.environ["LATITUDE"]),
              "longitude": float(os.environ["LONGITUDE"]),
              "cycle": os.environ["CYCLE"],
              "run_utc": os.environ.get("RUN_TIME") or None,
              "forecast_hours": found,
              "expected_hours": expected,
              "missing_hours": missing,
              "assets": [f"f{hour:03d}.png" for hour in found],
              "profile_assets": [f"f{hour:03d}.json" for hour in found],
              "release_tag": os.environ["RELEASE_TAG"],
          }
          Path("batch-output/manifest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          status = {
              "schema": "sideral-metbr-skewt-click-status-v1",
              "request_id": os.environ["REQUEST_ID"],
              "status": state,
              "release_tag": os.environ["RELEASE_TAG"],
              "available_hours": found,
              "expected_hours": expected,
              "missing_hours": missing,
              "error": None if success else (
                  f"Preparação: {os.environ.get('PREPARE_RESULT')}; "
                  f"geração: {os.environ.get('GENERATE_RESULT')}; "
                  f"validades ausentes: {missing}"
              ),
          }
          Path("batch-output/status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(status, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("success=" + ("true" if success else "false") + "\n")
          PY

      - name: Publicar PNGs, perfis e manifesto no release deste pedido
        if: ${{ needs.prepare.outputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: metbr-skewt-click-${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" \
              --title "METBR Click-to-Point — ${{ inputs.latitude }}, ${{ inputs.longitude }}" \
              --notes "Lote de sondagens METBR WRF 4 km sob demanda." --latest=false
          fi
          mapfile -d '' assets < <(find batch-output -maxdepth 1 -type f \( -name 'f*.png' -o -name 'f*.json' \) -print0 | sort -z)
          for ((offset=0; offset<${#assets[@]}; offset+=40)); do
            chunk=("${assets[@]:offset:40}")
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber "${chunk[@]}"
          done
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber \
            batch-output/manifest.json batch-output/status.json
          echo "Publicação do pedido $RELEASE_TAG concluída."

      - name: Falha explícita se o lote não ficou completo
        if: ${{ steps.result.outputs.success != 'true' }}
        run: |
          echo "O lote Click-to-Point terminou incompleto; confira o status.json e os logs das validades."
          exit 1
