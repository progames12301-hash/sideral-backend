name: Patch CIM 6h + 3 MPI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cim-6h-3mpi.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar correção CIM
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/cim-wrf-3km-operational.yml')
          s = p.read_text(encoding='utf-8')

          old = """        segment:
          - { id: '000-009', start: 0,  end: 9 }
          - { id: '006-015', start: 6,  end: 15 }
          - { id: '012-021', start: 12, end: 21 }
          - { id: '018-027', start: 18, end: 27 }
          - { id: '024-033', start: 24, end: 33 }
          - { id: '030-039', start: 30, end: 39 }
          - { id: '036-045', start: 36, end: 45 }
          - { id: '042-048', start: 42, end: 48 }
"""
          new = """        segment:
          - { id: '000-006', start: 0,  end: 6 }
          - { id: '006-012', start: 6,  end: 12 }
          - { id: '012-018', start: 12, end: 18 }
          - { id: '018-024', start: 18, end: 24 }
          - { id: '024-030', start: 24, end: 30 }
          - { id: '030-036', start: 30, end: 36 }
          - { id: '036-042', start: 36, end: 42 }
          - { id: '042-048', start: 42, end: 48 }
"""
          if old not in s:
              raise SystemExit('Bloco antigo de segmentos não encontrado')
          s = s.replace(old, new, 1)

          marker = """      - name: Executar segmento CIM 3 km Cone Sul ampliado
        if: steps.checkpoint.outputs.hit != 'true'
"""
          mpi_step = """      - name: Ajustar CIM para 3 processos MPI
        if: steps.checkpoint.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYMPI'
          from pathlib import Path
          p = Path('wrf/run_wrf_with_source.sh')
          s = p.read_text(encoding='utf-8')
          count = s.count('-np 4')
          if count < 2:
              raise SystemExit(f'Esperava ao menos 2 ocorrências de -np 4; encontrei {count}')
          p.write_text(s.replace('-np 4', '-np 3'), encoding='utf-8')
          print('CIM MPI: 3 processos para real.exe e wrf.exe')
          PYMPI

""" + marker
          if marker not in s:
              raise SystemExit('Etapa de execução CIM não encontrada')
          s = s.replace(marker, mpi_step, 1)

          replacements = {
              "if 6 <= hour <= 48 and hour % 3 == 0:": "if 6 <= hour <= 48 and hour % 6 == 0:",
              "meta['temporalResolutionMinutes'] = 180": "meta['temporalResolutionMinutes'] = 360",
              "assert hours == list(range(6, 49, 3)), hours": "assert hours == list(range(6, 49, 6)), hours",
              "assert len(frames) == 15, len(frames)": "assert len(frames) == 8, len(frames)",
              "assert len(meta['frames']) == 15, len(meta['frames'])": "assert len(meta['frames']) == 8, len(meta['frames'])",
              "for SEGMENT in 000-009 006-015 012-021 018-027 024-033 030-039 036-045 042-048; do": "for SEGMENT in 000-006 006-012 012-018 018-024 024-030 030-036 036-042 042-048; do",
              "F006-F048, 3 km, REFL_10CM nativo.": "F006-F048 de 6 em 6 h, 3 km, REFL_10CM nativo."
          }
          for a, b in replacements.items():
              if a not in s:
                  raise SystemExit(f'Trecho esperado não encontrado: {a}')
              s = s.replace(a, b)

          publish_header = """  publish:
    name: Publicar CIM 48h (${{ matrix.model }})
    needs: [resolve_runs, segments]
    runs-on: ubuntu-22.04
"""
          publish_new = """  publish:
    name: Publicar CIM 48h (${{ matrix.model }})
    needs: [resolve_runs, segments]
    if: ${{ always() && needs.resolve_runs.result == 'success' }}
    runs-on: ubuntu-22.04
"""
          if publish_header not in s:
              raise SystemExit('Cabeçalho publish não encontrado')
          s = s.replace(publish_header, publish_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- .github/workflows/cim-wrf-3km-operational.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cim-wrf-3km-operational.yml
          git commit -m 'CIM: segmentos 6h, 3 MPI e publicação independente'
          git push origin main
