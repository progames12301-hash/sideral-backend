name: METBR WRF cycle watchdog

on:
  # Retry five minutes after each synoptic launch in case GitHub skipped the cron.
  schedule:
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Each watchdog run is independent; it must not block WRF cycles that are already running.
concurrency:
  group: metbr-wrf-cycle-watchdog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ensure-synoptic-cycle:
    name: Garantir execução METBR 00/06/12/18Z
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verificar e iniciar a rodada se o cron principal foi perdido
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          HOUR="$(date -u +%H)"
          if [[ ! "$HOUR" =~ ^(00|06|12|18)$ ]]; then
            echo "Watchdog manual fora dos horários sinóticos; nenhuma rodada disparada."
            exit 0
          fi

          CYCLE_START="$(date -u -d "$(date -u +%F) ${HOUR}:00:00" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Checando rodada METBR para $CYCLE_START."

          CANDIDATES="$(gh run list --repo "$GH_REPO" --workflow metbr-wrf-4km.yml --limit 50 --json databaseId,status,createdAt,workflowName)"
          EXISTING="$(jq --arg start "$CYCLE_START" '[.[] | select(.workflowName == "METBR WRF 4 KM - ICON") | select(.createdAt >= $start)] | length' <<< "$CANDIDATES")"

          if [[ ! "$EXISTING" =~ ^[0-9]+$ ]]; then
            echo "Não foi possível validar o histórico de execuções; não vou disparar duplicata."
            exit 1
          fi

          if (( EXISTING > 0 )); then
            echo "Já existe uma execução METBR nesta janela ($EXISTING encontrada(s)); ela pode continuar mesmo com outra ativa."
            exit 0
          fi

          echo "O cron principal não aparece nesta janela; iniciando a execução manual de recuperação."
          gh workflow run metbr-wrf-4km.yml --repo "$GH_REPO" --ref main
          echo "Disparo de recuperação enviado para a rodada ${HOUR}Z."
