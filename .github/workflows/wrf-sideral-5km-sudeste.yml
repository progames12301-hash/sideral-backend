name: WRF SIDERAL 5 KM Sudeste — ICON

on:
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * *'
    - cron: '45 12 * * *'

permissions:
  contents: write
  actions: read

env:
  SIDERAL_CHECKPOINT_PREFIX: sideral-wrf-5km-sudeste-checkpoint
  WRF_MPI_PROCS: 4
  WRF_TARGET_RESOLUTION_KM: 5
  WRF_DX_METERS: 5000
  WRF_DY_METERS: 5000
  WRF_E_WE: 269
  WRF_E_SN: 401
  WRF_TIME_STEP: 24
  WRF_HISTORY_INTERVAL_MINUTES: 60
  WRF2_ICON_ONLY: '1'
  WRF_SCHEDULED_CYCLE: ${{ github.event.schedule == '45 0 * * *' && '00' || (github.event.schedule == '45 12 * * *' && '12' || '') }}
  WRF_REF_LAT: -23.0
  WRF_REF_LON: -45.5
  WRF_STAND_LON: -45.5

jobs:

  seg00:
    name: SIDERAL 5 KM ICON F000-F006
    runs-on: ubuntu-22.04
    timeout-minutes: 478
    steps:
      - name: Checkout Sideral runner
        uses: actions/checkout@v4
        with:
          ref: sideral-wrf-5km-sudeste
          fetch-depth: 1
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pré-validar scripts Bash e ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find wrf -maxdepth 1 -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          if grep -nIl $'\r' "${scripts[@]}"; then
            echo "ERRO: existe CRLF em script wrf/*.sh; converta para LF." >&2
            exit 1
          fi
          # Normalize checkout permissions: helpers are explicitly run with bash.
          chmod +x "${scripts[@]}"
          for f in "${scripts[@]}"; do
            test -x "$f" || { echo "ERRO: script não executável após chmod: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          grep -Fq ' -e WRF_BOUNDARY_ONLY="${WRF_BOUNDARY_ONLY:-0}"' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: WRF_BOUNDARY_ONLY nao esta sendo passado ao container; isso executa WRF duplicado." >&2; exit 1; }
          grep -Fq 'if [[ "${WRF_BOUNDARY_ONLY:-0}" == "1" ]]; then' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: guarda de boundary-only ausente." >&2; exit 1; }
          grep -Fq -- '--start-hour "$WRF_START_HOUR" --max-hour "$BOUNDARY_END_HOUR"' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: suporte de solo ainda baixa horas repetidas." >&2; exit 1; }
          grep -Fq 'p.add_argument("--start-hour", type=int, default=0' wrf/fetch_gfs_land_support.py || { echo "ERRO: seletor de horas GFS ausente." >&2; exit 1; }
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/select_tarc_icon_run.py wrf/fetch_gfs_land_support.py
          echo "ShellCheck e sintaxe Python dos fallbacks validados."
      - name: Executar F000-F006
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: sideral-wrf-5km-sudeste-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 0 6 0 1
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sideral-5km-diagnostics-seg00
          path: |
            tarc_diagnostics/
            tarc_segment_output/rsl.*
          if-no-files-found: ignore
          retention-days: 7

