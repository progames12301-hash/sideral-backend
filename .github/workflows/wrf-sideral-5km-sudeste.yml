            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
      - name: Baixar WRFOUT da rodada completa
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: sideral-wrf-5km-sudeste-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf tarc_all_wrfout tarc_raw_wrfout tarc_products tarc_severe
          mkdir -p tarc_all_wrfout
          gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p tarc_raw_wrfout
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'tarc-wrfout-*' --dir tarc_raw_wrfout --clobber
          for f in tarc_raw_wrfout/tarc-wrfout-*; do
            [[ -f "$f" ]] || continue
            n="$(basename "$f" | sed -E 's/^tarc-wrfout-[0-9]+-//; s/_([0-9]{2})[.]([0-9]{2})[.]([0-9]{2})$/_\1:\2:\3/')"
            mv -f "$f" "tarc_all_wrfout/$n"
          done
          gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'tarc-run.env' --dir . --clobber
          test -n "$(find tarc_all_wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print -quit)"
          test -s tarc-run.env
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027'
      - name: Gerar produtos principais
        run: |
          python wrf/tarc_postprocess.py tarc_all_wrfout/wrfout_d01_* --output-dir tarc_products
          test -s tarc_products/metadata.json
          test -n "$(find tarc_products -type f -name '*.npz' -size +0c -print -quit)"
          cp -f wrf/tarc_variable_catalog.json tarc_products/variable_catalog.json
      - name: Gerar diagnósticos severos
        env:
          WRF_DX_METERS: 5000
          WRF_PRODUCT_LABEL: WRF SIDERAL 5 KM SUDESTE ICON · diagnósticos severos
        run: |
          python wrf/extract_wrf_severe.py --run-dir tarc_all_wrfout --run-env tarc-run.env --output-dir tarc_severe --grid-x 269 --grid-y 401 --model icon --interval-hours 3 --expected-start 0 --expected-end 48
          test -s tarc_severe/metadata.json
          test -s tarc_severe/diagnostics.json
      - name: Validar grade e produtos
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path('tarc_products/metadata.json').read_text(encoding='utf-8'))
          assert m['model']=='WRF SIDERAL 5 KM SUDESTE'
          assert m['resolutionKm']==5
          assert m['nativeReflectivity']=='REFL_10CM'
          assert m['domain']['e_we']==269 and m['domain']['e_sn']==401
          assert len(m['frames'])==49, f"Esperados 49 horários F000-F048; encontrados {len(m['frames'])}"
          valid_times=[str(frame.get('time','')) for frame in m['frames']]
          assert len(set(valid_times))==49, 'TARC contém horários duplicados ou inválidos'
          s=json.loads(pathlib.Path('tarc_severe/metadata.json').read_text(encoding='utf-8'))
          assert s['frameCount'] > 0
          print('TARC principal:', len(m['frames']), 'frames')
          print('TARC severo:', s['frameCount'], 'frames')
          print('Status severo:', s['status'])
          PY
      - name: Publicar produtos no Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: sideral-wrf-5km-sudeste-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          tar -czf sideral-wrf-5km-sudeste-products.tar.gz -C tarc_products .
          tar -czf sideral-wrf-5km-sudeste-severe.tar.gz -C tarc_severe .
          test -s sideral-wrf-5km-sudeste-products.tar.gz
          test -s sideral-wrf-5km-sudeste-severe.tar.gz
          gh release upload "$CHECKPOINT_TAG" sideral-wrf-5km-sudeste-products.tar.gz sideral-wrf-5km-sudeste-severe.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$CHECKPOINT_TAG" wrf/tarc_variable_catalog.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "TARC 3 KM: produtos e diagnósticos publicados."
