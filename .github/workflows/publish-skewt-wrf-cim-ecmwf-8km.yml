name: Publicar Skew-T — CIM WRF 8 km ECMWF

on:
  workflow_run:
    workflows:
      - "CIM WRF 8 km - 40h horario"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ID da execução de origem concluída com sucesso
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-skewt-wrf-cim-ecmwf-8km-${{ github.event.workflow_run.id || inputs.source_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout das ferramentas e da interface Sideral
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validar execução de origem
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW: CIM WRF 8 km - 40h horario
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            SOURCE_RUN_ID="$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")"
          else
            SOURCE_RUN_ID="$DISPATCH_SOURCE_RUN_ID"
          fi
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "source_run_id inválido." >&2; exit 2; }
          RUN_JSON="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,workflowName,status)"
          STATUS="$(jq -r '.status // ""' <<< "$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion // ""' <<< "$RUN_JSON")"
          WORKFLOW_NAME="$(jq -r '.workflowName // ""' <<< "$RUN_JSON")"
          [[ "$STATUS" == completed && "$CONCLUSION" == success ]] || {
            echo "Origem não concluída com sucesso: $WORKFLOW_NAME / $STATUS / $CONCLUSION" >&2; exit 3;
          }
          [[ "$WORKFLOW_NAME" == "$EXPECTED_WORKFLOW" ]] || {
            echo "Run $SOURCE_RUN_ID pertence a '$WORKFLOW_NAME', não a '$EXPECTED_WORKFLOW'." >&2; exit 4;
          }
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "Origem validada: $WORKFLOW_NAME / $SOURCE_RUN_ID"

      - name: Baixar artefato nativo da execução de origem
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source_artifact wrfout
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "skewt-wrfout-cim-ecmwf-8km" --dir source_artifact
          test -s source_artifact/skewt-wrfout.tar.gz
          tar -xzf source_artifact/skewt-wrfout.tar.gz -C wrfout
          count="$(find wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c | wc -l | tr -d '[:space:]')"
          [[ "$count" =~ ^[0-9]+$ ]] && (( count >= 5 )) || {
            echo "Artefato skewt-wrfout-cim-ecmwf-8km incompleto: $count WRFOUTs." >&2; exit 20;
          }
          echo "Skew-T wrf-cim-ecmwf-8km: $count WRFOUTs nativos baixados."

      - name: Gerar e publicar Skew-T nativo das capitais cobertas
        uses: ./.github/actions/publish-wrf-skewt
        with:
          run-dir: wrfout
          model-key: wrf-cim-ecmwf-8km
          model-label: CIM WRF 8 km ECMWF
          resolution-km: '8'
          source-run-id: ${{ env.SOURCE_RUN_ID }}
          repo-path: .

      - name: Guardar artefatos para diagnóstico se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skewt-wrf-cim-ecmwf-8km-diagnostics-${{ github.run_id }}
          path: |
            build/skewt-native-capitals/**
            checkpoint_assets/**
            metbr_meta/**
            metbr_wrfout/**
            wrfout/**
          if-no-files-found: ignore
          retention-days: 7
