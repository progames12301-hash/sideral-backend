name: Agendar Skew-T diário — todos os WRF operacionais

on:
  schedule:
    - cron: '37 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-skewt-wrf-daily.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: schedule-skewt-wrf-daily
  cancel-in-progress: false

jobs:
  dispatch:
    name: Verificar rodadas e disparar publicadores pendentes
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Publicar Skew-T de cada WRF com rodada diária concluída
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          while IFS='|' read -r source_workflow publisher_file; do
            [[ -n "$source_workflow" ]] || continue
            echo "::group::$publisher_file <= $source_workflow"

            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$source_workflow" --branch main --limit 20 --json databaseId,status,conclusion,createdAt,headSha)"
            latest="$(jq -c 'sort_by(.createdAt) | last // empty' <<< "$runs")"

            if [[ -z "$latest" || "$latest" == "null" ]]; then
              echo "Sem execução de origem encontrada; nada será publicado."
              echo "::endgroup::"
              continue
            fi

            status="$(jq -r '.status // ""' <<< "$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$latest")"
            source_id="$(jq -r '.databaseId // empty' <<< "$latest")"
            source_sha="$(jq -r '.headSha // empty' <<< "$latest")"
            created_at="$(jq -r '.createdAt // empty' <<< "$latest")"

            if [[ "$status" != "completed" ]]; then
              echo "Origem ainda não terminou (status=$status). O gatilho workflow_run cuidará da publicação quando concluir."
              echo "::endgroup::"
              continue
            fi

            if [[ "$conclusion" != "success" || ! "$source_id" =~ ^[0-9]+$ || -z "$source_sha" ]]; then
              echo "Última execução da origem não terminou com sucesso; não reutilizarei uma rodada antiga."
              echo "::endgroup::"
              continue
            fi

            source_epoch="$(date -u -d "$created_at" +%s)"
            now_epoch="$(date -u +%s)"
            age_seconds=$((now_epoch - source_epoch))
            if (( age_seconds < 0 || age_seconds > 129600 )); then
              echo "Última rodada bem-sucedida tem mais de 36 horas; publicação antiga bloqueada."
              echo "::endgroup::"
              continue
            fi

            publisher_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$publisher_file" --branch main --limit 30 --json headSha,status,conclusion)"
            already_handled="$(jq -r --arg sha "$source_sha" 'any(.[]; .headSha == $sha and (.conclusion == "success" or .status == "in_progress" or .status == "queued"))' <<< "$publisher_runs")"

            if [[ "$already_handled" == "true" ]]; then
              echo "Esta rodada já foi publicada ou já tem publicação em andamento."
              echo "::endgroup::"
              continue
            fi

            echo "Disparando $publisher_file com source_run_id=$source_id"
            gh workflow run "$publisher_file" --repo "$GITHUB_REPOSITORY" --ref main -f "source_run_id=$source_id"
            echo "::endgroup::"
          done <<'MATRIX'
          SIDERAL WRF Brasil 21 km - 48h horario|publish-skewt-wrf-brasil-21km.yml
          WRF CBR 4 KM — fallback ICON → ECMWF → GFS|publish-skewt-wrf-cbr-4km.yml
          WRF2 CBR 4 KM — ICON válido amanhã|publish-skewt-wrf-cbr2-4km.yml
          CIM WRF 8 km - 40h horario|publish-skewt-wrf-cim-ecmwf-8km.yml
          CIM WRF 8 km - 40h horario|publish-skewt-wrf-cim-icon-8km.yml
          METBR WRF 4 KM - ICON|publish-skewt-wrf-metbr-4km.yml
          METBR WRF2 4 KM - ICON válido amanhã|publish-skewt-wrf-metbr2-4km.yml
          WRF SIDERAL 4 KM Sudeste — ICON|publish-skewt-wrf-sideral-4km-sudeste.yml
          WRF SIDERAL 4 KM 2 Sudeste — ICON|publish-skewt-wrf-sideral-4km-2-sudeste.yml
          WRF SIDERAL 5 KM Sudeste — ICON|publish-skewt-wrf-sideral-5km-sudeste.yml
          WRF SIDERAL 5 KM 2 Sudeste — ICON|publish-skewt-wrf-sideral-5km-2-sudeste.yml
          WRF TARC 3 KM — fallback ICON → ECMWF → GFS|publish-skewt-wrf-tarc-3km.yml
          WRF2 TARC 3 KM — ICON válido amanhã|publish-skewt-wrf-tarc2-3km.yml
          WRF 7 km SUL ECMWF - AUTOMATICO DIARIO|publish-skewt-wrf-sul-ecmwf-7km.yml
          WRF 7 km SUL GFS - AUTOMATICO DIARIO|publish-skewt-wrf-sul-gfs-7km.yml
          WRF 7 km SUL ICON - AUTOMATICO DIARIO|publish-skewt-wrf-sul-icon-7km.yml
          MATRIX
