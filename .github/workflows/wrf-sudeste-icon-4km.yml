name: WRF Sudeste 4 km ICON - 48H REFL NATIVO

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7,19 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-sudeste-icon-4km.yml"
      - ".github/workflows/wrf-regional-48h-reusable.yml"

permissions:
  contents: write

concurrency:
  group: sideral-wrf-sudeste-icon
  cancel-in-progress: false

jobs:
  wrf:
    uses: ./.github/workflows/wrf-regional-48h-reusable.yml
    with:
      model: icon
      source_data_branch: icon-data
      publish_branch: wrf-sudeste-icon-data
      run_script: run_icon_wrf_sudeste.sh
      publish_severe: true
    secrets: inherit
