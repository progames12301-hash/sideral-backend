name: Validate Sideral Sudeste WRF pipelines

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate:
    if: false  # Desativado para reduzir carga de runners.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout 4 km runner
        uses: actions/checkout@v4
        with:
          ref: sideral-wrf-4km-sudeste
          path: runner4

      - name: Checkout 5 km runner
        uses: actions/checkout@v4
        with:
          ref: sideral-wrf-5km-sudeste
          path: runner5

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q 'PyYAML>=6,<7' 'numpy>=1.24,<3'

      - name: Validate workflow YAML and catalogs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          workflow_paths = sorted(Path(".github/workflows").glob("wrf-sideral-*.yml"))
          workflow_paths += sorted(Path(".github/workflows").glob("publish-sideral-*.yml"))
          assert len(workflow_paths) == 8, f"Expected 8 Sideral model/publisher workflows, got {len(workflow_paths)}"
          for path in workflow_paths:
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert isinstance(data, dict) and "jobs" in data, f"Invalid workflow shape: {path}"
              print("YAML OK:", path)

          expected = {
              "wrf/sideral_wrf_4km_sudeste_variable_catalog.json": ("WRF SIDERAL 4 KM SUDESTE", 4, 337, 501, "sideral_wrf_4km_sudeste"),
              "wrf/sideral_wrf_5km_sudeste_variable_catalog.json": ("WRF SIDERAL 5 KM SUDESTE", 5, 269, 401, "sideral_wrf_5km_sudeste"),
              "wrf/sideral_wrf_4km_2_sudeste_variable_catalog.json": ("WRF SIDERAL 4 KM 2 SUDESTE", 4, 337, 501, "sideral_wrf_4km_2_sudeste"),
              "wrf/sideral_wrf_5km_2_sudeste_variable_catalog.json": ("WRF SIDERAL 5 KM 2 SUDESTE", 5, 269, 401, "sideral_wrf_5km_2_sudeste"),
          }
          for file, (name, resolution, e_we, e_sn, key) in expected.items():
              doc = json.loads(Path(file).read_text(encoding="utf-8"))
              assert doc["model"] == name, (file, doc.get("model"))
              assert doc["resolutionKm"] == resolution
              assert (doc["domain"]["e_we"], doc["domain"]["e_sn"]) == (e_we, e_sn)
              assert doc["modelKey"] == key
              print("Catalog OK:", name, f"{e_we}x{e_sn}", f"{resolution} km")

          for root, name, key in [
              ("runner4", "WRF SIDERAL 4 KM 2 SUDESTE", "sideral_wrf_4km_2_sudeste"),
              ("runner5", "WRF SIDERAL 5 KM 2 SUDESTE", "sideral_wrf_5km_2_sudeste"),
          ]:
              doc = json.loads((Path(root) / "wrf/tarc_variable_catalog_wrf2.json").read_text(encoding="utf-8"))
              assert doc["model"] == name and doc["modelKey"] == key
              print("WRF2 catalog OK:", name)
          PY

      - name: Validate runner shell syntax
        run: |
          set -euo pipefail
          for root in runner4 runner5; do
            if grep -RFn --include='*.sh' '${config.res}' "$root/wrf"; then
              echo "ERRO: template JavaScript encontrado em script Bash no runner $root." >&2
              exit 1
            fi
            python -m py_compile "$root/wrf/tarc_postprocess.py"
            bash -n "$root/wrf/run_tarc_checkpoint_segment.sh"
            bash -n "$root/wrf/run_tarc_icon_wrf.sh"
            bash -n "$root/wrf/run_tarc_wrf_with_source.sh"
            bash -n "$root/wrf/run_tarc_restart_segment.sh"
          done
          echo "All four runner shell scripts pass bash -n on both resolutions."

      - name: Smoke test all four compact JSON contracts
        run: |
          set -euo pipefail
          python -m py_compile wrf/publish_sideral_checkpoint_json.py
          python - <<'PY'
          import gzip
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          import numpy as np

          script = Path("wrf/publish_sideral_checkpoint_json.py").resolve()
          models = {
              "sideral4": "sideral_wrf_4km_sudeste",
              "sideral5": "sideral_wrf_5km_sudeste",
              "sideral4_2": "sideral_wrf_4km_2_sudeste",
              "sideral5_2": "sideral_wrf_5km_2_sudeste",
          }
          with tempfile.TemporaryDirectory(prefix="sideral-smoke-") as tmp:
              root = Path(tmp)
              for model, key in models.items():
                  inp = root / model / "input"
                  out = root / model / "out"
                  inp.mkdir(parents=True)
                  env = root / model / "run.env"
                  env.write_text("RUN_DATE=20261023\nRUN_CYCLE=00\nSOURCE_MODEL=icon\n", encoding="utf-8")
                  lat = np.array([[-22.0, -22.0], [-23.0, -23.0]], dtype=np.float32)
                  lon = np.array([[-46.0, -45.0], [-46.0, -45.0]], dtype=np.float32)
                  refl = np.array([[0.0, 20.0], [35.0, 45.0]], dtype=np.float32)
                  np.savez_compressed(inp / "20261023_000000.npz",
                                      lat=lat, lon=lon,
                                      reflectivity_native_dbz=refl,
                                      reflectivity_composite_dbz=refl)
                  subprocess.run([sys.executable, str(script), "--model", model,
                                  "--input-dir", str(inp), "--run-env", str(env),
                                  "--output-dir", str(out)], check=True)
                  meta = json.loads((out / "metadata.json").read_text(encoding="utf-8"))
                  assert meta["modelKey"] == key
                  assert meta["frameCount"] == 1 and meta["status"] == "partial"
                  with gzip.open(out / "frames" / "f000.json.gz", "rt", encoding="utf-8") as stream:
                      frame = json.load(stream)
                  assert frame["modelKey"] == key
                  assert frame["fields"]["lat"] and frame["fields"]["lon"]
                  assert frame["fields"]["reflectivityDbz"]
                  print("JSON smoke OK:", model, meta["initTime"])
          PY
