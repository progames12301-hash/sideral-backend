name: WRF CBR 4 KM - ICON

on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * *'

permissions:
  contents: write
  actions: read

env:
  CBR_CHECKPOINT_PREFIX: cbr-wrf-4km-checkpoint
  WRF_MPI_PROCS: 8
  WRF_TARGET_RESOLUTION_KM: 4
  WRF_DX_METERS: 4000
  WRF_DY_METERS: 4000
  WRF_E_WE: 401
  WRF_E_SN: 501
  WRF_TIME_STEP: 20
  WRF_HISTORY_INTERVAL_MINUTES: 60
  WRF_REF_LAT: -10.5
  WRF_REF_LON: -40.0
  WRF_STAND_LON: -40.0

jobs:
  seg00:
    name: CBR ICON F000-F003
    runs-on: ubuntu-22.04
    
    timeout-minutes: 355
    steps:
      - name: Checkout CBR
        uses: actions/checkout@v4
        with:
          ref: cbr-wrf-4km
          fetch-depth: 1
      - name: Pré-validar CBR antes de downloads
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cbr_checkpoint_segment.sh
            wrf/run_cbr_icon_wrf.sh
            wrf/run_cbr_wrf_with_source.sh
            wrf/run_cbr_restart_segment.sh
          )
          for f in "${scripts[@]}"; do
            test -f "$f"
            test -x "$f" || { echo "ERRO: CBR script não executável: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_gfs_land_support.py wrf/cbr_extract_json.py wrf/cbr_postprocess.py
          python3 - <<'PY'
import json
from pathlib import Path
m=json.loads(Path('wrf/cbr_variable_catalog.json').read_text(encoding='utf-8'))
assert m['model']=='WRF CBR 4 KM'
assert m['resolutionKm']==4
assert m['domain']['e_we']==401 and m['domain']['e_sn']==501
assert m['forecast']['hours']==42
print('CBR preflight: catálogo/grade OK')
PY
      - name: Executar CBR F000-F003
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: cbr-wrf-4km-checkpoint-${{ github.run_id }}
        run: |
          bash wrf/run_cbr_checkpoint_segment.sh 0 3 0 1
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbr-diagnostics-seg00
          path: |
            cbr_diagnostics/
            cbr_segment_output/rsl.*
          if-no-files-found: ignore
          retention-days: 7

