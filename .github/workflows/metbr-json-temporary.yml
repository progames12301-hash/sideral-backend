name: METBR WRF 4 KM - JSON temporário

on:
  push:
    branches: [main]
    paths:
      - 'wrf/metbr_extract_json.py'
      - '.github/workflows/metbr-json-temporary.yml'
  workflow_run:
    workflows: ["METBR WRF 4 KM - ICON"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  METBR_JSON_BRANCH: metbr-json-data
  METBR_TAG_PREFIX: metbr-wrf-4km-checkpoint-

jobs:
  extract:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'netCDF4>=1.7,<2'

      - name: Definir execução METBR
        env:
          RUN_ID_EVENT: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${RUN_ID_EVENT:-}" ]; then
            echo "RUN_ID=$RUN_ID_EVENT" >> "$GITHUB_ENV"
          else
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow metbr-wrf-4km.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            test -n "$RUN_ID"
            echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          fi
          echo "METBR_RUN_ID=$RUN_ID"

      - name: Baixar WRFOUT bruto do checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${METBR_TAG_PREFIX}${RUN_ID}"
          rm -rf metbr_input
          mkdir -p metbr_input
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wrfout_d01_*' \
            --dir metbr_input \
            --clobber
          count=$(find metbr_input -type f -name 'wrfout_d01_*' -size +0c | wc -l)
          echo "WRFOUT encontrados: $count"
          test "$count" -gt 0

      - name: Extrair JSON nativo
        run: |
          set -euo pipefail
          rm -rf metbr_json
          python wrf/metbr_extract_json.py \
            --run-dir metbr_input \
            --output-dir metbr_json
          test -s metbr_json/metadata.json
          test -s metbr_json/metbr_wrf_4km.json
          test -s metbr_json/grid.json
          test -s metbr_json/vertical-f000.npz
          test -d metbr_json/frames

      - name: Selecionar branch da rodada METBR
        shell: bash
        run: |
          set -euo pipefail
          RUN_CYCLE="$(python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          meta=json.loads(Path("metbr_json/metadata.json").read_text(encoding="utf-8"))
          text=str(meta.get("initTime") or "")
          if not text:
              raise SystemExit("metadata.json não informa initTime")
          stamp=datetime.fromisoformat(text.replace("Z","+00:00"))
          print(stamp.strftime("%H"))
          PY
          )"
          [[ "$RUN_CYCLE" =~ ^(00|06|12|18|21)$ ]] || { echo "Ciclo METBR não suportado: $RUN_CYCLE" >&2; exit 20; }
          echo "METBR_RUN_CYCLE=$RUN_CYCLE" >> "$GITHUB_ENV"
          echo "METBR_JSON_BRANCH=metbr-json-data-$RUN_CYCLE" >> "$GITHUB_ENV"
          echo "A publicação desta execução irá para metbr-json-data-$RUN_CYCLE e também atualizará metbr-json-data."

      - name: Validar JSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          root = Path('metbr_json')
          meta = json.loads((root / 'metadata.json').read_text())
          data = json.loads((root / 'metbr_wrf_4km.json').read_text())
          grid = json.loads((root / 'grid.json').read_text())
          assert meta.get('verticalProfileFile') == 'vertical-f000.npz', meta
          assert int(meta.get('verticalProfileForecastHour', -1)) == 0, meta
          import numpy as np
          with np.load(root / 'vertical-f000.npz', allow_pickle=False) as vertical:
              shape = vertical['pressure_hpa'].shape
              assert len(shape) == 3 and shape[0] >= 10
              assert shape[1:] == (int(meta['grid']['ny']), int(meta['grid']['nx']))
              for name in ('temperature_c', 'dewpoint_c', 'height_m', 'u_kt', 'v_kt', 'omega_pa_s'):
                  assert vertical[name].shape == shape, (name, vertical[name].shape)
              assert vertical['lat'].shape == shape[1:] and vertical['lon'].shape == shape[1:]
              assert vertical['terrain_m'].shape == shape[1:]
              assert np.isfinite(vertical['pressure_hpa'][0]).any()
          print(f"METBR Skew-T F000 vertical profile grid: {shape}, file={ (root / 'vertical-f000.npz').stat().st_size } bytes")
          source = meta.get('reflectivitySource')
          sources = [source] if isinstance(source, str) else source if isinstance(source, list) else []
          assert meta.get('modelKey') == 'metbr_wrf', meta
          assert meta.get('resolutionKm') == 4, meta
          assert any('REFL_10CM' in str(item).upper() for item in sources), sources
          assert meta.get('frames'), meta
          assert data.get('modelKey') == 'metbr_wrf', data
          assert len(data.get('frames', [])) == len(meta['frames'])
          nx, ny = int(meta['grid']['nx']), int(meta['grid']['ny'])
          assert grid.get('schema') == 'sideral-metbr-grid-v1', grid
          assert grid.get('modelKey') == 'metbr_wrf', grid
          assert int(grid['grid']['nx']) == nx and int(grid['grid']['ny']) == ny
          assert len(grid['fields']['lat']) == nx * ny and len(grid['fields']['lon']) == nx * ny
          available_from_payload = set()
          for index, item in enumerate(meta['frames']):
              forecast = int(item.get('forecastHour', index))
              file = item.get('dataFile') or f'frames/f{forecast:03d}.json.gz'
              with gzip.open(root / file, 'rt', encoding='utf-8') as handle:
                  frame = json.load(handle)
              assert frame.get('modelKey') == 'metbr_wrf', file
              assert frame.get('reflectivitySource') == 'REFL_10CM_NATIVE', file
              assert int(frame['gridX']) == nx and int(frame['gridY']) == ny, file
              assert len(frame['reflectivityDbz']) == nx * ny, file
              assert frame.get('forecastHour') == forecast, file
              fields = frame.get('fields') or {}
              assert isinstance(fields, dict), (file, fields)
              for field_name, values in fields.items():
                  assert isinstance(values, list) and len(values) == nx * ny, (file, field_name)
                  assert all(value is None or isinstance(value, (int, float)) for value in values), (file, field_name)
              declared = frame.get('availableVariables') or []
              assert isinstance(declared, list), (file, declared)
              available_from_payload.update(
                  field_name for field_name, values in fields.items()
                  if any(value is not None for value in values)
              )
          detected = set(meta.get('availableVariablesAnyFrame') or [])
          assert detected <= available_from_payload, (detected, available_from_payload)
          assert 'reflectivity' in available_from_payload, 'Nenhum frame contém valores de refletividade usáveis'
          print(f"METBR JSON OK: {len(meta['frames'])} frames, grid {nx}x{ny}, grade nativa e quadros GZIP multifield")
          print(f"Variáveis disponíveis: {', '.join(sorted(available_from_payload))}")
          print(f"Inventário WRFOUT: {len(meta.get('nativeVariables') or [])} variáveis")
          print(f"Fonte nativa de refletividade: {sources}")
          PY

      - name: Preparar branch de publicação
        run: |
          set -euo pipefail
          rm -rf published-metbr-json
          git fetch origin "$METBR_JSON_BRANCH" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$METBR_JSON_BRANCH"; then
            git worktree add --detach published-metbr-json "origin/$METBR_JSON_BRANCH"
            find published-metbr-json -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            mkdir published-metbr-json
            git -C published-metbr-json init
            git -C published-metbr-json checkout --orphan "$METBR_JSON_BRANCH"
          fi

          cp -f metbr_json/metadata.json published-metbr-json/metadata.json
          cp -f metbr_json/metbr_wrf_4km.json published-metbr-json/metbr_wrf_4km.json
          cp -f metbr_json/grid.json published-metbr-json/grid.json
          cp -f metbr_json/vertical-f000.npz published-metbr-json/vertical-f000.npz
          rm -rf published-metbr-json/frames
          cp -a metbr_json/frames published-metbr-json/frames
          cat > published-metbr-json/README.md <<'EOF'
          # METBR WRF 4 km — publicação JSON nativa

          - `metadata.json`: horários e contrato de publicação
          - `grid.json`: coordenadas geográficas nativas XLAT/XLONG, uma única vez
          - `vertical-f000.npz`: grade vertical nativa completa F000 (pressão, temperatura, ponto de orvalho, altura, vento e omega) para Skew-T click-to-point; não contém PNGs nem valores interpolados de outro modelo
          - `frames/fNNN.json.gz`: quadros comprimidos com refletividade nativa e demais campos disponíveis
          - `metadata.json`: inventário das variáveis WRFOUT e campos disponíveis por horário
          - `metbr_wrf_4km.json`: índice legado compatível, com os horários e a refletividade

          Campos publicados quando presentes/deriváveis no WRFOUT: precipitação acumulada, temperatura a 2 m, umidade relativa a 2 m, vento a 10 m, água precipitável, CAPE, bulk shear 0–6 km e vorticidade relativa em 850 hPa. Cada frame informa `availableVariables` e `fieldSources`; campos ausentes não são substituídos por outros modelos.

          Este produto METBR é servido diretamente desta branch, sem proxy Render e sem reutilizar quadros de outros WRF.
          EOF

          git -C published-metbr-json config user.name 'github-actions[bot]'
          git -C published-metbr-json config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published-metbr-json add -A
          git -C published-metbr-json diff --cached --quiet || git -C published-metbr-json commit -m "METBR 4 km: atualizar JSON"

      - name: Publicar branch METBR
        run: |
          set -euo pipefail
          git -C published-metbr-json remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 2>/dev/null || true
          git -C published-metbr-json remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C published-metbr-json push --force origin HEAD:"$METBR_JSON_BRANCH"
          if [[ "$METBR_JSON_BRANCH" != "metbr-json-data" ]]; then
            git -C published-metbr-json push --force origin HEAD:metbr-json-data
          fi
          echo "METBR JSON publicado com sucesso no ciclo $METBR_RUN_CYCLE (branch $METBR_JSON_BRANCH) e no alias metbr-json-data."

      - name: Resumo
        run: |
          echo "METBR JSON: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${METBR_JSON_BRANCH}/metadata.json"
          echo "METBR grade: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${METBR_JSON_BRANCH}/grid.json"
          echo "METBR Skew-T F000: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${METBR_JSON_BRANCH}/vertical-f000.npz"
          echo "METBR quadros: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${METBR_JSON_BRANCH}/frames/fNNN.json.gz"
          echo "METBR índice legado: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${METBR_JSON_BRANCH}/metbr_wrf_4km.json"
