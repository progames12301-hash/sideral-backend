name: Cache de pixels do radar REDEMET

# O cache é publicado em um ramo separado para não alterar WRF ou os modelos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build_radar_pixels.py"
      - ".github/workflows/radar-pixels-cache.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: sideral-radar-pixels
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Baixar backend
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests

      - name: Gerar PNGs polares
        run: |
          set -euxo pipefail
          rm -rf radar-cache
          python .github/scripts/build_radar_pixels.py --output radar-cache
          test -s radar-cache/manifest.json

      - name: Publicar no ramo radar-pixels
        run: |
          set -euxo pipefail
          git config user.name "sideral-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/sideral-radar-pixels
          git worktree add --detach /tmp/sideral-radar-pixels
          cd /tmp/sideral-radar-pixels
          git checkout --orphan radar-pixels-next
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$GITHUB_WORKSPACE/radar-cache/." .
          cat > README.md <<'EOF'
          # Sideral radar pixels
          Cache dos PNGs polares oficiais da REDEMET/DECEA.
          Este ramo é rotacionado automaticamente e contém somente os últimos quadros.
          EOF
          git add .
          git commit -m "Atualiza cache de pixels REDEMET"
          git push --force origin HEAD:radar-pixels

      - name: Conferir manifesto público
        run: |
          set -euxo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/radar-pixels/manifest.json?run=${GITHUB_RUN_ID}"
          for N in $(seq 1 12); do
            if curl -fsSL --connect-timeout 10 --max-time 30 "$URL-$N" -o /tmp/radar-manifest.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/radar-manifest.json').read_text(encoding='utf-8'))
          assert data.get('schema') == 'sideral-radar-pixel-cache-v1'
          assert data.get('product') == '03km'
          assert data.get('frames')
          assert any(frame.get('items') for frame in data['frames'])
          print('Manifesto publicado:', len(data['frames']), 'quadros')
          PY
              exit 0
            fi
            sleep 5
          done
          exit 41
