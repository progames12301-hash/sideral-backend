  <g filter="url(#shadow)"><rect x="392" y="790" width="968" height="118" rx="26" fill="#ffffff" stroke="#d8e2e8" stroke-width="2"/><text x="876" y="825" class="boxTitle" style="font-size:20px;">EXEMPLOS DE PRODUTOS GERADOS A PARTIR DA SAÍDA WRF</text><rect x="430" y="846" width="180" height="38" rx="19" fill="#eef8fa"/><text x="520" y="871" class="small" style="fill:#1b6c75;font-weight:800;">REFLETIVIDADE</text><rect x="628" y="846" width="138" height="38" rx="19" fill="#f1f4ff"/><text x="697" y="871" class="small" style="fill:#5369c9;font-weight:800;">CAPE / CIN</text><rect x="784" y="846" width="150" height="38" rx="19" fill="#f1f4ff"/><text x="859" y="871" class="small" style="fill:#5369c9;font-weight:800;">SRH / SHEAR</text><rect x="952" y="846" width="150" height="38" rx="19" fill="#fff4e9"/><text x="1027" y="871" class="small" style="fill:#a7611d;font-weight:800;">VENTO / T2M</text><rect x="1120" y="846" width="202" height="38" rx="19" fill="#fff4e9"/><text x="1221" y="871" class="small" style="fill:#a7611d;font-weight:800;">ÍNDICES CONVECTIVOS</text></g>
  <line x1="70" y1="958" x2="1730" y2="958" stroke="#d4dfe6" stroke-width="2"/><text x="900" y="992" class="footer">O WRF Sideral 4 km é uma simulação regional: não é radar em tempo real e não substitui avisos meteorológicos oficiais.</text><text x="900" y="1020" class="footer" style="font-weight:500;">Fluxo público simplificado • sem expor detalhes operacionais da infraestrutura</text>
</svg>
