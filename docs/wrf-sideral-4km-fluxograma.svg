<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7fafc"/><stop offset="100%" stop-color="#eef4f8"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#071a2b"/><stop offset="100%" stop-color="#123b55"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d2e44"/><stop offset="100%" stop-color="#0b5d68"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b2239" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#35556b"/></marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#17a7b8"/></marker>
    <style>
      .title { font: 800 46px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
      .subtitle { font: 500 20px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #b9d2de; }
      .col { font: 800 24px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #0b2239; text-anchor: middle; }
      .boxTitle { font: 800 23px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #10283b; text-anchor: middle; }
      .boxSub { font: 500 17px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #496578; text-anchor: middle; }
      .small { font: 600 15px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #587184; text-anchor: middle; }
      .modelTitle { font: 900 34px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .modelSub { font: 600 19px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #d7f1f3; text-anchor: middle; }
      .stepNum { font: 800 15px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .footer { font: 600 16px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #577082; text-anchor: middle; }
      .arrow { fill: none; stroke: #35556b; stroke-width: 4; marker-end: url(#arrow); }
      .arrowCyan { fill: none; stroke: #17a7b8; stroke-width: 5; marker-end: url(#arrowCyan); }
      .dash { fill: none; stroke: #7d97a7; stroke-width: 3; stroke-dasharray: 10 9; marker-end: url(#arrow); opacity: .85; }
    </style>
  </defs>
  <rect width="1800" height="1050" fill="url(#bg)"/>
  <rect x="0" y="0" width="1800" height="132" fill="url(#brand)"/>
  <rect x="64" y="38" width="10" height="56" rx="5" fill="#27c5c7"/>
  <text x="100" y="70" class="title">WRF SIDERAL 4 KM</text>
  <text x="100" y="103" class="subtitle">Fluxo do sistema de modelagem • Sideral Meteorologia</text>
  <text x="1685" y="67" text-anchor="end" style="font:800 18px 'Inter','Segoe UI',Arial,sans-serif; fill:#8ee4e4;">SIDERAL METEOROLOGIA</text>
  <text x="1685" y="95" text-anchor="end" style="font:500 15px 'Inter','Segoe UI',Arial,sans-serif; fill:#a9c5d1;">Modelo regional experimental</text>
  <text x="190" y="190" class="col">FONTES EXTERNAS</text><text x="525" y="190" class="col">PRÉ-PROCESSAMENTO</text><text x="865" y="190" class="col">INICIALIZAÇÃO</text><text x="1200" y="190" class="col">MODELO WRF</text><text x="1560" y="190" class="col">PÓS-PROCESSAMENTO</text>
  <rect x="95" y="210" width="190" height="5" rx="2.5" fill="#28b38a"/><rect x="410" y="210" width="230" height="5" rx="2.5" fill="#1bb7c6"/><rect x="770" y="210" width="190" height="5" rx="2.5" fill="#5e7de3"/><rect x="1115" y="210" width="170" height="5" rx="2.5" fill="#17a7b8"/><rect x="1450" y="210" width="220" height="5" rx="2.5" fill="#d58534"/>
  <g><circle cx="104" cy="257" r="18" fill="#28b38a"/><text x="104" y="257" class="stepNum">1</text></g><g><circle cx="430" cy="257" r="18" fill="#1bb7c6"/><text x="430" y="257" class="stepNum">2</text></g><g><circle cx="790" cy="257" r="18" fill="#5e7de3"/><text x="790" y="257" class="stepNum">3</text></g><g><circle cx="1135" cy="257" r="18" fill="#17a7b8"/><text x="1135" y="257" class="stepNum">4</text></g><g><circle cx="1470" cy="257" r="18" fill="#d58534"/><text x="1470" y="257" class="stepNum">5</text></g>
  <g filter="url(#shadow)"><rect x="70" y="295" width="250" height="150" rx="22" fill="#ffffff" stroke="#28b38a" stroke-width="4"/><text x="195" y="342" class="boxTitle">GFS</text><text x="195" y="375" class="boxSub">Condição inicial</text><text x="195" y="402" class="boxSub">e de contorno</text><text x="195" y="428" class="small">atmosfera em grande escala</text></g>
  <g filter="url(#shadow)"><rect x="70" y="500" width="250" height="150" rx="22" fill="#ffffff" stroke="#28b38a" stroke-width="4"/><text x="195" y="547" class="boxTitle" style="font-size:19px;">DADOS TERRESTRES WRF</text><text x="195" y="582" class="boxSub">Relevo • uso do solo</text><text x="195" y="609" class="boxSub">solo • superfície</text><text x="195" y="635" class="small">base geográfica da grade</text></g>
  <g filter="url(#shadow)"><rect x="70" y="705" width="250" height="126" rx="22" fill="#f8fbfd" stroke="#86a3b4" stroke-width="3" stroke-dasharray="9 7"/><text x="195" y="748" class="boxTitle" style="font-size:20px;">OUTRAS FONTES</text><text x="195" y="781" class="boxSub">Pipelines experimentais</text><text x="195" y="808" class="small">quando configurados</text></g>
  <g filter="url(#shadow)"><rect x="392" y="305" width="270" height="410" rx="28" fill="#ffffff" stroke="#1bb7c6" stroke-width="4"/><text x="527" y="355" class="boxTitle" style="font-size:30px;">WPS</text><text x="527" y="386" class="boxSub">WRF Preprocessing System</text><rect x="425" y="425" width="204" height="70" rx="16" fill="#edfafa"/><text x="527" y="454" class="boxTitle" style="font-size:20px;">GEOGRID.EXE</text><text x="527" y="480" class="small">define a grade regional</text><rect x="425" y="520" width="204" height="70" rx="16" fill="#edfafa"/><text x="527" y="549" class="boxTitle" style="font-size:20px;">UNGRIB.EXE</text><text x="527" y="575" class="small">decodifica campos globais</text><rect x="425" y="615" width="204" height="70" rx="16" fill="#edfafa"/><text x="527" y="644" class="boxTitle" style="font-size:20px;">METGRID.EXE</text><text x="527" y="670" class="small">interpola para a grade WRF</text></g>
  <g filter="url(#shadow)"><rect x="745" y="400" width="250" height="220" rx="28" fill="#ffffff" stroke="#5e7de3" stroke-width="4"/><text x="870" y="456" class="boxTitle" style="font-size:29px;">REAL.EXE</text><text x="870" y="495" class="boxSub">Monta as condições</text><text x="870" y="523" class="boxSub">iniciais e de contorno</text><rect x="785" y="558" width="170" height="34" rx="17" fill="#eef1ff"/><text x="870" y="581" class="small" style="fill:#5369c9;">entrada pronta para o WRF</text></g>
  <g filter="url(#shadow)"><rect x="1070" y="320" width="290" height="400" rx="42" fill="url(#model)"/><rect x="1096" y="346" width="238" height="48" rx="24" fill="#ffffff" fill-opacity=".12"/><text x="1215" y="378" class="modelSub">WRF-ARW • grade ~4 km</text><text x="1215" y="452" class="modelTitle">WRF.EXE</text><text x="1215" y="495" class="modelSub">Integração numérica regional</text><line x1="1110" y1="532" x2="1320" y2="532" stroke="#8ce1e4" stroke-opacity=".45" stroke-width="2"/><text x="1215" y="574" class="modelSub">dinâmica ARW</text><text x="1215" y="607" class="modelSub">+ parametrizações físicas</text><text x="1215" y="640" class="modelSub">+ evolução atmosférica</text><rect x="1130" y="670" width="170" height="32" rx="16" fill="#24b4bc"/><text x="1215" y="692" class="small" style="fill:#ffffff; font-weight:800;">SIMULAÇÃO 4 KM</text></g>
  <g filter="url(#shadow)"><rect x="1450" y="292" width="240" height="115" rx="22" fill="#ffffff" stroke="#d58534" stroke-width="4"/><text x="1570" y="337" class="boxTitle">WRFOUT</text><text x="1570" y="370" class="boxSub">Saída bruta do modelo</text><text x="1570" y="394" class="small" style="font-size:13px;">campos prognósticos/diagnósticos</text></g>
  <g filter="url(#shadow)"><rect x="1450" y="447" width="240" height="115" rx="22" fill="#ffffff" stroke="#d58534" stroke-width="4"/><text x="1570" y="490" class="boxTitle" style="font-size:21px;">EXTRAÇÃO</text><text x="1570" y="520" class="boxSub">Variáveis necessárias</text><text x="1570" y="545" class="small" style="font-size:13px;">redução do volume de dados</text></g>
  <g filter="url(#shadow)"><rect x="1450" y="602" width="240" height="115" rx="22" fill="#ffffff" stroke="#d58534" stroke-width="4"/><text x="1570" y="645" class="boxTitle" style="font-size:21px;">VERIFICAÇÕES</text><text x="1570" y="675" class="boxSub">Rodada • validade</text><text x="1570" y="700" class="small" style="font-size:13px;">metadados e consistência</text></g>
  <g filter="url(#shadow)"><rect x="1450" y="757" width="240" height="150" rx="22" fill="#ffffff" stroke="#d58534" stroke-width="4"/><text x="1570" y="800" class="boxTitle" style="font-size:21px;">PUBLICAÇÃO WEB</text><text x="1570" y="832" class="boxSub">Formatos compactos</text><text x="1570" y="860" class="boxSub">API / site Sideral</text><text x="1570" y="889" class="small" style="font-size:13px;">mapas e produtos meteorológicos</text></g>
